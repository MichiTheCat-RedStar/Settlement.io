  } else if(t === 'robotAssembler'){
    ctx.fillStyle = '#6a5a8a'; ctx.fillRect(sx + s*0.1, sy + s*0.32, s*0.8, s*0.58);
    ctx.fillStyle = '#4a3a6a'; ctx.fillRect(sx + s*0.1, sy + s*0.32, s*0.8, s*0.1);
    ctx.fillStyle = '#9a7ad0';
    ctx.beginPath(); ctx.arc(cx, cy + s*0.08, s*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#c8a0e0';
    ctx.beginPath(); ctx.arc(cx - s*0.1, cy + s*0.04, s*0.04, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*0.1, cy + s*0.04, s*0.04, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#e0c040'; ctx.lineWidth = Math.max(1.5, s*0.04);
    ctx.beginPath(); ctx.arc(cx, cy + s*0.08, s*0.2 + Math.sin(G.time*3)*s*0.03, 0, 6.3); ctx.stroke();
  } else if(t === 'logisticsHub'){
    ctx.fillStyle = '#5a7a6a'; ctx.fillRect(sx + s*0.12, sy + s*0.3, s*0.76, s*0.6);
    ctx.fillStyle = '#3a5a4a'; ctx.fillRect(sx + s*0.12, sy + s*0.3, s*0.76, s*0.1);
    ctx.strokeStyle = '#7fe0c0'; ctx.lineWidth = Math.max(1.5, s*0.04);
    ctx.beginPath(); ctx.arc(cx, cy + s*0.15, s*0.22, 0, 6.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy + s*0.15, s*0.12, 0, 6.3); ctx.stroke();
    const a2 = G.time * 2;
    ctx.fillStyle = '#7fe0c0';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a2)*s*0.22, cy + s*0.15 + Math.sin(a2)*s*0.22, s*0.04, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - Math.cos(a2)*s*0.22, cy + s*0.15 - Math.sin(a2)*s*0.22, s*0.04, 0, 6.3); ctx.fill();
  } else {
    ctx.fillStyle = '#9a9a9a';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
    ctx.fillStyle = '#6a6a6a';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.1);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(cx - s*0.08, sy + s*0.7, s*0.16, s*0.2);
  }
}

function drawUnit(u, sx, sy, s){
  const cx = sx, cy = sy;
  if(u.drone){
    const bob = Math.sin(G.time*6 + u.phase)*2.5;
    const fy = cy - s*0.15 + bob;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy + s*0.3, s*0.15, s*0.06, 0, 0, 6.3); ctx.fill();
    const t = G.time * 30;
    for(let i=0;i<4;i++){
      const a = Math.PI/4 + i*Math.PI/2;
      const px = cx + Math.cos(a)*s*0.18;
      const py = fy + Math.sin(a)*s*0.13;
      ctx.strokeStyle = 'rgba(180,220,255,.75)'; ctx.lineWidth = Math.max(1.2, s*0.035);
      const r = s*0.09;
      const ct = Math.cos(t + i*0.5), st = Math.sin(t + i*0.5);
      ctx.beginPath(); ctx.moveTo(px - ct*r, py - st*r*0.45); ctx.lineTo(px + ct*r, py + st*r*0.45); ctx.stroke();
    }
    ctx.fillStyle = '#7a80a8'; ctx.beginPath(); ctx.arc(cx, fy, s*0.1, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8b0d0'; ctx.beginPath(); ctx.arc(cx, fy, s*0.05, 0, 6.3); ctx.fill();
    return;
  }
  const wScale = u.width || 1;
  const bob = Math.sin(G.time*8 + u.phase)*1.2;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*0.22, s*0.19*wScale, s*0.08, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#9a7ad0' : (u.skin || '#e8d7b8');
  ctx.beginPath(); ctx.arc(cx, cy - s*0.06 + bob*0.3, s*0.13*(0.92 + 0.08*wScale), 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#7a55b8' : u.cloth;
  ctx.fillRect(cx - s*0.11*wScale, cy + bob*0.3, s*0.22*wScale, s*0.2);
  if(u.manual){
    ctx.strokeStyle = '#e6c341'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy - s*0.06, s*0.18, 0, 6.3); ctx.stroke();
  }
}
function drawBoat(bo, sx, sy, s){
  const bob = Math.sin(G.time*2 + bo.phase)*1.5;
  ctx.save(); ctx.translate(sx, sy + bob);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, s*0.15, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#8a5a2a';
  ctx.beginPath(); ctx.moveTo(-s*0.4, 0); ctx.lineTo(s*0.4, 0); ctx.lineTo(s*0.3, s*0.25); ctx.lineTo(-s*0.3, s*0.25); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a8703a'; ctx.fillRect(-s*0.3, -s*0.02, s*0.6, s*0.05);
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = Math.max(1.5, s*0.05);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s*0.35); ctx.stroke();
  ctx.fillStyle = 'rgba(240,240,220,.85)';
  ctx.beginPath(); ctx.moveTo(s*0.02, -s*0.33); ctx.lineTo(s*0.28, -s*0.08); ctx.lineTo(s*0.02, -s*0.05); ctx.closePath(); ctx.fill();
  for(let i=0;i<bo.passengers.length;i++){
    const p = bo.passengers[i];
    ctx.fillStyle = p.cloth || '#e8d7b8';
    ctx.beginPath(); ctx.arc(-s*0.22 + i*s*0.13, s*0.05, s*0.07, 0, 6.3); ctx.fill();
    if(p.skin){ ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(-s*0.22 + i*s*0.13, -s*0.02, s*0.05, 0, 6.3); ctx.fill(); }
  }
  ctx.restore();
}
function drawHeli(h, sx, sy, s){
  const bob = Math.sin(G.time*3 + h.phase)*1.6;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(sx, sy + s*0.42, s*0.22, s*0.07, 0, 0, 6.3); ctx.fill();
  const cy = sy - s*0.15 + bob;
  ctx.fillStyle = '#4a7a5a'; ctx.fillRect(sx + s*0.1, cy - s*0.03, s*0.24, s*0.06);
  ctx.strokeStyle = 'rgba(200,220,240,.55)'; ctx.lineWidth = Math.max(1, s*0.025);
  ctx.beginPath(); ctx.moveTo(sx + s*0.34, cy - s*0.09); ctx.lineTo(sx + s*0.34, cy + s*0.09); ctx.stroke();
  ctx.fillStyle = '#5a8a6a'; ctx.beginPath(); ctx.ellipse(sx, cy, s*0.2, s*0.12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(160,210,240,.85)'; ctx.beginPath(); ctx.ellipse(sx - s*0.08, cy, s*0.08, s*0.07, 0, 0, 6.3); ctx.fill();
  const rw = s*0.44; const ang = G.time*28 + h.phase;
  ctx.strokeStyle = 'rgba(210,230,250,.5)'; ctx.lineWidth = Math.max(1.2, s*0.03);
  ctx.beginPath(); ctx.moveTo(sx + Math.cos(ang)*rw, cy - s*0.12 + Math.sin(ang)*rw*0.18); ctx.lineTo(sx - Math.cos(ang)*rw, cy - s*0.12 - Math.sin(ang)*rw*0.18); ctx.stroke();
  ctx.fillStyle = '#3a5a4a'; ctx.fillRect(sx - s*0.02, cy - s*0.15, s*0.04, s*0.06);
}

const rainDrops = [];
for(let i = 0; i < 120; i++){
  rainDrops.push({ x: Math.random() * 1, y: Math.random() * 1, len: 8 + Math.random() * 12, speed: 0.7 + Math.random() * 0.5 });
}

function render(){
  updCam();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#080a0e';
  ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled = z < 1;
  ctx.drawImage(tcan, 0, 0, MW*TS, MH*TS, ox, oy, MW*TS*z, MH*TS*z);
  const s = TS*z;
  const x0 = clamp(Math.floor(-ox/s)-1, 0, MW-1);
  const x1 = clamp(Math.ceil((W-ox)/s)+1, 0, MW-1);
  const y0 = clamp(Math.floor(-oy/s)-1, 0, MH-1);
  const y1 = clamp(Math.ceil((H-oy)/s)+1, 0, MH-1);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const n = nodes[y][x];
    if(n) drawNode(n, x*TS*z+ox, y*TS*z+oy, s);
  }
  for(const b of G.buildings){
    const sx = b.tx*TS*z+ox, sy = b.ty*TS*z+oy;
    drawBuilding(b, sx, sy, s);
    if(b.constructionT <= 0){
      const status = buildingResourceStatus(b);
      if(status){
        ctx.fillStyle = 'rgba(230,80,80,.85)';
        ctx.beginPath(); ctx.arc(sx + s*0.85, sy + s*0.15, Math.max(3, s*0.08), 0, 6.3); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, s*0.15)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', sx + s*0.85, sy + s*0.15);
      } else if(b.def && b.def.workers && b.workers.length === 0){
        ctx.fillStyle = 'rgba(216,180,94,.7)';
        ctx.beginPath(); ctx.arc(sx + s*0.85, sy + s*0.15, Math.max(2.5, s*0.06), 0, 6.3); ctx.fill();
      }
    }
    if(G.sel === b){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.strokeRect(sx+2, sy+2, s-4, s-4);
    }
  }
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    const sx = u.x*z + ox, sy = u.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawUnit(u, sx, sy, s);
    if(G.sel === u || G.selectedUnits.includes(u)){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, s*0.32, 0, 6.3); ctx.stroke();
    }
  }
  for(const bo of G.boats){
    const sx = bo.x*z + ox, sy = bo.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawBoat(bo, sx, sy, s);
    if(G.sel === bo){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.5, 0, 6.3); ctx.stroke(); }
  }
  for(const h of G.helis){
    const sx = h.x*z + ox, sy = h.y*z + oy;
    if(sx < -60 || sx > W+60 || sy < -60 || sy > H+60) continue;
    drawHeli(h, sx, sy, s);
    if(G.sel === h){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.48, 0, 6.3); ctx.stroke(); }
  }
  for(const p of G.particles){
    const alpha = Math.min(1, p.life / p.maxLife);
    if(p.color.startsWith('rgba')){
      const parts = p.color.match(/rgba\((\d+),(\d+),(\d+),[\d.]+\)/);
      if(parts) ctx.fillStyle = `rgba(${parts[1]},${parts[2]},${parts[3]},${alpha*0.6})`;
    } else ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x*z+ox, p.y*z+oy, p.size*z, 0, 6.3); ctx.fill();
  }
  for(const m of G.markers){
    const mx = m.x*z+ox, my = m.y*z+oy;
    ctx.strokeStyle = '#e6c341'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, my - 20*z); ctx.stroke();
    ctx.fillStyle = '#e6c341';
    ctx.beginPath(); ctx.moveTo(mx, my - 20*z); ctx.lineTo(mx + 12*z, my - 16*z); ctx.lineTo(mx, my - 12*z); ctx.closePath(); ctx.fill();
  }
  if(SETTINGS.daynight){
    const nightAlpha = getNightAlpha();
    if(nightAlpha > 0.01){
      ctx.fillStyle = `rgba(10,20,50,${nightAlpha})`;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for(const b of G.buildings){
        if(b.constructionT > 0) continue;
        let glow = 0;
        if(b.type === 'house') glow = 0.5;
        else if(b.type === 'apartment' || b.type === 'luxuryHouse') glow = 0.7;
        else if(b.type === 'tavern' || b.type === 'theater' || b.type === 'forge' || b.type === 'factory' ||
                b.type === 'ironSmelter' || b.type === 'copperSmelter' || b.type === 'goldSmelter' ||
                b.type === 'coalPlant' || b.type === 'coalSteamPlant') glow = 0.6;
        else if(b.type === 'nuclearPlant') glow = 0.8;
        if(glow > 0){
          const bx = (b.tx*TS+TS/2)*z+ox;
          const by = (b.ty*TS+TS/2)*z+oy;
          const r = TS * z * 1.2;
          const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
          grad.addColorStop(0, `rgba(255,220,150,${glow*nightAlpha*0.5})`);
          grad.addColorStop(1, 'rgba(255,220,150,0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(bx, by, r, 0, 6.3); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if(G.weather && G.weather.type === 'storm'){
    ctx.strokeStyle = 'rgba(160,180,210,.35)';
    ctx.lineWidth = 1;
    const t = performance.now() / 1000;
    for(const drop of rainDrops){
      const x = ((drop.x * W + t * drop.speed * 60) % (W + 40)) - 20;
      const y = ((drop.y * H + t * drop.speed * 300) % (H + 60)) - 30;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + drop.len); ctx.stroke();
    }
  }
  if(G.boxSelect && G.boxSelect.active){
    const bx = Math.min(G.boxSelect.x1, G.boxSelect.x2);
    const by = Math.min(G.boxSelect.y1, G.boxSelect.y2);
    const bw = Math.abs(G.boxSelect.x2 - G.boxSelect.x1);
    const bh = Math.abs(G.boxSelect.y2 - G.boxSelect.y1);
    ctx.fillStyle = 'rgba(120,200,255,.15)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(120,200,255,.85)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
  }
  if(G.build && G.mouse.inside){
    const [wx,wy] = screenToWorld(G.mouse.x, G.mouse.y);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    if(tx>=0 && ty>=0 && tx<MW && ty<MH){
      if(G.build === 'demolish'){
        const bb = buildingAt(tx,ty);
        const hasRoad = roadGrid[ty] && roadGrid[ty][tx];
        if(bb || hasRoad){
          ctx.fillStyle = 'rgba(230,80,80,.35)';
          ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        }
      } else {
        const ok = canPlace(G.build, tx, ty);
        ctx.fillStyle = ok ? 'rgba(90,220,120,.28)' : 'rgba(230,80,80,.28)';
        ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        ctx.strokeStyle = ok ? '#7fe08a' : '#e05a5a';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx*TS*z+ox+1, ty*TS*z+oy+1, s-2, s-2);
      }
    }
  }
  if(G.markerMode && G.mouse.inside){
    ctx.strokeStyle = '#e6c341'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.mouse.x, G.mouse.y, 10, 0, 6.3); ctx.stroke();
  }
  drawMinimap();
}

// =================== PLACEMENT ===================
function buildingAt(tx,ty){
  for(const b of G.buildings) if(b.tx===tx && b.ty===ty) return b;
  return null;
}
function canPlace(type, tx, ty){
  if(tx<1||ty<1||tx>=MW-1||ty>=MH-1) return false;
  const t = terrain[ty][tx].t;
  const def = BUILDINGS[type];
  if(type === 'bridge'){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(type === 'road'){ if(t === 'water' || t === 'mountain') return false; if(roadGrid[ty][tx]) return false; if(buildingAt(tx,ty)) return false; return true; }
  if(def && def.waterOnly){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(t === 'water' || t === 'mountain') return false;
  if(buildingAt(tx,ty)) return false;
  if(def && def.onDeposit){ const n = nodes[ty][tx]; return !!(n && isDeposit(n.type)); }
  if(def && def.coastal){
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=tx+dx, ny=ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      if(terrain[ny][nx].t === 'water') return true;
    }
    return false;
  }
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) return false;
  return true;
}
function rebuildBridgeGrid(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) bridgeGrid[y][x]=false;
  for(const b of G.buildings) if(b.type==='bridge') bridgeGrid[b.ty][b.tx] = true;
}
function tryPlace(type, tx, ty){
  if(!canPlace(type, tx, ty)) return false;
  const cost = COSTS[type];
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return false; }
  pay(cost);
  SND.place();
  if(type === 'road'){ roadGrid[ty][tx] = true; redrawRoad(tx, ty); renderMiniBg(); return true; }
  const def = BUILDINGS[type];
  const b = { type, def, tx, ty, px: tx*TS+TS/2, py: ty*TS+TS/2, workers: [], deposit: null, constructionT: getBuildTime(type) };
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) b.deposit = n.type;
  if(n && (n.type==='tree' || n.type==='rock')) nodes[ty][tx] = null;
  G.buildings.push(b);
  if(type === 'bridge'){ bridgeGrid[ty][tx] = true; computeIslands(); }
  if(type === 'dock') spawnBoatFromDock(b);
  if(type === 'helipad') spawnHeliFromPad(b);
  renderMiniBg();
  return true;
}
function demolishBuilding(b){
  const idx = G.buildings.indexOf(b);
  if(idx < 0) return;
  G.buildings.splice(idx,1);
  for(const u of G.units){
    if(u.job === b){ u.job = null; if(u.state === 'work' || u.state === 'goBuilding'){ u.state = 'idle'; u.idleT = 0.2; u.path=null; } }
    if(u.hub === b) u.hub = null;
  }
  const cost = COSTS[b.type];
  if(cost){ for(const k in cost){ const v = Math.floor(cost[k]*0.5); if(v > 0) addRes(k, v); } }
  if(b.type === 'bridge'){ bridgeGrid[b.ty][b.tx] = false; computeIslands(); }
  if(b.deposit) nodes[b.ty][b.tx] = { type: b.deposit, tx: b.tx, ty: b.ty };
  if(G.sel === b) G.sel = null;
  updateInfoUI(); updateResUI(); renderMiniBg();
  pushLog('Снесено: ' + (b.def ? b.def.name : b.type), 'info');
  SND.click();
}
function demolishRoad(tx,ty){
  if(!roadGrid[ty] || !roadGrid[ty][tx]) return;
  roadGrid[ty][tx] = false;
  redrawTile(tx,ty);
  const v = Math.floor((COSTS.road.stone||0)*0.5);
  if(v > 0) addRes('stone', v);
  updateResUI(); renderMiniBg();
  pushLog('Дорога снесена', 'info');
  SND.click();
}
function spawnBoatFromDock(dock){
  for(let r=1;r<=3;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=dock.tx+dx, y=dock.ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water' && !(bridgeGrid[y] && bridgeGrid[y][x])){
      const bo = new Boat(x*TS+TS/2, y*TS+TS/2);
      G.boats.push(bo);
      pushLog('Лодка спущена на воду', 'good');
      return;
    }
  }
}
function spawnRobot(){
  const cost = COSTS.robot;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return; }
  const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
  if(!homes.length){ toast('Нужен хотя бы один дом'); SND.error(); return; }
  pay(cost);
  const h = homes[0];
  const u = new Unit(h.px + (Math.random()-0.5)*26, h.py + 26 + (Math.random()-0.5)*26, true);
  G.units.push(u);
  pushLog('Робот собран', 'good');
  SND.place();
}
function spawnDrone(){
  const cost = COSTS.drone;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return; }
  const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
  const from = homes.length ? homes[0] : null;
  if(!from){ toast('Нужен дом'); SND.error(); return; }
  pay(cost);
  const u = new Unit(from.px + (Math.random()-0.5)*26, from.py + 26 + (Math.random()-0.5)*26, true);
  u.drone = true; u.speed = 110;
  G.units.push(u);
  pushLog('Дрон запущен', 'good');
  SND.place();
}
function spawnHeliFromPad(pad){
  const h = new Heli(pad.px, pad.py - TS);
  G.helis.push(h);
  toast('Вертолёт поднялся в воздух');
}
function spawnExtraHeli(){
  if(!G.sel || G.sel.type !== 'helipad') return;
  if(G.res.planks >= 20 && G.res.ironIngot >= 15){
    G.res.planks -= 20; G.res.ironIngot -= 15;
    spawnHeliFromPad(G.sel); SND.place();
  } else { toast('Нужно 20 досок и 15 железа'); SND.error(); }
  updateResUI(); updateInfoUI();
}
function spawnExtraBoat(){
  if(G.res.wood >= 30){ G.res.wood -= 30; spawnBoatFromDock(G.sel); SND.place(); }
  else { toast('Нужно 30 дерева'); SND.error(); }
  updateResUI(); updateInfoUI();
}

let toastT = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.opacity = 1;
  toastT = 2.2;
}
function showTooltip(html, sx, sy){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('open');
  positionTooltip(sx, sy);
}
function positionTooltip(sx, sy){
  const r = tooltipEl.getBoundingClientRect();
  let x = sx + 16, y = sy + 16;
  if(x + r.width > W - 8) x = sx - r.width - 12;
  if(y + r.height > H - 8) y = sy - r.height - 12;
  tooltipEl.style.left = Math.max(6, x) + 'px';
  tooltipEl.style.top  = Math.max(6, y) + 'px';
}
function hideTooltip(){ tooltipEl.classList.remove('open'); G._hoverResKey = null; }

resbarEl.addEventListener('mousemove', e => {
  const el = e.target.closest('.res[data-res]');
  if(el){
    const k = el.dataset.res;
    if(G._hoverResKey !== k){
      G._hoverResKey = k;
      showTooltip(resTooltipHtml(k), e.clientX, e.clientY);
    } else {
      positionTooltip(e.clientX, e.clientY);
    }
  } else {
    hideTooltip();
  }
});
resbarEl.addEventListener('mouseleave', () => { hideTooltip(); });

function resTooltipHtml(k){
  const info = RES_INFO.find(r => r[0] === k);
  if(!info) return '';
  const name = info[1], col = info[2], abbr = info[3];
  let html = `<b><span class="dot" style="background:${col};display:inline-block;margin-right:5px;vertical-align:middle"></span>${name} <span style="color:#8fa6c0;font-size:11px">(${abbr})</span></b>`;
  html += `<div style="margin-top:4px;color:#d8e2f0">Сейчас: <b>${Math.floor(G.res[k])}</b>`;
  const r = G.rates[k] || 0;
  if(Math.abs(r) > 0.01){
    const c = r > 0 ? '#7fc27f' : '#e08a7a';
    html += ` <span style="color:${c}">(${r>0?'+':''}${r.toFixed(2)}/с)</span>`;
  }
  html += `</div>`;
  if(RES_SOURCES[k]) html += `<div style="margin-top:4px;color:#8fa6c0">📍 ${RES_SOURCES[k]}</div>`;
  return html;
}

function renderLog(){
  if(!SETTINGS.log){ logEl.style.display = 'none'; return; }
  logEl.style.display = 'block';
  let html = '';
  const entries = G.log.slice(-30).reverse();
  for(const e of entries){
    const cls = 'log-entry ' + (e.type||'');
    const mins = Math.floor(e.time / 60);
    const secs = Math.floor(e.time % 60);

    html += `<div class="${cls}"><span class="t">${tstr}</span>${e.msg}</div>`;
  }
  logEl.innerHTML = html;
}

function buildTooltipHtml(id){
  const def = BUILDINGS[id];
  const name = def ? def.name : id;
  let html = `<b>${name}</b>`;
  if(def && def.desc) html += `<div style="color:#d8e2f0;margin-top:3px">${def.desc}</div>`;
  if(def && def.long) html += `<div style="color:#8fa6c0;margin-top:4px;font-size:11px;line-height:1.4">${def.long}</div>`;
  const chars = [];
  if(def && def.workers) chars.push(`👷 Рабочих: ${def.workers}`);
  if(def && def.robotOnly) chars.push('🤖 Только роботы');
  if(def && def.waterOnly) chars.push('🌊 Только на воде');
  if(def && def.coastal) chars.push('🏖 Только у берега');
  if(def && def.onDeposit) chars.push('⛏ Только на залежи');
  if(def && def.powerOutput) chars.push(`⚡ +${def.powerOutput}${def.dayOnly ? ' (днём)' : ''}${def.fuel ? `, топливо: ${RES_NAMES[def.fuel]} ${def.fuelRate}/с` : ''}`);
  if(def && def.powerUse) chars.push(`⚡ −${def.powerUse}`);
  if(chars.length) html += `<div style="margin-top:5px;color:#9fc4ee;font-size:11px">${chars.join(' · ')}</div>`;
  const cost = COSTS[id];
  if(cost) html += `<div class="tt-cost">💰 ${costStr(cost)}</div>`;
  const req = REQS[id];
  if(req){
    const t = TECHS.find(t=>t.id===req);
    html += `<div class="tt-req">${G.techs[req] ? '✓ ' : '🔒 '}${t ? t.name : req}</div>`;
  }
  return html;
}
function placedTooltipHtml(b){
  let html = `<b>${b.def.name}</b>`;
  if(b.def.desc) html += `<div style="color:#d8e2f0;margin-top:3px">${b.def.desc}</div>`;
  if(b.def.long) html += `<div style="color:#8fa6c0;margin-top:4px;font-size:11px;line-height:1.4">${b.def.long}</div>`;
  if(b.constructionT > 0){
    const total = getBuildTime(b.type);
    const pct = Math.round((1 - b.constructionT/total) * 100);
    html += `<div class="tt-warn" style="color:#d8b45e">🏗 Строится: ${pct}%</div>`;
    return html;
  }
  if(b.def.workers) html += `<div class="tt-sub">Рабочих: ${b.workers.length}/${b.def.workers}</div>`;
  if(b.def.powerOutput){
    let out = b.def.powerOutput;
    if(b.def.workers) out *= (b.workers.length / b.def.workers);
    if(b.def.dayOnly) out *= solarOutput();
    html += `<div class="tt-pw">+${out.toFixed(1)} ⚡</div>`;
  }
  if(b.def.powerUse){
    html += `<div class="tt-pw">−${b.def.powerUse} ⚡ (КПД: ${Math.round(G.energy.efficiency*100)}%)</div>`;
  }
  if(b.deposit) html += `<div class="tt-cost">Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}</div>`;
  const status = buildingResourceStatus(b);
  if(status) html += `<div class="tt-warn">⚠ Не хватает ${RES_NAMES[status.res] || status.res} — не работает</div>`;
  else if(b.def.workers && b.workers.length === 0) html += `<div class="tt-warn">⏳ Нет рабочих</div>`;
  const rates = buildingRate(b);
  const pos = [], neg = [];
  const blocked = !!status;
  for(const k in rates){
    if(rates[k] > 0.005) pos.push(`<span style="color:${blocked?'#6c8098':'#7fc27f'}">+${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span>`);
    else if(rates[k] < -0.005) neg.push(`<span style="color:${blocked?'#6c8098':'#e08a7a'}">${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span>`);
  }
  if(pos.length || neg.length){
    html += '<div class="tt-rate">';
    if(pos.length) html += '<div>' + pos.join(' ') + '</div>';
    if(neg.length) html += '<div>' + neg.join(' ') + '</div>';
    html += '</div>';
  }
  return html;
}
function nodeTooltipHtml(n){

const buildBtns = {};
function makeBuildUI(){
  hideTooltip();
  buildCatsEl.innerHTML = '';
  buildItemsEl.innerHTML = '';
  buildItemsEl.classList.remove('open');
  G.selectedCategory = null;
  for(const cat of CATEGORIES){
    const div = document.createElement('div');
    div.className = 'catbtn';
    div.textContent = cat.name;
    div.title = cat.title;
    div.onclick = () => {
      SND.click();
      if(G.selectedCategory === cat.id){
        G.selectedCategory = null;
        buildItemsEl.classList.remove('open');
        div.classList.remove('active');
      } else {
        G.selectedCategory = cat.id;
        buildCatsEl.querySelectorAll('.catbtn').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        renderBuildItems(cat);
        buildItemsEl.classList.add('open');
      }
    };
    buildCatsEl.appendChild(div);
  }
}
function renderBuildItems(cat){
  buildItemsEl.innerHTML = '';
  const items = [];
  for(const id in BUILDINGS){
    if(BUILDINGS[id].cat === cat.id) items.push(id);
  }
  for(const id of items){
    const div = document.createElement('div');
    div.className = 'btn' + (id === 'demolish' ? ' danger' : '');
    const name = BUILDINGS[id]?.name || id;
    const cost = COSTS[id];
    const def = BUILDINGS[id];
    let extra = '';
    if(def.powerOutput) extra = `<div class="pw">+${def.powerOutput} ⚡</div>`;
    else if(def.powerUse) extra = `<div class="pw">−${def.powerUse} ⚡</div>`;
    else if(cost) extra = `<div class="c">${costStr(cost)}</div>`;
    div.innerHTML = `<div>${name}</div>${extra}`;
    div.onclick = () => {
      SND.click();
      const req = REQS[id];
      if(req && !G.techs[req]){
        const t = TECHS.find(t=>t.id===req);
        toast('Нужна технология: ' + (t ? t.name : req));
        SND.error();
        return;
      }
      if(id === 'robot'){ spawnRobot(); return; }
      if(id === 'drone'){ spawnDrone(); return; }
      if(G.build === id) G.build = null;
      else { G.build = id; G.markerMode = false; }
      refreshBuildUI();
    };
    div.addEventListener('mouseenter', e => showTooltip(buildTooltipHtml(id), e.clientX, e.clientY));
    div.addEventListener('mousemove', e => positionTooltip(e.clientX, e.clientY));
    div.addEventListener('mouseleave', hideTooltip);
    buildItemsEl.appendChild(div);
    buildBtns[id] = div;
  }
}
function refreshBuildUI(){
  for(const id in buildBtns){
    const el = buildBtns[id];
    if(!el) continue;
    if(id === 'demolish'){ el.classList.remove('dis'); el.classList.toggle('active', G.build === id); continue; }
    const req = REQS[id];
    const locked = req && !G.techs[req];
    const afford = canAfford(COSTS[id]);
    el.classList.toggle('dis', locked || !afford);
    el.classList.toggle('active', G.build === id);
  }
}
function renderTech(){
  techEl.innerHTML = '<h3>🔬 Дерево технологий</h3>';
  for(const t of TECHS){
    const done = !!G.techs[t.id];
    const unlocked = !t.req || t.req.every(r => G.techs[r]);
    const div = document.createElement('div');
    div.className = 'tech' + (done ? ' done' : '') + (unlocked ? '' : ' locked');
    div.innerHTML = `<b>${t.name}</b><div class="td">${t.desc}</div>` +
      `<div class="tc">${done ? '✓ изучено' : costStr(t.cost)}</div>`;
    if(!done && unlocked){
      div.onclick = () => {
        if(pay(t.cost)){
          G.techs[t.id] = true;
          SND.tech();
          renderTech(); refreshBuildUI(); renderQuests();
          pushLog('Изучено: ' + t.name, 'good');
          toast('Изучено: ' + t.name);
        } else { toast('Не хватает ресурсов'); SND.error(); }
      };
    }
    techEl.appendChild(div);
  }
}

function formatRate(r){
  if(Math.abs(r) < 0.01) return '0';
  if(Math.abs(r) < 1) return r.toFixed(2);
  return r.toFixed(1);
}

function updateResUI(){
  const groups = [
    {id:'base',      items:['wood','planks','stone','stoneBlocks','food']},
    {id:'raw',       items:['coal','ironOre','copperOre','goldOre','uraniumOre']},
    {id:'processed', items:['ironIngot','copperIngot','goldIngot','uranium','gears','circuits']},
  ];
  let html = '';
  for(const group of groups){
    let rowHtml = '';
    for(const k of group.items){
      if(!CORE_RES.has(k) && (G.res[k]||0) < 0.5 && Math.abs(G.rates[k]||0) < 0.01) continue;
      const info = RES_INFO.find(r => r[0] === k);
      if(!info) continue;
      const [,name,col,abbr] = info;
      const rate = G.rates[k] || 0;
      let rateColor = '#6c8098';
      if(rate > 0.01) rateColor = '#7fc27f';
      else if(rate < -0.01) rateColor = '#e08a7a';
      const sign = rate > 0.01 ? '+' : '';
      const rateStr = `<span class="rt" style="color:${rateColor}">${sign}${formatRate(rate)}</span>`;
      rowHtml += `<div class="res" data-res="${k}"><span class="dot" style="background:${col}"></span><span class="abbr">${abbr}</span><b>${Math.floor(G.res[k])}</b>${rateStr}</div>`;
    }
    if(rowHtml) html += `<div class="resrow" data-row="${group.id}">${rowHtml}</div>`;
  }

  let statusHtml = '';
  const humans = countHumans();
  statusHtml += `<div class="res" title="Население">👥 <b>${humans}</b>/${popCap()}</div>`;
  const unemployed = G.units.filter(u=>!u.robot && !u.drone && !u.inBoat && !u.inHeli && !u.job && u.state==='idle').length;
  statusHtml += `<div class="res" style="cursor:pointer;pointer-events:auto" onclick="showWorkers()" title="Показать рабочие места">💼 <b>${unemployed}</b></div>`;
  if(G.energy.produced > 0 || G.energy.consumed > 0){
    const eff = G.energy.efficiency;
    const color = eff >= 0.99 ? '#7fc27f' : eff >= 0.5 ? '#d8b45e' : '#e08a7a';
    statusHtml += `<div class="res" title="Энергия: ${G.energy.consumed.toFixed(1)} из ${G.energy.produced.toFixed(1)}">⚡ <b style="color:${color}">${Math.round(G.energy.consumed)}/${Math.round(G.energy.produced)}</b></div>`;
  }
  const n = G.needs;
  statusHtml += `<div class="res" title="Еда: ${Math.round(n.food)}&#10;Жильё: ${Math.round(n.housing)}&#10;Развлечения: ${Math.round(n.recreation)}&#10;Вера: ${Math.round(n.faith)}">😊 <b>${Math.round(G.happiness)}</b></div>`;
  const hh = Math.floor(G.dayTime * 24), mm = Math.floor((G.dayTime * 24 % 1) * 60);
  statusHtml += `<div class="res">📅 День ${G.day} • ${SEASON_NAMES[G.season]} • ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}${G.weather?' ⛈':''}</div>`;

  html += `<div class="resrow" data-row="status">${statusHtml}</div>`;
  resbarEl.innerHTML = html;
}

  if(!G.sel){ infoEl.classList.remove('open'); return; }

    const bo = G.sel;
    html = `<b>⛵ Лодка</b><br>Пассажиров: ${bo.passengers.length}/4<br><span style="color:#8fa6c0;font-size:11px">ПКМ по земле — погрузка/разгрузка</span>`;

    if(b.constructionT > 0){
      const total = getBuildTime(b.type);
      html += `<div class="warn" id="build-progress" style="color:#d8b45e">🏗 Строится: ${Math.round((1-b.constructionT/total)*100)}%</div>`;
    } else {
      if(b.def.workers) html += `<br>Рабочих: ${b.workers.length}/${b.def.workers}`;
      if(b.def.robotOnly) html += `<br><span style="color:#c8a0e0">Только роботы</span>`;
      if(b.def.powerUse) html += `<br><span style="color:#7fd4e0">⚡ −${b.def.powerUse} (КПД ${Math.round(G.energy.efficiency*100)}%)</span>`;
      if(b.def.powerOutput){
        let out = b.def.powerOutput;
        if(b.def.workers) out *= (b.workers.length / b.def.workers);
        if(b.def.dayOnly) out *= solarOutput();
        html += `<br><span style="color:#7fd4e0">⚡ +${out.toFixed(1)}</span>`;
      }
      if(b.deposit) html += `<br>Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}`;
      const status = buildingResourceStatus(b);
      if(status) html += `<div class="warn">⚠ Не хватает ${RES_NAMES[status.res] || status.res}</div>`;
      else if(b.def.workers && b.workers.length === 0) html += `<div class="warn" style="color:#d8b45e">⏳ Нет рабочих</div>`;
      const rates = buildingRate(b);
      const blocked = !!status;
      let rateHtml = '';
      for(const k in rates){
        if(rates[k] > 0.005) rateHtml += `<span style="color:${blocked?'#6c8098':'#7fc27f'}">+${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span> `;
        else if(rates[k] < -0.005) rateHtml += `<span style="color:${blocked?'#6c8098':'#e08a7a'}">${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span> `;
      }
      if(rateHtml) html += `<br>${rateHtml}`;

      if(b.def.workers){
        html += `<div class="wlist"><div style="font-size:11px;color:#8fa6c0;margin-bottom:4px">Рабочие:</div>`;
        if(b.workers.length === 0) html += `<div style="font-size:11px;color:#e08a7a">— нет —</div>`;
        for(const w of b.workers){
          const icon = w.drone ? '🚁' : w.robot ? '🤖' : '🧑';
          html += `<button class="sm del" onclick="fireWorkerById(${w.id})">${icon} Уволить</button>`;
        }
        if(b.workers.length < b.def.workers){
          html += `<br><button class="sm" onclick="hireWorkerFor(${b.tx},${b.ty})">＋ Нанять рабочего</button>`;
        }
        html += `</div>`;
      }

window.toggleManual = (unitId) => {
  const u = G.units.find(x => x.id === unitId);
  if(!u) return;
  u.manual = !u.manual;
  if(!u.manual && u.state === 'idle') u.idleT = 0.1;
  updateInfoUI();
};
window.fireWorkerById = (unitId) => {
  const u = G.units.find(x => x.id === unitId);
  if(!u) return;
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null;
  u.state = 'idle'; u.idleT = 0.5; u.path = null;
  updateInfoUI();
  if(!(G.sel instanceof Unit)) updateInfoUI();
};
window.hireWorkerFor = (tx, ty) => {
  const b = buildingAt(tx, ty);
  if(!b || !b.def.workers || b.workers.length >= b.def.workers) return;
  let best = null, bd = 1e18;
  for(const u of G.units){
    if(u.drone || u.job || u.inBoat || u.inHeli || u.manual) continue;
    if(u.state !== 'idle') continue;
    if(b.def.robotOnly && !u.robot) continue;
    if(getIslandAt(u.x, u.y) !== getIslandTile(b.tx, b.ty)) continue;
    const d = (u.x - b.px)**2 + (u.y - b.py)**2;
    if(d < bd){ bd = d; best = u; }
  }
  if(best){
    best.job = b;
    b.workers.push(best);
    const a = Math.random()*6.28, r = 12+Math.random()*8;
    best.wax = Math.cos(a)*r;
    best.way = Math.sin(a)*r;
    best.state = 'goBuilding';
    best.path = null;
    toast('Рабочий назначен');
  } else {
    toast('Нет свободных рабочих');
    SND.error();
  }
  updateInfoUI();
};

function drawStats(){
  const c = document.getElementById('statscanvas');
  const cx2 = c.getContext('2d');
  const w = c.width, h = c.height;
  cx2.fillStyle = '#0e1420';
  cx2.fillRect(0, 0, w, h);
  cx2.strokeStyle = '#1e2a3a';
  cx2.lineWidth = 1;
  for(let i = 1; i < 5; i++){ cx2.beginPath(); cx2.moveTo(40, i * h/5); cx2.lineTo(w - 20, i * h/5); cx2.stroke(); }
  let maxPop = 1, maxFood = 1, maxWood = 1, maxStone = 1, maxGold = 1;
  for(const s of G.stats){
    if(s.pop > maxPop) maxPop = s.pop;
    if(s.food > maxFood) maxFood = s.food;
    if(s.wood > maxWood) maxWood = s.wood;
    if(s.stone > maxStone) maxStone = s.stone;
    if(s.gold > maxGold) maxGold = s.gold;
  }
  const series = [
    {data: G.stats.map(s=>s.pop), color: '#7fe08a', max: maxPop*1.2, label: 'Население'},
    {data: G.stats.map(s=>s.food), color: '#d8a33c', max: maxFood*1.2, label: 'Еда'},
    {data: G.stats.map(s=>s.wood), color: '#7a5230', max: maxWood*1.2, label: 'Дерево'},
    {data: G.stats.map(s=>s.stone), color: '#9aa0a6', max: maxStone*1.2, label: 'Камень'},
    {data: G.stats.map(s=>s.gold), color: '#e6c341', max: maxGold*1.2, label: 'Золото'},
    {data: G.stats.map(s=>s.hap), color: '#6fa4e2', max: 100, label: 'Счастье'},
  ];
  const n = G.stats.length;
  if(n < 2){
    cx2.fillStyle = '#6c8098';
    cx2.font = '14px sans-serif';
    cx2.textAlign = 'center';
    cx2.textBaseline = 'middle';
    cx2.fillText('Собираем данные...', w/2, h/2);
    return;
  }
  const padL = 50, padR = 20, padT = 20, padB = 30;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  for(const s of series){
    cx2.strokeStyle = s.color; cx2.lineWidth = 2;
    cx2.beginPath();
    for(let i = 0; i < n; i++){
      const x = padL + (i / (n-1)) * plotW;
      const y = padT + plotH - (s.data[i] / s.max) * plotH;
      if(i === 0) cx2.moveTo(x, y); else cx2.lineTo(x, y);
    }
    cx2.stroke();
  }
  cx2.font = '12px sans-serif'; cx2.textAlign = 'left'; cx2.textBaseline = 'alphabetic';
  let ly = padT + 14;
  for(const s of series){
    cx2.fillStyle = s.color; cx2.fillRect(w - 130, ly - 8, 10, 10);
    cx2.fillStyle = '#e8eef7'; cx2.fillText(s.label, w - 115, ly);
    ly += 18;
  }
  cx2.fillStyle = '#6c8098'; cx2.font = '10px sans-serif'; cx2.textAlign = 'center';
  const firstT = G.stats[0].t, lastT = G.stats[n-1].t;
  for(let i = 0; i <= 4; i++){
    const x = padL + (i/4) * plotW;
    const t = firstT + (i/4) * (lastT - firstT);
    cx2.fillText(Math.round(t) + 'с', x, h - 12);
  }
}

const SAVE_KEY = 'citysim_v6_';
const SAVE_VERSION = 6;

function saveGame(slot){
  try {
    const data = {
      version: SAVE_VERSION,
      mapSize,
      terrain: terrain.map(row => row.map(t => t.t)),
      terrainV: terrain.map(row => row.map(t => t.v)),
      nodes: nodes.map(row => row.map(n => n ? {type:n.type, amount:n.amount} : null)),
      roadGrid: roadGrid.map(row => row.map(c => c ? 1 : 0)),
      res: {...G.res}, techs: {...G.techs},
      time: G.time, growT: G.growT, happiness: G.happiness,
      dayTime: G.dayTime, day: G.day, season: G.season, year: G.year,
      quests: {...G.quests}, weather: G.weather,
      markers: G.markers.map(m=>({x:m.x,y:m.y})),
      buildings: G.buildings.map(b => ({
        type: b.type, tx: b.tx, ty: b.ty, deposit: b.deposit,
        constructionT: b.constructionT || 0,
        workerIds: b.workers.map(w => w.id)
      })),
      units: G.units.map(u => ({
        id: u.id, x: u.x, y: u.y, robot: u.robot, drone: u.drone, state: u.state,
        cloth: u.cloth, skin: u.skin, width: u.width, manual: u.manual,
        jobTx: u.job ? u.job.tx : -1, jobTy: u.job ? u.job.ty : -1,
        carry: u.carry, carryAmt: u.carryAmt,
        timer: u.timer, idleT: u.idleT,
        targetTx: u.target ? u.target.tx : -1,
        targetTy: u.target ? u.target.ty : -1,
        inBoatIdx: u.inBoat ? G.boats.indexOf(u.inBoat) : -1,
        inHeliIdx: u.inHeli ? G.helis.indexOf(u.inHeli) : -1,
        hubIdx: u.hub ? G.buildings.indexOf(u.hub) : -1,
        mvx: u.mvx, mvy: u.mvy
      })),
      boats: G.boats.map(bo => ({
        x: bo.x, y: bo.y, state: bo.state, target: bo.target,
        passengerIds: bo.passengers.map(p => p.id)
      })),
      helis: G.helis.map(h => ({
        x: h.x, y: h.y, state: h.state, target: h.target,
        passengerIds: h.passengers.map(p => p.id)
      })),
      cam: {x: cam.x, y: cam.y, zoom: cam.zoom},
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY + slot, JSON.stringify(data));
    return true;
  } catch(e){ console.error('Save error', e); toast('Ошибка сохранения'); return false; }
}

function loadGame(slot){
  try {
    const raw = localStorage.getItem(SAVE_KEY + slot);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || data.version !== SAVE_VERSION) return false;

    mapSize = data.mapSize || 'medium';
    const size = MAP_SIZES[mapSize] || MAP_SIZES.medium;
    MW = size.w; MH = size.h;

    terrain = data.terrain.map((row, y) => row.map((t, x) => ({ t, v: data.terrainV[y][x] })));
    nodes = data.nodes.map((row, y) => row.map((n, x) => n ? {type:n.type, amount:n.amount, tx:x, ty:y} : null));
    roadGrid = data.roadGrid.map(row => row.map(c => !!c));
    bridgeGrid = [];
    for(let y=0;y<MH;y++){ bridgeGrid[y] = new Array(MW).fill(false); }

    G.res = {...data.res};
    for(const [k] of RES_INFO) if(G.res[k] === undefined) G.res[k] = 0;
    G.techs = {...data.techs};
    G.time = data.time; G.growT = data.growT; G.happiness = data.happiness || 50;
    G.dayTime = data.dayTime || 0.35; G.day = data.day || 1;
    G.season = data.season || 'spring'; G.year = data.year || 1;
    G.quests = {...(data.quests||{})};
    G.weather = data.weather || null;
    G.markers = (data.markers||[]).map(m=>({x:m.x,y:m.y}));

    G.buildings = data.buildings.map(bd => ({
      type: bd.type, def: BUILDINGS[bd.type], tx: bd.tx, ty: bd.ty,
      px: bd.tx*TS+TS/2, py: bd.ty*TS+TS/2,
      workers: [], deposit: bd.deposit,
      constructionT: bd.constructionT || 0
    }));

    G.units = [];
    const unitById = {};
    data.units.forEach(ud => {
      const u = new Unit(ud.x, ud.y, ud.robot);
      if(ud.id) u.id = ud.id;
      if(ud.drone){ u.drone = true; u.speed = 110; }
      if(ud.cloth) u.cloth = ud.cloth;
      if(ud.skin) u.skin = ud.skin;
      if(ud.width) u.width = ud.width;
      u.manual = !!ud.manual;
      u.state = ud.state;
      u.carry = ud.carry; u.carryAmt = ud.carryAmt;
      u.timer = ud.timer; u.idleT = ud.idleT;
      u.mvx = ud.mvx || 0; u.mvy = ud.mvy || 0;
      if(ud.hubIdx !== undefined && ud.hubIdx >= 0 && G.buildings[ud.hubIdx]) u.hub = G.buildings[ud.hubIdx];
      const tn = (ud.targetTx >= 0) ? nodes[ud.targetTy]?.[ud.targetTx] : null;
      u.target = tn || null;
      G.units.push(u);
      unitById[u.id] = u;
    });
    if(G.units.length) nextUnitId = Math.max(...G.units.map(u => u.id)) + 1;

    data.buildings.forEach((bd, i) => {
      (bd.workerIds || []).forEach(id => {
        const u = unitById[id];
        if(u){ G.buildings[i].workers.push(u); u.job = G.buildings[i]; }
      });
    });
    data.units.forEach((ud, i) => {
      if(ud.jobTx !== undefined && ud.jobTx >= 0){
        const b = G.buildings.find(bb => bb.tx === ud.jobTx && bb.ty === ud.jobTy);
        if(b && !G.units[i].job) G.units[i].job = b;
      }
    });

    G.boats = data.boats.map(bod => { const bo = new Boat(bod.x, bod.y); bo.state = bod.state; bo.target = bod.target; return bo; });
    data.boats.forEach((bod, i) => {
      (bod.passengerIds || []).forEach(id => {
        const u = unitById[id];
        if(u){ G.boats[i].passengers.push(u); u.inBoat = G.boats[i]; }
      });
    });
    G.helis = (data.helis || []).map(hd => { const h = new Heli(hd.x, hd.y); h.state = hd.state; h.target = hd.target; return h; });
    (data.helis || []).forEach((hd, i) => {
      (hd.passengerIds || []).forEach(id => {
        const u = unitById[id];
        if(u){ G.helis[i].passengers.push(u); u.inHeli = G.helis[i]; }
      });
    });

    cam.x = data.cam.x; cam.y = data.cam.y; cam.zoom = data.cam.zoom;
    clampCam();
    rebuildBridgeGrid();
    computeIslands();
    renderTerrain();
    renderTech();
    makeBuildUI();
    refreshBuildUI();
    renderQuests();
    updateQuestHud();
    G.stats = []; G.log = []; G.particles = [];
    G.rateHistory = []; G.rateTimer = 0;
    G.energy = { produced: 0, consumed: 0, efficiency: 1 };
    G.gameStarted = true;
    return true;
  } catch(e){ console.error('Load error', e); toast('Ошибка загрузки'); return false; }
}

function listSaves(){
  const out = [];
  for(let i=0;i<3;i++){
    const raw = localStorage.getItem(SAVE_KEY + i);
    if(raw){ try { const d = JSON.parse(raw); out.push({slot: i, exists: true, savedAt: d.savedAt, version: d.version}); } catch(e){ out.push({slot: i, exists: false}); } }
    else out.push({slot: i, exists: false});
  }
  return out;
}
function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0,5);
}

  else if(view === 'load') renderMenuLoad();
  applyUIScale();
}
function closeMenu(){ overlayEl.classList.remove('open'); overlayEl.innerHTML = ''; }
function renderMenuMain(){
  const hasSaves = listSaves().some(s=>s.exists);
  let html = `<div class="menu-box">
    <h2>Поселение</h2>
    <button onclick="openMenu('newgame')">🌱 Новая игра</button>
    <button onclick="openMenu('load')" ${hasSaves ? '' : 'disabled'}>📂 Загрузить</button>
    <button onclick="openMenu('save')" ${G.gameStarted ? '' : 'disabled'}>💾 Сохранить</button>
    ${G.gameStarted ? '<button onclick="closeMenu()">▶ Продолжить игру</button>' : ''}
    <button class="back-btn" onclick="closeMenu()">✕ Закрыть</button>
  </div>`;
  overlayEl.innerHTML = html;
}
function renderMenuNewGame(){
  let html = '<div class="menu-box"><h2>Выбор карты</h2>';
  for(const key of ['small','medium','large']){
    const s = MAP_SIZES[key];
    html += `<button onclick="startNewGame('${key}')">${s.name} <span class="slot-info">${s.w}×${s.h}</span></button>`;
  }
  html += '<button class="back-btn" onclick="openMenu(\'main\')">◀ Назад</button></div>';
  overlayEl.innerHTML = html;
}
function renderMenuSave(){
  const saves = listSaves();
  let html = '<div class="menu-box"><h2>Сохранить игру</h2>';
  for(const s of saves){
    const info = s.exists ? formatDate(s.savedAt) : 'пусто';
    html += `<button onclick="doSave(${s.slot})">Слот ${s.slot+1}<span class="slot-info">${info}</span></button>`;
  }
  html += '<button class="back-btn" onclick="openMenu(\'main\')">◀ Назад</button></div>';
  overlayEl.innerHTML = html;
}
function renderMenuLoad(){
  const saves = listSaves();
  let html = '<div class="menu-box"><h2>Загрузить игру</h2>';
  for(const s of saves){
    const info = s.exists ? formatDate(s.savedAt) : 'пусто';
    html += `<button ${s.exists ? '' : 'disabled'} onclick="doLoad(${s.slot})">Слот ${s.slot+1}<span class="slot-info">${info}</span></button>`;
  }
  html += '<button class="back-btn" onclick="openMenu(\'main\')">◀ Назад</button></div>';
  overlayEl.innerHTML = html;
}
function doSave(slot){ if(!G.gameStarted){ toast('Игра не начата'); return; } if(saveGame(slot)){ toast('Игра сохранена'); renderMenuSave(); } }
function doLoad(slot){ if(loadGame(slot)){ closeMenu(); toast('Игра загружена'); updateResUI(); updateInfoUI(); } }
function startNewGame(size){
  closeMenu();
  mapSize = size || 'medium';
  newGame();
}
window.openMenu = openMenu; window.closeMenu = closeMenu; window.doSave = doSave;
window.doLoad = doLoad; window.startNewGame = startNewGame;

// =================== INPUT ===================
const keys = {};
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if(k === ' '){ e.preventDefault(); togglePause(); }
  if(k === 'escape'){
    if(G.build){ G.build = null; refreshBuildUI(); }
    else if(G.markerMode){ G.markerMode = false; }
    else if(buildItemsEl.classList.contains('open')){ G.selectedCategory = null; buildItemsEl.classList.remove('open'); buildCatsEl.querySelectorAll('.catbtn').forEach(el => el.classList.remove('active')); }
    else if(overlayEl.classList.contains('open')) closeMenu();
    else if(document.getElementById('settingsmodal').classList.contains('open')) document.getElementById('settingsmodal').classList.remove('open');
    else openMenu('main');
  }
  if(k === 't'){ techEl.classList.toggle('open'); renderTech(); questEl.classList.remove('open'); }
  if(k === 'q'){ questEl.classList.toggle('open'); renderQuests(); techEl.classList.remove('open'); }
  if(k === 's' && !e.shiftKey){ openStats(); }
  if(k === 'o'){ document.getElementById('settingsmodal').classList.toggle('open'); renderSettings(); applyUIScale(); }
  if(k === 'm'){ G.markerMode = !G.markerMode; G.build = null; refreshBuildUI(); toast(G.markerMode ? 'Режим меток включён' : 'Режим меток выключен'); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function togglePause(){
  G.speed = (G.speed === 0) ? 1 : 0;
  updateTimeButtons();
}
function updateTimeButtons(){
  document.querySelectorAll('.timebtn').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.speed) === G.speed);
  });
}
document.querySelectorAll('.timebtn').forEach(el => {
  el.onclick = () => { SND.click(); G.speed = parseInt(el.dataset.speed); updateTimeButtons(); };
});

let mouseDown = false, dragStartX = 0, dragStartY = 0, panMode = false;
let lastMX = 0, lastMY = 0;
canvas.addEventListener('mousedown', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY;
  if(e.button === 1){
    panMode = true; lastMX = e.clientX; lastMY = e.clientY;
    e.preventDefault(); return;
  }
  if(e.button === 0){
    mouseDown = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    if(!G.build && !G.markerMode) G.boxSelect = { active: false, x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY };
  }
  hideTooltip();
});
canvas.addEventListener('mousemove', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.inside = true;
  if(panMode){
    cam.x -= (e.clientX - lastMX) / cam.zoom;
    cam.y -= (e.clientY - lastMY) / cam.zoom;
    lastMX = e.clientX; lastMY = e.clientY;
    clampCam(); return;
  }
  if(mouseDown && G.boxSelect){
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if(Math.hypot(dx, dy) > 5){
      G.boxSelect.active = true;
      G.boxSelect.x2 = e.clientX; G.boxSelect.y2 = e.clientY;
    }
  }
  if(!G.build && !overlayEl.classList.contains('open') && !G.markerMode){
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    const bb = buildingAt(tx, ty);
    if(bb){ showTooltip(placedTooltipHtml(bb), e.clientX, e.clientY); }
    else if(nodes[ty] && nodes[ty][tx]){
      const n = nodes[ty][tx];
      if(n.type === 'tree' || n.type === 'rock' || isDeposit(n.type)){
        showTooltip(nodeTooltipHtml(n), e.clientX, e.clientY);
      } else hideTooltip();
    } else hideTooltip();
  } else hideTooltip();
});
addEventListener('mouseup', e => {
  if(panMode){ panMode = false; return; }
  if(e.button === 0 && mouseDown){
    mouseDown = false;
    if(G.boxSelect && G.boxSelect.active){
      const bx = Math.min(G.boxSelect.x1, G.boxSelect.x2);
      const by = Math.min(G.boxSelect.y1, G.boxSelect.y2);
      const bw = Math.abs(G.boxSelect.x2 - G.boxSelect.x1);
      const bh = Math.abs(G.boxSelect.y2 - G.boxSelect.y1);
      const sel = [];
      for(const u of G.units){
        if(u.inBoat || u.inHeli) continue;
        const ux = u.x*z + ox, uy = u.y*z + oy;
        if(ux >= bx && ux <= bx+bw && uy >= by && uy <= by+bh) sel.push(u);
      }
      G.selectedUnits = sel;
      G.sel = sel.length === 1 ? sel[0] : null;
      G.boxSelect = null;
      updateInfoUI();
    } else {
      G.boxSelect = null;
      handleClick(e.clientX, e.clientY);
    }
  }
});
canvas.addEventListener('mouseleave', () => { G.mouse.inside = false; mouseDown = false; panMode = false; hideTooltip(); });
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  for(let i = G.markers.length - 1; i >= 0; i--){
    const m = G.markers[i];
    if(Math.hypot(m.x - wx, m.y - wy) < 20){ G.markers.splice(i, 1); return; }
  }
  if(G.sel instanceof Boat){ boatGoTo(G.sel, wx, wy); return; }
  if(G.sel instanceof Heli){ heliGoTo(G.sel, wx, wy); return; }
  if(G.selectedUnits.length > 0){
    for(const u of G.selectedUnits) orderMove(u, wx, wy);
    return;
  }
  G.build = null; G.markerMode = false; refreshBuildUI();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx,wy] = screenToWorld(e.clientX, e.clientY);
  const f = e.deltaY > 0 ? 0.88 : 1.14;
  cam.zoom = clamp(cam.zoom * f, 0.3, 2.6);
  const [nx,ny] = screenToWorld(e.clientX, e.clientY);
  cam.x += wx - nx; cam.y += wy - ny;
  clampCam();
}, {passive:false});

function clampCam(){
  const halfW = (W/2)/cam.zoom, halfH = (H/2)/cam.zoom;
  const worldW = MW*TS, worldH = MH*TS;
  if(worldW < halfW*2) cam.x = worldW/2;
  else cam.x = clamp(cam.x, halfW, worldW-halfW);
  if(worldH < halfH*2) cam.y = worldH/2;
  else cam.y = clamp(cam.y, halfH, worldH-halfH);
}

function handleClick(sx, sy){
  const [wx, wy] = screenToWorld(sx, sy);
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(G.markerMode){
    G.markers.push({x: wx, y: wy});
    toast('Метка поставлена (ПКМ — убрать)');
    SND.click();
    return;
  }
  if(G.build === 'demolish'){
    const b = buildingAt(tx, ty);
    if(b){ demolishBuilding(b); return; }
    if(roadGrid[ty] && roadGrid[ty][tx]){ demolishRoad(tx, ty); return; }
    toast('Здесь нечего сносить');
    return;
  }
  if(G.build){
    if(tryPlace(G.build, tx, ty)){
      if(!keys['shift']) G.build = null;
      refreshBuildUI();
    }
    return;
  }
  let bestBoat = null, bd = 24/cam.zoom;
  for(const bo of G.boats){ const d = Math.hypot(bo.x-wx, bo.y-wy); if(d < bd){ bd = d; bestBoat = bo; } }
  if(bestBoat){ G.sel = bestBoat; G.selectedUnits = []; updateInfoUI(); return; }
  let bestHeli = null; bd = 26/cam.zoom;
  for(const h of G.helis){ const d = Math.hypot(h.x-wx, h.y-wy); if(d < bd){ bd = d; bestHeli = h; } }
  if(bestHeli){ G.sel = bestHeli; G.selectedUnits = []; updateInfoUI(); return; }
  let bestUnit = null; bd = 22/cam.zoom;
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    const d = Math.hypot(u.x-wx, u.y-wy);
    if(d < bd){ bd = d; bestUnit = u; }
  }
  if(bestUnit){
    if(keys['shift']){
      if(!G.selectedUnits.includes(bestUnit)) G.selectedUnits.push(bestUnit);
    } else G.selectedUnits = [bestUnit];
    G.sel = bestUnit;
    updateInfoUI();
    return;
  }
  const b = buildingAt(tx,ty);
  if(b){ G.sel = b; G.selectedUnits = []; updateInfoUI(); return; }
  if(G.sel instanceof Unit && !G.sel.inBoat && !G.sel.inHeli){
    if(orderMove(G.sel, wx, wy)){ updateInfoUI(); return; }
  }
  G.sel = null; G.selectedUnits = [];
  infoEl.classList.remove('open');
}

// =================== START ===================
function findStart(){
  computeIslands();
  let bestIsland = -1, bestSize = 0;
  for(const id in islandSizes){
    if(islandSizes[id] > bestSize){ bestSize = islandSizes[id]; bestIsland = parseInt(id); }
  }
  let best = null, bestScore = -1e9;
  for(let y=6;y<MH-6;y++) for(let x=6;x<MW-6;x++){
    if(islandId[y][x] !== bestIsland) continue;
    if(terrain[y][x].t !== 'grass') continue;
    let trees = 0, water = 0, dep = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = x+dx, ny = y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && n.type==='tree') trees++;
      if(n && isDeposit(n.type)) dep++;
      if(terrain[ny][nx].t === 'water') water++;
    }
    const score = trees*2 - dep*1.5 + Math.min(water, 8)*3 - Math.abs(x-MW/2)*0.1 - Math.abs(y-MH/2)*0.1;
    if(score > bestScore){ bestScore = score; best = {x,y}; }
  }
  return best || {x: Math.floor(MW/2), y: Math.floor(MH/2)};
}
function newGame(){
  const size = MAP_SIZES[mapSize] || MAP_SIZES.medium;
  MW = size.w; MH = size.h;
  tcan.width = MW*TS; tcan.height = MH*TS;
  genWorld();
  renderTerrain();
  G.res = { wood:120, planks:0, stone:60, stoneBlocks:0, food:60, coal:0,
            ironOre:0, ironIngot:0, copperOre:0, copperIngot:0,
            goldOre:0, goldIngot:0, uraniumOre:0, uranium:0, gears:0, circuits:0 };
  G.rates = {};
  for(const [k] of RES_INFO) G.rates[k] = 0;
  G.rateHistory = []; G.rateTimer = 0;
  G.units = []; G.buildings = []; G.boats = []; G.helis = []; G.regrow = [];
  G.techs = {}; G.sel = null; G.build = null; G.time = 0; G.growT = 0;
  G.happiness = 50;
  G.needs = {food:100, housing:100, recreation:0, faith:0};
  G.gameStarted = true;
  G.speed = 1; updateTimeButtons();
  G.dayTime = 0.35; G.day = 1; G.season = 'spring'; G.year = 1;
  G.log = []; G.stats = []; G.statTimer = 0;
  G.markers = []; G.markerMode = false;
  G.particles = []; G.particleTimer = 0;
  G.eventTimer = 90 + Math.random()*30;
  G.weather = null;
  G.selectedUnits = []; G.boxSelect = null;
  G.quests = {};
  G.energy = { produced: 0, consumed: 0, efficiency: 1 };
  G.selectedCategory = null;
  G._hoverResKey = null;
  logisticsHubs = [];
  nextUnitId = 1;

  const st = findStart();
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const x = st.x+dx, y = st.y+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    const n = nodes[y][x];
    if(n && !isDeposit(n.type)) nodes[y][x] = null;
  }
  const house = { type:'house', def:BUILDINGS.house, tx:st.x, ty:st.y, px: st.x*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0 };
  G.buildings.push(house);
  const stg = { type:'storage', def:BUILDINGS.storage, tx:st.x+1, ty:st.y, px: (st.x+1)*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0 };
  G.buildings.push(stg);
  G.units.push(new Unit(house.px - 10, house.py + 22, false));
  G.units.push(new Unit(house.px + 12, house.py + 26, false));
  cam.x = st.x*TS + TS; cam.y = st.y*TS + TS; cam.zoom = 1.4;
  clampCam();
  renderTech(); makeBuildUI(); refreshBuildUI(); renderQuests(); updateQuestHud();
  updateResUI(); renderLog();
  pushLog('Поселение основано. Удачи!', 'good');
  toast('Добро пожаловать! Изучайте технологии');
}

// =================== LOOP ===================
let last = performance.now();
let acc = 0, autosaveT = 0;
let fpsFrames = 0, fpsTime = 0;

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.1) dt = 0.1;

  fpsFrames++;
  fpsTime += dt;
  if(fpsTime >= 0.5){
    const fps = Math.round(fpsFrames / fpsTime);
    document.getElementById('fps-counter').textContent = `${fps} FPS`;
    fpsFrames = 0;
    fpsTime = 0;
  }

  const spd = 520/cam.zoom * dt;
  let moved = false;
  if(keys['a'] || keys['arrowleft'] || keys['ф']){ cam.x -= spd; moved = true; }
  if(keys['d'] || keys['arrowright'] || keys['в']){ cam.x += spd; moved = true; }
  if(keys['w'] || keys['arrowup'] || keys['ц']){ cam.y -= spd; moved = true; }
  if(keys['s'] || keys['arrowdown'] || keys['ы']){ cam.y += spd; moved = true; }
  if(moved) clampCam();
  if(G.gameStarted && !overlayEl.classList.contains('open') && G.speed > 0){
    update(dt * G.speed);
    updateParticles(dt * G.speed);
    autosaveT += dt;
    if(autosaveT > 90){ autosaveT = 0; saveGame('auto'); }
  }
  acc += dt;
  if(acc > 0.15){
    acc = 0;
    updateResUI();
    refreshBuildUI();
    updateUILayout();

    if(G.sel && G.sel.constructionT > 0 && G.sel.def){
      const el = document.getElementById('build-progress');
      if(el){
        const total = getBuildTime(G.sel.type);
        el.textContent = `🏗 Строится: ${Math.round((1 - G.sel.constructionT/total) * 100)}%`;
      }
    }

    if(tooltipEl.classList.contains('open') && G.mouse.inside && tooltipEl.textContent.includes('Строится')){
      const [wx, wy] = screenToWorld(G.mouse.x, G.mouse.y);
      const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
      const bb = buildingAt(tx, ty);
      if(bb) tooltipEl.innerHTML = placedTooltipHtml(bb);
    }
  }
  if(toastT > 0){ toastT -= dt; if(toastT <= 0) toastEl.style.opacity = 0; }
  render();
}

// =================== INIT ===================
(function init(){
  loadSettings();
  genWorld();
  renderTerrain();
  applySettings();
  cam.x = MW*TS/2; cam.y = MH*TS/2; cam.zoom = 0.5;
  clampCam();
  renderQuests();
  updateQuestHud();
  openMenu('main');
  requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поселение</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;
  font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#e8eef7;user-select:none}
#c{display:block;position:absolute;inset:0;cursor:crosshair}

#minimap{position:fixed;bottom:10px;left:10px;border:1px solid #2f3a4b;border-radius:6px;
  cursor:pointer;z-index:50;background:#0b0e13;box-shadow:0 2px 12px rgba(0,0,0,.5);
  opacity:.85;transition:opacity .18s ease;top:auto;right:auto}
#minimap:hover{opacity:1}

#resbar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;
  gap:3px;pointer-events:none;max-width:calc(100vw - 560px);z-index:4}
.resrow{display:flex;gap:3px;flex-wrap:wrap;pointer-events:none}
.res{background:rgba(16,21,30,.88);border:1px solid #2f3a4b;border-radius:5px;
  padding:2px 6px;font-size:10.5px;display:flex;gap:4px;align-items:center;
  backdrop-filter:blur(4px);line-height:1.3;pointer-events:auto;cursor:help}
.res b{font-weight:700;font-variant-numeric:tabular-nums;font-size:11px}
.res .abbr{font-size:10px;color:#a8b8cc}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.rt{font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}

#questhud{position:absolute;top:78px;left:8px;background:rgba(16,21,30,.88);
  border:1px solid #2f3a4b;border-radius:6px;padding:5px 10px;font-size:11.5px;z-index:4;
  color:#d8e2f0;pointer-events:none;max-width:300px;transition:top .1s ease}
#questhud b{color:#7fc27f}

#topbar{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:10;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:7px;
  padding:6px 10px;font-size:12px;cursor:pointer;transition:.12s;backdrop-filter:blur(4px)}
.tbtn:hover{background:rgba(40,58,84,.95);border-color:#58789e}
.timegroup{display:flex;gap:2px;background:rgba(16,21,30,.92);border:1px solid #2f3a4b;
  border-radius:7px;padding:2px;backdrop-filter:blur(4px)}
.timebtn{padding:4px 8px;font-size:11.5px;border-radius:5px;cursor:pointer;transition:.1s;min-width:24px;text-align:center}
.timebtn:hover{background:rgba(40,58,84,.95)}
.timebtn.active{background:#2e5c8f;color:#fff}

#build{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;
  max-width:calc(100vw - 480px)}
#buildcats{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.catbtn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:6px;
  padding:5px 9px;font-size:16px;cursor:pointer;transition:.12s;min-width:40px;
  text-align:center;backdrop-filter:blur(4px);line-height:1.1}
.catbtn:hover{background:rgba(40,58,84,.95);border-color:#58789e}
.catbtn.active{background:#2e5c8f;border-color:#6fa4e2;box-shadow:0 0 12px rgba(80,150,230,.4)}
#builditems{display:none;gap:3px;flex-wrap:wrap;justify-content:center;
  background:rgba(11,15,22,.9);border:1px solid #2f3a4b;border-radius:8px;
  padding:5px;max-width:100%;backdrop-filter:blur(4px)}
#builditems.open{display:flex}
.btn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:6px;
  padding:3px 6px;font-size:10px;cursor:pointer;min-width:70px;text-align:center;
  transition:.12s;line-height:1.2;backdrop-filter:blur(4px)}
.btn:hover{background:rgba(40,58,84,.95);border-color:#58789e}
.btn.active{background:#2e5c8f;border-color:#6fa4e2;box-shadow:0 0 12px rgba(80,150,230,.5)}
.btn.dis{opacity:.32;cursor:not-allowed}
.btn.dis:hover{background:rgba(16,21,30,.92);border-color:#2f3a4b}
.btn.danger.active{background:#8f3030;border-color:#e27a7a}
.btn .c{font-size:8.5px;color:#8fa6c0;margin-top:1px}
.btn .pw{font-size:8.5px;color:#7fd4e0;margin-top:1px}

.sidepanel{position:absolute;top:58px;right:8px;width:340px;max-height:calc(100vh - 130px);
  overflow-y:auto;background:rgba(11,15,22,.97);border:1px solid #2f3a4b;
  border-radius:9px;padding:10px;display:none;backdrop-filter:blur(6px);z-index:20}
.sidepanel.open{display:block}
.sidepanel h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:#9fc4ee;font-weight:600}
.tech{border:1px solid #2c3747;border-radius:7px;padding:7px 9px;margin-bottom:6px;
  cursor:pointer;background:#141c28;transition:.12s}
.tech:hover{background:#1c2839;border-color:#456080}
.tech b{font-size:12.5px}
.tech .td{font-size:11px;color:#8fa6c0;margin:2px 0 3px}
.tech .tc{font-size:11px;color:#d8b45e}
.tech.done{opacity:.55;border-color:#3a6b3a;background:#132018;cursor:default}

.tech.locked:hover{background:#141c28;border-color:#2c3747}

.quest{border:1px solid #2c3747;border-radius:7px;padding:7px 9px;margin-bottom:6px;

.quest .qd{font-size:11px;color:#8fa6c0;margin-top:2px}
.quest.done{border-color:#3a6b3a;background:#132018;opacity:.65}
.quest.done b{color:#7fc27f}
.quest.active{border-color:#6fa4e2;background:#1a2436;box-shadow:0 0 10px rgba(80,150,230,.25)}
.quest .qprog{font-size:11px;color:#d8b45e;margin-top:2px;font-variant-numeric:tabular-nums}

#info{position:absolute;left:8px;top:120px;background:rgba(16,21,30,.92);
  border:1px solid #2f3a4b;border-radius:7px;padding:8px 11px;font-size:12px;

#info.open{display:block}
#info button{background:#2e5c8f;border:1px solid #6fa4e2;color:#fff;border-radius:5px;

#info button:hover{background:#3a6dab}
#info button.del{background:#8f3030;border-color:#e27a7a}
#info button.del:hover{background:#ab3a3a}
#info button.sm{padding:2px 6px;font-size:10px;margin-top:2px}
#info .warn{color:#e08a7a;font-weight:600;margin-top:3px}
#info .wlist{margin-top:5px;border-top:1px solid #2c3747;padding-top:5px}

#hint{position:absolute;left:240px;bottom:12px;font-size:10.5px;color:#6c8098;

#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

#tooltip{position:absolute;pointer-events:none;background:rgba(11,16,24,.97);

#tooltip.open{display:block}
#tooltip b{color:#9fc4ee;font-size:12.5px}
#tooltip .tt-cost{color:#d8b45e;margin-top:3px}
#tooltip .tt-req{color:#e08a6a;margin-top:2px}
#tooltip .tt-sub{color:#8fa6c0;margin-top:2px}
#tooltip .tt-warn{color:#e08a7a;margin-top:3px;font-weight:600}
#tooltip .tt-rate{margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
#tooltip .tt-pw{color:#7fd4e0;margin-top:3px}

#logbox{position:absolute;bottom:135px;right:10px;width:270px;max-height:110px;overflow-y:auto;

.log-entry{padding:2px 0;border-bottom:1px solid rgba(60,75,95,.3)}

.log-entry.danger{color:#e08a7a}
.log-entry.good{color:#7fc27f}
.log-entry .t{color:#5a6a80;font-size:10px;margin-right:4px}

#overlay{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;

#overlay.open{display:flex}
.menu-box{background:#131b26;border:1px solid #2f3a4b;border-radius:12px;padding:26px;

.menu-box h2{margin:0 0 20px;text-align:center;color:#9fc4ee;font-size:22px;letter-spacing:1px}
.menu-box button{display:block;width:100%;background:#1e2b3d;border:1px solid #3a4a5e;

  margin-bottom:8px;transition:.12s;text-align:left;position:relative}
.menu-box button:hover{background:#2e5c8f;border-color:#6fa4e2}
.menu-box button:disabled{opacity:.35;cursor:not-allowed}
.menu-box button:disabled:hover{background:#1e2b3d;border-color:#3a4a5e}
.slot-info{font-size:11px;color:#8fa6c0;float:right;margin-top:2px;font-weight:400}
.back-btn{margin-top:12px;text-align:center!important}

#statsmodal{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#statsmodal.open{display:flex}
#statsmodal .menu-box{width:780px;max-width:95vw;padding:20px;display:flex;flex-direction:column;align-items:center}
#statscanvas{display:block;position:relative;inset:auto;width:100%;max-width:720px;
  height:auto;aspect-ratio:720/400;background:#0e1420;border-radius:8px;
  border:1px solid #2c3747;margin-bottom:15px}

#workersmodal{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#workersmodal.open{display:flex}
.worker-row{padding:5px 8px;border-bottom:1px solid rgba(60,75,95,.3);cursor:pointer;
  display:flex;justify-content:space-between;font-size:12px}
.worker-row:hover{background:rgba(40,58,84,.6)}
.worker-row .vac{color:#e08a7a}

#settingsmodal{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#settingsmodal.open{display:flex}
#settingsmodal .menu-box{min-width:460px}
.setting-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(60,75,95,.3);font-size:13px}
.setting-row:last-child{border-bottom:none}
.setting-row label{color:#e8eef7;cursor:pointer}
.setting-row input[type="range"]{width:160px;accent-color:#2e5c8f}
.setting-row select{background:#1e2b3d;color:#e8eef7;border:1px solid #3a4a5e;
  border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer}
.toggle-switch{position:relative;display:inline-block;width:42px;height:22px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#2c3747;
  border-radius:22px;transition:.2s}
.toggle-slider:before{content:"";position:absolute;height:16px;width:16px;
  left:3px;bottom:3px;background:#e8eef7;border-radius:50%;transition:.2s}
.toggle-switch input:checked + .toggle-slider{background:#2e5c8f}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(20px)}
.settings-section{font-size:11px;color:#6fa4e2;text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 4px;font-weight:600}
.settings-section:first-child{margin-top:0}

#fps-counter{position:absolute;bottom:10px;right:10px;background:rgba(16,21,30,.88);
  border:1px solid #2f3a4b;border-radius:5px;padding:4px 8px;font-size:11px;
  font-family:monospace;color:#7fc27f;z-index:50;display:none;pointer-events:none}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#2c3747;border-radius:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="minimap" width="220" height="165"></canvas>

<div id="topbar">
  <div class="timegroup">
    <div class="timebtn" data-speed="0" title="Пауза (пробел)">⏸</div>
    <div class="timebtn active" data-speed="1" title="1×">▶</div>

  </div>

<div id="settingsmodal"><div class="menu-box"><h2>⚙ Настройки</h2><div id="settingscontent"></div><button class="back-btn" onclick="document.getElementById('settingsmodal').classList.remove('open')">✕ Закрыть</button></div></div>
<div id="hint">WASD — камера • колесо — зум • ЛКМ-протяжка — выделение • M — метка • Пробел — пауза • O — настройки</div>

<div id="tooltip"></div>

<script>
"use strict";

// =================== SETTINGS ===================
const SETTINGS = {
  sound: true, volume: 0.35, minimap: true, minimapSize: 'medium',
  log: true, particles: true, daynight: true, hints: true, uiScale: 1.15, fps: false,
};
function loadSettings(){ try { const raw = localStorage.getItem('citysim_settings'); if(raw) Object.assign(SETTINGS, JSON.parse(raw)); } catch(e){} }
function saveSettings(){ try { localStorage.setItem('citysim_settings', JSON.stringify(SETTINGS)); } catch(e){} }

// =================== UI SCALE ===================
const UI_ZOOM_ELEMENTS = ['resbar','questhud','topbar','build','logbox','hint','info','questpanel','techpanel','minimap'];
function applyUIScale(){
  const scale = SETTINGS.uiScale || 1;
  for(const id of UI_ZOOM_ELEMENTS){
    const el = document.getElementById(id);
    if(el) el.style.zoom = scale;
  }
  document.querySelectorAll('.menu-box').forEach(el => { el.style.zoom = scale; });
  updateUILayout();
}

function updateUILayout(){
  const scale = SETTINGS.uiScale || 1;
  const resbarEl = document.getElementById('resbar');
  if(!resbarEl) return;

  const availW = Math.max(180, (W - 560) / scale);
  resbarEl.style.maxWidth = availW + 'px';

  const rb = resbarEl.getBoundingClientRect();
  const bottomCss = rb.bottom / scale;

  const questhudEl = document.getElementById('questhud');
  if(questhudEl && questhudEl.style.display !== 'none'){
    questhudEl.style.top = Math.max(78, bottomCss + 6) + 'px';
  }

  const infoEl2 = document.getElementById('info');
  if(infoEl2){
    infoEl2.style.top = Math.max(120, bottomCss + 8) + 'px';
  }
}

// =================== SOUND ===================
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, vol, delay){
  if(!SETTINGS.sound || SETTINGS.volume <= 0) return;
  const ac = ensureAudio(); if(!ac) return;
  try {
    const t0 = ac.currentTime + (delay||0);
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    const v = vol * SETTINGS.volume;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(v, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  } catch(e){}
}
const SND = {
  click: () => playTone(760, 0.04, 'square', 0.03),
  place: () => { playTone(500,0.08,'sine',0.06); playTone(720,0.1,'sine',0.05,0.05); },
  error: () => playTone(180, 0.15, 'sawtooth', 0.05),
  quest: () => [523,659,784].forEach((f,i) => playTone(f,0.22,'sine',0.06,i*0.09)),
  tech: () => [440,554,659].forEach((f,i) => playTone(f,0.2,'sine',0.055,i*0.08)),
  newcomer: () => { playTone(880,0.12,'sine',0.045); playTone(1175,0.18,'sine',0.035,0.1); },
  caravan: () => { playTone(440,0.18,'triangle',0.06); playTone(660,0.22,'triangle',0.05,0.14); },
  season: () => { playTone(330,0.32,'sine',0.04); playTone(440,0.32,'sine',0.035,0.18); },
  weather: () => playTone(150, 0.32, 'sawtooth', 0.04),
  notify: () => playTone(660, 0.08, 'sine', 0.035),
};
document.addEventListener('click', ensureAudio, { once: true });
document.addEventListener('keydown', ensureAudio, { once: true });

// =================== UTILS ===================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const miniCan = document.getElementById('minimap');
const miniCtx = miniCan.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize', () => { resize(); updateUILayout(); }); resize();

const TS = 32;
let MW = 160, MH = 120;
const MAP_SIZES = {
  small:  { w:100, h:75,  name:'Маленькая' },
  medium: { w:160, h:120, name:'Средняя'   },
  large:  { w:240, h:180, name:'Большая'   },
};
let mapSize = 'medium';

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const DAY_LENGTH = 100;
const DAYS_PER_SEASON = 3;
const SEASONS = ['spring','summer','autumn','winter'];
const SEASON_NAMES = {spring:'Весна', summer:'Лето', autumn:'Осень', winter:'Зима'};
const SEASON_FARM = {spring:1.1, summer:1.2, autumn:1.0, winter:0.5};

function hash(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct=4){
  let v=0, a=.5, f=1;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*131); f*=2; a*=.5; }
  return v;
}

// =================== RESOURCES ===================
const RES_INFO = [
  ['wood',       'Дерево',      '#7a5230', 'Др'],
  ['planks',     'Доски',       '#a67b52', 'Дс'],
  ['stone',      'Камень',      '#9aa0a6', 'Км'],
  ['stoneBlocks','Блоки',       '#6b7076', 'Бл'],
  ['food',       'Еда',         '#d8a33c', 'Ед'],
  ['coal',       'Уголь',       '#3d3d44', 'Уг'],
  ['ironOre',    'Жел.руда',    '#8b6555', 'ЖР'],
  ['ironIngot',  'Железо',      '#a8705a', 'Жл'],
  ['copperOre',  'Мед.руда',    '#c97a3a', 'МР'],
  ['copperIngot','Медь',        '#e89a4a', 'Мд'],
  ['goldOre',    'Зол.руда',    '#d4b13a', 'ЗР'],

// =================== WORLD GEN ===================
let terrain = [], nodes = [];
let islandId = [], islandSizes = {};
let roadGrid = [], bridgeGrid = [];

function initGrids(){
  roadGrid = []; bridgeGrid = []; islandId = [];
  for(let y=0;y<MH;y++){
    roadGrid[y]=[]; bridgeGrid[y]=[]; islandId[y]=[];
    for(let x=0;x<MW;x++){ roadGrid[y][x]=false; bridgeGrid[y][x]=false; islandId[y][x]=-1; }
  }
}

function genWorld(){
  terrain=[]; nodes=[];
  const seed = Math.floor(Math.random()*100000);
  for(let y=0;y<MH;y++){
    terrain[y]=[]; nodes[y]=[];
    for(let x=0;x<MW;x++){
      const e = fbm(x*0.045, y*0.045, seed, 4);
      let t = 'grass';
      if(e < 0.37) t = 'water';
      else if(e < 0.41) t = 'sand';
      else if(e > 0.75) t = 'mountain';
      terrain[y][x] = {t, v: hash(x,y,seed+3)};
      nodes[y][x] = null;
    }
  }
  const cx0 = MW * 0.62;
  for(let y=2;y<MH-2;y++){
    const wobble = Math.sin(y*0.07)*10 + fbm(y*0.04, 50, seed+999)*16 - 8;
    const cx = cx0 + wobble;
    const halfW = 2.5 + hash(y,1,seed+555)*3.5;
    for(let x=Math.floor(cx-halfW); x<=Math.ceil(cx+halfW); x++){
      if(x<1||x>=MW-1) continue;
      if(hash(x,y,seed+777) > 0.10) terrain[y][x].t = 'water';
    }
  }
  for(let i=0;i<20;i++){
    const lx = 8 + Math.floor(hash(i,1,seed+888) * (MW-16));
    const ly = 8 + Math.floor(hash(1,i,seed+999) * (MH-16));
    const r = 2 + Math.floor(hash(i,i,seed+111) * 4);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      const x=lx+dx, y=ly+dy;
      if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
      if(Math.hypot(dx,dy) <= r && hash(x,y,seed+222) > 0.25) terrain[y][x].t = 'water';
    }
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(terrain[y][x].t !== 'grass') continue;
    const m = fbm(x*0.07+40, y*0.07+40, seed+77, 3);
    const r = hash(x,y,seed+9);
    const r2 = hash(x,y,seed+13);
    if(m > 0.60 && r > 0.70) nodes[y][x] = {type:'tree', tx:x, ty:y, amount:3};
    else if(r2 > 0.94) nodes[y][x] = {type:'rock', tx:x, ty:y, amount:3};
  }
  veins('stoneD',      6, seed+501, 2, 0.50);
  veins('coalD',       7, seed+201, 2, 0.45);
  veins('ironOreD',    7, seed+307, 2, 0.45);
  veins('copperOreD',  5, seed+403, 2, 0.50);
  veins('goldOreD',    4, seed+509, 1, 0.60);
  veins('uraniumOreD', 2, seed+613, 1, 0.70);
  initGrids();
  computeIslands();
  ensureAllOres(seed);
  return seed;
}

function ensureAllOres(seed){
  let mainIsland = -1, maxSize = 0;
  for(const id in islandSizes){
    if(islandSizes[id] > maxSize){ maxSize = islandSizes[id]; mainIsland = parseInt(id); }
  }
  for(const type of Object.keys(DEPOSITS)){
    let found = false;
    for(let y=0;y<MH && !found;y++) for(let x=0;x<MW && !found;x++)
      if(nodes[y][x] && nodes[y][x].type === type) found = true;
    if(found) continue;
    let attempts = 0;
    while(attempts < 800){
      const bx = 4 + Math.floor(Math.random() * (MW - 8));
      const by = 4 + Math.floor(Math.random() * (MH - 8));
      if(islandId[by][bx] !== mainIsland || terrain[by][bx].t !== 'grass'){ attempts++; continue; }
      const r = 1;
      let placed = 0;
      for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
        const x = bx+dx, y = by+dy;
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        if(nodes[y][x] && isDeposit(nodes[y][x].type)) continue;
        if(Math.hypot(dx,dy) <= r){ nodes[y][x] = { type, tx:x, ty:y }; placed++; }
      }
      if(placed > 0) break;
      attempts++;
    }
  }
}

function veins(type, count, seed, maxRadius, minThreshold){
  maxRadius = maxRadius || 2;
  minThreshold = minThreshold === undefined ? 0.45 : minThreshold;
  for(let i=0;i<count;i++){
    const bx = 6 + Math.floor(hash(i,1,seed) * (MW-12));
    const by = 6 + Math.floor(hash(1,i,seed+5) * (MH-12));
    const r = 1 + Math.floor(hash(i,i,seed+9) * maxRadius);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      const x=bx+dx, y=by+dy;
      if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
      if(terrain[y][x].t !== 'grass') continue;
      const n = nodes[y][x];
      if(n && isDeposit(n.type)) continue;
      if(Math.hypot(dx,dy) <= r && hash(x,y,seed+17) > minThreshold) nodes[y][x] = {type, tx:x, ty:y};
    }
  }
}

function isWalkableTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  const t = terrain[ty][tx].t;
  if(t === 'mountain') return false;
  if(t !== 'water') return true;
  return bridgeGrid[ty] && bridgeGrid[ty][tx];
}

function computeIslands(){
  islandId = []; islandSizes = {};
  for(let y=0;y<MH;y++) islandId[y] = new Array(MW).fill(-1);
  let nextId = 0;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(!isWalkableTile(x,y)) continue;
    if(islandId[y][x] !== -1) continue;
    const stack = [[x,y]];
    const id = nextId++;
    islandId[y][x] = id;
    let size = 0;
    while(stack.length){
      const [cx, cy] = stack.pop();
      size++;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy;
        if(!isWalkableTile(nx,ny)) continue;
        if(islandId[ny][nx] !== -1) continue;
        islandId[ny][nx] = id;
        stack.push([nx,ny]);
      }
    }
    islandSizes[id] = size;
  }
}
function getIslandAt(px, py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}
function getIslandTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}

// =================== PATHFINDING ===================
class MinHeap {
  constructor(){ this.items = []; }
  push(item){
    this.items.push(item);
    let i = this.items.length - 1;
    while(i > 0){
      const p = (i-1) >> 1;
      if(this.items[p].f <= this.items[i].f) break;
      const t = this.items[p]; this.items[p] = this.items[i]; this.items[i] = t;
      i = p;
    }
  }
  pop(){
    if(this.items.length === 0) return null;
    const top = this.items[0];
    const last = this.items.pop();
    if(this.items.length > 0){
      this.items[0] = last;
      let i = 0;
      const n = this.items.length;
      while(true){
        let s = i;
        const l = 2*i+1, r = 2*i+2;
        if(l < n && this.items[l].f < this.items[s].f) s = l;
        if(r < n && this.items[r].f < this.items[s].f) s = r;
        if(s === i) break;
        const t = this.items[s]; this.items[s] = this.items[i]; this.items[i] = t;
        i = s;
      }
    }
    return top;
  }
  get size(){ return this.items.length; }
}

function canWalkStraight(x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const d = Math.hypot(dx,dy);
  if(d < 6) return true;
  const steps = Math.ceil(d / 8);
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    const px = x1 + dx*t, py = y1 + dy*t;
    if(!isWalkableTile(Math.floor(px/TS), Math.floor(py/TS))) return false;
  }
  return true;
}

function findPath(sx, sy, tx, ty){
  const stx = Math.floor(sx/TS), sty = Math.floor(sy/TS);
  if(!isWalkableTile(stx, sty)) return null;
  if(!isWalkableTile(tx, ty)) return null;
  if(stx === tx && sty === ty) return [{x: tx*TS+16, y: ty*TS+16}];
  const open = new MinHeap();
  const closed = new Set();
  const bestG = new Map();
  const startH = Math.abs(tx-stx) + Math.abs(ty-sty);
  open.push({x: stx, y: sty, g: 0, f: startH, parent: null});
  bestG.set(sty*MW+stx, 0);
  let iter = 0;
  const maxIter = 10000;
  while(open.size > 0 && iter < maxIter){
    iter++;
    const cur = open.pop();
    const ck = cur.y*MW + cur.x;
    if(closed.has(ck)) continue;
    const gMap = bestG.get(ck);
    if(gMap !== undefined && gMap < cur.g) continue;
    closed.add(ck);
    if(cur.x === tx && cur.y === ty){
      const path = [];
      let n = cur;
      while(n){ path.unshift({x: n.x*TS+16, y: n.y*TS+16}); n = n.parent; }
      return path;
    }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cur.x+dx, ny = cur.y+dy;
      if(!isWalkableTile(nx, ny)) continue;
      const nk = ny*MW+nx;
      if(closed.has(nk)) continue;
      const stepCost = (roadGrid[ny] && roadGrid[ny][nx]) ? 0.6 : 1;
      const ng = cur.g + stepCost;
      const prevG = bestG.get(nk);
      if(prevG !== undefined && prevG <= ng) continue;
      bestG.set(nk, ng);
      const h = Math.abs(tx-nx) + Math.abs(ty-ny);
      open.push({x: nx, y: ny, g: ng, f: ng+h, parent: cur});
    }
  }
  return null;
}

function isWaterPx(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
  if(terrain[ty][tx].t !== 'water') return false;
  if(bridgeGrid[ty] && bridgeGrid[ty][tx]) return false;
  return true;
}
function isWaterForBoat(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  return terrain[ty][tx].t === 'water';
}

function getSpeedBoost(u){
  for(const b of logisticsHubs){
    if(Math.hypot(b.px - u.x, b.py - u.y) < 8*TS) return 1.15;
  }
  return 1;
}

function moveTo(u, tpx, tpy, dt){
  if(u.drone){
    const dx = tpx-u.x, dy = tpy-u.y;
    const d = Math.hypot(dx,dy);
    if(d < 2.5) return true;
    const step = Math.min(d, u.speed*dt);
    u.x += dx/d*step; u.y += dy/d*step;
    return d < 3.5;
  }
  const ttx = Math.floor(tpx/TS), tty = Math.floor(tpy/TS);
  if(!u.path || u.pathTargetTx !== ttx || u.pathTargetTy !== tty){
    if(canWalkStraight(u.x, u.y, tpx, tpy)){
      u.path = [{x: tpx, y: tpy}];
    } else {
      if(pathBudget <= 0) return false;
      pathBudget--;
      u.path = findPath(u.x, u.y, ttx, tty);
      if(!u.path){ u.unreachable = true; return false; }
    }
    u.pathTargetTx = ttx; u.pathTargetTy = tty; u.pathIdx = 0;
  }
  while(u.pathIdx < u.path.length){
    const wp = u.path[u.pathIdx];
    const dx = wp.x-u.x, dy = wp.y-u.y;
    const d = Math.hypot(dx,dy);
    if(d < 3){ u.pathIdx++; continue; }
    let sp = u.speed * getSpeedBoost(u);
    const curTx = Math.floor(u.x/TS), curTy = Math.floor(u.y/TS);
    if(roadGrid[curTy] && roadGrid[curTy][curTx]) sp *= 1.7;
    const step = Math.min(d, sp*dt);
    let nx = u.x + dx/d*step;
    let ny = u.y + dy/d*step;
    if(isWaterPx(nx, u.y)) nx = u.x;
    if(isWaterPx(u.x, ny)) ny = u.y;
    u.x = nx; u.y = ny;
    return false;
  }
  return true;
}

function nearestStorage(u){
  let best=null, bd=1e18;
  const myIsland = u.drone ? -2 : getIslandAt(u.x, u.y);
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type!=='house' && b.type!=='storage' && b.type!=='apartment' && b.type!=='luxuryHouse') continue;
    if(!u.drone && getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}

function assignJob(u){
  if(u.manual) return;
  if(u.drone){
    let bn=null, bnd=1e18;
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      const n = nodes[y][x];
      if(!n || (n.type!=='tree' && n.type!=='rock') || n.amount <= 0) continue;
      const d = (x*TS+16-u.x)**2 + (y*TS+16-u.y)**2;
      if(d<bnd){ bnd=d; bn=n; }
    }
    if(bn){ u.target = bn; u.state = 'goNode'; return; }
    u.state = 'idle'; return;
  }
  const myIsland = getIslandAt(u.x, u.y);
  if(myIsland < 0) return;
  let best=null, bd=1e18;
  for(const b of G.buildings){
    const def = b.def;
    if(!def || !def.workers || def.auto) continue;
    if(b.constructionT > 0) continue;
    if(def.robotOnly && !u.robot) continue;
    if(b.workers.length >= def.workers) continue;
    if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  if(best){
    best.workers.push(u);
    u.job = best;
    const a = Math.random()*6.28, r = 12+Math.random()*8;
    u.wax = Math.cos(a)*r; u.way = Math.sin(a)*r;
    u.state = 'goBuilding';
    return;
  }
  let bn=null, bnd=1e18;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const n = nodes[y][x];
    if(!n || (n.type!=='tree' && n.type!=='rock') || n.amount <= 0) continue;
    if(islandId[y][x] !== myIsland) continue;
    const d = (x*TS+16-u.x)**2 + (y*TS+16-u.y)**2;
    if(d<bnd){ bnd=d; bn=n; }
  }
  if(bn){ u.target = bn; u.state = 'goNode'; return; }
  u.state = 'idle';
}

function depositCarry(u){
  if(u.carry && u.carryAmt > 0) addRes(u.carry, u.carryAmt);
  u.carry = null; u.carryAmt = 0;
}

function updateUnit(u, dt){
  if(u.inBoat || u.inHeli) return;
  const moving = (u.state==='goNode'||u.state==='goStore'||u.state==='goBuilding'||u.state==='manualMove');
  if(moving){
    u.stuckT += dt;
    if(u.stuckT > 3.0){
      if(Math.hypot(u.x-u.lx, u.y-u.ly) < 5){
        if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
        u.job = null; u.target = null; u.state='idle'; u.idleT = 0.6; u.path = null;
      }
      u.stuckT = 0; u.lx = u.x; u.ly = u.y;
    }
  }
  switch(u.state){
    case 'idle': {
      u.idleT -= dt;
      if(u.idleT <= 0){
        if(!u.manual) assignJob(u);
        u.idleT = 0.5;
      }
      break;
    }
    case 'manualMove': {
      u.unreachable = false;
      const arrived = moveTo(u, u.mvx, u.mvy, dt);
      if(u.unreachable || arrived){ u.state = 'idle'; u.idleT = 0.25; u.path = null; }
      break;
    }
    case 'goNode': {
      const n = u.target;
      if(!n || n.amount <= 0 || nodes[n.ty][n.tx] !== n){ u.state='idle'; u.target=null; u.path=null; break; }
      u.unreachable = false;
      const arrived = moveTo(u, n.tx*TS+16, n.ty*TS+16, dt);
      if(u.unreachable){ u.state='idle'; u.target=null; u.path=null; break; }
      if(arrived){ u.state='gather'; u.timer = u.drone ? 1.0 : 2.2; u.path=null; }
      break;
    }
    case 'gather': {
      u.timer -= dt;
      if(u.timer <= 0){
        const n = u.target;
        if(!n || nodes[n.ty][n.tx] !== n || n.amount <= 0){ u.state='idle'; u.target=null; break; }
        n.amount--;
        u.carry = (n.type === 'tree') ? 'wood' : 'stone';
        u.carryAmt = 5;
        if(n.amount <= 0){
          if(n.type === 'tree') G.regrow.push({ tx:n.tx, ty:n.ty, t: 30 + Math.random()*20 });
          else nodes[n.ty][n.tx] = null;
        }
        u.target = null; u.state = 'goStore';
      }
      break;
    }
    case 'goStore': {
      const s = nearestStorage(u);
      if(!s){ depositCarry(u); u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, s.px, s.py, dt);
      if(u.unreachable){ depositCarry(u); u.state='idle'; u.path=null; break; }
      if(arrived){ depositCarry(u); u.state='idle'; u.idleT = 0.25; u.path=null; }
      break;
    }
    case 'goBuilding': {
      const b = u.job;
      if(!b){ u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, b.px + u.wax, b.py + u.way, dt);
      if(u.unreachable){
        const i = b.workers.indexOf(u);
        if(i>=0) b.workers.splice(i,1);
        u.job = null; u.state='idle'; u.path=null;
        break;
      }
      if(arrived){ u.state = 'work'; u.path=null; }
      break;
    }
    case 'work': {
      if(!u.job || u.job.workers.indexOf(u) < 0){ u.state='idle'; u.job=null; }
      break;
    }
  }
}

function orderMove(u, wx, wy){
  if(u.inHeli) return false;
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(!u.drone && !isWalkableTile(tx,ty)) return false;
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); u.job = null; }
  u.target = null; u.path = null;
  u.carry = null; u.carryAmt = 0;
  u.state = 'manualMove';
  u.mvx = tx*TS + TS/2 + (Math.random()-0.5)*10;
  u.mvy = ty*TS + TS/2 + (Math.random()-0.5)*10;
  u.stuckT = 0; u.lx = u.x; u.ly = u.y;
  return true;
}

// =================== BOATS & HELIS ===================
function updateBoat(bo, dt){
  if(bo.state === 'sailing' && bo.target){
    const dx = bo.target.x - bo.x, dy = bo.target.y - bo.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      bo.x = bo.target.x; bo.y = bo.target.y;
      const tgt = bo.target;
      bo.state = 'idle'; bo.target = null;
      if(tgt.landTx !== undefined){
        if(bo.passengers.length > 0) unloadPassengers(bo, tgt.landTx, tgt.landTy);
        else pickUpWorkers(bo);
      }
    } else {
      const step = Math.min(d, bo.speed*dt);
      const nx = bo.x + dx/d*step, ny = bo.y + dy/d*step;
      if(isWaterForBoat(nx, ny)){ bo.x = nx; bo.y = ny; }
      else { bo.state='idle'; bo.target=null; }
    }
  }
}
function boatGoTo(bo, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  const isLand = terrain[ty][tx].t !== 'water';
  if(isLand){
    const water = findNearestWaterToLand(tx, ty);
    if(!water) return;
    bo.target = { x: water.x*TS+TS/2, y: water.y*TS+TS/2, landTx: tx, landTy: ty };
  } else bo.target = { x: tx*TS+TS/2, y: ty*TS+TS/2 };
  bo.state = 'sailing';
}
function findNearestWaterToLand(tx, ty){
  for(let r=1;r<=6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=tx+dx, y=ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water') return {x, y};
  }
  return null;
}
function findNearestLandNearBoat(bo){
  const btx = Math.floor(bo.x/TS), bty = Math.floor(bo.y/TS);
  for(let r=1;r<=5;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=btx+dx, y=bty+dy;
    if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
    if(terrain[y][x].t !== 'water' && terrain[y][x].t !== 'mountain' && !(bridgeGrid[y] && bridgeGrid[y][x])) return {x, y};
  }
  return null;
}
function boardWorker(bo, u){
  if(bo.passengers.length >= 4 || u.inBoat || u.inHeli || u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inBoat = bo; bo.passengers.push(u);
  return true;
}
function pickUpWorkers(bo){
  if(bo.passengers.length >= 4) return;
  for(const u of G.units){
    if(u.robot || u.drone || u.inBoat || u.inHeli) continue;
    if(u.state === 'gather' || u.state === 'work') continue;
    if(Math.hypot(u.x - bo.x, u.y - bo.y) < TS*4){ boardWorker(bo, u); if(bo.passengers.length >= 4) break; }
  }
}
function unloadPassengers(bo, targetTx, targetTy){
  const land = findNearestLandNearBoat(bo) || {x:targetTx, y:targetTy};
  for(const u of bo.passengers){
    u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
    u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    u.inBoat = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  bo.passengers = [];
}

function findNearestWalkable(px,py){
  const btx = Math.floor(px/TS), bty = Math.floor(py/TS);
  if(isWalkableTile(btx,bty)) return {x:btx, y:bty};
  for(let r=1;r<=8;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;
    const x=btx+dx, y=bty+dy;
    if(isWalkableTile(x,y)) return {x,y};
  }
  return null;
}
function boardHeli(h, u){
  if(h.passengers.length >= 3 || u.inBoat || u.inHeli || u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inHeli = h; h.passengers.push(u);
  return true;
}
function pickUpForHeli(h){
  if(h.passengers.length >= 3) return;
  for(const u of G.units){
    if(u.robot || u.drone || u.inBoat || u.inHeli) continue;
    if(u.state === 'gather' || u.state === 'work') continue;
    if(Math.hypot(u.x - h.x, u.y - h.y) < TS*5){ boardHeli(h, u); if(h.passengers.length >= 3) break; }
  }
}
function unloadHeliPassengers(h){
  const land = findNearestWalkable(h.x, h.y);
  for(const u of h.passengers){
    if(land){
      u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
      u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    }
    u.inHeli = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  h.passengers = [];
}
function updateHeli(h, dt){
  if(h.state === 'sailing' && h.target){
    const dx = h.target.x - h.x, dy = h.target.y - h.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      h.x = h.target.x; h.y = h.target.y;
      h.target = null; h.state = 'idle';
      if(h.passengers.length > 0) unloadHeliPassengers(h);
      else pickUpForHeli(h);
    } else {
      const step = Math.min(d, h.speed*dt);
      h.x += dx/d*step; h.y += dy/d*step;
    }
  }
}
function heliGoTo(h, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  h.target = { x: wx, y: wy };
  h.state = 'sailing';
}

// =================== ENERGY ===================
function solarOutput(){
  const t = G.dayTime;
  if(t < 0.25 || t > 0.75) return 0;
  if(t < 0.35) return (t - 0.25) / 0.1;
  if(t > 0.65) return (0.75 - t) / 0.1;
  return 1;
}

function updateEnergy(dt){
  let produced = 0, consumed = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const def = b.def;
    if(!def.powerOutput) continue;
    let out = def.powerOutput;
    if(def.workers) out *= (b.workers.length / def.workers);
    if(def.fuel){
      const need = def.fuelRate * dt;
      if(G.res[def.fuel] >= need) G.res[def.fuel] -= need;
      else out = 0;
    }
    if(def.dayOnly) out *= solarOutput();
    produced += out;
  }
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const def = b.def;
    if(!def.powerUse) continue;
    if(def.workers && b.workers.length === 0) continue;
    consumed += def.powerUse;
  }
  G.energy.produced = produced;
  G.energy.consumed = consumed;
  G.energy.efficiency = consumed > 0 ? Math.min(1, produced / consumed) : 1;
}

function currentForgeState(){
  const activeForges = G.buildings.filter(b => b.type === 'forge' && b.workers.length > 0 && b.constructionT <= 0);
  let coalUse = 0;
  for(const f of activeForges) coalUse += 0.05 * f.workers.length;
  const active = coalUse > 0 && G.res.coal >= coalUse * 0.5;
  return { coalUse, active, bonus: active ? (1 + activeForges.length * 0.15) : 1 };
}
function currentOfficeBoost(){
  const libs = G.buildings.filter(b => b.type === 'library' && b.workers.length > 0 && b.constructionT <= 0).length;
  return Math.min(1.6, 1 + 0.2 * libs);
}
function farmBoost(b){
  let boost = 1;
  for(const w of G.buildings){
    if(w.type !== 'windmill' || w.constructionT > 0) continue;
    if(Math.hypot(w.tx - b.tx, w.ty - b.ty) <= 5) boost += 0.25;
  }
  return Math.min(boost, 2);
}

// =================== RATES & NEEDS ===================
function updateRates(dt){
  G.rateTimer += dt;
  if(G.rateTimer < 0.5) return;
  G.rateTimer = 0;
  G.rateHistory.push({t: G.time, res: {...G.res}});
  if(G.rateHistory.length > 20) G.rateHistory.shift();
  if(G.rateHistory.length < 2) return;
  const first = G.rateHistory[0];
  const last = G.rateHistory[G.rateHistory.length-1];
  const span = last.t - first.t;
  if(span < 1) return;
  for(const k in G.res){
    G.rates[k] = (last.res[k] - first.res[k]) / span;
  }
}

function computeNeeds(){
  const pop = countHumans();
  const capP = popCap();
  let food = 100;
  if(G.res.food < 3) food = 0;
  else if(G.res.food < 15) food = 40;
  else if(G.rates.food < -0.05 && G.res.food < 80) food = 60;
  let housing = 100;
  if(capP > 0 && pop >= capP) housing = Math.max(20, 100 - (pop - capP) * 10);
  else if(capP === 0) housing = 30;
  let rec = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type === 'park') rec += 10;
    else if(b.type === 'fountain') rec += 8;
    else if(b.type === 'theater') rec += 15 * b.workers.length;
    else if(b.type === 'tavern') rec += 10 * b.workers.length;
    else if(b.type === 'bathhouse') rec += 10 * b.workers.length;
  }
  rec = Math.min(100, rec);
  let faith = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type === 'temple') faith += 25;
    else if(b.type === 'monument') faith += 20;
    else if(b.type === 'library') faith += 10 * b.workers.length;
    else if(b.type === 'school') faith += 8 * b.workers.length;
    else if(b.type === 'observatory') faith += 8 * b.workers.length;
  }
  faith = Math.min(100, faith);
  const offices = G.buildings.filter(b=>b.type==='office' && b.constructionT<=0).length;
  const mines = G.buildings.filter(b=>(b.type==='mine'||b.type==='drill'||b.type==='quarry'||b.type==='electricMine') && b.constructionT<=0).length;
  const avg = (food + housing + rec + faith) / 4;
  const total = clamp(avg - offices*3 - mines*1, 0, 100);
  return {food, housing, recreation: rec, faith, total};
}

// =================== BUILDING RATES ===================
function buildingRate(b, forgeBonus){
  const r = {};
  const def = b.def;
  if(!def) return r;
  if(b.constructionT > 0) return r;
  if(forgeBonus === undefined) forgeBonus = currentForgeState().bonus;
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;
  const eff = def.powerUse ? G.energy.efficiency : 1;

  if(def.auto){
    if(b.type === 'drill' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.03 : res==='uraniumOre'?0.02 : res==='ironOre'?0.1 : res==='copperOre'?0.1 : res==='coal'?0.16 : 0.2;
      r[res] = (r[res]||0) + rate * forgeBonus;
    } else if(b.type === 'algae') r.food = (r.food||0) + 0.4;
    else if(b.type === 'windTurbine' || b.type === 'waterWheel' || b.type === 'solarPanel') return r;
    else if(b.type === 'woodBurner'){ r.wood = -0.5; return r; }
    return r;
  }

  if(!def.workers) return r;
  const w = b.workers.length;
  if(w === 0) return r;

  if(b.type === 'mine' && b.deposit){
    const res = DEPOSITS[b.deposit];
    const rate = res==='goldOre'?0.04 : res==='uraniumOre'?0.025 : res==='ironOre'?0.14 : res==='copperOre'?0.12 : res==='coal'?0.22 : 0.28;
    r[res] = (r[res]||0) + rate * w * forgeBonus;
  } else if(b.type === 'electricMine' && b.deposit){
    const res = DEPOSITS[b.deposit];
    const rate = res==='goldOre'?0.08 : res==='uraniumOre'?0.05 : res==='ironOre'?0.28 : res==='copperOre'?0.24 : res==='coal'?0.44 : 0.56;
    r[res] = (r[res]||0) + rate * w * forgeBonus * eff;
  } else if(b.type === 'farm'){
    r.food = (r.food||0) + 0.35*w*farmBoost(b)*seasonMul*weatherMul;
  } else if(b.type === 'electricFarm'){
    r.food = (r.food||0) + 0.7*w*farmBoost(b)*seasonMul*weatherMul*eff;
  } else if(b.type === 'grove') r.wood = (r.wood||0) + 0.32*w;
  else if(b.type === 'lumberjack'){
    let near = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = b.tx+dx, ny = b.ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && n.type==='tree' && n.amount > 0) near++;
    }
    r.wood = (r.wood||0) + 0.06*w*Math.min(near, 12);
  } else if(b.type === 'sawmill'){
    r.wood = (r.wood||0) - 0.25*w;
    r.planks = (r.planks||0) + 0.2*w;
  } else if(b.type === 'quarry'){
    let near = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = b.tx+dx, ny = b.ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
    }
    r.stone = (r.stone||0) + 0.05*w*Math.min(near, 10)*forgeBonus;
  } else if(b.type === 'stonemason'){
    r.stone = (r.stone||0) - 0.25*w;
    r.stoneBlocks = (r.stoneBlocks||0) + 0.18*w;
  } else if(b.type === 'ironSmelter'){
    const ore = 0.15*w, coal = 0.1*w;
    if(G.res.ironOre >= ore && G.res.coal >= coal){
      r.ironOre = -ore;
      r.coal = (r.coal||0) - coal;
      r.ironIngot = (r.ironIngot||0) + 0.1*w;
    }
  } else if(b.type === 'electricSmelter'){
    const ore = 0.3*w*eff, coal = 0.2*w*eff;
    if(G.res.ironOre >= ore && G.res.coal >= coal){
      r.ironOre = -ore;
      r.coal = (r.coal||0) - coal;
      r.ironIngot = (r.ironIngot||0) + 0.2*w*eff;
    }
  } else if(b.type === 'copperSmelter'){
    const ore = 0.15*w, coal = 0.1*w;
    if(G.res.copperOre >= ore && G.res.coal >= coal){
      r.copperOre = -ore;
      r.coal = (r.coal||0) - coal;
      r.copperIngot = (r.copperIngot||0) + 0.1*w;
    }
  } else if(b.type === 'goldSmelter'){
    const ore = 0.08*w, coal = 0.1*w;
    if(G.res.goldOre >= ore && G.res.coal >= coal){
      r.goldOre = -ore;
      r.coal = (r.coal||0) - coal;
      r.goldIngot = (r.goldIngot||0) + 0.06*w;
    }
  } else if(b.type === 'centrifuge'){
    const ore = 0.1*w*eff;
    if(G.res.uraniumOre >= ore){
      r.uraniumOre = -ore;
      r.uranium = (r.uranium||0) + 0.05*w*eff;
    }
  } else if(b.type === 'fisherman') r.food = (r.food||0) + 0.4*w;
  else if(b.type === 'bakery'){
    const need = 0.15*w;
    if(G.res.wood >= need){
      r.wood = (r.wood||0) - need;
      r.food = (r.food||0) + 0.6*w;
    }
  } else if(b.type === 'workshop'){
    const iron = 0.1*w, copper = 0.05*w;
    if(G.res.ironIngot >= iron && G.res.copperIngot >= copper){
      r.ironIngot = -iron;
      r.copperIngot = -copper;
      r.gears = (r.gears||0) + 0.08*w;
    }
  } else if(b.type === 'factory'){
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if(robots > 0){
      const copper = 0.1*robots, gears = 0.05*robots;
      if(G.res.copperIngot >= copper && G.res.gears >= gears){
        r.copperIngot = -copper;
        r.gears = (r.gears||0) - gears;
        r.circuits = (r.circuits||0) + 0.05*robots;
      }
    }
  } else if(b.type === 'electricFactory'){
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if(robots > 0){
      const copper = 0.2*robots*eff, gears = 0.1*robots*eff;
      if(G.res.copperIngot >= copper && G.res.gears >= gears){
        r.copperIngot = -copper;
        r.gears = (r.gears||0) - gears;
        r.circuits = (r.circuits||0) + 0.1*robots*eff;
      }
    }
  } else if(b.type === 'forge') r.coal = (r.coal||0) - 0.05*w;
  else if(b.type === 'tavern') r.food = (r.food||0) - 0.15*w;
  else if(b.type === 'bathhouse') r.wood = (r.wood||0) - 0.1*w;
  else if(b.type === 'office') r.goldIngot = (r.goldIngot||0) + 0.08*w*currentOfficeBoost();
  else if(b.type === 'coalPlant'){ r.coal = (r.coal||0) - 0.3; }
  else if(b.type === 'coalSteamPlant'){ r.coal = (r.coal||0) - 0.5; }
  else if(b.type === 'nuclearPlant'){ r.uranium = (r.uranium||0) - 0.05; }
  return r;
}

function buildingResourceStatus(b){
  if(!b.def || !b.def.workers) return null;
  if(b.constructionT > 0) return null;
  const w = b.workers.length;
  if(w === 0) return null;
  if(b.type === 'bakery'){ const need = 0.15*w; if(G.res.wood < need) return {res:'wood', needed:need}; }
  else if(b.type === 'tavern'){ const need = 0.15*w; if(G.res.food < need) return {res:'food', needed:need}; }
  else if(b.type === 'bathhouse'){ const need = 0.1*w; if(G.res.wood < need) return {res:'wood', needed:need}; }
  else if(b.type === 'ironSmelter'){ if(G.res.ironOre < 0.15*w || G.res.coal < 0.1*w) return {res:'ironOre/coal', needed:0.15*w}; }
  else if(b.type === 'electricSmelter'){ if(G.res.ironOre < 0.3*w || G.res.coal < 0.2*w) return {res:'ironOre/coal', needed:0.3*w}; }
  else if(b.type === 'copperSmelter'){ if(G.res.copperOre < 0.15*w || G.res.coal < 0.1*w) return {res:'copperOre/coal', needed:0.15*w}; }
  else if(b.type === 'goldSmelter'){ if(G.res.goldOre < 0.08*w || G.res.coal < 0.1*w) return {res:'goldOre/coal', needed:0.08*w}; }
  else if(b.type === 'centrifuge'){ if(G.res.uraniumOre < 0.1*w) return {res:'uraniumOre', needed:0.1*w}; }
  else if(b.type === 'sawmill'){ if(G.res.wood < 0.25*w) return {res:'wood', needed:0.25*w}; }
  else if(b.type === 'stonemason'){ if(G.res.stone < 0.25*w) return {res:'stone', needed:0.25*w}; }
  else if(b.type === 'workshop'){ if(G.res.ironIngot < 0.1*w || G.res.copperIngot < 0.05*w) return {res:'ironIngot/copperIngot', needed:0.1*w}; }
  else if(b.type === 'forge'){ const fs = currentForgeState(); if(!fs.active) return {res:'coal', needed:0.05*w}; }
  else if(b.type === 'coalPlant'){ if(G.res.coal < 0.3) return {res:'coal', needed:0.3}; }
  else if(b.type === 'coalSteamPlant'){ if(G.res.coal < 0.5) return {res:'coal', needed:0.5}; }
  else if(b.type === 'nuclearPlant'){ if(G.res.uranium < 0.05) return {res:'uranium', needed:0.05}; }
  return null;
}

// =================== EVENTS ===================
function pushLog(msg, type){
  G.log.push({time: G.time, msg, type: type||'info'});
  if(G.log.length > 100) G.log.shift();
  renderLog();
}

function triggerRandomEvent(){
  const r = Math.random();
  if(r < 0.30) triggerCaravan();
  else if(r < 0.55){
    const amt = 20 + Math.floor(Math.random()*30);
    addRes('food', amt);
    pushLog(`Хороший урожай: +${amt} еды`, 'good');
    toast(`+${amt} еды`);
    SND.notify();
  } else if(r < 0.85){
    G.weather = {type: 'storm', timer: 45, foodMult: 0.5};
    pushLog('Непогода: производство еды снижено', 'warn');
    toast('Непогода — фермы работают вполсилы');
    SND.weather();
  } else {
    if(popCap() > countHumans() && G.res.food >= 20){
      G.res.food -= 10;
      const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
      if(homes.length){
        const h = homes[0];
        const nu = new Unit(h.px + (Math.random()-0.5)*20, h.py + 20, false);
        G.units.push(nu);
        pushLog('Прибыл путник, поселился в вашем городе', 'good');
        toast('Путник присоединился к поселению');
        SND.newcomer();
      }
    } else {
      addRes('goldIngot', 5);
      pushLog('Торговец оставил 5 золота', 'good');
      SND.notify();
    }
  }
}

function triggerCaravan(){
  const resKeys = Object.keys(RES_BASE_VALUE).filter(k => k !== 'goldIngot');
  const offers = [];
  const usedGive = new Set();
  const usedGet = new Set();
  let tries = 0;

  while(offers.length < 3 && tries < 100){
    tries++;
    const giveRes = resKeys[Math.floor(Math.random() * resKeys.length)];
    if(usedGive.has(giveRes)) continue;
    let getRes = resKeys[Math.floor(Math.random() * resKeys.length)];
    if(getRes === giveRes) continue;
    
    if(Math.random() < 0.5) getRes = 'goldIngot';
    if(getRes !== 'goldIngot' && usedGet.has(getRes)) continue;

    usedGive.add(giveRes);
    if(getRes !== 'goldIngot') usedGet.add(getRes);

    const giveVal = 15 + Math.random() * 15;
    const giveAmt = Math.max(1, Math.floor(giveVal / RES_BASE_VALUE[giveRes]));
    const getVal = giveVal * (0.85 + Math.random() * 0.4);
    const getAmt = Math.max(1, Math.floor(getVal / RES_BASE_VALUE[getRes]));

    offers.push({
      give: {[giveRes]: giveAmt},
      get: {[getRes]: getAmt},
      label: `Обменять ${giveAmt} ${RES_NAMES[giveRes]} на ${getAmt} ${RES_NAMES[getRes]}`
    });
  }

  window.currentCaravanOffers = offers;
  const ov = document.getElementById('overlay');
  ov.classList.add('open');
  let html = `<div class="menu-box"><h2>🚚 Караван</h2><p style="color:#d8e2f0;font-size:13px;margin-bottom:14px">Странствующий торговец предлагает:</p>`;
  for(let i=0; i<offers.length; i++){
    const o = offers[i];
    const can = Object.keys(o.give).every(k => (G.res[k]||0) >= o.give[k]);
    html += `<button ${can ? '' : 'style="opacity:0.5"'} onclick="acceptCaravan(${i})">${o.label}</button>`;
  }
  html += `<button class="back-btn" onclick="closeCaravan()">✕ Отказаться</button></div>`;
  ov.innerHTML = html;
  applyUIScale();
  SND.caravan();
}

window.acceptCaravan = (index) => {
  const offers = window.currentCaravanOffers;
  if(!offers || !offers[index]) return;
  const o = offers[index];
  const can = Object.keys(o.give).every(k => (G.res[k]||0) >= o.give[k]);
  if(!can){ toast('Не хватает ресурсов'); SND.error(); return; }

  for(const k in o.give) G.res[k] -= o.give[k];
  for(const k in o.get) addRes(k, o.get[k]);
  pushLog(`Караван: ${o.label}`, 'good');
  toast('Сделка заключена!');
  SND.place();
  closeCaravan();
};

window.closeCaravan = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('overlay').innerHTML = '';
  window.currentCaravanOffers = null;
};

// =================== PARTICLES ===================
function spawnParticle(x, y, color, opts){
  if(!SETTINGS.particles) return;
  opts = opts || {};
  G.particles.push({
    x, y,
    vx: (Math.random()-0.5) * (opts.speed || 20),
    vy: -Math.random() * (opts.speed || 20) - 10,
    life: opts.life || 1.5, maxLife: opts.life || 1.5,
    color, size: opts.size || 3,
  });
  if(G.particles.length > 80) G.particles.shift();
}
function updateParticles(dt){
  if(!SETTINGS.particles){ G.particles = []; return; }
  G.particleTimer += dt;
  if(G.particleTimer > 0.35){
    G.particleTimer = 0;
    for(const b of G.buildings){
      if(b.constructionT > 0) continue;
      if(b.type === 'forge' || b.type === 'coalPlant' || b.type === 'coalSteamPlant' || b.type === 'ironSmelter' || b.type === 'copperSmelter' || b.type === 'goldSmelter')
        spawnParticle(b.px + (Math.random()-0.5)*10, b.py - 12, 'rgba(120,120,130,0.6)', {life:2, size:4, speed:15});
      else if(b.type === 'factory' || b.type === 'electricFactory')
        spawnParticle(b.px + (Math.random()-0.5)*14, b.py - 16, 'rgba(120,120,130,0.6)', {life:2.2, size:5, speed:12});
      else if(b.type === 'bakery')
        spawnParticle(b.px, b.py - 10, 'rgba(220,200,160,0.5)', {life:1.5, size:3, speed:8});
      else if(b.type === 'nuclearPlant')
        spawnParticle(b.px, b.py - 20, 'rgba(120,255,150,0.5)', {life:2.5, size:4, speed:10});
    }
  }
  for(let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 10 * dt; p.life -= dt;
    if(p.life <= 0) G.particles.splice(i, 1);
  }
}

// =================== TIME ===================
function updateTime(dt){
  G.dayTime += dt / DAY_LENGTH;
  if(G.dayTime >= 1){
    G.dayTime -= 1;
    G.day++;
    if((G.day-1) % DAYS_PER_SEASON === 0 && G.day > 1){
      const idx = SEASONS.indexOf(G.season);
      G.season = SEASONS[(idx+1) % SEASONS.length];
      pushLog(`Наступила ${SEASON_NAMES[G.season].toLowerCase()}`, 'info');
      toast(SEASON_NAMES[G.season]);
      SND.season();
      if(G.season === 'spring') G.year++;
    }
  }
}
function getNightAlpha(){
  const t = G.dayTime;
  if(t < 0.25) return 0.55 * (1 - t/0.25);
  if(t > 0.75) return 0.55 * (t - 0.75) / 0.25;
  return 0;
}

// =================== UPDATE ===================
function update(dt){
  G.time += dt;
  pathBudget = 5;
  logisticsHubs = G.buildings.filter(b => b.type === 'logisticsHub' && b.constructionT <= 0);
  updateTime(dt);
  if(G.weather){ G.weather.timer -= dt; if(G.weather.timer <= 0) G.weather = null; }
  G.eventTimer -= dt;
  if(G.eventTimer <= 0){ G.eventTimer = 90 + Math.random()*60; triggerRandomEvent(); }
  for(let i=G.regrow.length-1;i>=0;i--){
    const r = G.regrow[i];
    r.t -= dt;
    if(r.t <= 0){
      const n = nodes[r.ty][r.tx];
      if(n && n.type === 'tree') n.amount = 3;
      G.regrow.splice(i,1);
    }
  }
  for(const u of G.units) updateUnit(u, dt);
  for(const bo of G.boats) updateBoat(bo, dt);
  for(const h of G.helis) updateHeli(h, dt);
  for(const b of G.buildings){
    if(b.constructionT > 0){
      b.constructionT -= dt;
      if(b.constructionT <= 0){
        b.constructionT = 0;
        pushLog(`Построено: ${b.def.name}`, 'good');
        if(G.sel === b) updateInfoUI();
      }
    }
  }
  updateEnergy(dt);
  const forge = currentForgeState();
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;

  for(const b of G.buildings){
    const def = b.def;
    if(!def) continue;
    if(b.constructionT > 0) continue;
    const eff = def.powerUse ? G.energy.efficiency : 1;
    if(eff <= 0 && def.powerUse) continue;
    if(def.auto){
      if(b.type === 'drill' && b.deposit){
        const res = DEPOSITS[b.deposit];
        const rate = res==='goldOre'?0.03 : res==='uraniumOre'?0.02 : res==='ironOre'?0.1 : res==='copperOre'?0.1 : res==='coal'?0.16 : 0.2;
        addRes(res, rate*dt*forge.bonus);
      } else if(b.type === 'algae') addRes('food', 0.4*dt);
      else if(b.type === 'droneHub'){
        b.spawnT = (b.spawnT || 0) + dt;
        if(b.spawnT >= def.spawnRate){
          b.spawnT = 0;
          const myDrones = G.units.filter(u => u.drone && u.hub === b).length;
          if(myDrones < def.maxDrones && G.res.ironIngot >= 25 && G.res.circuits >= 10){
            G.res.ironIngot -= 25; G.res.circuits -= 10;
            const u = new Unit(b.px + (Math.random()-0.5)*30, b.py + (Math.random()-0.5)*30, true);
            u.drone = true; u.speed = 110; u.hub = b;
            G.units.push(u);
            pushLog('Дрон-хаб собрал дрона', 'good');
            SND.notify();
          }
        }
      } else if(b.type === 'robotAssembler'){
        b.spawnT = (b.spawnT || 0) + dt;
        if(b.spawnT >= def.spawnRate){
          b.spawnT = 0;
          const myRobots = G.units.filter(u => u.robot && !u.drone && u.hub === b).length;
          if(myRobots < def.maxRobots && G.res.ironIngot >= 20 && G.res.goldIngot >= 5){
            G.res.ironIngot -= 20; G.res.goldIngot -= 5;
            const u = new Unit(b.px + (Math.random()-0.5)*30, b.py + (Math.random()-0.5)*30, true);
            u.hub = b;
            G.units.push(u);
            pushLog('Сборочный цех собрал робота', 'good');
            SND.notify();
          }
        }
      }
      continue;
    }
    if(!def.workers) continue;
    const w = b.workers.length;
    if(w === 0) continue;

    if(b.type === 'mine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.04 : res==='uraniumOre'?0.025 : res==='ironOre'?0.14 : res==='copperOre'?0.12 : res==='coal'?0.22 : 0.28;
      addRes(res, rate*w*dt*forge.bonus);
    } else if(b.type === 'electricMine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.08 : res==='uraniumOre'?0.05 : res==='ironOre'?0.28 : res==='copperOre'?0.24 : res==='coal'?0.44 : 0.56;
      addRes(res, rate*w*dt*forge.bonus*eff);

    } else if(b.type === 'electricFarm'){

    } else if(b.type === 'office'){
      addRes('goldIngot', 0.08*w*currentOfficeBoost()*dt);
    } else if(b.type === 'tavern'){
      const need = 0.15*w*dt;
      if(G.res.food >= need) G.res.food -= need;
    } else if(b.type === 'bathhouse'){
      const need = 0.1*w*dt;
      if(G.res.wood >= need) G.res.wood -= need;
    }
  }
  if(forge.active) G.res.coal = Math.max(0, G.res.coal - forge.coalUse * dt);
  let pop = countHumans();
  const activeObs = G.buildings.filter(b => b.type === 'observatory' && b.workers.length > 0 && b.constructionT<=0).length;
  if(pop > 0){
    let foodCons = pop * 0.028;
    foodCons *= Math.max(0.5, 1 - activeObs * 0.1);
    G.res.food = Math.max(0, G.res.food - foodCons*dt);
  }
  const needs = computeNeeds();
  G.needs = needs;
  G.happiness = needs.total;
  G.growT += dt;
  const growthInterval = G.happiness >= 60 ? 12 : G.happiness >= 40 ? 18 : 30;
  if(G.growT > growthInterval){
    G.growT = 0;
    const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
    const capP = popCap();
    const humans = countHumans();
    if(humans < capP && G.res.food >= 15 && homes.length){
      G.res.food -= 10;
      const h = homes[Math.floor(Math.random()*homes.length)];
      const nu = new Unit(h.px + (Math.random()-0.5)*20, h.py + 20 + (Math.random()-0.5)*20, false);
      G.units.push(nu);
      pushLog('Новый житель поселился', 'good');
      SND.newcomer();
    }
  }
  updateRates(dt);
  G.statTimer += dt;
  if(G.statTimer > 2){
    G.statTimer = 0;
    G.stats.push({
      t: G.time, pop: countHumans(),
      food: G.res.food, wood: G.res.wood, stone: G.res.stone, gold: G.res.goldIngot,
      hap: G.happiness,
    });
    if(G.stats.length > 300) G.stats.shift();
  }
  updateQuests();
  if(G.infoT > 0){ G.infoT -= dt; if(G.infoT <= 0) infoEl.classList.remove('open'); }
}

// =================== QUESTS ===================
function getActiveQuest(){
  for(const q of QUESTS) if(!G.quests[q.id]) return q;
  return null;
}
function updateQuests(){
  for(const q of QUESTS){
    if(G.quests[q.id]) continue;
    if(q.check()){
      G.quests[q.id] = true;
      pushLog(`Задание выполнено: ${q.title}`, 'good');
      toast(`✓ ${q.title}`);
      SND.quest();
      renderQuests();
      updateQuestHud();
      break;
    }
  }
}

// =================== RENDER ===================
const tcan = document.createElement('canvas');
tcan.width = MW*TS; tcan.height = MH*TS;
const tctx = tcan.getContext('2d');
const TCOL = {
  grass: ['#4a7437','#517d3c','#446b32','#568440'],
  sand:  ['#c7b789','#c0b081','#cbbc8e'],
  water: ['#2b5c86','#27547b','#30628d'],
  mountain: ['#5a5a68','#525260','#606070']
};

function drawMountainTile(tctx2, x, y){
  const v = terrain[y][x].v;
  const arr = TCOL.mountain;
  tctx2.fillStyle = arr[Math.floor(v*arr.length) % arr.length];
  tctx2.fillRect(x*TS, y*TS, TS+1, TS+1);
  tctx2.fillStyle = '#7a7a8a';
  tctx2.beginPath();
  tctx2.moveTo(x*TS+TS/2, y*TS+5);
  tctx2.lineTo(x*TS+TS-4, y*TS+TS-3);
  tctx2.lineTo(x*TS+4, y*TS+TS-3);
  tctx2.closePath(); tctx2.fill();
  tctx2.fillStyle = '#d0d0e0';
  tctx2.beginPath();
  tctx2.moveTo(x*TS+TS/2, y*TS+5);
  tctx2.lineTo(x*TS+TS*0.62, y*TS+TS*0.35);
  tctx2.lineTo(x*TS+TS*0.38, y*TS+TS*0.35);
  tctx2.closePath(); tctx2.fill();
}
function renderTerrain(){
  tcan.width = MW*TS; tcan.height = MH*TS;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const t = terrain[y][x];
    if(t.t === 'mountain'){ drawMountainTile(tctx, x, y); continue; }
    const arr = TCOL[t.t];
    tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
    tctx.fillRect(x*TS, y*TS, TS+1, TS+1);
    if(roadGrid[y] && roadGrid[y][x]){
      tctx.fillStyle = '#6b6b6b';
      tctx.fillRect(x*TS+4, y*TS+4, TS-8, TS-8);
      tctx.fillStyle = '#7b7b7b';
      tctx.fillRect(x*TS+7, y*TS+7, TS-14, TS-14);
    }
  }
  for(let i=0;i<MW*MH*0.3;i++){
    const x = Math.floor(Math.random()*MW)*TS + Math.random()*TS;
    const y = Math.floor(Math.random()*MH)*TS + Math.random()*TS;
    const tx = Math.floor(x/TS), ty = Math.floor(y/TS);
    if(terrain[ty][tx].t === 'water' || terrain[ty][tx].t === 'mountain') continue;
    tctx.fillStyle = 'rgba(0,0,0,0.05)';
    tctx.fillRect(x, y, 2, 2);
  }
  tctx.strokeStyle = '#101820';
  tctx.lineWidth = 8;
  tctx.strokeRect(0,0,MW*TS,MH*TS);
  renderMiniBg();
}
function redrawTile(tx,ty){
  const t = terrain[ty][tx];
  if(t.t === 'mountain'){ drawMountainTile(tctx, tx, ty); return; }
  const arr = TCOL[t.t];
  tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
  tctx.fillRect(tx*TS, ty*TS, TS+1, TS+1);
}
function redrawRoad(tx,ty){
  redrawTile(tx,ty);
  tctx.fillStyle = '#6b6b6b';
  tctx.fillRect(tx*TS+4, ty*TS+4, TS-8, TS-8);
  tctx.fillStyle = '#7b7b7b';
  tctx.fillRect(tx*TS+7, ty*TS+7, TS-14, TS-14);
}

// =================== MINIMAP ===================
const miniBg = document.createElement('canvas');
const miniBgCtx = miniBg.getContext('2d');
function renderMiniBg(){
  miniBg.width = miniCan.width;
  miniBg.height = miniCan.height;
  const scaleX = miniBg.width / (MW*TS);
  const scaleY = miniBg.height / (MH*TS);
  for(let py = 0; py < miniBg.height; py++){
    for(let px = 0; px < miniBg.width; px++){
      const tx = Math.floor(px / scaleX / TS);
      const ty = Math.floor(py / scaleY / TS);
      const t = terrain[ty][tx].t;
      let col;
      if(t === 'water') col = '#2b5c86';
      else if(t === 'sand') col = '#c7b789';
      else if(t === 'mountain') col = '#5a5a68';
      else col = '#4a7437';
      miniBgCtx.fillStyle = col;
      miniBgCtx.fillRect(px, py, 1, 1);
    }
  }
  for(let y = 0; y < MH; y++) for(let x = 0; x < MW; x++){
    if(roadGrid[y][x]){
      miniBgCtx.fillStyle = '#8a8a8a';
      miniBgCtx.fillRect(x*TS*scaleX, y*TS*scaleY, Math.max(1, TS*scaleX), Math.max(1, TS*scaleY));
    }
  }
}
function drawMinimap(){
  if(!SETTINGS.minimap) return;
  const scaleX = miniCan.width / (MW*TS);
  const scaleY = miniCan.height / (MH*TS);
  miniCtx.drawImage(miniBg, 0, 0);
  if(G.minimapMode === 'resources'){
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      const n = nodes[y][x];
      if(!n) continue;
      let col = null;
      if(n.type==='tree') col = '#3a7d33';
      else if(n.type==='rock') col = '#a8aeb5';
      else if(n.type==='stoneD') col = '#9aa0a6';
      else if(n.type==='coalD') col = '#31313a';
      else if(n.type==='ironOreD') col = '#8b6555';
      else if(n.type==='copperOreD') col = '#c97a3a';
      else if(n.type==='goldOreD') col = '#d4b13a';
      else if(n.type==='uraniumOreD') col = '#6dd44a';
      if(col){ miniCtx.fillStyle = col; miniCtx.fillRect(x*TS*scaleX-0.5, y*TS*scaleY-0.5, 2, 2); }
    }
  }
  if(G.minimapMode === 'buildings' || G.minimapMode === 'normal'){
    for(const b of G.buildings){
      miniCtx.fillStyle = b.constructionT > 0 ? '#887755' :
        (b.type==='house'?'#e8d7b8':(b.type==='storage'?'#c0a25a':
        (b.def.powerOutput?'#4ad4d4':(b.def.powerUse?'#e04af0':'#e6c341'))));
      miniCtx.fillRect(b.tx*TS*scaleX-1, b.ty*TS*scaleY-1, 2.5, 2.5);
    }
  }
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    miniCtx.fillStyle = u.robot ? '#9a7ad0' : '#7fe08a';
    miniCtx.fillRect(u.x*scaleX-0.5, u.y*scaleY-0.5, 1.5, 1.5);
  }
  for(const m of G.markers){
    miniCtx.fillStyle = '#e6c341';
    miniCtx.fillRect(m.x*scaleX-1, m.y*scaleY-1, 2, 2);
  }
  const vx = -ox / z * scaleX;
  const vy = -oy / z * scaleY;
  const vw = W / z * scaleX;
  const vh = H / z * scaleY;
  miniCtx.strokeStyle = 'rgba(255,255,255,.85)';
  miniCtx.lineWidth = 1;
  miniCtx.strokeRect(vx, vy, vw, vh);
}
miniCan.addEventListener('click', e => {
  const r = miniCan.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  cam.x = (px / r.width) * MW * TS;
  cam.y = (py / r.height) * MH * TS;
  clampCam();
});
miniCan.addEventListener('contextmenu', e => {
  e.preventDefault();
  const modes = ['normal', 'resources', 'buildings'];
  G.minimapMode = modes[(modes.indexOf(G.minimapMode)+1) % modes.length];
  toast('Миникарта: ' + {normal:'обычная', resources:'ресурсы', buildings:'здания'}[G.minimapMode]);
});

// =================== DRAWING ===================
function drawNode(n, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(n.type === 'tree'){
    if(n.amount <= 0){
      ctx.fillStyle = '#5a3d1e';
      ctx.beginPath(); ctx.arc(cx, cy+2, s*0.13, 0, 6.3); ctx.fill();
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.28, s*0.26, s*0.1, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#4a2f16';
    ctx.fillRect(cx - s*0.045, cy + s*0.02, s*0.09, s*0.24);
    ctx.fillStyle = '#2d6528';
    ctx.beginPath(); ctx.arc(cx, cy - s*0.06, s*0.29, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#3a7d33';
    ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.03, s*0.19, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*0.14, cy + s*0.01, s*0.17, 0, 6.3); ctx.fill();
    return;
  }
  if(n.type === 'rock'){
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.22, s*0.25, s*0.09, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#8f959c';
    ctx.beginPath(); ctx.arc(cx - s*0.09, cy + s*0.04, s*0.17, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8aeb5';
    ctx.beginPath(); ctx.arc(cx + s*0.1, cy - s*0.02, s*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7c828a';
    ctx.beginPath(); ctx.arc(cx + s*0.02, cy + s*0.12, s*0.13, 0, 6.3); ctx.fill();
    return;
  }
  const colMap = { stoneD:'#9aa0a6', coalD:'#31313a', ironOreD:'#8b6555',
                   copperOreD:'#c97a3a', goldOreD:'#d4b13a', uraniumOreD:'#6dd44a' };
  const col = colMap[n.type] || '#888';
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy+s*0.26, s*0.31, s*0.12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.06, s*0.16, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.11, cy + s*0.11, s*0.14, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.02, cy - s*0.08, s*0.17, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.arc(cx - s*0.02, cy - s*0.14, s*0.07, 0, 6.3); ctx.fill();
}

function drawBuilding(b, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(b.constructionT > 0){
    ctx.fillStyle = 'rgba(200,180,120,.18)';
    ctx.fillRect(sx+4, sy+4, s-8, s-8);
    ctx.strokeStyle = '#c8a050';
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 2;
    ctx.strokeRect(sx+4, sy+4, s-8, s-8);
    ctx.setLineDash([]);
    const total = getBuildTime(b.type);
    const pct = 1 - b.constructionT / total;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(sx + 4, sy + s*0.88, s - 8, Math.max(3, s*0.1));
    ctx.fillStyle = '#7fc27f';
    ctx.fillRect(sx + 4, sy + s*0.88, (s - 8) * pct, Math.max(3, s*0.1));
    return;
  }
  if(b.type !== 'bridge' && b.type !== 'algae' && b.type !== 'waterWheel'){
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(cx, sy + s*0.9, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  }
  const t = b.type;
  if(t === 'house'){
    ctx.fillStyle = '#d9c7a8'; ctx.fillRect(sx + s*0.14, sy + s*0.34, s*0.72, s*0.56);
    ctx.fillStyle = '#a8563c';
    ctx.beginPath(); ctx.moveTo(sx + s*0.06, sy + s*0.36); ctx.lineTo(cx, sy + s*0.04); ctx.lineTo(sx + s*0.94, sy + s*0.36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4523'; ctx.fillRect(cx - s*0.1, sy + s*0.6, s*0.2, s*0.3);
  } else if(t === 'apartment'){
    ctx.fillStyle = '#b8bcc8'; ctx.fillRect(sx + s*0.12, sy + s*0.1, s*0.76, s*0.8);
    ctx.fillStyle = '#8f94a4'; ctx.fillRect(sx + s*0.12, sy + s*0.1, s*0.76, s*0.1);
    ctx.fillStyle = '#5a7fa8';
    for(let ry=0;ry<3;ry++) for(let rx=0;rx<3;rx++) ctx.fillRect(sx + s*0.2 + rx*s*0.24, sy + s*0.28 + ry*s*0.2, s*0.14, s*0.13);
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(cx - s*0.09, sy + s*0.78, s*0.18, s*0.12);
  } else if(t === 'luxuryHouse'){
    ctx.fillStyle = '#e8dcc8'; ctx.fillRect(sx + s*0.1, sy + s*0.25, s*0.8, s*0.7);
    ctx.fillStyle = '#8a6a4a'; ctx.fillRect(sx + s*0.1, sy + s*0.25, s*0.8, s*0.08);
    ctx.fillStyle = '#7fd4e0';
    for(let i=0;i<4;i++) ctx.fillRect(sx + s*0.16 + i*s*0.18, sy + s*0.4, s*0.1, s*0.12);
    for(let i=0;i<4;i++) ctx.fillRect(sx + s*0.16 + i*s*0.18, sy + s*0.6, s*0.1, s*0.12);
    ctx.fillStyle = '#c8a020'; ctx.fillRect(cx - s*0.06, sy + s*0.78, s*0.12, s*0.16);
  } else if(t === 'storage'){
    ctx.fillStyle = '#8d95a3'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.58);
    ctx.fillStyle = '#6b7381'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.14);
    ctx.fillStyle = '#c0a25a'; ctx.fillRect(sx + s*0.24, sy + s*0.55, s*0.2, s*0.22); ctx.fillRect(sx + s*0.56, sy + s*0.55, s*0.2, s*0.22);
  } else if(t === 'farm' || t === 'electricFarm'){
    ctx.fillStyle = '#7a6a2a'; ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.6);
    ctx.fillStyle = t === 'electricFarm' ? '#a8e8a8' : '#d8bc44';
    for(let i=0;i<3;i++) ctx.fillRect(sx + s*0.16, sy + s*0.4 + i*s*0.16, s*0.68, s*0.08);
    if(t === 'electricFarm'){
      ctx.fillStyle = '#4ad4d4';
      ctx.fillRect(sx + s*0.85, sy + s*0.15, s*0.08, s*0.08);
    }
  } else if(t === 'grove'){
    ctx.fillStyle = '#3d6b34'; ctx.fillRect(sx + s*0.1, sy + s*0.28, s*0.8, s*0.62);
    ctx.fillStyle = '#4e8f3f';
    for(let i=0;i<3;i++){ const a = i*2.1 + b.px*0.01; ctx.beginPath(); ctx.arc(cx + Math.cos(a)*s*0.22, cy + Math.sin(a)*s*0.18, s*0.16, 0, 6.3); ctx.fill(); }
  } else if(t === 'sawmill'){
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.6);
    ctx.fillStyle = '#a8703a'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.1);
    ctx.save();
    ctx.translate(cx, cy + s*0.15);
    ctx.rotate(G.time*1.5);
    ctx.strokeStyle = '#d0c0a0'; ctx.lineWidth = Math.max(1.5, s*0.06);
    ctx.beginPath(); ctx.arc(0, 0, s*0.14, 0, 6.3); ctx.stroke();
    for(let i=0;i<8;i++){ const a = i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.14, Math.sin(a)*s*0.14); ctx.lineTo(Math.cos(a)*s*0.2, Math.sin(a)*s*0.2); ctx.stroke(); }
    ctx.restore();
  } else if(t === 'mine' || t === 'electricMine'){
    ctx.fillStyle = t === 'electricMine' ? '#4a4c80' : '#4a4c60';
    ctx.fillRect(sx + s*0.14, sy + s*0.3, s*0.72, s*0.62);
    ctx.fillStyle = '#1a1a22';
    ctx.beginPath(); ctx.moveTo(cx - s*0.2, sy + s*0.92); ctx.lineTo(cx - s*0.2, sy + s*0.62);
    ctx.arc(cx, sy + s*0.62, s*0.2, Math.PI, 0); ctx.lineTo(cx + s*0.2, sy + s*0.92); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a8fa5'; ctx.fillRect(sx + s*0.18, sy + s*0.24, s*0.64, s*0.09);
    if(t === 'electricMine'){ ctx.fillStyle = '#4ad4d4'; ctx.fillRect(sx + s*0.85, sy + s*0.15, s*0.08, s*0.08); }
  } else if(t === 'drill'){
    ctx.fillStyle = '#6a3a7a'; ctx.fillRect(sx + s*0.2, sy + s*0.36, s*0.6, s*0.56);
    ctx.strokeStyle = '#c8a0e0'; ctx.lineWidth = Math.max(1.5, s*0.07);
    ctx.beginPath(); const ang = G.time*2.5; ctx.moveTo(cx, sy + s*0.34); ctx.lineTo(cx + Math.cos(ang)*s*0.3, sy + s*0.34 + Math.sin(ang)*s*0.16); ctx.stroke();
    ctx.fillStyle = '#3b2050'; ctx.beginPath(); ctx.arc(cx, sy + s*0.34, s*0.09, 0, 6.3); ctx.fill();
  } else if(t === 'lumberjack'){
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
    ctx.fillStyle = '#5c4420'; ctx.fillRect(sx + s*0.22, sy + s*0.45, s*0.56, s*0.2);
    ctx.fillStyle = '#d0c0a0'; ctx.fillRect(sx + s*0.4, sy + s*0.7, s*0.2, s*0.2);
  } else if(t === 'quarry'){
    ctx.fillStyle = '#808690'; ctx.fillRect(sx + s*0.15, sy + s*0.32, s*0.7, s*0.6);
    ctx.fillStyle = '#5a6068';
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(sx + s*0.25 + (i%2)*s*0.4, sy + s*0.5 + Math.floor(i/2)*s*0.25, s*0.12, 0, 6.3); ctx.fill(); }
  } else if(t === 'stonemason'){
    ctx.fillStyle = '#a8aeb5'; ctx.fillRect(sx + s*0.12, sy + s*0.3, s*0.76, s*0.6);
    ctx.fillStyle = '#8a9098'; ctx.fillRect(sx + s*0.12, sy + s*0.3, s*0.76, s*0.1);
    ctx.fillStyle = '#6b7076';
    for(let ry=0;ry<2;ry++) for(let rx=0;rx<3;rx++){
      ctx.fillRect(sx + s*0.18 + rx*s*0.24, sy + s*0.45 + ry*s*0.22, s*0.18, s*0.16);
    }
  } else if(t === 'ironSmelter' || t === 'electricSmelter' || t === 'copperSmelter' || t === 'goldSmelter'){
    const baseColor = t === 'copperSmelter' ? '#b06a3a' : t === 'goldSmelter' ? '#b09030' : t === 'electricSmelter' ? '#4a4c80' : '#5a4a4a';

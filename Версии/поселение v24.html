<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поселение</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;

#c{display:block;position:absolute;inset:0;cursor:crosshair}

#minimap:hover{opacity:1}
#resbar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;

.resrow{display:flex;gap:3px;flex-wrap:wrap;pointer-events:none}
.res{background:rgba(16,21,30,.88);border:1px solid #2f3a4b;border-radius:5px;

#build{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);

.catbtn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:6px;

#builditems.open{display:flex}
.btn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:6px;
  padding:3px 6px;font-size:10px;cursor:pointer;min-width:70px;text-align:center;

.btn.active{background:#2e5c8f;border-color:#6fa4e2;box-shadow:0 0 12px rgba(80,150,230,.5)}

.sidepanel{position:absolute;top:62px;right:8px;width:340px;max-height:calc(100vh - 130px);

.sidepanel.open{display:block}
.sidepanel h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:#9fc4ee;font-weight:600}
.tech{border:1px solid #2c3747;border-radius:7px;padding:7px 9px;margin-bottom:6px;
  cursor:pointer;background:#141c28;transition:.12s}
.tech:hover{background:#1c2839;border-color:#456080}
.tech b{font-size:12.5px}

.tech.locked:hover{background:#141c28;border-color:#2c3747}

#logbox{position:absolute;bottom:135px;right:10px;width:270px;max-height:110px;overflow-y:auto;

.menu-box button.mode-war.selected{background:#806030;border-color:#e0b060;box-shadow:0 0 14px rgba(200,150,60,.4)}

.back-btn{margin-top:12px;text-align:center!important}
.menu-section{font-size:11px;color:#6fa4e2;text-transform:uppercase;letter-spacing:1px;

.worker-row{padding:5px 8px;border-bottom:1px solid rgba(60,75,95,.3);cursor:pointer;
  display:flex;justify-content:space-between;font-size:12px}
.worker-row:hover{background:rgba(40,58,84,.6)}
.worker-row .vac{color:#e08a7a}
#settingsmodal{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#settingsmodal.open{display:flex}
#settingsmodal .menu-box{min-width:460px}
.setting-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(60,75,95,.3);font-size:13px}

.setting-row select{background:#1e2b3d;color:#e8eef7;border:1px solid #3a4a5e;
  border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer}
.toggle-switch{position:relative;display:inline-block;width:42px;height:22px;flex-shrink:0}

.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#2c3747;
  border-radius:22px;transition:.2s}
.toggle-slider:before{content:"";position:absolute;height:16px;width:16px;
  left:3px;bottom:3px;background:#e8eef7;border-radius:50%;transition:.2s}
.toggle-switch input:checked + .toggle-slider{background:#2e5c8f}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(20px)}
.settings-section{font-size:11px;color:#6fa4e2;text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 4px;font-weight:600}
.settings-section:first-child{margin-top:0}

  border:1px solid #2f3a4b;border-radius:5px;padding:4px 8px;font-size:11px;
  font-family:monospace;color:#7fc27f;z-index:50;display:none;pointer-events:none}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#2c3747;border-radius:4px}

</head>
<body>
<canvas id="c"></canvas>
<canvas id="minimap" width="220" height="165"></canvas>
<div id="resbar"></div>
<div id="questhud"></div>
<div id="wavehud"></div>
<div id="topbar">
  <div class="timegroup">
    <div class="timebtn" data-speed="0" title="Пауза (пробел)">⏸</div>
    <div class="timebtn active" data-speed="1" title="1×">▶</div>
    <div class="timebtn" data-speed="2" title="2×">▶▶</div>
    <div class="timebtn" data-speed="4" title="4×">▶▶▶</div>
  </div>
  <div class="tbtn" id="questbtn">📜 (Q)</div>
  <div class="tbtn" id="techbtn">🔬 (T)</div>
  <div class="tbtn" id="statsbtn">📊 (F)</div>
  <div class="tbtn" id="settingsbtn" title="Настройки (O)">⚙</div>
  <div class="tbtn" id="menubtn">☰</div>
</div>
<div id="info"></div>
<div id="build">
  <div id="builditems"></div>
  <div id="buildcats"></div>
</div>
<div id="questpanel" class="sidepanel"></div>
<div id="techpanel" class="sidepanel"></div>
<div id="logbox"></div>
<div id="overlay"></div>
<div id="fps-counter">0 FPS</div>
<div id="statsmodal">
  <div class="menu-box">
    <h2>Статистика</h2>
    <canvas id="statscanvas" width="720" height="400"></canvas>
    <button class="back-btn" onclick="document.getElementById('statsmodal').classList.remove('open')">✕ Закрыть</button>
  </div>
</div>
<div id="workersmodal"><div class="menu-box" id="workersbox"><h2>Рабочие</h2><div id="workerslist"></div><button class="back-btn" onclick="document.getElementById('workersmodal').classList.remove('open')">✕ Закрыть</button></div></div>
<div id="settingsmodal"><div class="menu-box"><h2>⚙ Настройки</h2><div id="settingscontent"></div><button class="back-btn" onclick="document.getElementById('settingsmodal').classList.remove('open')">✕ Закрыть</button></div></div>
<div id="gameovermodal"><div class="menu-box"><h2 id="gameover-title">Игра окончена</h2><p id="gameover-text"></p><button class="primary" onclick="closeGameOver()">Закрыть</button><button class="back-btn" onclick="openMenu('main');closeGameOver()">◀ В меню</button></div></div>
<div id="hint">WASD — камера • колесо — зум • ЛКМ-протяжка — выделение • ПКМ — приказ • Shift+ЛКМ — серия построек • M — метка • Пробел — пауза • O — настройки</div>
<div id="toast"></div>
<div id="tooltip"></div>
<script>
"use strict";

// =================== SETTINGS ===================
const SETTINGS = {
  sound: true, volume: 0.35, minimap: true, minimapSize: 'medium',
  log: true, particles: true, daynight: true, hints: true, uiScale: 1.0, fps: false,
};
function loadSettings(){
  try { const raw = localStorage.getItem('citysim_settings'); if(raw) Object.assign(SETTINGS, JSON.parse(raw)); } catch(e){}
  if(SETTINGS.uiScale === 1.15) SETTINGS.uiScale = 1.0;
}
function saveSettings(){ try { localStorage.setItem('citysim_settings', JSON.stringify(SETTINGS)); } catch(e){} }
const UI_ZOOM_ELEMENTS = ['resbar','questhud','topbar','build','logbox','hint','info','questpanel','techpanel','minimap','wavehud'];
function applyUIScale(){
  const scale = SETTINGS.uiScale || 1;
  for(const id of UI_ZOOM_ELEMENTS){ const el = document.getElementById(id); if(el) el.style.zoom = scale; }
  document.querySelectorAll('.menu-box').forEach(el => { el.style.zoom = scale; });
  updateUILayout();
}
function updateUILayout(){
  const scale = SETTINGS.uiScale || 1;
  const resbarEl = document.getElementById('resbar');
  if(!resbarEl) return;
  resbarEl.style.maxWidth = Math.max(180, (W - 560) / scale) + 'px';
  const rb = resbarEl.getBoundingClientRect();
  const bottomCss = rb.bottom / scale;
  const qh = document.getElementById('questhud');
  if(qh && qh.style.display !== 'none') qh.style.top = Math.max(82, bottomCss + 6) + 'px';
  const infoEl2 = document.getElementById('info');
  if(infoEl2) infoEl2.style.top = Math.max(124, bottomCss + 8) + 'px';
}

// =================== SOUND ===================
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, vol, delay){
  if(!SETTINGS.sound || SETTINGS.volume <= 0) return;
  const ac = ensureAudio(); if(!ac) return;
  try {
    const t0 = ac.currentTime + (delay||0);
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol * SETTINGS.volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  } catch(e){}
}
const SND = {

function hash(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct=4){
  let v=0, a=.5, f=1;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*131); f*=2; a*=.5; }
  return v;
}

const TREE_COLORS = {
  spring:{ main:'#6a8a3a', light:'#7a9a4a' }, summer:{ main:'#2d6528', light:'#3a7d33' },
  autumn:{ main:'#904020', light:'#a05030' }, winter:{ main:'#4a5a4a', light:'#e0e8f0' }
};
function getLerpRGB(c1,c2,t){ return [Math.round(c1[0]+(c2[0]-c1[0])*t),Math.round(c1[1]+(c2[1]-c1[1])*t),Math.round(c1[2]+(c2[2]-c1[2])*t)]; }
function getSeasonColors(type){
  const pal = type === 'grass' ? GRASS_RGB : WATER_RGB;
  const s1 = pal[G.prevSeason] || pal.spring, s2 = pal[G.season] || pal.spring;
  const t = G.seasonBlend !== undefined ? G.seasonBlend : 1;
  const arr = [];
  for(let i=0;i<4;i++){ if(type === 'water' && i >= 3) break; const rgb = getLerpRGB(s1[i], s2[i], t); arr.push(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`); }
  return arr;
}
function tilePalette(type){ if(type === 'grass') return getSeasonColors('grass'); if(type === 'water') return getSeasonColors('water'); return TCOL_BASE[type]; }
function miniTileColor(type){
  if(type === 'water') return getSeasonColors('water')[0];
  if(type === 'sand') return '#c7b789';
  if(type === 'mountain') return '#5a5a68';
  return getSeasonColors('grass')[0];
}

const pathCache = new Map();
function findPathCached(sx, sy, tx, ty){
  const stx = Math.floor(sx/TS), sty = Math.floor(sy/TS);
  const key = stx + ',' + sty + ',' + tx + ',' + ty;
  const now = G.time;
  const entry = pathCache.get(key);
  if(entry && (now - entry.t) < 3){
    return entry.path ? entry.path.map(p => ({x: p.x, y: p.y})) : null;
  }
  if(pathCache.size > 150){
    const del = [];
    for(const [k,v] of pathCache){ if(now - v.t > 10) del.push(k); }
    for(const k of del) pathCache.delete(k);
    if(pathCache.size > 250) pathCache.clear();
  }
  const path = findPath(sx, sy, tx, ty);
  pathCache.set(key, { path: path ? path.map(p => ({x:p.x,y:p.y})) : null, t: now });
  return path;
}

function genWorld(){

  for(let y=0;y<MH;y++){
    terrain[y]=[]; nodes[y]=[];
    for(let x=0;x<MW;x++){
      if(tt === 'flat'){ terrain[y][x] = {t:'grass', v: hash(x,y,seed+3)}; nodes[y][x] = null; continue; }
      const freq = (tt === 'island') ? 0.06 : 0.045;
      const e = fbm(x*freq, y*freq, seed, 4);
      let t = 'grass', waterTh, sandTh, mountainTh;
      if(tt === 'island'){ waterTh = 0.48; sandTh = 0.52; mountainTh = 0.80; }
      else if(tt === 'mountain'){ waterTh = 0.36; sandTh = 0.40; mountainTh = 0.55; }
      else { waterTh = 0.37; sandTh = 0.41; mountainTh = 0.75; }
      if(e < waterTh) t = 'water';
      else if(e < sandTh) t = 'sand';
      else if(e > mountainTh) t = 'mountain';
      terrain[y][x] = {t, v: hash(x,y,seed+3)};
      nodes[y][x] = null;
    }
  }
  if(tt === 'normal'){
    const cx0 = MW * 0.62;
    for(let y=1;y<MH-1;y++){
      const wobble = Math.sin(y*0.07)*10 + fbm(y*0.04, 50, seed+999)*16 - 8;
      const cx = cx0 + wobble;
      const halfW = 2.5 + hash(y,1,seed+555)*3.5;
      for(let x=Math.floor(cx-halfW); x<=Math.ceil(cx+halfW); x++){
        if(x<1||x>=MW-1) continue;
        terrain[y][x].t = 'water';
      }
    }
  }
  if(tt !== 'flat'){
    const lakeCount = tt === 'island' ? 25 : tt === 'mountain' ? 15 : 20;
    for(let i=0;i<lakeCount;i++){
      const lx = 8 + Math.floor(hash(i,1,seed+888) * (MW-16));
      const ly = 8 + Math.floor(hash(1,i,seed+999) * (MH-16));
      const r = 2 + Math.floor(hash(i,i,seed+111) * 4);
      for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
        const x=lx+dx, y=ly+dy;
        if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
        if(Math.hypot(dx,dy) <= r && hash(x,y,seed+222) > 0.25) terrain[y][x].t = 'water';
      }
    }
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(terrain[y][x].t !== 'grass') continue;
    const m = fbm(x*0.07+40, y*0.07+40, seed+77, 3);
    const r = hash(x,y,seed+9);
    const r2 = hash(x,y,seed+13);
    if(m > 0.60 && r > 0.70) nodes[y][x] = {type:'tree', tx:x, ty:y, amount:3};
    else if(r2 > 0.94) nodes[y][x] = {type:'rock', tx:x, ty:y, amount:3};
  }
  veins('stoneD',15,seed+501,{shape:'circle',maxRadius:2,density:0.55});
  veins('coalD',20,seed+201,{shape:'circle',maxRadius:1,density:0.65});

  veins('copperOreD',10,seed+403,{shape:'circle',maxRadius:1,density:0.6});
  veins('goldOreD',7,seed+509,{shape:'point'});

  initGrids();
  computeIslands();
  ensureAllOres(seed);
  rebuildHarvestIndex();
}
function ensureAllOres(seed){
  let mainIsland = -1, maxSize = 0;
  for(const id in islandSizes){ if(islandSizes[id] > maxSize){ maxSize = islandSizes[id]; mainIsland = parseInt(id); } }
  for(const type of Object.keys(DEPOSITS)){
    let found = false;
    for(let y=0;y<MH && !found;y++) for(let x=0;x<MW && !found;x++)
      if(nodes[y][x] && nodes[y][x].type === type) found = true;
    if(found) continue;
    let attempts = 0;
    while(attempts < 800){
      const bx = 4 + Math.floor(Math.random() * (MW - 8));
      const by = 4 + Math.floor(Math.random() * (MH - 8));
      if(islandId[by][bx] !== mainIsland || terrain[by][bx].t !== 'grass'){ attempts++; continue; }
      let placed = 0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const x = bx+dx, y = by+dy;
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        if(nodes[y][x] && isDeposit(nodes[y][x].type)) continue;
        if(Math.hypot(dx,dy) <= 1){ nodes[y][x] = { type, tx:x, ty:y }; placed++; }
      }
      if(placed > 0) break;
      attempts++;
    }
  }
}
function veins(type, count, seed, opts){
  opts = opts || {shape:'circle',maxRadius:2,density:0.5};
  const shape = opts.shape || 'circle';
  for(let i=0;i<count;i++){
    const bx = 5 + Math.floor(hash(i,1,seed) * (MW-10));
    const by = 5 + Math.floor(hash(1,i,seed+5) * (MH-10));
    if(shape === 'point'){
      if(bx<2||by<2||bx>=MW-2||by>=MH-2) continue;
      if(terrain[by][bx].t !== 'grass') continue;
      if(nodes[by][bx] && isDeposit(nodes[by][bx].type)) continue;
      nodes[by][bx] = {type, tx:bx, ty:by};
    } else if(shape === 'circle'){
      const r = 1 + Math.floor(hash(i,i,seed+9) * (opts.maxRadius || 2));
      const dens = opts.density || 0.5;
      for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
        const x=bx+dx, y=by+dy;
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        if(nodes[y][x] && isDeposit(nodes[y][x].type)) continue;
        if(Math.hypot(dx,dy) <= r && hash(x,y,seed+17) > (1 - dens)) nodes[y][x] = {type, tx:x, ty:y};
      }
    } else if(shape === 'line'){
      const len = 2 + Math.floor(hash(i,i,seed+11) * 5);
      const ang = hash(i,i,seed+13) * Math.PI * 2;
      const dirX = Math.cos(ang), dirY = Math.sin(ang);
      for(let t=0; t<len; t++){
        const x = bx + Math.round(dirX * t), y = by + Math.round(dirY * t);
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        if(nodes[y][x] && isDeposit(nodes[y][x].type)) continue;
        nodes[y][x] = {type, tx:x, ty:y};
        if(hash(x,y,seed+19) > 0.6){
          const nx = x + Math.round(-dirY), ny = y + Math.round(dirX);
          if(nx>=2 && ny>=2 && nx<MW-2 && ny<MH-2 && terrain[ny][nx].t === 'grass' && !(nodes[ny][nx] && isDeposit(nodes[ny][nx].type))){
            nodes[ny][nx] = {type, tx:nx, ty:ny};
          }
        }
      }
    }
  }
}
function isWalkableTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  const t = terrain[ty][tx].t;
  if(t === 'mountain') return false;
  if(t !== 'water') return true;
  return bridgeGrid[ty] && bridgeGrid[ty][tx];
}
function computeIslands(){
  islandId = []; islandSizes = {};
  for(let y=0;y<MH;y++) islandId[y] = new Array(MW).fill(-1);
  let nextId = 0;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(!isWalkableTile(x,y)) continue;
    if(islandId[y][x] !== -1) continue;
    const stack = [[x,y]];
    const id = nextId++;
    islandId[y][x] = id;
    let size = 0;
    while(stack.length){
      const [cx, cy] = stack.pop();
      size++;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy;
        if(!isWalkableTile(nx,ny)) continue;
        if(islandId[ny][nx] !== -1) continue;
        islandId[ny][nx] = id;
        stack.push([nx,ny]);
      }
    }
    islandSizes[id] = size;
  }
}
function getIslandAt(px, py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;

}

// =================== PATHFINDING ===================
class MinHeap {
  constructor(){ this.items = []; }
  push(item){
    this.items.push(item);
    let i = this.items.length - 1;
    while(i > 0){
      const p = (i-1) >> 1;
      if(this.items[p].f <= this.items[i].f) break;
      const t = this.items[p]; this.items[p] = this.items[i]; this.items[i] = t;
      i = p;
    }
  }
  pop(){
    if(this.items.length === 0) return null;
    const top = this.items[0];
    const last = this.items.pop();
    if(this.items.length > 0){
      this.items[0] = last;
      let i = 0;
      const n = this.items.length;
      while(true){
        let s = i;
        const l = 2*i+1, r = 2*i+2;
        if(l < n && this.items[l].f < this.items[s].f) s = l;
        if(r < n && this.items[r].f < this.items[s].f) s = r;
        if(s === i) break;
        const t = this.items[s]; this.items[s] = this.items[i]; this.items[i] = t;
        i = s;
      }
    }
    return top;
  }
  get size(){ return this.items.length; }
}
function canWalkStraight(x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const d = Math.hypot(dx,dy);
  if(d < 6) return true;
  const steps = Math.ceil(d / 8);
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    if(!isWalkableTile(Math.floor((x1+dx*t)/TS), Math.floor((y1+dy*t)/TS))) return false;
  }
  return true;
}
function findPath(sx, sy, tx, ty){
  const stx = Math.floor(sx/TS), sty = Math.floor(sy/TS);
  if(!isWalkableTile(stx, sty)) return null;
  if(!isWalkableTile(tx, ty)) return null;
  if(stx === tx && sty === ty) return [{x: tx*TS+16, y: ty*TS+16}];
  const open = new MinHeap();
  const closed = new Set();
  const bestG = new Map();
  open.push({x: stx, y: sty, g: 0, f: Math.abs(tx-stx) + Math.abs(ty-sty), parent: null});
  bestG.set(sty*MW+stx, 0);
  let iter = 0;
  const maxIter = 4000;
  while(open.size > 0 && iter < maxIter){
    iter++;
    const cur = open.pop();
    const ck = cur.y*MW + cur.x;
    if(closed.has(ck)) continue;
    const gMap = bestG.get(ck);
    if(gMap !== undefined && gMap < cur.g) continue;
    closed.add(ck);
    if(cur.x === tx && cur.y === ty){
      const path = [];
      let n = cur;
      while(n){ path.unshift({x: n.x*TS+16, y: n.y*TS+16}); n = n.parent; }
      return path;
    }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cur.x+dx, ny = cur.y+dy;
      if(!isWalkableTile(nx, ny)) continue;
      const nk = ny*MW+nx;
      if(closed.has(nk)) continue;
      const stepCost = (roadGrid[ny] && roadGrid[ny][nx]) ? 0.6 : 1;
      const ng = cur.g + stepCost;
      const prevG = bestG.get(nk);
      if(prevG !== undefined && prevG <= ng) continue;
      bestG.set(nk, ng);
      open.push({x: nx, y: ny, g: ng, f: ng + Math.abs(tx-nx) + Math.abs(ty-ny), parent: cur});
    }
  }
  return null;
}

// =================== MOVEMENT ===================
function isWaterPx(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
  if(terrain[ty][tx].t !== 'water') return false;
  if(bridgeGrid[ty] && bridgeGrid[ty][tx]) return false;
  return true;
}
function isWaterForBoat(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  return terrain[ty][tx].t === 'water';
}
function getSpeedBoost(u){
  for(const b of logisticsHubs){ if(Math.hypot(b.px - u.x, b.py - u.y) < 8*TS) return 1.15; }
  return 1;
}
function moveTo(u, tpx, tpy, dt){
  if(u.drone || u.flying){
    const dx = tpx-u.x, dy = tpy-u.y;
    const d = Math.hypot(dx,dy);
    if(d < 2.5) return true;
    const step = Math.min(d, u.speed*dt);
    u.x += dx/d*step; u.y += dy/d*step;
    return d < 3.5;
  }
  const ttx = Math.floor(tpx/TS), tty = Math.floor(tpy/TS);
  if(!u.path || u.pathTargetTx !== ttx || u.pathTargetTy !== tty){
    if(canWalkStraight(u.x, u.y, tpx, tpy)){
      u.path = [{x: tpx, y: tpy}];
    } else {
      if(pathBudget <= 0) return false;
      pathBudget--;
      u.path = findPathCached(u.x, u.y, ttx, tty);
      if(!u.path){ u.unreachable = true; return false; }
    }
    u.pathTargetTx = ttx; u.pathTargetTy = tty; u.pathIdx = 0;
  }
  while(u.pathIdx < u.path.length){
    const wp = u.path[u.pathIdx];
    const dx = wp.x-u.x, dy = wp.y-u.y;
    const d = Math.hypot(dx,dy);
    if(d < 3){ u.pathIdx++; continue; }
    let sp = u.speed * getSpeedBoost(u);
    const curTx = Math.floor(u.x/TS), curTy = Math.floor(u.y/TS);
    if(roadGrid[curTy] && roadGrid[curTy][curTx]) sp *= 1.7;
    const step = Math.min(d, sp*dt);
    let nx = u.x + dx/d*step;
    let ny = u.y + dy/d*step;
    if(isWaterPx(nx, u.y)) nx = u.x;
    if(isWaterPx(u.x, ny)) ny = u.y;
    u.x = nx; u.y = ny;
    return false;
  }
  return true;
}
function smoothDirectStep(u, tx, ty, dt){
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.hypot(dx, dy);
  if(d < 0.5) return true;
  const step = Math.min(d, u.speed * dt);
  const nx = u.x + dx/d * step, ny = u.y + dy/d * step;
  if(isWalkableTile(Math.floor(nx/TS), Math.floor(ny/TS))){ u.x = nx; u.y = ny; return false; }
  if(isWalkableTile(Math.floor(nx/TS), Math.floor(u.y/TS))){ u.x = nx; return false; }
  if(isWalkableTile(Math.floor(u.x/TS), Math.floor(ny/TS))){ u.y = ny; return false; }
  return true;
}
function nearestStorage(u){
  let best=null, bd=1e18;
  const myIsland = u.drone ? -2 : getIslandAt(u.x, u.y);
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type!=='house' && !isStorageType(b.type) && b.type!=='apartment' && b.type!=='luxuryHouse' && b.type!=='townHall') continue;
    if(!u.drone && getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}
function assignJob(u){
  if(u.manual) return;
  if(u.soldierType) return;
  if(u.isRepairDrone) return;
  if(u.drone){
    let bn=null, bnd=1e18;
    for(let i = 0; i < harvestIndex.length; i++){
      const h = harvestIndex[i];
      const n = nodes[h.ty][h.tx];
      if(!n || n.amount <= 0) continue;
      const d = (h.tx*TS+16-u.x)**2 + (h.ty*TS+16-u.y)**2;
      if(d<bnd){ bnd=d; bn=n; }
    }
    if(bn){ u.target = bn; u.state = 'goNode'; return; }
    u.state = 'idle'; return;
  }
  const myIsland = getIslandAt(u.x, u.y);
  if(myIsland < 0) return;
  let best=null, bd=1e18;
  for(const b of G.buildings){
    const def = b.def;
    if(!def || !def.workers || def.auto) continue;
    if(b.constructionT > 0) continue;
    if(def.robotOnly && !u.robot) continue;
    if(b.workers.length >= def.workers) continue;
    if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  if(best){
    best.workers.push(u); u.job = best;
    const a = Math.random()*6.28, r = 12+Math.random()*8;
    u.wax = Math.cos(a)*r; u.way = Math.sin(a)*r;
    u.state = 'goBuilding'; return;
  }
  let bn=null, bnd=1e18;
  for(let i = 0; i < harvestIndex.length; i++){
    const h = harvestIndex[i];
    const n = nodes[h.ty][h.tx];
    if(!n || n.amount <= 0) continue;
    if(islandId[h.ty][h.tx] !== myIsland) continue;
    const d = (h.tx*TS+16-u.x)**2 + (h.ty*TS+16-u.y)**2;
    if(d<bnd){ bnd=d; bn=n; }
  }
  if(bn){ u.target = bn; u.state = 'goNode'; return; }
  u.state = 'idle';
}
function depositCarry(u){ if(u.carry && u.carryAmt > 0) addRes(u.carry, u.carryAmt); u.carry = null; u.carryAmt = 0; }

// =================== COMBAT ===================
function findNearestAttackable(x, y, maxRange){
  let best = null, bestD = maxRange !== undefined ? maxRange * TS : 1e18;
  for(const e of G.enemies){
    const d = Math.hypot(e.x - x, e.y - y);
    if(d < bestD){ bestD = d; best = e; }
  }
  for(const gb of G.goblinBuildings){
    const d = Math.hypot(gb.px - x, gb.py - y) * 1.15;
    if(d < bestD){ bestD = d; best = gb; }
  }
  for(const eb of G.enemyBases){
    const d = Math.hypot(eb.x - x, eb.y - y) * 1.4;
    if(d < bestD){ bestD = d; best = eb; }
  }
  return best;
}
function isValidAttackTarget(t){
  if(!t) return false;
  return G.enemies.includes(t) || G.goblinBuildings.includes(t) || G.enemyBases.includes(t);
}
function spawnProjectile(fromX, fromY, target, damage, type, fromPlayer){
  let speed = 400, color = '#f0e0a0', size = 3;
  if(type === 'arrow'){ speed = 380; color = '#d8c080'; size = 2; }
  else if(type === 'bolt'){ speed = 500; color = '#c0a060'; size = 2.5; }
  else if(type === 'bullet'){ speed = 800; color = '#ffd060'; size = 2; }
  else if(type === 'cannon'){ speed = 280; color = '#404048'; size = 5; }
  else if(type === 'laser'){ speed = 2000; color = '#80ff80'; size = 3; }
  else if(type === 'magic'){ speed = 300; color = '#c080ff'; size = 4; }
  const tx = target.x !== undefined ? target.x : target.px;
  const ty = target.y !== undefined ? target.y : target.py;
  const dx = tx - fromX, dy = ty - fromY;
  const d = Math.hypot(dx, dy) || 1;
  G.projectiles.push({ x: fromX, y: fromY, vx: dx/d*speed, vy: dy/d*speed, speed, damage, type, color, size, target, fromPlayer, life: 3 });
  if(type === 'arrow' || type === 'bolt') SND.arrowShot();
  else if(type === 'cannon' || type === 'magic') SND.cannonShot();
}
function damageTarget(target, dmg, fromPlayer){
  if(!target) return;
  if(target.hp === undefined){ const defHp = (target.def && target.def.hp) || 200; target.hp = defHp; target.maxHp = defHp; }
  target.hp -= dmg;
  if(G.units.includes(target)) target.lastDamageT = G.time;
  if(target.hp <= 0) killTarget(target, fromPlayer);
}
function killTarget(target, fromPlayer){
  if(G.enemies.includes(target)){
    const idx = G.enemies.indexOf(target);
    if(idx >= 0) G.enemies.splice(idx, 1);
    if(fromPlayer !== false){ G.totalKills++; SND.goblinDeath(); }
    const col = target.color || '#c04040';
    for(let i=0;i<6;i++) spawnParticle(target.x + (Math.random()-0.5)*10, target.y + (Math.random()-0.5)*10, col, {life:0.6, size:3, speed:30});
    return;
  }
  if(G.goblinBuildings.includes(target)){
    const idx = G.goblinBuildings.indexOf(target);
    if(idx >= 0) G.goblinBuildings.splice(idx, 1);
    G.goblinBuildingsDestroyed++;
    rebuildWallGrid();
    if(fromPlayer !== false) pushLog('Гоблинское строение уничтожено', 'good');
    SND.explosion();
    for(let i=0;i<10;i++) spawnParticle(target.px + (Math.random()-0.5)*20, target.py + (Math.random()-0.5)*20, '#8a3a1a', {life:1, size:4, speed:40});
    return;
  }
  if(G.enemyBases.includes(target)){
    const idx = G.enemyBases.indexOf(target);
    if(idx >= 0) G.enemyBases.splice(idx, 1);
    pushLog('Вражеская база уничтожена!', 'good');
    toast('Вражеская база уничтожена!');
    SND.explosion();
    checkBattleVictory();
    return;
  }
  if(G.buildings.includes(target)){
    for(let i=0;i<8;i++) spawnParticle(target.px + (Math.random()-0.5)*20, target.py + (Math.random()-0.5)*20, 'rgba(200,120,80,0.8)', {life:1, size:4, speed:40});
    if(target === G.townHall) triggerDefeat('Ратуша разрушена!');
    demolishBuilding(target, true);
    return;
  }
  if(G.units.includes(target)){
    const idx = G.units.indexOf(target);
    if(idx >= 0){
      if(target.job){ const wi = target.job.workers.indexOf(target); if(wi >= 0) target.job.workers.splice(wi, 1); }
      for(let i=0;i<4;i++) spawnParticle(target.x + (Math.random()-0.5)*8, target.y + (Math.random()-0.5)*8, target.soldierColor || '#c08080', {life:0.5, size:2, speed:25});
      const wasSoldier = !!target.soldierType;
      const wasRepair = target.isRepairDrone;
      G.units.splice(idx, 1);
      if(G.sel === target) G.sel = null;
      if(!wasSoldier && !wasRepair && !target.robot){ G.civilianDeaths++; pushLog('💀 Житель погиб!', 'danger'); SND.civilianDeath(); }
      else { SND.goblinDeath(); }
    }
  }
}
function updateProjectiles(dt){
  for(let i = G.projectiles.length - 1; i >= 0; i--){
    const p = G.projectiles[i];
    p.life -= dt;
    if(p.life <= 0){ G.projectiles.splice(i, 1); continue; }
    const targetValid = p.target && (G.enemies.includes(p.target) || G.goblinBuildings.includes(p.target) || G.enemyBases.includes(p.target) || G.buildings.includes(p.target) || G.units.includes(p.target));
    if(!targetValid){ G.projectiles.splice(i, 1); continue; }
    const tx = p.target.x !== undefined ? p.target.x : p.target.px;
    const ty = p.target.y !== undefined ? p.target.y : p.target.py;
    const dx = tx - p.x, dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    if(d < 10){ damageTarget(p.target, p.damage, p.fromPlayer); G.projectiles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function updateEffects(dt){ for(let i = G.effects.length - 1; i >= 0; i--){ G.effects[i].life -= dt; if(G.effects[i].life <= 0) G.effects.splice(i, 1); } }
function doSoldierAttack(u, enemy){
  if(u.suicide){
    damageTarget(enemy, u.atk, true);
    for(const e of G.enemies){
      if(e === enemy) continue;
      const ed = Math.hypot(e.x - u.x, e.y - u.y);
      if(ed < TS * 2) damageTarget(e, u.atk * 0.5, true);
    }
    spawnParticle(u.x, u.y, '#ff6020', {life:0.8, size:8, speed:60});
    spawnParticle(u.x, u.y, '#ffa040', {life:0.6, size:5, speed:40});
    SND.explosion();
    const idx = G.units.indexOf(u);
    if(idx >= 0) G.units.splice(idx, 1);
    return;
  }
  if(u.ranged){ spawnProjectile(u.x, u.y, enemy, u.atk, u.projectile, true); }
  else {
    const ex = enemy.x !== undefined ? enemy.x : enemy.px;
    const ey = enemy.y !== undefined ? enemy.y : enemy.py;
    damageTarget(enemy, u.atk, true);
    spawnParticle(ex, ey, '#ffffff', {life:0.3, size:2, speed:15});
    SND.swordHit();
  }
}
function updateFlyingSoldier(u, dt){
  if(u.state === 'manualMove'){
    const dx = u.mvx - u.x, dy = u.mvy - u.y;
    const dd = Math.hypot(dx, dy);
    if(dd < 3){ u.state = 'idle'; u.idleT = 0.25; return; }
    const step = Math.min(dd, u.speed * dt);
    u.x += dx/dd * step; u.y += dy/dd * step;
    return;
  }
  const tryTarget = (t) => {
    const tx = t.x !== undefined ? t.x : t.px;
    const ty = t.y !== undefined ? t.y : t.py;
    const d = Math.hypot(tx - u.x, ty - u.y);
    if(d < u.range * TS){
      u.attackT -= dt;
      if(u.attackT <= 0){ u.attackT = u.cooldown; doSoldierAttack(u, t); }
    } else {
      const step = Math.min(d, u.speed * dt);
      u.x += (tx - u.x) / d * step;
      u.y += (ty - u.y) / d * step;
    }
  };
  if(u.attackTarget){
    if(!isValidAttackTarget(u.attackTarget)) u.attackTarget = null;
    else { tryTarget(u.attackTarget); return; }
  }
  if(u.combatMode === 'manual'){ u.state = 'idle'; return; }
  if(u.combatMode === 'guard'){
    const gp = u.guardPos || {x: u.x, y: u.y};
    const enemy = findNearestAttackable(u.x, u.y, u.range);
    if(enemy){ tryTarget(enemy); return; }
    const dxg = gp.x - u.x, dyg = gp.y - u.y;
    const ddg = Math.hypot(dxg, dyg);
    if(ddg > TS * 0.8){
      const step = Math.min(ddg, u.speed * dt);
      u.x += dxg/ddg * step; u.y += dyg/ddg * step;
    }
    u.state = 'idle';
    return;
  }
  if(G.enemies.length > 0 || G.goblinBuildings.length > 0 || G.enemyBases.length > 0){
    const enemy = findNearestAttackable(u.x, u.y);
    if(enemy){ tryTarget(enemy); return; }
  }
  u.state = 'idle';
}
function updateSoldier(u, dt){
  if(!u.soldierType) return;
  if(u.flying){ updateFlyingSoldier(u, dt); return; }
  if(u.state === 'manualMove'){
    const arrived = moveTo(u, u.mvx, u.mvy, dt);
    if(arrived || u.unreachable){ u.state = 'idle'; u.idleT = 0.25; u.path = null; u.unreachable = false; }
    return;
  }
  if(u.attackTarget){
    if(!isValidAttackTarget(u.attackTarget)){ u.attackTarget = null; }
    else {
      const t = u.attackTarget;
      const tx = t.x !== undefined ? t.x : t.px;
      const ty = t.y !== undefined ? t.y : t.py;
      const d = Math.hypot(tx - u.x, ty - u.y);
      if(d < u.range * TS){
        u.state = 'attack';
        u.attackT -= dt;
        if(u.attackT <= 0){ u.attackT = u.cooldown; doSoldierAttack(u, t); }
        u.path = null;
      } else {
        u.unreachable = false;
        const arrived = moveTo(u, tx, ty, dt);
        if(u.unreachable){ u.attackTarget = null; u.path = null; u.state = 'idle'; u.idleT = 1; }
        else if(arrived){ smoothDirectStep(u, tx, ty, dt); u.path = null; }
        u.state = 'goEnemy';
      }
      return;
    }
  }
  if(u.combatMode === 'manual'){ u.state = 'idle'; return; }
  if(u.combatMode === 'guard'){
    const gp = u.guardPos || {x: u.x, y: u.y};
    const enemy = findNearestAttackable(u.x, u.y, u.range);
    if(enemy){
      u.state = 'attack';
      u.attackT -= dt;
      if(u.attackT <= 0){ u.attackT = u.cooldown; doSoldierAttack(u, enemy); }
      u.path = null;
      return;
    }
    const dxg = gp.x - u.x, dyg = gp.y - u.y;
    if(Math.hypot(dxg, dyg) > TS * 0.8){
      u.unreachable = false;
      const arrived = moveTo(u, gp.x, gp.y, dt);
      if(arrived || u.unreachable) u.path = null;
      u.state = 'goEnemy';
    } else { u.state = 'idle'; u.path = null; }
    return;
  }
  if(G.enemies.length > 0 || G.goblinBuildings.length > 0 || G.enemyBases.length > 0){
    const enemy = findNearestAttackable(u.x, u.y);
    if(enemy){
      const ex = enemy.x !== undefined ? enemy.x : enemy.px;
      const ey = enemy.y !== undefined ? enemy.y : enemy.py;
      const d = Math.hypot(ex - u.x, ey - u.y);
      if(d < u.range * TS){
        u.state = 'attack';
        u.attackT -= dt;
        if(u.attackT <= 0){ u.attackT = u.cooldown; doSoldierAttack(u, enemy); }
        u.path = null;
      } else {
        u.unreachable = false;
        const arrived = moveTo(u, ex, ey, dt);
        if(u.unreachable){ u.path = null; u.state = 'idle'; u.idleT = 1; }
        else if(arrived){ u.path = null; smoothDirectStep(u, ex, ey, dt); }
        u.state = 'goEnemy';
      }
      return;
    }
  }
  if(u.state !== 'idle' && u.state !== 'attack'){ u.state = 'idle'; u.idleT = 1; }
  u.idleT -= dt;
  if(u.idleT <= 0){
    u.idleT = 1;
    if(u.barracks && G.buildings.includes(u.barracks)){
      const ang = Math.random() * 6.28;
      const r = Math.random() * 40;
      const tx = u.barracks.px + Math.cos(ang) * r;
      const ty = u.barracks.py + Math.sin(ang) * r;
      if(isWalkableTile(Math.floor(tx/TS), Math.floor(ty/TS))){
        const dx = tx - u.x, dy = ty - u.y;
        const d = Math.hypot(dx, dy);
        if(d > 4){ u.x += dx/d * Math.min(d, u.speed * 0.3); u.y += dy/d * Math.min(d, u.speed * 0.3); }
      }
    }
  }
}

// =================== ENEMY AI ===================
function updateEnemyFlowField(dt){
  enemyFlowTimer -= dt;
  if(enemyFlowTimer > 0) return;
  enemyFlowTimer = 3.0;
  const target = G.townHall || (G.buildings.length > 0 ? G.buildings[0] : null);
  if(!target) return;
  const ttx = target.tx, tty = target.ty;
  if(ttx === enemyFlowTargetTx && tty === enemyFlowTargetTy && enemyFlowField) return;
  enemyFlowTargetTx = ttx; enemyFlowTargetTy = tty;
  const size = MW * MH;
  const dist = new Int32Array(size);
  dist.fill(-1);
  const queue = new Int32Array(size);
  let head = 0, tail = 0;
  if(!isWalkableTile(ttx, tty)) return;
  const startIdx = tty * MW + ttx;
  dist[startIdx] = 0; queue[tail++] = startIdx;
  while(head < tail){
    const idx = queue[head++];
    const cy = Math.floor(idx / MW), cx = idx % MW;
    const d = dist[idx];
    for(let i=0;i<4;i++){
      const nx = cx + [1,-1,0,0][i], ny = cy + [0,0,1,-1][i];
      if(nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      if(!isWalkableTile(nx, ny)) continue;
      const nidx = ny * MW + nx;
      if(dist[nidx] !== -1) continue;
      dist[nidx] = d + 1;
      queue[tail++] = nidx;
    }
  }
  enemyFlowField = dist;
}
function followFlowField(e, dt){
  if(!enemyFlowField) return false;
  const ctx2 = Math.floor(e.x/TS), cty = Math.floor(e.y/TS);
  if(ctx2 < 0 || cty < 0 || ctx2 >= MW || cty >= MH) return false;
  const curDist = enemyFlowField[cty*MW+ctx2];
  if(curDist <= 0) return false;
  let bestDir = null, bestD = curDist;
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(let i=0;i<4;i++){
    const nx = ctx2 + dirs[i][0], ny = cty + dirs[i][1];
    if(nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
    const nd = enemyFlowField[ny*MW+nx];
    if(nd !== -1 && nd < bestD){ bestD = nd; bestDir = dirs[i]; }
  }
  if(!bestDir) return false;
  const tpx = (ctx2 + bestDir[0]) * TS + TS/2;
  const tpy = (cty + bestDir[1]) * TS + TS/2;
  const wall = getWallAt(tpx, tpy);
  if(wall){
    e.wallAttackCooldown -= dt;
    if(e.wallAttackCooldown <= 0){
      e.wallAttackCooldown = e.cooldown;
      wall.hp -= e.atk;
      spawnParticle(tpx + (Math.random()-0.5)*20, tpy + (Math.random()-0.5)*20, 'rgba(150,100,50,0.8)', {life:0.5, size:3, speed:30});
      if(wall.hp <= 0){
        if(G.goblinBuildings.includes(wall)){ const gi = G.goblinBuildings.indexOf(wall); if(gi>=0) G.goblinBuildings.splice(gi,1); rebuildWallGrid(); }
        else demolishBuilding(wall, true);
      }
    }
    return true;
  }
  const dx = tpx - e.x, dy = tpy - e.y;
  const d = Math.hypot(dx, dy);
  if(d > 2){
    const step = Math.min(d, e.speed * dt);
    let nx = e.x + dx/d*step, ny = e.y + dy/d*step;
    if(isWalkableTile(Math.floor(nx/TS), Math.floor(ny/TS))){ e.x = nx; e.y = ny; }
  }
  return true;
}
function updateEnemy(e, dt){
  let bestTarget = null, bestD = 5 * TS;
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    const d = Math.hypot(u.x - e.x, u.y - e.y);
    if(d < bestD){ bestD = d; bestTarget = u; }
  }
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const d = Math.hypot(b.px - e.x, b.py - e.y);
    if(d < bestD){ bestD = d; bestTarget = b; }
  }
  if(bestTarget){
    const tx = bestTarget.x !== undefined ? bestTarget.x : bestTarget.px;
    const ty = bestTarget.y !== undefined ? bestTarget.y : bestTarget.py;
    const dist = Math.hypot(tx - e.x, ty - e.y);
    if(dist < e.range * TS){
      e.attackT -= dt;
      if(e.attackT <= 0){
        e.attackT = e.cooldown;
        if(e.ranged) spawnProjectile(e.x, e.y, bestTarget, e.atk, e.projectile, false);
        else { damageTarget(bestTarget, e.atk, false); SND.swordHit(); }
      }
    } else {
      const step = e.speed * dt;
      const dx = tx - e.x, dy = ty - e.y;
      const d = Math.hypot(dx, dy);
      let nx = e.x + dx/d*step, ny = e.y + dy/d*step;
      const wall = getWallAt(nx, ny);
      if(wall){
        e.wallAttackCooldown -= dt;
        if(e.wallAttackCooldown <= 0){
          e.wallAttackCooldown = e.cooldown;
          wall.hp -= e.atk;
          if(wall.hp <= 0){
            if(G.goblinBuildings.includes(wall)){ const gi = G.goblinBuildings.indexOf(wall); if(gi>=0) G.goblinBuildings.splice(gi,1); rebuildWallGrid(); }
            else demolishBuilding(wall, true);
          }
        }
      } else if(isWalkableTile(Math.floor(nx/TS), Math.floor(ny/TS))){
        e.x = nx; e.y = ny;
      } else {
        if(isWalkableTile(Math.floor(nx/TS), Math.floor(e.y/TS))) e.x = nx;
        else if(isWalkableTile(Math.floor(e.x/TS), Math.floor(ny/TS))) e.y = ny;
      }
    }
  } else followFlowField(e, dt);
}
function updateTower(b, dt){
  const def = b.def;
  if(!def || !def.range) return;
  if(b.constructionT > 0) return;
  if(def.powerUse && !b.hasPower) return;
  if(def.workers && b.workers.length < def.workers) return;
  let best = null, bestD = def.range * TS;
  for(const e of G.enemies){
    const d = Math.hypot(e.x - b.px, e.y - b.py);
    if(d < bestD){ bestD = d; best = e; }
  }
  for(const gb of G.goblinBuildings){
    const d = Math.hypot(gb.px - b.px, gb.py - b.py);
    if(d < bestD){ bestD = d; best = gb; }
  }
  if(!best) return;
  b.attackT = (b.attackT || 0) - dt;
  if(b.attackT <= 0){
    b.attackT = def.cooldown;
    const workers = def.workers ? Math.max(1, b.workers.length) : 1;
    spawnProjectile(b.px, b.py - 8, best, def.damage * workers, def.attackType, true);
  }
}
function updateRepairDrone(u, dt){
  let best = null, bestScore = -1e18;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.hp === undefined || b.hp >= b.maxHp) continue;
    const d = Math.hypot(b.px - u.x, b.py - u.y);
    if(d > 15 * TS) continue;
    const score = (b.maxHp - b.hp) * 10 - d;
    if(score > bestScore){ bestScore = score; best = b; }
  }
  if(!best){
    for(const b of G.units){
      if(!b.robot || b.drone || b === u) continue;
      if(b.hp >= b.maxHp) continue;
      const d = Math.hypot(b.x - u.x, b.y - u.y);
      if(d > 15 * TS) continue;
      const score = (b.maxHp - b.hp) * 5 - d;
      if(score > bestScore){ bestScore = score; best = b; }
    }
  }
  if(!best){
    if(u.hub && G.buildings.includes(u.hub)){
      const ang = G.time * 0.5 + u.id;
      const tx = u.hub.px + Math.cos(ang) * 35;
      const ty = u.hub.py + Math.sin(ang) * 35;
      const dx = tx - u.x, dy = ty - u.y;
      const d = Math.hypot(dx, dy);
      if(d > 4){ u.x += dx/d * u.speed * dt; u.y += dy/d * u.speed * dt; }
    }
    return;
  }
  const tx = best.px !== undefined ? best.px : best.x;
  const ty = best.py !== undefined ? best.py : best.y;
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.hypot(dx, dy);
  if(d > 20){
    const step = Math.min(d, u.speed * dt);
    u.x += dx/d * step; u.y += dy/d * step;
  } else {
    best.hp = Math.min(best.maxHp, best.hp + 12 * dt);
    if(Math.random() < 0.1) spawnParticle(best.px !== undefined ? best.px : best.x, (best.py !== undefined ? best.py : best.y) - 10, 'rgba(120,220,180,0.8)', {life:0.6, size:2, speed:10});
  }
}
function updateUnit(u, dt){
  if(u.inBoat || u.inHeli) return;
  if(!u.robot && u.hp < u.maxHp && G.time - u.lastDamageT > 5) u.hp = Math.min(u.maxHp, u.hp + 3 * dt);
  if(u.soldierType){ updateSoldier(u, dt); return; }
  if(u.isRepairDrone){ updateRepairDrone(u, dt); return; }
  const moving = (u.state==='goNode'||u.state==='goStore'||u.state==='goBuilding'||u.state==='manualMove');
  if(moving){
    u.stuckT += dt;
    if(u.stuckT > 3.0){
      if(Math.hypot(u.x-u.lx, u.y-u.ly) < 5){
        if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
        u.job = null; u.target = null; u.state='idle'; u.idleT = 0.6; u.path = null;
      }
      u.stuckT = 0; u.lx = u.x; u.ly = u.y;
    }
  }
  switch(u.state){
    case 'idle':
      u.idleT -= dt;
      if(u.idleT <= 0){ if(!u.manual) assignJob(u); u.idleT = 0.5; }
      break;
    case 'manualMove': {
      u.unreachable = false;
      const arrived = moveTo(u, u.mvx, u.mvy, dt);
      if(u.unreachable || arrived){ u.state = 'idle'; u.idleT = 0.25; u.path = null; }
      break;
    }
    case 'goNode': {
      const n = u.target;
      if(!n || n.amount <= 0 || nodes[n.ty][n.tx] !== n){ u.state='idle'; u.target=null; u.path=null; break; }
      u.unreachable = false;
      const arrived = moveTo(u, n.tx*TS+16, n.ty*TS+16, dt);
      if(u.unreachable){ u.state='idle'; u.target=null; u.path=null; break; }
      if(arrived){ u.state='gather'; u.timer = u.drone ? 1.0 : 2.2; u.path=null; }
      break;
    }
    case 'gather':
      u.timer -= dt;
      if(u.timer <= 0){
        const n = u.target;
        if(!n || nodes[n.ty][n.tx] !== n || n.amount <= 0){ u.state='idle'; u.target=null; break; }
        n.amount--;
        u.carry = (n.type === 'tree') ? 'wood' : 'stone';
        u.carryAmt = 5;
        if(n.amount <= 0){
          if(n.type === 'tree') G.regrow.push({tx:n.tx, ty:n.ty, t: 30 + Math.random()*20});
          else nodes[n.ty][n.tx] = null;
        }
        u.target = null; u.state = 'goStore';
      }
      break;
    case 'goStore': {
      const s = nearestStorage(u);
      if(!s){ depositCarry(u); u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, s.px, s.py, dt);
      if(u.unreachable){ depositCarry(u); u.state='idle'; u.path=null; break; }
      if(arrived){ depositCarry(u); u.state='idle'; u.idleT = 0.25; u.path=null; }
      break;
    }
    case 'goBuilding': {
      const b = u.job;
      if(!b){ u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, b.px + u.wax, b.py + u.way, dt);
      if(u.unreachable){
        const i = b.workers.indexOf(u);
        if(i>=0) b.workers.splice(i,1);
        u.job = null; u.state='idle'; u.path=null; break;
      }
      if(arrived){ u.state = 'work'; u.path=null; }
      break;
    }
    case 'work':
      if(!u.job || u.job.workers.indexOf(u) < 0){ u.state='idle'; u.job=null; }
      break;
  }
}
function orderMove(u, wx, wy){
  if(u.inHeli) return false;
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(!u.drone && !u.flying && !isWalkableTile(tx,ty)) return false;
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); u.job = null; }
  u.target = null; u.path = null; u.carry = null; u.carryAmt = 0; u.attackTarget = null;
  u.state = 'manualMove';
  u.mvx = tx*TS + TS/2 + (Math.random()-0.5)*10;
  u.mvy = ty*TS + TS/2 + (Math.random()-0.5)*10;
  u.stuckT = 0; u.lx = u.x; u.ly = u.y;
  if(u.soldierType && u.combatMode === 'guard') u.guardPos = { x: u.mvx, y: u.mvy };
  return true;
}
function orderAttack(u, target){
  if(!u.soldierType) return false;
  if(!isValidAttackTarget(target)) return false;
  u.attackTarget = target; u.state = 'goEnemy'; u.path = null;
  return true;
}

// =================== BOATS & HELIS ===================
function pickUpWorkers(bo){
  if(bo.passengers.length >= 4) return;
  for(const u of G.units){
    if(u.robot || u.drone || u.flying || u.inBoat || u.inHeli) continue;
    if(u.soldierType) continue;
    if(u.state !== 'idle') continue;
    if(u.manual) continue;
    if(Math.hypot(u.x - bo.x, u.y - bo.y) < TS*4){ boardWorker(bo, u); if(bo.passengers.length >= 4) break; }
  }
}
// FIX: only boat to islands that have buildings
function findBoatDestination(bo){
  const btx = Math.floor(bo.x/TS), bty = Math.floor(bo.y/TS);
  const curIsland = islandId[bty]?.[btx];
  if(curIsland === undefined) return null;
  const islandsWithBuildings = new Set();
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const iid = islandId[b.ty]?.[b.tx];
    if(iid !== undefined && iid !== curIsland) islandsWithBuildings.add(iid);
  }
  if(islandsWithBuildings.size === 0) return null;
  for(let r=2; r<=25; r++){
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const nx = btx + dx, ny = bty + dy;
        if(nx<2||ny<2||nx>=MW-2||ny>=MH-2) continue;
        const tt = terrain[ny][nx].t;
        if(tt !== 'grass' && tt !== 'sand') continue;
        const iid = islandId[ny][nx];
        if(iid === curIsland) continue;
        if(!islandsWithBuildings.has(iid)) continue;
        if(!isWalkableTile(nx, ny)) continue;
        for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const wx = nx+ax, wy = ny+ay;
          if(wx<0||wy<0||wx>=MW||wy>=MH) continue;
          if(terrain[wy][wx].t === 'water' && !(bridgeGrid[wy] && bridgeGrid[wy][wx])){
            return { x: wx*TS+TS/2, y: wy*TS+TS/2, landTx: nx, landTy: ny };
          }
        }
      }
    }
  }
  return null;
}
function updateBoat(bo, dt){
  if(bo.autoLockT > 0) bo.autoLockT -= dt;
  if(bo.state === 'idle' && bo.autoLockT <= 0){
    bo.pickupT = (bo.pickupT || 0) - dt;
    if(bo.passengers.length === 0){
      if(bo.pickupT <= 0){ bo.pickupT = 2; pickUpWorkers(bo); }
    } else {
      const dest = findBoatDestination(bo);
      if(dest){ bo.target = dest; bo.state = 'sailing'; }
    }
  }
  if(bo.state === 'sailing' && bo.target){
    const dx = bo.target.x - bo.x, dy = bo.target.y - bo.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      bo.x = bo.target.x; bo.y = bo.target.y;
      const tgt = bo.target;
      bo.state = 'idle'; bo.target = null;
      if(tgt.landTx !== undefined){
        if(bo.passengers.length > 0) unloadPassengers(bo, tgt.landTx, tgt.landTy);
      }
    } else {
      const step = Math.min(d, bo.speed*dt);
      const nx = bo.x + dx/d*step, ny = bo.y + dy/d*step;
      if(isWaterForBoat(nx, ny)){ bo.x = nx; bo.y = ny; }
      else { bo.state='idle'; bo.target=null; }
    }
  }
}
function boatGoTo(bo, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  const isLand = terrain[ty][tx].t !== 'water';
  if(isLand){
    const water = findNearestWaterToLand(tx, ty);
    if(!water) return;
    bo.target = { x: water.x*TS+TS/2, y: water.y*TS+TS/2, landTx: tx, landTy: ty };
  } else bo.target = { x: tx*TS+TS/2, y: ty*TS+TS/2 };
  bo.state = 'sailing';
  bo.autoLockT = 20;
}
function findNearestWaterToLand(tx, ty){
  for(let r=1;r<=6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=tx+dx, y=ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water') return {x, y};
  }
  return null;
}
function findNearestLandNearBoat(bo){
  const btx = Math.floor(bo.x/TS), bty = Math.floor(bo.y/TS);
  for(let r=1;r<=5;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=btx+dx, y=bty+dy;
    if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
    if(terrain[y][x].t !== 'water' && terrain[y][x].t !== 'mountain' && !(bridgeGrid[y] && bridgeGrid[y][x])) return {x, y};
  }
  return null;
}
function boardWorker(bo, u){
  if(bo.passengers.length >= 4 || u.inBoat || u.inHeli || u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inBoat = bo; bo.passengers.push(u);
  return true;
}
function unloadPassengers(bo, targetTx, targetTy){
  const land = findNearestLandNearBoat(bo) || {x:targetTx, y:targetTy};
  for(const u of bo.passengers){
    u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
    u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    u.inBoat = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  bo.passengers = [];
}
function findNearestWalkable(px,py){
  const btx = Math.floor(px/TS), bty = Math.floor(py/TS);
  if(isWalkableTile(btx,bty)) return {x:btx, y:bty};
  for(let r=1;r<=8;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;
    const x=btx+dx, y=bty+dy;
    if(isWalkableTile(x,y)) return {x,y};
  }
  return null;
}
function boardHeli(h, u){
  if(h.passengers.length >= 3 || u.inBoat || u.inHeli || u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inHeli = h; h.passengers.push(u);
  return true;
}
function pickUpForHeli(h){
  if(h.passengers.length >= 3) return;
  for(const u of G.units){
    if(u.robot || u.drone || u.flying || u.inBoat || u.inHeli) continue;
    if(u.soldierType) continue;
    if(u.state !== 'idle' || u.manual) continue;
    if(Math.hypot(u.x - h.x, u.y - h.y) < TS*5){ boardHeli(h, u); if(h.passengers.length >= 3) break; }
  }
}
function unloadHeliPassengers(h){
  const land = findNearestWalkable(h.x, h.y);
  for(const u of h.passengers){
    if(land){ u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14; u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14; }
    u.inHeli = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  h.passengers = [];
}
function updateHeli(h, dt){
  if(h.autoLockT > 0) h.autoLockT -= dt;
  if(h.state === 'idle' && h.autoLockT <= 0){
    h.pickupT = (h.pickupT || 0) - dt;
    if(h.passengers.length === 0){ if(h.pickupT <= 0){ h.pickupT = 2; pickUpForHeli(h); } }
    else {
      const dest = findBoatDestination(h);
      if(dest){ h.target = {x: dest.landTx*TS+TS/2, y: dest.landTy*TS+TS/2}; h.state = 'sailing'; }
    }
  }
  if(h.state === 'sailing' && h.target){
    const dx = h.target.x - h.x, dy = h.target.y - h.y;
    const d = Math.hypot(dx,dy);
    if(d < 6){
      h.x = h.target.x; h.y = h.target.y;
      h.target = null; h.state = 'idle';
      if(h.passengers.length > 0) unloadHeliPassengers(h);
    } else {
      const step = Math.min(d, h.speed*dt);
      h.x += dx/d*step; h.y += dy/d*step;
    }
  }
}
function heliGoTo(h, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  h.target = { x: wx, y: wy };
  h.state = 'sailing';
  h.autoLockT = 20;
}

// =================== ENERGY ===================
function solarOutput(){
  const t = G.dayTime;
  if(t < 0.25 || t > 0.75) return 0;
  if(t < 0.35) return (t - 0.25) / 0.1;
  if(t > 0.65) return (0.75 - t) / 0.1;
  return 1;
}
function updateEnergy(dt){
  let produced = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const def = b.def;
    if(!def.powerOutput) continue;
    let out = def.powerOutput;
    if(def.workers) out *= (b.workers.length / def.workers);
    if(def.fuel){
      const need = def.fuelRate * dt;
      if(G.res[def.fuel] >= need) G.res[def.fuel] -= need;
      else out = 0;
    }
    if(def.dayOnly) out *= solarOutput();
    produced += out;
  }
  let available = produced;
  let totalDemand = 0, actualConsumed = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    const def = b.def;
    if(!def.powerUse){ b.hasPower = true; continue; }
    if(def.workers && b.workers.length === 0){ b.hasPower = false; continue; }
    totalDemand += def.powerUse;
    if(available >= def.powerUse){ available -= def.powerUse; b.hasPower = true; actualConsumed += def.powerUse; }
    else b.hasPower = false;
  }
  G.energy.produced = produced;
  G.energy.consumed = actualConsumed;
  G.energy.demand = totalDemand;
  G.energy.efficiency = totalDemand > 0 ? Math.min(1, produced / totalDemand) : 1;
}
function currentForgeState(){
  const activeForges = G.buildings.filter(b => b.type === 'forge' && b.workers.length > 0 && b.constructionT <= 0);
  let coalUse = 0;
  for(const f of activeForges) coalUse += 0.05 * f.workers.length;
  const active = coalUse > 0 && G.res.coal >= coalUse * 0.5;
  return { coalUse, active, bonus: active ? (1 + activeForges.length * 0.15) : 1 };
}
function currentOfficeBoost(){
  const libs = G.buildings.filter(b => b.type === 'library' && b.workers.length > 0 && b.constructionT <= 0).length;
  return Math.min(1.6, 1 + 0.2 * libs);
}
function farmBoost(b){
  let boost = 1;
  for(const w of G.buildings){
    if(w.type !== 'windmill' || w.constructionT > 0) continue;
    if(Math.hypot(w.tx - b.tx, w.ty - b.ty) <= 5) boost += 0.25;
  }
  return Math.min(boost, 2);
}
function updateRates(dt){
  G.rateTimer += dt;
  if(G.rateTimer < 0.5) return;
  G.rateTimer = 0;
  G.rateHistory.push({t: G.time, res: {...G.res}});
  if(G.rateHistory.length > 20) G.rateHistory.shift();
  if(G.rateHistory.length < 2) return;
  const first = G.rateHistory[0], last = G.rateHistory[G.rateHistory.length-1];
  const span = last.t - first.t;
  if(span < 1) return;
  for(const k in G.res) G.rates[k] = (last.res[k] - first.res[k]) / span;
}
function computeNeeds(){
  const pop = countHumans() + countSoldiers();
  const capP = popCap();
  let food = 100;
  if(G.res.food < 3) food = 0;
  else if(G.res.food < 15) food = 40;
  else if(G.rates.food < -0.05 && G.res.food < 80) food = 60;
  let housing = 100;
  if(capP > 0 && pop >= capP) housing = Math.max(20, 100 - (pop - capP) * 10);
  else if(capP === 0) housing = 30;
  let rec = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type === 'park') rec += 8;
    else if(b.type === 'fountain') rec += 20;
    else if(b.type === 'theater') rec += 15 * b.workers.length;
    else if(b.type === 'tavern') rec += 10 * b.workers.length;
    else if(b.type === 'bathhouse') rec += 10 * b.workers.length;
  }
  rec = Math.min(100, rec);
  let faith = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type === 'temple') faith += 25;
    else if(b.type === 'monument') faith += 20;
    else if(b.type === 'fountain') faith += 5;
    else if(b.type === 'library') faith += 10 * b.workers.length;
    else if(b.type === 'school') faith += 8 * b.workers.length;
    else if(b.type === 'observatory') faith += 8 * b.workers.length;
  }
  faith = Math.min(100, faith);
  const offices = G.buildings.filter(b=>b.type==='office' && b.constructionT<=0).length;
  const mines = G.buildings.filter(b=>(b.type==='mine'||b.type==='drill'||b.type==='quarry'||b.type==='electricMine') && b.constructionT<=0).length;
  const avg = (food + housing + rec + faith) / 4;
  const total = clamp(avg - offices*3 - mines*1, 0, 100);
  return {food, housing, recreation: rec, faith, total};
}
function buildingRate(b, forgeBonus){
  const r = {};
  const def = b.def;
  if(!def) return r;
  if(b.constructionT > 0) return r;
  if(def.powerUse && !b.hasPower) return r;
  if(forgeBonus === undefined) forgeBonus = currentForgeState().bonus;
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;
  if(def.auto){
    if(b.type === 'drill' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.03 : res==='uraniumOre'?0.02 : res==='ironOre'?0.1 : res==='copperOre'?0.1 : res==='coal'?0.16 : 0.2;
      r[res] = (r[res]||0) + rate * forgeBonus;
    } else if(b.type === 'algae') r.food = (r.food||0) + 0.4;
    else if(b.type === 'windTurbine' || b.type === 'waterWheel' || b.type === 'solarPanel') return r;
    else if(b.type === 'woodBurner'){ r.wood = -0.5; return r; }
    return r;
  }
  if(!def.workers) return r;
  const w = b.workers.length;
  if(w === 0) return r;
  if(b.type === 'mine' && b.deposit){
    const res = DEPOSITS[b.deposit];
    const rate = res==='goldOre'?0.04 : res==='uraniumOre'?0.025 : res==='ironOre'?0.14 : res==='copperOre'?0.12 : res==='coal'?0.22 : 0.28;
    r[res] = (r[res]||0) + rate * w * forgeBonus;
  } else if(b.type === 'electricMine' && b.deposit){
    const res = DEPOSITS[b.deposit];
    const rate = res==='goldOre'?0.08 : res==='uraniumOre'?0.05 : res==='ironOre'?0.28 : res==='copperOre'?0.24 : res==='coal'?0.44 : 0.56;
    r[res] = (r[res]||0) + rate * w * forgeBonus;
  } else if(b.type === 'farm') r.food = (r.food||0) + 0.35*w*farmBoost(b)*seasonMul*weatherMul;
  else if(b.type === 'electricFarm') r.food = (r.food||0) + 0.7*w*farmBoost(b)*seasonMul*weatherMul;
  else if(b.type === 'grove') r.wood = (r.wood||0) + 0.32*w;
  else if(b.type === 'lumberjack'){
    let near = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = b.tx+dx, ny = b.ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && n.type==='tree' && n.amount > 0) near++;
    }
    r.wood = (r.wood||0) + 0.06*w*Math.min(near, 12);
  } else if(b.type === 'sawmill'){ r.wood = (r.wood||0) - 0.25*w; r.planks = (r.planks||0) + 0.2*w; }
  else if(b.type === 'quarry'){
    let near = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = b.tx+dx, ny = b.ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
    }
    r.stone = (r.stone||0) + 0.05*w*Math.min(near, 10)*forgeBonus;
  } else if(b.type === 'stonemason'){ r.stone = (r.stone||0) - 0.25*w; r.stoneBlocks = (r.stoneBlocks||0) + 0.18*w; }
  else if(b.type === 'ironSmelter'){
    const ore = 0.15*w, coal = 0.1*w;
    if(G.res.ironOre >= ore && G.res.coal >= coal){ r.ironOre = -ore; r.coal = (r.coal||0) - coal; r.ironIngot = (r.ironIngot||0) + 0.1*w; }
  } else if(b.type === 'electricSmelter'){
    const ore = 0.3*w, coal = 0.2*w;
    if(G.res.ironOre >= ore && G.res.coal >= coal){ r.ironOre = -ore; r.coal = (r.coal||0) - coal; r.ironIngot = (r.ironIngot||0) + 0.2*w; }
  } else if(b.type === 'copperSmelter'){
    const ore = 0.15*w, coal = 0.1*w;
    if(G.res.copperOre >= ore && G.res.coal >= coal){ r.copperOre = -ore; r.coal = (r.coal||0) - coal; r.copperIngot = (r.copperIngot||0) + 0.1*w; }
  } else if(b.type === 'goldSmelter'){
    const ore = 0.08*w, coal = 0.1*w;
    if(G.res.goldOre >= ore && G.res.coal >= coal){ r.goldOre = -ore; r.coal = (r.coal||0) - coal; r.goldIngot = (r.goldIngot||0) + 0.06*w; }
  } else if(b.type === 'centrifuge'){
    const ore = 0.1*w;
    if(G.res.uraniumOre >= ore){ r.uraniumOre = -ore; r.uranium = (r.uranium||0) + 0.05*w; }
  } else if(b.type === 'fisherman') r.food = (r.food||0) + 0.4*w;
  else if(b.type === 'bakery'){
    const need = 0.15*w;
    if(G.res.wood >= need){ r.wood = (r.wood||0) - need; r.food = (r.food||0) + 0.6*w; }
  } else if(b.type === 'workshop'){
    const iron = 0.1*w, copper = 0.05*w;
    if(G.res.ironIngot >= iron && G.res.copperIngot >= copper){ r.ironIngot = -iron; r.copperIngot = -copper; r.gears = (r.gears||0) + 0.08*w; }
  } else if(b.type === 'factory'){
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if(robots > 0){
      const copper = 0.1*robots, gears = 0.05*robots;
      if(G.res.copperIngot >= copper && G.res.gears >= gears){ r.copperIngot = -copper; r.gears = (r.gears||0) - gears; r.circuits = (r.circuits||0) + 0.05*robots; }
    }
  } else if(b.type === 'electricFactory'){
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if(robots > 0){
      const copper = 0.2*robots, gears = 0.1*robots;
      if(G.res.copperIngot >= copper && G.res.gears >= gears){ r.copperIngot = -copper; r.gears = (r.gears||0) - gears; r.circuits = (r.circuits||0) + 0.1*robots; }
    }
  } else if(b.type === 'forge') r.coal = (r.coal||0) - 0.05*w;
  else if(b.type === 'tavern') r.food = (r.food||0) - 0.15*w;
  else if(b.type === 'bathhouse') r.wood = (r.wood||0) - 0.1*w;
  else if(b.type === 'office') r.goldIngot = (r.goldIngot||0) + 0.08*w*currentOfficeBoost();
  return r;
}
function buildingResourceStatus(b){
  if(!b.def || !b.def.workers) return null;
  if(b.constructionT > 0) return null;
  if(b.def.powerUse && !b.hasPower) return {res:'⚡', needed:0};
  const w = b.workers.length;
  if(w === 0) return null;
  if(b.type === 'bakery'){ const need = 0.15*w; if(G.res.wood < need) return {res:'wood', needed:need}; }
  else if(b.type === 'tavern'){ const need = 0.15*w; if(G.res.food < need) return {res:'food', needed:need}; }
  else if(b.type === 'bathhouse'){ const need = 0.1*w; if(G.res.wood < need) return {res:'wood', needed:need}; }
  else if(b.type === 'ironSmelter'){ if(G.res.ironOre < 0.15*w || G.res.coal < 0.1*w) return {res:'ironOre/coal', needed:0.15*w}; }
  else if(b.type === 'electricSmelter'){ if(G.res.ironOre < 0.3*w || G.res.coal < 0.2*w) return {res:'ironOre/coal', needed:0.3*w}; }
  else if(b.type === 'copperSmelter'){ if(G.res.copperOre < 0.15*w || G.res.coal < 0.1*w) return {res:'copperOre/coal', needed:0.15*w}; }
  else if(b.type === 'goldSmelter'){ if(G.res.goldOre < 0.08*w || G.res.coal < 0.1*w) return {res:'goldOre/coal', needed:0.08*w}; }
  else if(b.type === 'centrifuge'){ if(G.res.uraniumOre < 0.1*w) return {res:'uraniumOre', needed:0.1*w}; }
  else if(b.type === 'sawmill'){ if(G.res.wood < 0.25*w) return {res:'wood', needed:0.25*w}; }
  else if(b.type === 'stonemason'){ if(G.res.stone < 0.25*w) return {res:'stone', needed:0.25*w}; }
  else if(b.type === 'workshop'){ if(G.res.ironIngot < 0.1*w || G.res.copperIngot < 0.05*w) return {res:'ironIngot/copperIngot', needed:0.1*w}; }
  else if(b.type === 'forge'){ const fs = currentForgeState(); if(!fs.active) return {res:'coal', needed:0.05*w}; }
  return null;
}

// =================== GOBLIN AI ===================
function updateGoblinBaseAI(eb, dt){
  if(!eb.hp || eb.hp <= 0) return;
  eb.buildTimer = (eb.buildTimer || 0) + dt;
  eb.waveTimer = (eb.waveTimer || 0) + dt;
  eb.level = eb.level || 1;
  const raiderInterval = Math.max(20, 40 - eb.level * 3);
  if(eb.waveTimer >= raiderInterval){ eb.waveTimer = 0; spawnGoblinRaid(eb, 2 + eb.level); }
  if(eb.buildTimer >= 15){
    eb.buildTimer = 0;
    tryGoblinBuild(eb);
    eb.level = Math.min(8, 1 + Math.floor(G.time / 180));
  }
}
function spawnGoblinRaid(eb, count){
  const points = getSpawnPoints();
  const spawnPoints = points.length ? points : [{x: eb.x, y: eb.y}];
  for(let i=0;i<count;i++){
    const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
    let type = 'grunt';
    const r = Math.random();
    if(eb.level >= 3 && r > 0.8) type = 'brute';
    else if(eb.level >= 2 && r > 0.55) type = 'archer';
    const e = new Enemy(sp.x + (Math.random()-0.5)*30, sp.y + (Math.random()-0.5)*30, type);
    e.hp *= (1 + eb.level * 0.08); e.maxHp = e.hp;
    G.enemies.push(e);
  }
  pushLog(`Гоблины идут в атаку! (${count})`, 'danger');
  SND.goblinBuild();
}
function tryGoblinBuild(eb){
  const btx = Math.floor(eb.x / TS), bty = Math.floor(eb.y / TS);
  const types = ['goblinTurret', 'goblinBarracks'];
  if(Math.random() < 0.3) types.push('goblinWall');
  if(Math.random() < 0.15) types.push('goblinBridge');
  const type = types[Math.floor(Math.random() * types.length)];
  for(let attempt = 0; attempt < 20; attempt++){
    const r = 2 + Math.floor(Math.random() * 5);
    const ang = Math.random() * Math.PI * 2;
    const tx = btx + Math.round(Math.cos(ang) * r), ty = bty + Math.round(Math.sin(ang) * r);
    if(tx < 1 || ty < 1 || tx >= MW-1 || ty >= MH-1) continue;
    const t = terrain[ty][tx].t;
    if(type === 'goblinBridge'){ if(t !== 'water' || bridgeGrid[ty][tx]) continue; }
    else {
      if(t === 'water' || t === 'mountain') continue;
      let occupied = false;
      for(const b of G.buildings) if(b.tx === tx && b.ty === ty){ occupied = true; break; }
      if(!occupied) for(const gb of G.goblinBuildings) if(gb.tx === tx && gb.ty === ty){ occupied = true; break; }
      if(occupied) continue;
    }
    const gbd = GOBLIN_BUILDINGS[type];
    const gb = { type, def: gbd, tx, ty, px: tx*TS+TS/2, py: ty*TS+TS/2, hp: gbd.hp, maxHp: gbd.hp, attackT: 0, spawnT: 0 };
    G.goblinBuildings.push(gb);
    if(type === 'goblinBridge'){ bridgeGrid[ty][tx] = true; computeIslands(); }
    if(type === 'goblinWall') rebuildWallGrid();
    SND.goblinBuild();
    pushLog(`Гоблины строят: ${gbd.name}`, 'warn');
    return;
  }
}
function updateGoblinBuilding(gb, dt){
  if(gb.hp <= 0) return;
  const def = gb.def;
  if(gb.type === 'goblinTurret'){
    gb.attackT = (gb.attackT || 0) - dt;
    if(gb.attackT > 0) return;
    let best = null, bestD = def.range * TS;
    for(const u of G.units){
      if(u.inBoat || u.inHeli) continue;
      const d = Math.hypot(u.x - gb.px, u.y - gb.py);
      if(d < bestD){ bestD = d; best = u; }
    }
    if(best){ gb.attackT = def.cooldown; spawnProjectile(gb.px, gb.py - 8, best, def.damage, def.attackType, false); }
  } else if(gb.type === 'goblinBarracks'){
    gb.spawnT = (gb.spawnT || 0) + dt;
    if(gb.spawnT >= def.spawnRate){
      gb.spawnT = 0;
      const nearbyEnemies = G.enemies.filter(e => Math.hypot(e.x - gb.px, e.y - gb.py) < 10*TS).length;
      if(nearbyEnemies < 5){
        const ang = Math.random() * 6.28;
        const ex = gb.px + Math.cos(ang) * 40, ey = gb.py + Math.sin(ang) * 40;
        if(isWalkableTile(Math.floor(ex/TS), Math.floor(ey/TS))){
          const type = Math.random() < 0.7 ? 'grunt' : 'archer';
          G.enemies.push(new Enemy(ex, ey, type));
        }
      }
    }
  }
}
function updateEnemyBase(eb, dt){
  if(eb.hp <= 0){ const idx = G.enemyBases.indexOf(eb); if(idx >= 0) G.enemyBases.splice(idx, 1); return; }
  if(G.mode === 'experimental'){ updateGoblinBaseAI(eb, dt); return; }
  eb.spawnT = (eb.spawnT || 0) + dt;
  if(eb.spawnT >= eb.spawnRate){
    eb.spawnT = 0;
    if(G.enemies.length < eb.maxEnemies){
      const ang = Math.random() * 6.28;
      const r = TS * 2;
      const ex = eb.x + Math.cos(ang) * r, ey = eb.y + Math.sin(ang) * r;
      if(isWalkableTile(Math.floor(ex/TS), Math.floor(ey/TS))){
        const type = Math.random() < 0.7 ? 'grunt' : (Math.random() < 0.6 ? 'archer' : 'brute');
        G.enemies.push(new Enemy(ex, ey, type));
      }
    }
  }
}

function updateWaves(dt){
  if(G.mode !== 'waves' || G.gameOver || G.wavePause) return;
  G.waveTimer -= dt;
  if(G.waveTimer <= 0){
    G.wave++;
    spawnWave(G.wave);
    G.waveTimer = Math.max(25, 70 - G.wave * 3);
    pushLog(`Волна ${G.wave}!`, 'danger');
    toast(`⚔ Волна ${G.wave}!`);
    SND.waveStart();
    updateWaveHud();
  }
}
function startWaveNow(){ if(G.mode !== 'waves' || G.wavePause) return; G.waveTimer = 0; }
function spawnWave(waveNum){
  const count = Math.min(3 + Math.floor(waveNum * 1.4), 40);
  const hpMult = 1 + waveNum * 0.12;
  const atkMult = 1 + waveNum * 0.08;
  const spawnPoints = getSpawnPoints();
  if(!spawnPoints.length) return;
  for(let i = 0; i < count; i++){
    const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
    let type = 'grunt';
    const roll = Math.random();
    if(waveNum >= 3 && roll > 0.85) type = 'brute';
    else if(waveNum >= 2 && roll > 0.60) type = 'archer';
    else if(waveNum >= 6 && roll > 0.90) type = 'shaman';
    else if(waveNum >= 10 && roll > 0.95) type = 'warlord';
    let ex = sp.x + (Math.random()-0.5)*20;
    let ey = sp.y + (Math.random()-0.5)*20;
    if(!isWalkableTile(Math.floor(ex/TS), Math.floor(ey/TS))){ ex = sp.x; ey = sp.y; }
    const e = new Enemy(ex, ey, type);
    e.hp *= hpMult; e.maxHp = e.hp; e.atk *= atkMult;
    G.enemies.push(e);
  }
}
// FIX: fallback for island maps
function getSpawnPoints(){
  if(!G.playerStart) return [];
  const island = islandId[Math.floor(G.playerStart.py/TS)][Math.floor(G.playerStart.px/TS)];
  const pts = [];
  const margin = 3;
  for(let x = margin; x < MW - margin; x++){
    for(const y of [margin, MH - margin - 1]){
      if(islandId[y][x] === island && isWalkableTile(x, y)) pts.push({ x: x*TS + TS/2, y: y*TS + TS/2 });
    }
  }
  for(let y = margin; y < MH - margin; y++){
    for(const x of [margin, MW - margin - 1]){
      if(islandId[y][x] === island && isWalkableTile(x, y)) pts.push({ x: x*TS + TS/2, y: y*TS + TS/2 });
    }
  }
  if(pts.length === 0){
    const psx = G.playerStart.tx, psy = G.playerStart.ty;
    const minDist = Math.max(15, Math.min(MW, MH) * 0.3);
    const step = Math.max(1, Math.floor(Math.max(MW, MH) / 60));
    for(let y = margin; y < MH - margin; y += step){
      for(let x = margin; x < MW - margin; x += step){
        if(!isWalkableTile(x, y)) continue;
        if(terrain[y][x].t !== 'grass') continue;
        const d = Math.hypot(x - psx, y - psy);
        if(d < minDist) continue;
        pts.push({ x: x*TS + TS/2, y: y*TS + TS/2 });
      }
    }
  }
  return pts;
}

function triggerVictory(msg){

  G.gameOver = true;
  SND.victory();
  const modal = document.getElementById('gameovermodal');

function triggerRandomEvent(){

      }
    } else { addRes('goldIngot', 5); pushLog('Торговец оставил 5 золота', 'good'); SND.notify(); }
  }
}
function triggerCaravan(){
  const resKeys = Object.keys(RES_BASE_VALUE).filter(k => k !== 'goldIngot');
  const offers = [];
  const usedGive = new Set(), usedGet = new Set();
  let tries = 0;
  while(offers.length < 3 && tries < 100){
    tries++;
    const giveRes = resKeys[Math.floor(Math.random() * resKeys.length)];
    if(usedGive.has(giveRes)) continue;
    let getRes = resKeys[Math.floor(Math.random() * resKeys.length)];
    if(getRes === giveRes) continue;
    if(Math.random() < 0.5) getRes = 'goldIngot';
    if(getRes !== 'goldIngot' && usedGet.has(getRes)) continue;
    usedGive.add(giveRes);
    if(getRes !== 'goldIngot') usedGet.add(getRes);
    const giveVal = 30 + Math.random() * 60;
    const giveAmt = Math.max(1, Math.floor(giveVal / RES_BASE_VALUE[giveRes]));
    const getVal = giveVal * (0.85 + Math.random() * 0.4);
    const getAmt = Math.max(1, Math.floor(getVal / RES_BASE_VALUE[getRes]));
    offers.push({
      give: {[giveRes]: giveAmt},
      get: {[getRes]: getAmt},
      label: `Обменять ${giveAmt} ${RES_NAMES[giveRes]} на ${getAmt} ${RES_NAMES[getRes]}`
    });
  }
  window.currentCaravanOffers = offers;
  const ov = document.getElementById('overlay');
  ov.classList.add('open');
  let html = `<div class="menu-box"><h2>🚚 Караван</h2><p style="color:#d8e2f0;font-size:13px;margin-bottom:14px">Странствующий торговец предлагает крупные партии:</p>`;
  for(let i=0; i<offers.length; i++){
    const o = offers[i];
    const can = Object.keys(o.give).every(k => (G.res[k]||0) >= o.give[k]);
    html += `<button ${can ? '' : 'style="opacity:0.5"'} onclick="acceptCaravan(${i})">${o.label}</button>`;
  }
  html += `<button class="back-btn" onclick="closeCaravan()">✕ Отказаться</button></div>`;
  ov.innerHTML = html;
  applyUIScale(); SND.caravan();
}
window.acceptCaravan = (index) => {
  const offers = window.currentCaravanOffers;
  if(!offers || !offers[index]) return;
  const o = offers[index];
  const can = Object.keys(o.give).every(k => (G.res[k]||0) >= o.give[k]);
  if(!can){ toast('Не хватает ресурсов'); SND.error(); return; }
  for(const k in o.give) G.res[k] -= o.give[k];
  for(const k in o.get) addRes(k, o.get[k]);
  G.totalTrades++;
  pushLog(`Караван: ${o.label}`, 'good');
  toast('Сделка заключена!'); SND.place();
  closeCaravan();
};
window.closeCaravan = () => { document.getElementById('overlay').classList.remove('open'); document.getElementById('overlay').innerHTML = ''; window.currentCaravanOffers = null; };
function spawnParticle(x, y, color, opts){

  if(G.particles.length > 120) G.particles.shift();
}
function updateParticles(dt){
  if(!SETTINGS.particles){ G.particles = []; return; }
  G.particleTimer += dt;
  if(G.particleTimer > 0.35){
    G.particleTimer = 0;
    for(const b of G.buildings){
      if(b.constructionT > 0) continue;
      if(b.type === 'forge' || b.type === 'coalPlant' || b.type === 'coalSteamPlant' || b.type === 'ironSmelter' || b.type === 'copperSmelter' || b.type === 'goldSmelter')
        spawnParticle(b.px + (Math.random()-0.5)*10, b.py - 12, 'rgba(120,120,130,0.6)', {life:2, size:4, speed:15});
      else if(b.type === 'factory' || b.type === 'electricFactory')
        spawnParticle(b.px + (Math.random()-0.5)*14, b.py - 16, 'rgba(120,120,130,0.6)', {life:2.2, size:5, speed:12});
      else if(b.type === 'nuclearPlant')
        spawnParticle(b.px, b.py - 20, 'rgba(120,255,150,0.5)', {life:2.5, size:4, speed:10});
    }
  }
  for(let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 10 * dt; p.life -= dt;
    if(p.life <= 0) G.particles.splice(i, 1);
  }
}
function updateTime(dt){
  G.dayTime += dt / DAY_LENGTH;
  if(G.dayTime >= 1){
    G.dayTime -= 1; G.day++;
    if((G.day-1) % DAYS_PER_SEASON === 0 && G.day > 1){
      const idx = SEASONS.indexOf(G.season);
      G.prevSeason = G.season; G.season = SEASONS[(idx+1) % SEASONS.length];
      G.seasonBlend = 0; G.lastSeasonStep = -1;
      pushLog(`Наступила ${SEASON_NAMES[G.season].toLowerCase()}`, 'info');
      toast(SEASON_NAMES[G.season]); SND.season();
      if(G.season === 'spring') G.year++;
    }
  }
  if(G.seasonBlend < 1){
    G.seasonBlend += dt / 15;
    if(G.seasonBlend > 1) G.seasonBlend = 1;
    const step = Math.floor(G.seasonBlend * 20);
    if(step !== G.lastSeasonStep){ G.lastSeasonStep = step; terrainDirty = true; }
  }
}
function getNightAlpha(){
  const t = G.dayTime;
  const dawn = SEASON_NIGHT_DAWN[G.season] || 0.25;
  const dusk = SEASON_NIGHT_DUSK[G.season] || 0.75;
  if(t < dawn){
    if(t < dawn * 0.4) return 0.6;
    return 0.6 * (1 - (t - dawn*0.4) / (dawn*0.6));
  }
  if(t > dusk){ return 0.6 * Math.min(1, (t - dusk) / ((1 - dusk) * 0.6)); }
  return 0;
}

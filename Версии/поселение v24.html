function runProduction(pdt){
  const forge = currentForgeState();
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;
  for(const b of G.buildings){
    const def = b.def;
    if(!def) continue;
    if(b.constructionT > 0) continue;
    if(def.powerUse && !b.hasPower) continue;
    if(def.auto){
      if(b.type === 'drill' && b.deposit){
        const res = DEPOSITS[b.deposit];
        const rate = res==='goldOre'?0.03 : res==='uraniumOre'?0.02 : res==='ironOre'?0.1 : res==='copperOre'?0.1 : res==='coal'?0.16 : 0.2;
        addRes(res, rate*pdt*forge.bonus);
      } else if(b.type === 'algae') addRes('food', 0.4*pdt);
      else if(b.type === 'droneHub'){
        b.spawnT = (b.spawnT || 0) + pdt;
        if(b.spawnT >= def.spawnRate){
          b.spawnT = 0;
          const myDrones = G.units.filter(u => u.drone && !u.isRepairDrone && u.hub === b).length;
          if(myDrones < def.maxDrones && G.res.ironIngot >= 25 && G.res.circuits >= 10){
            G.res.ironIngot -= 25; G.res.circuits -= 10;
            const u = new Unit(b.px + (Math.random()-0.5)*30, b.py + (Math.random()-0.5)*30, true);
            u.drone = true; u.speed = 110; u.hub = b;
            G.units.push(u);
            pushLog('Дрон-хаб собрал дрона', 'good'); SND.notify();
          }
        }
      } else if(b.type === 'robotAssembler'){
        b.spawnT = (b.spawnT || 0) + pdt;
        if(b.spawnT >= def.spawnRate){
          b.spawnT = 0;
          const myRobots = G.units.filter(u => u.robot && !u.drone && u.hub === b).length;
          if(myRobots < def.maxRobots && G.res.ironIngot >= 20 && G.res.goldIngot >= 5){
            G.res.ironIngot -= 20; G.res.goldIngot -= 5;
            const u = new Unit(b.px + (Math.random()-0.5)*30, b.py + (Math.random()-0.5)*30, true);
            u.hub = b; G.units.push(u);
            pushLog('Сборочный цех собрал робота', 'good'); SND.notify();
          }
        }
      } else if(b.def.unitType){
        b.spawnT = (b.spawnT || 0) + pdt;
        if(b.spawnT >= def.spawnRate){
          b.spawnT = 0;
          const unitType = def.unitType;
          const maxUnits = def.maxUnits || def.maxDrones || 3;
          if(unitType === 'repairDrone'){
            const myDrones = G.units.filter(u => u.isRepairDrone && u.hub === b).length;
            if(myDrones < maxUnits && G.res.ironIngot >= 20 && G.res.circuits >= 10){
              G.res.ironIngot -= 20; G.res.circuits -= 10;
              const u = new Unit(b.px + (Math.random()-0.5)*30, b.py + (Math.random()-0.5)*30, true);
              u.drone = true; u.isRepairDrone = true; u.speed = 90; u.hub = b;
              G.units.push(u);
              pushLog('Дрон-ремонтник создан', 'good'); SND.notify();
            }
          } else if(SOLDIER_TYPES[unitType]){
            const mySoldiers = G.units.filter(u => u.barracks === b && u.soldierType === unitType).length;
            if(mySoldiers < maxUnits){
              let sx = b.px + (Math.random()-0.5)*30, sy = b.py + TS * 1.5 + (Math.random()-0.5)*20;
              if(!isWalkableTile(Math.floor(sx/TS), Math.floor(sy/TS))){
                const safe = findNearestWalkable(sx, sy);
                if(safe){ sx = safe.x*TS+TS/2; sy = safe.y*TS+TS/2; }
                else { sx = b.px; sy = b.py + TS; }
              }
              if(isWalkableTile(Math.floor(sx/TS), Math.floor(sy/TS))){
                const u = new Unit(sx, sy, false);
                u.setSoldier(unitType); u.barracks = b; u.state = 'idle'; u.idleT = 1;
                G.units.push(u);
                pushLog(`Тренирован: ${SOLDIER_TYPES[unitType].name}`, 'good'); SND.notify();
              }
            }
          }
        }
      }
      continue;
    }
    if(!def.workers) continue;
    const w = b.workers.length;
    if(w === 0) continue;
    if(b.type === 'mine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.04 : res==='uraniumOre'?0.025 : res==='ironOre'?0.14 : res==='copperOre'?0.12 : res==='coal'?0.22 : 0.28;
      addRes(res, rate*w*pdt*forge.bonus);
    } else if(b.type === 'electricMine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='goldOre'?0.08 : res==='uraniumOre'?0.05 : res==='ironOre'?0.28 : res==='copperOre'?0.24 : res==='coal'?0.44 : 0.56;
      addRes(res, rate*w*pdt*forge.bonus);
    } else if(b.type === 'farm') addRes('food', 0.35*w*farmBoost(b)*seasonMul*weatherMul*pdt);
    else if(b.type === 'electricFarm') addRes('food', 0.7*w*farmBoost(b)*seasonMul*weatherMul*pdt);
    else if(b.type === 'grove') addRes('wood', 0.32*w*pdt);
    else if(b.type === 'lumberjack'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && n.type==='tree' && n.amount > 0) near++;
      }
      addRes('wood', 0.06*w*Math.min(near, 12)*pdt);
    } else if(b.type === 'sawmill'){
      const need = 0.25*w*pdt;
      if(G.res.wood >= need){ G.res.wood -= need; addRes('planks', 0.2*w*pdt); }
    } else if(b.type === 'quarry'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
      }
      addRes('stone', 0.05*w*Math.min(near, 10)*pdt*forge.bonus);
    } else if(b.type === 'stonemason'){
      const need = 0.25*w*pdt;
      if(G.res.stone >= need){ G.res.stone -= need; addRes('stoneBlocks', 0.18*w*pdt); }
    } else if(b.type === 'ironSmelter'){
      const ore = 0.15*w*pdt, coal = 0.1*w*pdt;
      if(G.res.ironOre >= ore && G.res.coal >= coal){ G.res.ironOre -= ore; G.res.coal -= coal; addRes('ironIngot', 0.1*w*pdt); }
    } else if(b.type === 'electricSmelter'){
      const ore = 0.3*w*pdt, coal = 0.2*w*pdt;
      if(G.res.ironOre >= ore && G.res.coal >= coal){ G.res.ironOre -= ore; G.res.coal -= coal; addRes('ironIngot', 0.2*w*pdt); }
    } else if(b.type === 'copperSmelter'){
      const ore = 0.15*w*pdt, coal = 0.1*w*pdt;
      if(G.res.copperOre >= ore && G.res.coal >= coal){ G.res.copperOre -= ore; G.res.coal -= coal; addRes('copperIngot', 0.1*w*pdt); }
    } else if(b.type === 'goldSmelter'){
      const ore = 0.08*w*pdt, coal = 0.1*w*pdt;
      if(G.res.goldOre >= ore && G.res.coal >= coal){ G.res.goldOre -= ore; G.res.coal -= coal; addRes('goldIngot', 0.06*w*pdt); }
    } else if(b.type === 'centrifuge'){
      const ore = 0.1*w*pdt;
      if(G.res.uraniumOre >= ore){ G.res.uraniumOre -= ore; addRes('uranium', 0.05*w*pdt); }
    } else if(b.type === 'fisherman') addRes('food', 0.4*w*pdt);
    else if(b.type === 'bakery'){
      const need = 0.15*w*pdt;
      if(G.res.wood >= need){ G.res.wood -= need; addRes('food', 0.6*w*pdt); }
    } else if(b.type === 'workshop'){
      const iron = 0.1*w*pdt, copper = 0.05*w*pdt;
      if(G.res.ironIngot >= iron && G.res.copperIngot >= copper){ G.res.ironIngot -= iron; G.res.copperIngot -= copper; addRes('gears', 0.08*w*pdt); }
    } else if(b.type === 'factory'){
      const robots = b.workers.filter(x => x.robot && !x.drone).length;
      if(robots > 0){
        const copper = 0.1*robots*pdt, gears = 0.05*robots*pdt;
        if(G.res.copperIngot >= copper && G.res.gears >= gears){ G.res.copperIngot -= copper; G.res.gears -= gears; addRes('circuits', 0.05*robots*pdt); }
      }
    } else if(b.type === 'electricFactory'){
      const robots = b.workers.filter(x => x.robot && !x.drone).length;
      if(robots > 0){
        const copper = 0.2*robots*pdt, gears = 0.1*robots*pdt;
        if(G.res.copperIngot >= copper && G.res.gears >= gears){ G.res.copperIngot -= copper; G.res.gears -= gears; addRes('circuits', 0.1*robots*pdt); }
      }
    } else if(b.type === 'office') addRes('goldIngot', 0.08*w*currentOfficeBoost()*pdt);
    else if(b.type === 'tavern'){ const need = 0.15*w*pdt; if(G.res.food >= need) G.res.food -= need; }
    else if(b.type === 'bathhouse'){ const need = 0.1*w*pdt; if(G.res.wood >= need) G.res.wood -= need; }
  }
  if(forge.active) G.res.coal = Math.max(0, G.res.coal - forge.coalUse * pdt);
}
function update(dt){
  G.time += dt;
  pathBudget = 8;
  logisticsHubs = G.buildings.filter(b => b.type === 'logisticsHub' && b.constructionT <= 0);
  updateTime(dt);
  if(G.weather){ G.weather.timer -= dt; if(G.weather.timer <= 0) G.weather = null; }
  G.eventTimer -= dt;
  if(G.eventTimer <= 0){ G.eventTimer = 90 + Math.random()*60; triggerRandomEvent(); }
  for(let i=G.regrow.length-1;i>=0;i--){
    const r = G.regrow[i]; r.t -= dt;
    if(r.t <= 0){ const n = nodes[r.ty][r.tx]; if(n && n.type === 'tree') n.amount = 3; G.regrow.splice(i,1); }
  }
  // Safe iteration (suicide units can splice themselves)
  for(let i = G.units.length - 1; i >= 0; i--) if(i < G.units.length) updateUnit(G.units[i], dt);
  for(const bo of G.boats) updateBoat(bo, dt);
  for(const h of G.helis) updateHeli(h, dt);
  updateEnemyFlowField(dt);
  for(let i = G.enemies.length - 1; i >= 0; i--) updateEnemy(G.enemies[i], dt);
  for(const eb of G.enemyBases) updateEnemyBase(eb, dt);
  for(const gb of G.goblinBuildings) updateGoblinBuilding(gb, dt);
  for(const b of G.buildings){
    if(b.constructionT > 0){
      b.constructionT -= dt;
      if(b.constructionT <= 0){
        b.constructionT = 0;
        pushLog(`Построено: ${b.def.name}`, 'good');
        if(G.sel === b) updateInfoUI();
        if(b.type && typeof b.type === 'string' && b.type.startsWith('walls_')) rebuildWallGrid();
        SND.buildComplete();
      }
    }
  }
  for(const b of G.buildings){ if(b.constructionT > 0) continue; if(b.def && b.def.range) updateTower(b, dt); }
  updateProjectiles(dt);
  updateEffects(dt);
  updateEnergy(dt);
  updateWaves(dt);
  updateWarRaids(dt);
  G.prodTimer = (G.prodTimer || 0) + dt;
  if(G.prodTimer >= 0.1){ const pdt = G.prodTimer; G.prodTimer = 0; runProduction(pdt); }
  let pop = countHumans() + countSoldiers();
  const activeObs = G.buildings.filter(b => b.type === 'observatory' && b.workers.length > 0 && b.constructionT<=0).length;
  if(pop > 0){
    let foodCons = pop * 0.028 * Math.max(0.5, 1 - activeObs * 0.1);
    G.res.food = Math.max(0, G.res.food - foodCons*dt);
  }
  const needs = computeNeeds();
  G.needs = needs; G.happiness = needs.total;
  G.growT += dt;
  const growthInterval = G.happiness >= 60 ? 12 : G.happiness >= 40 ? 18 : 30;
  if(G.growT > growthInterval){
    G.growT = 0;
    const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
    const capP = popCap(), humans = countHumans();
    if(humans < capP && G.res.food >= 15 && homes.length){
      G.res.food -= 10;
      const h = homes[Math.floor(Math.random()*homes.length)];
      G.units.push(new Unit(h.px + (Math.random()-0.5)*20, h.py + 20 + (Math.random()-0.5)*20, false));
      pushLog('Новый житель поселился', 'good'); SND.newcomer();
    }
  }
  updateRates(dt);
  G.statTimer += dt;
  if(G.statTimer > 2){
    G.statTimer = 0;
    G.stats.push({t:G.time, pop:countHumans(), food:G.res.food, wood:G.res.wood, stone:G.res.stone, gold:G.res.goldIngot, hap:G.happiness});
    if(G.stats.length > 300) G.stats.shift();
  }
  G.checkTimer = (G.checkTimer || 0) + dt;
  if(G.checkTimer > 0.5){ G.checkTimer = 0; updateQuests(); checkAchievements(); }
  if(G.infoT > 0){ G.infoT -= dt; if(G.infoT <= 0) infoEl.classList.remove('open'); }
}
function checkAchievements(){
  if(G.time < 3) return;
  for(const a of ACHIEVEMENTS){
    if(!G.achievements[a.id] && a.check()){
      G.achievements[a.id] = true;
      pushLog(`🏆 Достижение: ${a.name}`, 'good');
      toast(`🏆 Достижение: ${a.name}`);
      addRes('goldIngot', 25); SND.quest();
    }

}

// TERRAIN SCALE (for superHuge: cap cache at 8192)
const MAX_TCAN_DIM = 8192;
let terrainScale = 1;
function updateTerrainCanvasSize(){
  const wantW = MW * TS, wantH = MH * TS;
  const maxWant = Math.max(wantW, wantH);
  if(maxWant > MAX_TCAN_DIM){ terrainScale = MAX_TCAN_DIM / maxWant; }
  else { terrainScale = 1; }
  tcan.width = Math.floor(wantW * terrainScale);
  tcan.height = Math.floor(wantH * terrainScale);
}
const tcan = document.createElement('canvas');
tcan.width = MW*TS; tcan.height = MH*TS;
const tctx = tcan.getContext('2d');

function drawMountainTile(tctx2, x, y){
  const tw = TS * terrainScale, th = TS * terrainScale;
  const px = x*tw, py = y*th;
  const v = terrain[y][x].v;
  const arr = TCOL_BASE.mountain;
  tctx2.fillStyle = arr[Math.floor(v*arr.length) % arr.length];
  tctx2.fillRect(px, py, tw+1, th+1);
  tctx2.fillStyle = '#7a7a8a';
  tctx2.beginPath();
  tctx2.moveTo(px + tw/2, py + th*0.16);
  tctx2.lineTo(px + tw*0.88, py + th*0.91);
  tctx2.lineTo(px + tw*0.12, py + th*0.91);
  tctx2.closePath(); tctx2.fill();
  tctx2.fillStyle = '#d0d0e0';
  tctx2.beginPath();
  tctx2.moveTo(px + tw/2, py + th*0.16);
  tctx2.lineTo(px + tw*0.62, py + th*0.44);
  tctx2.lineTo(px + tw*0.38, py + th*0.44);
  tctx2.closePath(); tctx2.fill();
}
function renderTerrain(){
  updateTerrainCanvasSize();
  const tw = TS * terrainScale, th = TS * terrainScale;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const t = terrain[y][x];
    if(t.t === 'mountain'){ drawMountainTile(tctx, x, y); continue; }
    const arr = tilePalette(t.t);
    tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
    tctx.fillRect(x*tw, y*th, tw+1, th+1);
    if(roadGrid[y] && roadGrid[y][x]){
      tctx.fillStyle = '#6b6b6b'; tctx.fillRect(x*tw+tw*0.12, y*th+th*0.12, tw*0.76, th*0.76);
      tctx.fillStyle = '#7b7b7b'; tctx.fillRect(x*tw+tw*0.22, y*th+th*0.22, tw*0.56, th*0.56);
    }
  }
  tctx.strokeStyle = '#101820'; tctx.lineWidth = 8;
  tctx.strokeRect(0,0,tcan.width,tcan.height);
  renderMiniBg();
}
function redrawTile(tx,ty){
  const tw = TS * terrainScale, th = TS * terrainScale;
  const t = terrain[ty][tx];
  if(t.t === 'mountain'){ drawMountainTile(tctx, tx, ty); return; }
  const arr = tilePalette(t.t);
  tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
  tctx.fillRect(tx*tw, ty*th, tw+1, th+1);
}
function redrawRoad(tx,ty){
  redrawTile(tx,ty);
  const tw = TS * terrainScale, th = TS * terrainScale;
  tctx.fillStyle = '#6b6b6b'; tctx.fillRect(tx*tw+tw*0.12, ty*th+th*0.12, tw*0.76, th*0.76);
  tctx.fillStyle = '#7b7b7b'; tctx.fillRect(tx*tw+tw*0.22, ty*th+th*0.22, tw*0.56, th*0.56);
}
const miniBg = document.createElement('canvas');
const miniBgCtx = miniBg.getContext('2d');
function renderMiniBg(){
  miniBg.width = miniCan.width; miniBg.height = miniCan.height;
  const scaleX = miniBg.width / (MW*TS), scaleY = miniBg.height / (MH*TS);
  for(let py = 0; py < miniBg.height; py++){
    for(let px = 0; px < miniBg.width; px++){
      const tx = clamp(Math.floor(px / scaleX / TS), 0, MW-1);
      const ty = clamp(Math.floor(py / scaleY / TS), 0, MH-1);
      miniBgCtx.fillStyle = miniTileColor(terrain[ty][tx].t);
      miniBgCtx.fillRect(px, py, 1, 1);
    }
  }
  for(let y = 0; y < MH; y++) for(let x = 0; x < MW; x++){
    if(roadGrid[y][x]){
      miniBgCtx.fillStyle = '#8a8a8a';
      miniBgCtx.fillRect(x*TS*scaleX, y*TS*scaleY, Math.max(1, TS*scaleX), Math.max(1, TS*scaleY));
    }
  }
}
let lastMinimapDraw = 0;
function drawMinimap(){
  if(!SETTINGS.minimap) return;
  const now = performance.now();
  if(now - lastMinimapDraw < 100) return;
  lastMinimapDraw = now;
  const scaleX = miniCan.width / (MW*TS), scaleY = miniCan.height / (MH*TS);
  miniCtx.drawImage(miniBg, 0, 0);
  if(G.minimapMode === 'resources'){
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      const n = nodes[y][x]; if(!n) continue;
      let col = null;
      if(n.type==='tree') col = '#3a7d33'; else if(n.type==='rock') col = '#a8aeb5';
      else if(n.type==='stoneD') col = '#9aa0a6'; else if(n.type==='coalD') col = '#31313a';
      else if(n.type==='ironOreD') col = '#8b6555'; else if(n.type==='copperOreD') col = '#c97a3a';
      else if(n.type==='goldOreD') col = '#d4b13a'; else if(n.type==='uraniumOreD') col = '#6dd44a';
      if(col){ miniCtx.fillStyle = col; miniCtx.fillRect(x*TS*scaleX-0.5, y*TS*scaleY-0.5, 2, 2); }
    }
  }
  if(G.minimapMode === 'buildings' || G.minimapMode === 'normal'){
    for(const b of G.buildings){
      miniCtx.fillStyle = b.constructionT > 0 ? '#887755' :
        (b.type==='townHall'?'#ffd040':(b.type==='house'?'#e8d7b8':(isStorageType(b.type)?'#c0a25a':
        (b.def.powerOutput?'#4ad4d4':(b.def.powerUse?'#e04af0':
        (b.def.range?'#e08040':(b.type.startsWith('walls_')?'#808090':'#e6c341')))))));
      miniCtx.fillRect(b.tx*TS*scaleX-1, b.ty*TS*scaleY-1, 2.5, 2.5);
    }
    for(const gb of G.goblinBuildings){
      miniCtx.fillStyle = '#c04040'; miniCtx.fillRect(gb.tx*TS*scaleX-1.2, gb.ty*TS*scaleY-1.2, 2.5, 2.5);
    }
  }
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    miniCtx.fillStyle = u.soldierType ? (u.flying?'#ff60a0':'#ff9040') : (u.robot ? '#9a7ad0' : '#7fe08a');
    miniCtx.fillRect(u.x*scaleX-0.5, u.y*scaleY-0.5, 1.5, 1.5);
  }
  for(const e of G.enemies){ miniCtx.fillStyle = '#ff4040'; miniCtx.fillRect(e.x*scaleX-0.8, e.y*scaleY-0.8, 2, 2); }
  for(const eb of G.enemyBases){ miniCtx.fillStyle = '#ff2020'; miniCtx.fillRect(eb.x*scaleX-2, eb.y*scaleY-2, 4, 4); }
  for(const m of G.markers){ miniCtx.fillStyle = '#e6c341'; miniCtx.fillRect(m.x*scaleX-1, m.y*scaleY-1, 2, 2); }
  const vx = -ox / z * scaleX, vy = -oy / z * scaleY, vw = W / z * scaleX, vh = H / z * scaleY;
  miniCtx.strokeStyle = 'rgba(255,255,255,.85)'; miniCtx.lineWidth = 1;
  miniCtx.strokeRect(vx, vy, vw, vh);
}
miniCan.addEventListener('click', e => {
  const r = miniCan.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  cam.x = (px / r.width) * MW * TS; cam.y = (py / r.height) * MH * TS;
  clampCam();
});
miniCan.addEventListener('contextmenu', e => {
  e.preventDefault();
  const modes = ['normal', 'resources', 'buildings'];
  G.minimapMode = modes[(modes.indexOf(G.minimapMode)+1) % modes.length];
  toast('Миникарта: ' + {normal:'обычная', resources:'ресурсы', buildings:'здания'}[G.minimapMode]);
});

// [DRAWING FUNCTIONS — same as before, kept identical for brevity in comments]
function drawNode(n, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(n.type === 'tree'){
    if(n.amount <= 0){ ctx.fillStyle = '#5a3d1e'; ctx.beginPath(); ctx.arc(cx, cy+2, s*0.13, 0, 6.3); ctx.fill(); return; }
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.28, s*0.26, s*0.1, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#4a2f16'; ctx.fillRect(cx - s*0.045, cy + s*0.02, s*0.09, s*0.24);
    const tc = TREE_COLORS[G.season] || TREE_COLORS.summer;
    ctx.fillStyle = tc.main; ctx.beginPath(); ctx.arc(cx, cy - s*0.06, s*0.29, 0, 6.3); ctx.fill();
    ctx.fillStyle = tc.light; ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.03, s*0.19, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*0.14, cy + s*0.01, s*0.17, 0, 6.3); ctx.fill();
    return;
  }
  if(n.type === 'rock'){
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.22, s*0.25, s*0.09, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#8f959c'; ctx.beginPath(); ctx.arc(cx - s*0.09, cy + s*0.04, s*0.17, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8aeb5'; ctx.beginPath(); ctx.arc(cx + s*0.1, cy - s*0.02, s*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7c828a'; ctx.beginPath(); ctx.arc(cx + s*0.02, cy + s*0.12, s*0.13, 0, 6.3); ctx.fill();
    return;
  }
  const colMap = { stoneD:'#9aa0a6', coalD:'#31313a', ironOreD:'#8b6555', copperOreD:'#c97a3a', goldOreD:'#d4b13a', uraniumOreD:'#6dd44a' };
  const col = colMap[n.type] || '#888';
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.26, s*0.31, s*0.12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.06, s*0.16, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.11, cy + s*0.11, s*0.14, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.02, cy - s*0.08, s*0.17, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.arc(cx - s*0.02, cy - s*0.14, s*0.07, 0, 6.3); ctx.fill();
}
function drawGoblinBuilding(gb, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2, t = gb.type;
  if(t === 'goblinBridge'){
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(sx + s*0.02, sy + s*0.22, s*0.96, s*0.56);
    ctx.fillStyle = '#3a2010';
    for(let i=0;i<4;i++) ctx.fillRect(sx + s*0.05 + i*s*0.24, sy + s*0.22, s*0.05, s*0.56);
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(sx, sy + s*0.45, s, s*0.1);
    return;
  }
  if(t === 'goblinWall'){
    ctx.fillStyle = '#4a3a2a'; ctx.fillRect(sx+2, sy+2, s-4, s-4);
    ctx.fillStyle = '#3a2a1a';
    for(let i = 0; i < 3; i++) ctx.fillRect(sx+4 + i*(s-8)/3, sy+4, (s-8)/3 - 1, s-8);
    const hpFrac = gb.hp / gb.maxHp;
    if(hpFrac < 1){ ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sx + 3, sy + s - 4, s - 6, 3); ctx.fillStyle = hpFrac > 0.5 ? '#c08040' : '#e05a5a'; ctx.fillRect(sx + 3, sy + s - 4, (s - 6) * hpFrac, 3); }
    return;
  }
  if(t === 'goblinTurret'){
    ctx.fillStyle = '#4a2a1a'; ctx.fillRect(sx + s*0.15, sy + s*0.3, s*0.7, s*0.65);
    ctx.fillStyle = '#6a3a2a'; ctx.fillRect(sx + s*0.1, sy + s*0.25, s*0.8, s*0.12);
    ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.arc(cx, cy, s*0.22, 0, 6.3); ctx.fill();
    return;
  }
  if(t === 'goblinBarracks'){
    ctx.fillStyle = '#5a2a1a'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.6);
    ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.moveTo(sx + s*0.2, sy + s*0.1); ctx.lineTo(sx + s*0.4, sy + s*0.32); ctx.lineTo(sx, sy + s*0.32); ctx.closePath(); ctx.fill();
    return;
  }
}
function drawMilitaryBuilding(b, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2, t = b.type;
  if(t.startsWith('walls_')){
    let col1 = '#8a6a3a', col2 = '#6a4a2a', hpFrac = b.hp / b.maxHp;
    if(t === 'walls_stone'){ col1 = '#8a9098'; col2 = '#6b7076'; }
    else if(t === 'walls_iron'){ col1 = '#a0a8b8'; col2 = '#7080a0'; }
    ctx.fillStyle = col1; ctx.fillRect(sx+2, sy+2, s-4, s-4);
    ctx.fillStyle = col2;
    for(let i = 0; i < 3; i++) ctx.fillRect(sx+4 + i*(s-8)/3, sy+4, (s-8)/3 - 1, s-8);
    if(hpFrac < 1){
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sx + 3, sy + s - 4, s - 6, 3);
      ctx.fillStyle = hpFrac > 0.5 ? '#7fc27f' : hpFrac > 0.25 ? '#d8b45e' : '#e05a5a';
      ctx.fillRect(sx + 3, sy + s - 4, (s - 6) * hpFrac, 3);
    }
    return;
  }
  if(t === 'barracks'){ ctx.fillStyle = '#7a4a3a'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.6); ctx.fillStyle = '#c0a060'; ctx.fillRect(cx - s*0.1, sy + s*0.5, s*0.2, s*0.4); return; }
  if(t === 'archerTower'){ ctx.fillStyle = '#8a6a4a'; ctx.fillRect(sx + s*0.15, sy + s*0.3, s*0.7, s*0.65); ctx.fillStyle = '#a08060'; ctx.fillRect(sx + s*0.1, sy + s*0.25, s*0.8, s*0.12); return; }
  if(t === 'cannonTower'){ ctx.fillStyle = '#5a5a6a'; ctx.fillRect(sx + s*0.15, sy + s*0.3, s*0.7, s*0.65); ctx.fillStyle = '#303038'; ctx.fillRect(cx - s*0.18, cy + s*0.05, s*0.36, s*0.15); return; }
  if(t === 'autoTurret'){ ctx.fillStyle = '#404a5a'; ctx.fillRect(sx + s*0.2, sy + s*0.35, s*0.6, s*0.55); ctx.fillStyle = '#5a6a8a'; ctx.beginPath(); ctx.arc(cx, cy + s*0.05, s*0.2, 0, 6.3); ctx.fill(); return; }
  if(t === 'laserTurret'){ ctx.fillStyle = '#3a4a5a'; ctx.fillRect(sx + s*0.2, sy + s*0.35, s*0.6, s*0.55); ctx.fillStyle = '#80ff80'; const pulse = 0.6 + Math.sin(G.time * 4) * 0.4; ctx.globalAlpha = pulse; ctx.beginPath(); ctx.arc(cx, cy + s*0.05, s*0.1, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1; return; }
  if(t === 'artilleryTower'){
    ctx.fillStyle = '#3a3a4a'; ctx.fillRect(sx + s*0.15, sy + s*0.3, s*0.7, s*0.65);
    ctx.fillStyle = '#6a6a8a'; ctx.fillRect(sx + s*0.12, sy + s*0.24, s*0.76, s*0.1);
    ctx.fillStyle = '#2a2a3a'; ctx.fillRect(cx - s*0.25, cy + s*0.02, s*0.5, s*0.16);
    const pulse = 0.6 + Math.sin(G.time * 2) * 0.4;
    ctx.fillStyle = `rgba(255,180,80,${pulse*0.8})`; ctx.beginPath(); ctx.arc(cx, sy + s*0.15, s*0.08, 0, 6.3); ctx.fill();
    return;
  }
  ctx.fillStyle = '#8a8a8a'; ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
}
function drawBuilding(b, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(b.constructionT > 0){
    ctx.fillStyle = 'rgba(200,180,120,.18)'; ctx.fillRect(sx+4, sy+4, s-8, s-8);
    ctx.strokeStyle = '#c8a050'; ctx.setLineDash([4, 3]); ctx.lineWidth = 2; ctx.strokeRect(sx+4, sy+4, s-8, s-8); ctx.setLineDash([]);
    const total = getBuildTime(b.type);
    const pct = 1 - b.constructionT / total;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(sx + 4, sy + s*0.88, s - 8, Math.max(3, s*0.1));
    ctx.fillStyle = '#7fc27f'; ctx.fillRect(sx + 4, sy + s*0.88, (s - 8) * pct, Math.max(3, s*0.1));
    return;
  }
  const def = b.def;
  if(def && (def.range || def.unitType || (b.type && typeof b.type === 'string' && b.type.startsWith('walls_')))){ drawMilitaryBuilding(b, sx, sy, s); return; }
  if(b.type !== 'bridge' && b.type !== 'algae' && b.type !== 'waterWheel'){
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx, sy + s*0.9, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  }
  const t = b.type;
  if(t === 'townHall'){ ctx.fillStyle = '#d8c8a8'; ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.62); ctx.fillStyle = '#a8563c'; ctx.beginPath(); ctx.moveTo(sx + s*0.05, sy + s*0.32); ctx.lineTo(cx, sy + s*0.02); ctx.lineTo(sx + s*0.95, sy + s*0.32); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#6b4523'; ctx.fillRect(cx - s*0.1, sy + s*0.55, s*0.2, s*0.37); }

  else if(t === 'apartment'){ ctx.fillStyle = '#b8bcc8'; ctx.fillRect(sx + s*0.12, sy + s*0.1, s*0.76, s*0.8); ctx.fillStyle = '#5a7fa8'; for(let ry=0;ry<3;ry++) for(let rx=0;rx<3;rx++) ctx.fillRect(sx + s*0.2 + rx*s*0.24, sy + s*0.28 + ry*s*0.2, s*0.14, s*0.13); }
  else if(t === 'luxuryHouse'){ ctx.fillStyle = '#e8dcc8'; ctx.fillRect(sx + s*0.1, sy + s*0.25, s*0.8, s*0.7); ctx.fillStyle = '#7fd4e0'; for(let i=0;i<4;i++){ ctx.fillRect(sx + s*0.16 + i*s*0.18, sy + s*0.4, s*0.1, s*0.12); ctx.fillRect(sx + s*0.16 + i*s*0.18, sy + s*0.6, s*0.1, s*0.12); } }
  else if(isStorageType(t)){
    const tierCol = t === 'storageSmall' ? '#8a8578' : t === 'storage' ? '#8d95a3' : t === 'storageLarge' ? '#a0a8b8' : '#c8a25a';
    const tierCol2 = t === 'storageSmall' ? '#6a6558' : t === 'storage' ? '#6b7381' : t === 'storageLarge' ? '#7a8298' : '#a08040';
    ctx.fillStyle = tierCol; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.58);
    ctx.fillStyle = tierCol2; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.14);
    ctx.fillStyle = '#c0a25a';
    const boxes = t === 'storageSmall' ? 1 : t === 'storage' ? 2 : t === 'storageLarge' ? 3 : 4;
    for(let i=0;i<boxes;i++) ctx.fillRect(sx + s*0.18 + i*s*0.2, sy + s*0.55, s*0.14, s*0.22);
    if(t === 'storageHuge'){ ctx.fillStyle = '#e6c341'; ctx.fillRect(cx - s*0.05, sy + s*0.15, s*0.1, s*0.1); }
  }
  else if(t === 'farm' || t === 'electricFarm'){ ctx.fillStyle = '#7a6a2a'; ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.6); ctx.fillStyle = t === 'electricFarm' ? '#a8e8a8' : '#d8bc44'; for(let i=0;i<3;i++) ctx.fillRect(sx + s*0.16, sy + s*0.4 + i*s*0.16, s*0.68, s*0.08); }
  else if(t === 'grove'){ ctx.fillStyle = '#3d6b34'; ctx.fillRect(sx + s*0.1, sy + s*0.28, s*0.8, s*0.62); ctx.fillStyle = '#4e8f3f'; for(let i=0;i<3;i++){ const a = i*2.1 + b.px*0.01; ctx.beginPath(); ctx.arc(cx + Math.cos(a)*s*0.22, cy + Math.sin(a)*s*0.18, s*0.16, 0, 6.3); ctx.fill(); } }

function drawHeli(h, sx, sy, s){

const rainDrops = [];

function render(){

  for(const bo of G.boats){ const sx = bo.x*z + ox, sy = bo.y*z + oy; if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue; drawBoat(bo, sx, sy, s); if(G.sel === bo){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.5, 0, 6.3); ctx.stroke(); } }
  for(const h of G.helis){ const sx = h.x*z + ox, sy = h.y*z + oy; if(sx < -60 || sx > W+60 || sy < -60 || sy > H+60) continue; drawHeli(h, sx, sy, s); if(G.sel === h){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.48, 0, 6.3); ctx.stroke(); } }
  for(const p of G.projectiles){
    const sx = p.x*z + ox, sy = p.y*z + oy;
    if(sx < -20 || sx > W+20 || sy < -20 || sy > H+20) continue;
    if(p.type === 'laser' && p.target){
      const tx = (p.target.x !== undefined ? p.target.x : p.target.px) * z + ox;
      const ty = (p.target.y !== undefined ? p.target.y : p.target.py) * z + oy;
      ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(2, 3*z);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
    } else {

    }
  }
  for(const p of G.particles){
    const alpha = Math.min(1, p.life / p.maxLife);
    if(p.color.startsWith('rgba')){
      const parts = p.color.match(/rgba\((\d+),(\d+),(\d+),[\d.]+\)/);
      if(parts) ctx.fillStyle = `rgba(${parts[1]},${parts[2]},${parts[3]},${alpha*0.6})`;
    } else ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x*z+ox, p.y*z+oy, p.size*z, 0, 6.3); ctx.fill();
  }
  for(const m of G.markers){
    const mx = m.x*z+ox, my = m.y*z+oy;
    ctx.strokeStyle = '#e6c341'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, my - 20*z); ctx.stroke();
    ctx.fillStyle = '#e6c341';
    ctx.beginPath(); ctx.moveTo(mx, my - 20*z); ctx.lineTo(mx + 12*z, my - 16*z); ctx.lineTo(mx, my - 12*z); ctx.closePath(); ctx.fill();
  }
  if(SETTINGS.daynight){
    const nightAlpha = getNightAlpha();
    if(nightAlpha > 0.01){
      ctx.fillStyle = `rgba(10,20,50,${nightAlpha})`; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for(const b of G.buildings){
        if(b.constructionT > 0) continue;
        let glow = 0;
        if(b.type === 'house') glow = 0.5;
        else if(b.type === 'apartment' || b.type === 'luxuryHouse') glow = 0.7;
        else if(b.type === 'tavern' || b.type === 'theater' || b.type === 'forge' || b.type === 'factory' || b.type === 'ironSmelter' || b.type === 'copperSmelter' || b.type === 'goldSmelter' || b.type === 'coalPlant' || b.type === 'coalSteamPlant') glow = 0.6;
        else if(b.type === 'nuclearPlant') glow = 0.8;
        if(glow > 0){
          const bx = (b.tx*TS+TS/2)*z+ox, by = (b.ty*TS+TS/2)*z+oy;
          const r = TS * z * 1.2;
          const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
          grad.addColorStop(0, `rgba(255,220,150,${glow*nightAlpha*0.5})`);
          grad.addColorStop(1, 'rgba(255,220,150,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(bx, by, r, 0, 6.3); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if(G.weather && G.weather.type === 'storm'){
    const isSnow = G.season === 'winter';
    const t = performance.now() / 1000;
    if(isSnow){
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for(const drop of rainDrops){ const x = ((drop.x * W + t * drop.speed * 30) % (W + 40)) - 20; const y = ((drop.y * H + t * drop.speed * 80) % (H + 60)) - 30; ctx.beginPath(); ctx.arc(x, y, 1.5 + drop.len/8, 0, 6.3); ctx.fill(); }
    } else {
      ctx.strokeStyle = 'rgba(160,180,210,.35)'; ctx.lineWidth = 1;
      for(const drop of rainDrops){ const x = ((drop.x * W + t * drop.speed * 60) % (W + 40)) - 20; const y = ((drop.y * H + t * drop.speed * 300) % (H + 60)) - 30; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + drop.len); ctx.stroke(); }
    }
  }
  if(G.boxSelect && G.boxSelect.active){
    const bx = Math.min(G.boxSelect.x1, G.boxSelect.x2), by = Math.min(G.boxSelect.y1, G.boxSelect.y2);
    const bw = Math.abs(G.boxSelect.x2 - G.boxSelect.x1), bh = Math.abs(G.boxSelect.y2 - G.boxSelect.y1);
    ctx.fillStyle = 'rgba(120,200,255,.15)'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(120,200,255,.85)'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
  }
  if(G.build && G.mouse.inside){
    const [wx,wy] = screenToWorld(G.mouse.x, G.mouse.y);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    if(tx>=0 && ty>=0 && tx<MW && ty<MH){
      if(G.build === 'demolish'){
        const bb = buildingAt(tx,ty);
        const hasRoad = roadGrid[ty] && roadGrid[ty][tx];
        if(bb || hasRoad){ ctx.fillStyle = 'rgba(230,80,80,.35)'; ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s); }
      } else {
        const ok = canPlace(G.build, tx, ty);
        ctx.fillStyle = ok ? 'rgba(90,220,120,.28)' : 'rgba(230,80,80,.28)'; ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        ctx.strokeStyle = ok ? '#7fe08a' : '#e05a5a'; ctx.lineWidth = 2;
        ctx.strokeRect(tx*TS*z+ox+1, ty*TS*z+oy+1, s-2, s-2);
      }
    }
  }
  if(G.markerMode && G.mouse.inside){ ctx.strokeStyle = '#e6c341'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(G.mouse.x, G.mouse.y, 10, 0, 6.3); ctx.stroke(); }
  drawMinimap();
}

// =================== PLACEMENT ===================
function buildingAt(tx,ty){
  for(const b of G.buildings) if(b.tx===tx && b.ty===ty) return b;
  for(const gb of G.goblinBuildings) if(gb.tx===tx && gb.ty===ty) return gb;
  return null;
}
function canPlace(type, tx, ty){
  if(tx<1||ty<1||tx>=MW-1||ty>=MH-1) return false;
  const t = terrain[ty][tx].t;
  const def = BUILDINGS[type];
  if(type === 'road'){ if(t === 'water' || t === 'mountain') return false; if(roadGrid[ty][tx]) return false; return true; }
  if(type === 'bridge'){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(def && def.waterOnly){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(t === 'water' || t === 'mountain') return false;
  if(buildingAt(tx,ty)) return false;
  if(def && def.onDeposit){ const n = nodes[ty][tx]; return !!(n && isDeposit(n.type)); }
  if(def && def.coastal){
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=tx+dx, ny=ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      if(terrain[ny][nx].t === 'water') return true;
    }
    return false;
  }
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) return false;
  return true;
}
function rebuildBridgeGrid(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) bridgeGrid[y][x]=false;
  for(const b of G.buildings) if(b.type==='bridge') bridgeGrid[b.ty][b.tx] = true;
  for(const gb of G.goblinBuildings) if(gb.type==='goblinBridge') bridgeGrid[gb.ty][gb.tx] = true;
}
function tryPlace(type, tx, ty){
  if(!canPlace(type, tx, ty)) return false;
  const cost = COSTS[type];
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return false; }
  pay(cost); SND.place();
  if(type === 'road'){ roadGrid[ty][tx] = true; redrawRoad(tx, ty); renderMiniBg(); invalidatePathCache(); return true; }
  const def = BUILDINGS[type];
  const b = { type, def, tx, ty, px: tx*TS+TS/2, py: ty*TS+TS/2, workers: [], deposit: null, constructionT: getBuildTime(type) };
  b.hp = (def && def.hp) || 200; b.maxHp = b.hp;
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) b.deposit = n.type;
  if(n && (n.type==='tree' || n.type==='rock')) nodes[ty][tx] = null;
  G.buildings.push(b);
  if(type === 'bridge'){ bridgeGrid[ty][tx] = true; computeIslands(); }
  if(type === 'dock') spawnBoatFromDock(b);
  if(type === 'helipad') spawnHeliFromPad(b);
  if(typeof type === 'string' && type.startsWith('walls_')) rebuildWallGrid();
  if(type === 'townHall') G.townHall = b;
  renderMiniBg();
  invalidatePathCache();
  return true;
}
function demolishBuilding(b, noRefund){
  const idx = G.buildings.indexOf(b);
  if(idx < 0) return;
  G.buildings.splice(idx,1);
  for(const u of G.units){
    if(u.job === b){ u.job = null; if(u.state === 'work' || u.state === 'goBuilding'){ u.state = 'idle'; u.idleT = 0.2; u.path=null; } }
    if(u.hub === b) u.hub = null;
    if(u.barracks === b) u.barracks = null;
  }
  if(!G.creative && !noRefund){ const cost = COSTS[b.type]; if(cost){ for(const k in cost){ const v = Math.floor(cost[k]*0.5); if(v > 0) addRes(k, v); } } }
  if(b.type === 'bridge'){ bridgeGrid[b.ty][b.tx] = false; computeIslands(); }
  if(b.deposit) nodes[b.ty][b.tx] = { type: b.deposit, tx: b.tx, ty: b.ty };
  if(typeof b.type === 'string' && b.type.startsWith('walls_')) rebuildWallGrid();
  if(G.sel === b) G.sel = null;
  if(b === G.townHall){ G.townHall = null; if(!G.gameOver && (G.mode === 'battle' || G.mode === 'waves' || G.mode === 'experimental' || G.mode === 'war')) triggerDefeat('Ратуша разрушена!'); }
  updateInfoUI(); updateResUI(); renderMiniBg();
  if(!noRefund) pushLog('Снесено: ' + (b.def ? b.def.name : b.type), 'info');
  invalidatePathCache();
  SND.click();
}
function demolishRoad(tx,ty){
  if(!roadGrid[ty] || !roadGrid[ty][tx]) return;
  roadGrid[ty][tx] = false;
  redrawTile(tx,ty);
  if(!G.creative){ const v = Math.floor((COSTS.road.stone||0)*0.5); if(v > 0) addRes('stone', v); }
  updateResUI(); renderMiniBg();
  pushLog('Дорога снесена', 'info'); SND.click(); invalidatePathCache();
}
function spawnBoatFromDock(dock){
  for(let r=1;r<=3;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=dock.tx+dx, y=dock.ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water' && !(bridgeGrid[y] && bridgeGrid[y][x])){
      G.boats.push(new Boat(x*TS+TS/2, y*TS+TS/2));
      pushLog('Лодка спущена на воду', 'good');
      return;
    }
  }
}
function spawnRobot(){
  const cost = COSTS.robot;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return; }
  const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
  if(!homes.length){ toast('Нужен хотя бы один дом'); SND.error(); return; }
  pay(cost);
  const h = homes[0];
  const u = new Unit(h.px + (Math.random()-0.5)*26, h.py + 26 + (Math.random()-0.5)*26, true);
  G.units.push(u);
  pushLog('Робот собран', 'good'); SND.place();
}
function spawnDrone(){
  const cost = COSTS.drone;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); SND.error(); return; }
  const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment'||b.type==='luxuryHouse') && b.constructionT<=0);
  const from = homes.length ? homes[0] : null;
  if(!from){ toast('Нужен дом'); SND.error(); return; }
  pay(cost);
  const u = new Unit(from.px + (Math.random()-0.5)*26, from.py + 26 + (Math.random()-0.5)*26, true);
  u.drone = true; u.speed = 110;
  G.units.push(u);
  pushLog('Дрон запущен', 'good'); SND.place();
}
function spawnHeliFromPad(pad){ G.helis.push(new Heli(pad.px, pad.py - TS)); toast('Вертолёт поднялся в воздух'); }
function spawnExtraHeli(){
  if(!G.sel || G.sel.type !== 'helipad') return;
  if(G.creative || (G.res.planks >= 20 && G.res.ironIngot >= 15)){
    if(!G.creative){ G.res.planks -= 20; G.res.ironIngot -= 15; }
    spawnHeliFromPad(G.sel); SND.place();
  } else { toast('Нужно 20 досок и 15 железа'); SND.error(); }
  updateResUI(); updateInfoUI();
}
function spawnExtraBoat(){
  if(G.creative || G.res.wood >= 30){ if(!G.creative) G.res.wood -= 30; spawnBoatFromDock(G.sel); SND.place(); }
  else { toast('Нужно 30 дерева'); SND.error(); }
  updateResUI(); updateInfoUI();
}

function showTooltip(html, sx, sy){ tooltipEl.innerHTML = html; tooltipEl.classList.add('open'); positionTooltip(sx, sy); }
function positionTooltip(sx, sy){
  const r = tooltipEl.getBoundingClientRect();

    if(G._hoverResKey !== k){ G._hoverResKey = k; showTooltip(resTooltipHtml(k), e.clientX, e.clientY); }
    else positionTooltip(e.clientX, e.clientY);
  } else hideTooltip();
});
resbarEl.addEventListener('mouseleave', () => { hideTooltip(); });
function resTooltipHtml(k){
  const info = RES_INFO.find(r => r[0] === k);
  if(!info) return '';
  const name = info[1], col = info[2], abbr = info[3];
  let html = `<b><span class="dot" style="background:${col};display:inline-block;margin-right:5px;vertical-align:middle"></span>${name} <span style="color:#8fa6c0;font-size:11px">(${abbr})</span></b>`;
  html += `<div style="margin-top:4px;color:#d8e2f0">Сейчас: <b>${Math.floor(G.res[k])}</b> / ${cap()}`;
  const r = G.rates[k] || 0;
  if(Math.abs(r) > 0.01){
    const c = r > 0 ? '#7fc27f' : '#e08a7a';
    html += ` <span style="color:${c}">(${r>0?'+':''}${r.toFixed(2)}/с)</span>`;
  }
  html += `</div>`;
  if(G.res[k] >= cap() - 0.5) html += `<div style="color:#e08a7a;margin-top:3px;font-weight:600">⚠ Лимит достигнут — постройте склад!</div>`;
  if(RES_SOURCES[k]) html += `<div style="margin-top:4px;color:#8fa6c0">📍 ${RES_SOURCES[k]}</div>`;
  return html;
}
function renderLog(){
  if(!SETTINGS.log){ logEl.style.display = 'none'; return; }
  logEl.style.display = 'block';
  let html = '';
  const entries = G.log.slice(-30).reverse();
  for(const e of entries){

function renderBuildItems(cat){
  buildItemsEl.innerHTML = '';
  const items = [];
  for(const id in BUILDINGS){ if(BUILDINGS[id].cat === cat.id) items.push(id); }
  for(const id of items){
    const div = document.createElement('div');
    div.className = 'btn' + (id === 'demolish' ? ' danger' : '');
    const name = BUILDINGS[id]?.name || id;
    const cost = COSTS[id];
    const def = BUILDINGS[id];
    let extra = '';
    if(def.powerOutput) extra = `<div class="pw">+${def.powerOutput} ⚡</div>`;
    else if(def.powerUse) extra = `<div class="pw">−${def.powerUse} ⚡</div>`;
    else if(cost) extra = `<div class="c">${G.creative ? '∞' : costStr(cost)}</div>`;
    div.innerHTML = `<div>${name}</div>${extra}`;
    div.onclick = () => {
      SND.click();
      const req = REQS[id];
      if(req && !G.techs[req]){ const t = TECHS.find(t=>t.id===req); toast('Нужна технология: ' + (t ? t.name : req)); SND.error(); return; }
      if(id === 'robot'){ spawnRobot(); return; }
      if(id === 'drone'){ spawnDrone(); return; }
      if(G.build === id) G.build = null;
      else { G.build = id; G.markerMode = false; }
      refreshBuildUI();
    };
    div.addEventListener('mouseenter', e => showTooltip(buildTooltipHtml(id), e.clientX, e.clientY));
    div.addEventListener('mousemove', e => positionTooltip(e.clientX, e.clientY));

function refreshBuildUI(){

    if(id === 'demolish'){ el.classList.remove('dis'); el.classList.toggle('active', G.build === id); continue; }
    const req = REQS[id];
    const locked = req && !G.techs[req];

window.hireWorkerFor = (tx, ty) => {
  const b = buildingAt(tx, ty);
  if(!b || !b.def || !b.def.workers || b.workers.length >= b.def.workers) return;
  let best = null, bd = 1e18;
  for(const u of G.units){
    if(u.drone || u.job || u.inBoat || u.inHeli || u.manual || u.soldierType) continue;
    if(u.state !== 'idle') continue;
    if(b.def.robotOnly && !u.robot) continue;
    if(getIslandAt(u.x, u.y) !== getIslandTile(b.tx, b.ty)) continue;
    const d = (u.x - b.px)**2 + (u.y - b.py)**2;
    if(d < bd){ bd = d; best = u; }
  }
  if(best){ best.job = b; b.workers.push(best); const a = Math.random()*6.28, r = 12+Math.random()*8; best.wax = Math.cos(a)*r; best.way = Math.sin(a)*r; best.state = 'goBuilding'; best.path = null; toast('Рабочий назначен'); }

};

function drawStats(){
  const c = document.getElementById('statscanvas');
  const cx2 = c.getContext('2d');
  const w = c.width, h = c.height;
  cx2.fillStyle = '#0e1420'; cx2.fillRect(0, 0, w, h);
  cx2.strokeStyle = '#1e2a3a'; cx2.lineWidth = 1;
  for(let i = 1; i < 5; i++){ cx2.beginPath(); cx2.moveTo(40, i * h/5); cx2.lineTo(w - 20, i * h/5); cx2.stroke(); }
  let maxPop = 1, maxFood = 1, maxWood = 1, maxStone = 1, maxGold = 1;
  for(const s of G.stats){ if(s.pop > maxPop) maxPop = s.pop; if(s.food > maxFood) maxFood = s.food; if(s.wood > maxWood) maxWood = s.wood; if(s.stone > maxStone) maxStone = s.stone; if(s.gold > maxGold) maxGold = s.gold; }
  const series = [
    {data:G.stats.map(s=>s.pop),color:'#7fe08a',max:maxPop*1.2,label:'Население'},
    {data:G.stats.map(s=>s.food),color:'#d8a33c',max:maxFood*1.2,label:'Еда'},
    {data:G.stats.map(s=>s.wood),color:'#7a5230',max:maxWood*1.2,label:'Дерево'},
    {data:G.stats.map(s=>s.stone),color:'#9aa0a6',max:maxStone*1.2,label:'Камень'},
    {data:G.stats.map(s=>s.gold),color:'#e6c341',max:maxGold*1.2,label:'Золото'},
    {data:G.stats.map(s=>s.hap),color:'#6fa4e2',max:100,label:'Счастье'},
  ];
  const n = G.stats.length;
  if(n < 2){ cx2.fillStyle = '#6c8098'; cx2.font = '14px sans-serif'; cx2.textAlign = 'center'; cx2.textBaseline = 'middle'; cx2.fillText('Собираем данные...', w/2, h/2); return; }
  const padL = 50, padR = 20, padT = 20, padB = 30;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  for(const s of series){
    cx2.strokeStyle = s.color; cx2.lineWidth = 2; cx2.beginPath();
    for(let i = 0; i < n; i++){ const x = padL + (i / (n-1)) * plotW; const y = padT + plotH - (s.data[i] / s.max) * plotH; if(i === 0) cx2.moveTo(x, y); else cx2.lineTo(x, y); }
    cx2.stroke();
  }
  cx2.font = '12px sans-serif'; cx2.textAlign = 'left'; cx2.textBaseline = 'alphabetic';
  let ly = padT + 14;
  for(const s of series){ cx2.fillStyle = s.color; cx2.fillRect(w - 130, ly - 8, 10, 10); cx2.fillStyle = '#e8eef7'; cx2.fillText(s.label, w - 115, ly); ly += 18; }
}

function saveToFile(){
  if(!G.gameStarted){ toast('Игра не начата'); return; }
  try {
    const data = buildSaveData();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const name = `citysim_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('💾 Файл сохранения скачан');
  } catch(e){ console.error(e); toast('Ошибка экспорта'); }
}
function loadFromFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(applySaveData(data)){ closeMenu(); toast('📂 Игра загружена из файла'); updateResUI(); updateInfoUI(); updateWaveHud(); }
        else { toast('Неверный формат или версия'); SND.error(); }
      } catch(err){ console.error(err); toast('Ошибка чтения файла'); SND.error(); }
    };
    reader.readAsText(file);
  };
  input.click();
}

  if(bestUnit){ if(keys['shift']){ if(!G.selectedUnits.includes(bestUnit)) G.selectedUnits.push(bestUnit); } else G.selectedUnits = [bestUnit]; G.sel = bestUnit; updateInfoUI(); return; }
  const b = buildingAt(tx,ty);
  if(b){ if(G.goblinBuildings.includes(b)) return; G.sel = b; G.selectedUnits = []; updateInfoUI(); return; }
  if(G.sel instanceof Unit && !G.sel.inBoat && !G.sel.inHeli){ if(orderMove(G.sel, wx, wy)){ updateInfoUI(); return; } }
  G.sel = null; G.selectedUnits = []; infoEl.classList.remove('open');
}

// =================== START ===================
function findStart(){
  computeIslands();
  let bestIsland = -1, bestSize = 0;
  for(const id in islandSizes){ if(islandSizes[id] > bestSize){ bestSize = islandSizes[id]; bestIsland = parseInt(id); } }
  let best = null, bestScore = -1e9;
  for(let y=6;y<MH-6;y++) for(let x=6;x<MW-6;x++){
    if(islandId[y][x] !== bestIsland) continue;
    if(terrain[y][x].t !== 'grass') continue;
    let trees = 0, water = 0, dep = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = x+dx, ny = y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && n.type==='tree') trees++;
      if(n && isDeposit(n.type)) dep++;
      if(terrain[ny][nx].t === 'water') water++;
    }
    const score = trees*2 - dep*1.5 + Math.min(water, 8)*3 - Math.abs(x-MW/2)*0.1 - Math.abs(y-MH/2)*0.1;
    if(score > bestScore){ bestScore = score; best = {x,y}; }
  }
  return best || {x: Math.floor(MW/2), y: Math.floor(MH/2)};
}
function findFarTileFromPlayer(){
  if(!G.playerStart) return null;
  const stx = Math.floor(G.playerStart.px/TS), sty = Math.floor(G.playerStart.py/TS);
  if(!isWalkableTile(stx, sty)) return null;
  const dist = new Int32Array(MW * MH); dist.fill(-1);
  const queue = new Int32Array(MW * MH);
  let head = 0, tail = 0;
  const startIdx = sty * MW + stx;
  dist[startIdx] = 0; queue[tail++] = startIdx;
  while(head < tail){
    const idx = queue[head++];
    const cy = Math.floor(idx / MW), cx = idx % MW, d = dist[idx];
    for(let i = 0; i < 4; i++){
      const nx = cx + [1,-1,0,0][i], ny = cy + [0,0,1,-1][i];
      if(nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      if(!isWalkableTile(nx, ny)) continue;
      const nidx = ny * MW + nx;
      if(dist[nidx] !== -1) continue;
      dist[nidx] = d + 1; queue[tail++] = nidx;
    }
  }
  let best = null, bestDist = 0;
  for(let y = 5; y < MH - 5; y++){
    for(let x = 5; x < MW - 5; x++){
      const idx = y * MW + x;
      if(dist[idx] <= bestDist) continue;
      if(terrain[y][x].t !== 'grass') continue;
      let ok = true;
      for(let dy = -2; dy <= 2 && ok; dy++) for(let dx = -2; dx <= 2 && ok; dx++){
        const nx = x + dx, ny = y + dy;
        if(nx < 1 || ny < 1 || nx >= MW-1 || ny >= MH-1){ ok = false; break; }
        if(terrain[ny][nx].t !== 'grass'){ ok = false; break; }
      }
      if(!ok) continue;
      bestDist = dist[idx]; best = {x, y};
    }
  }
  return best;
}
function newGame(){
  G.units = []; G.buildings = []; G.boats = []; G.helis = []; G.regrow = [];
  G.enemies = []; G.enemyBases = []; G.goblinBuildings = []; G.projectiles = []; G.effects = [];
  G.townHall = null; G.sel = null; G.build = null; G.markerMode = false;
  G.selectedUnits = []; G.boxSelect = null; G.selectedCategory = null;
  G._hoverResKey = null; logisticsHubs = [];
  nextUnitId = 1; nextEnemyId = 1;
  enemyFlowField = null; enemyFlowTimer = 0; enemyFlowTargetTx = -1; enemyFlowTargetTy = -1;
  wallGrid = []; harvestIndex = []; G.playerStart = null;
  pathCache.clear();
  const size = MAP_SIZES[mapSize] || MAP_SIZES.medium;
  MW = size.w; MH = size.h;
  tcan.width = MW*TS; tcan.height = MH*TS;
  genWorld(); renderTerrain();
  const startRes = (G.mode === 'battle' || G.mode === 'waves' || G.mode === 'experimental' || G.mode === 'war')
    ? { wood:300, planks:80, stone:200, stoneBlocks:40, food:180, coal:40, ironOre:40, ironIngot:30, copperOre:0, copperIngot:0, goldOre:0, goldIngot:10, uraniumOre:0, uranium:0, gears:0, circuits:0 }
    : { wood:120, planks:0, stone:60, stoneBlocks:0, food:60, coal:0, ironOre:0, ironIngot:0, copperOre:0, copperIngot:0, goldOre:0, goldIngot:0, uraniumOre:0, uranium:0, gears:0, circuits:0 };
  G.res = {...startRes};
  G.rates = {}; for(const [k] of RES_INFO) G.rates[k] = 0;
  G.totalGathered = {}; G.rateHistory = []; G.rateTimer = 0; G.prodTimer = 0; G.checkTimer = 0; G.totalTrades = 0;
  G.techs = {}; G.achievements = {};
  G.time = 0; G.growT = 0; G.happiness = 50;
  G.needs = {food:100, housing:100, recreation:0, faith:0};
  G.gameStarted = true; G.speed = 1; updateTimeButtons();
  G.dayTime = 0.35; G.day = 1; G.season = 'spring'; G.year = 1;
  G.prevSeason = 'spring'; G.seasonBlend = 1; G.lastSeasonStep = 20;
  G.log = []; G.stats = []; G.statTimer = 0;
  G.markers = []; G.markerMode = false; G.particles = []; G.particleTimer = 0;
  G.eventTimer = 90 + Math.random()*30; G.weather = null;
  G.quests = {};
  G.energy = { produced: 0, consumed: 0, demand: 0, efficiency: 1 };
  G.wave = 0; G.waveTimer = G.mode === 'waves' ? 60 : 0;
  G.totalKills = 0; G.civilianDeaths = 0; G.goblinBuildingsDestroyed = 0;
  G.battleActive = false; G.gameOver = false; G.wavePause = false;
  G.warRaidTimer = 90;
  const st = findStart();
  G.playerStart = { px: st.x*TS+TS/2, py: st.y*TS+TS/2, tx: st.x, ty: st.y };
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const x = st.x+dx, y = st.y+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    const n = nodes[y][x];
    if(n && !isDeposit(n.type)) nodes[y][x] = null;
  }
  const isCombatMode = (G.mode === 'battle' || G.mode === 'waves' || G.mode === 'experimental' || G.mode === 'war');
  if(isCombatMode){
    const th = { type:'townHall', def:BUILDINGS.townHall, tx:st.x, ty:st.y, px: st.x*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0, hp:2500, maxHp:2500 };
    G.buildings.push(th); G.townHall = th;
  } else {
    const house = { type:'house', def:BUILDINGS.house, tx:st.x, ty:st.y, px: st.x*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0, hp:250, maxHp:250 };
    G.buildings.push(house);
  }
  // Storage: small for normal, large for combat
  const stgType = isCombatMode ? 'storageLarge' : 'storageSmall';
  const stg = { type:stgType, def:BUILDINGS[stgType], tx:st.x+1, ty:st.y, px:(st.x+1)*TS+TS/2, py:st.y*TS+TS/2, workers:[], deposit:null, constructionT:0, hp:300, maxHp:300 };
  G.buildings.push(stg);
  // FIX: spawn units at walkable positions
  const spawnSafe = (px, py) => {
    const safe = findNearestWalkable(px, py);
    if(safe) return { x: safe.x*TS+TS/2, y: safe.y*TS+TS/2 };
    return { x: px, y: py };
  };
  if(isCombatMode){
    for(let i = 0; i < 3; i++){ const p = spawnSafe(st.x*TS + TS/2 + (i-1)*20, st.y*TS + TS*2); const u = new Unit(p.x, p.y, false); u.setSoldier('spearman'); u.state = 'idle'; G.units.push(u); }
    for(let i = 0; i < 2; i++){ const p = spawnSafe(st.x*TS + TS/2 + (i-0.5)*30, st.y*TS + TS*2.5); const u = new Unit(p.x, p.y, false); u.setSoldier('bowman'); u.state = 'idle'; G.units.push(u); }
    const p1 = spawnSafe(st.x*TS + TS/2 - 25, st.y*TS + TS*3); G.units.push(new Unit(p1.x, p1.y, false));
    const p2 = spawnSafe(st.x*TS + TS/2 + 25, st.y*TS + TS*3); G.units.push(new Unit(p2.x, p2.y, false));
  } else {
    const p1 = spawnSafe(st.x*TS + TS/2 - 10, st.y*TS + TS*2); G.units.push(new Unit(p1.x, p1.y, false));
    const p2 = spawnSafe(st.x*TS + TS/2 + 12, st.y*TS + TS*2.5); G.units.push(new Unit(p2.x, p2.y, false));
  }
  if(G.mode === 'battle' || G.mode === 'experimental'){ setupBattleMode(); }
  cam.x = st.x*TS + TS; cam.y = st.y*TS + TS; cam.zoom = 1.4;
  clampCam();
  renderTech(); makeBuildUI(); refreshBuildUI(); renderQuests(); updateQuestHud();
  updateResUI(); renderLog(); updateWaveHud();
  if(G.mode === 'battle'){ pushLog('⚔ Битва началась! Найдите и уничтожьте вражескую базу.', 'danger'); toast('⚔ Найдите вражескую базу!'); }
  else if(G.mode === 'waves'){ pushLog('🌊 Волны врагов! Готовьтесь к обороне.', 'danger'); toast('🌊 Готовьтесь к волнам!'); }
  else if(G.mode === 'experimental'){ pushLog('🧪 Гоблинская база на карте!', 'danger'); toast('🧪 Уничтожьте гоблинскую базу!'); }
  else if(G.mode === 'war'){ pushLog('🛡 War: стройте экономику, отражайте набеги.', 'good'); toast('🛡 Готовьтесь к набегам!'); }
  else { pushLog('Поселение основано. Удачи!', 'good'); toast('Добро пожаловать! Изучайте технологии'); }
}
function setupBattleMode(){
  let bestTile = findFarTileFromPlayer();
  if(!bestTile){ bestTile = {x: G.playerStart.tx + 15, y: G.playerStart.ty + 15}; bestTile.x = clamp(bestTile.x, 4, MW-4); bestTile.y = clamp(bestTile.y, 4, MH-4); }
  for(let dy=-3; dy<=3; dy++) for(let dx=-3; dx<=3; dx++){
    const nx = bestTile.x + dx, ny = bestTile.y + dy;
    if(nx < 1 || ny < 1 || nx >= MW-1 || ny >= MH-1) continue;
    if(nodes[ny] && nodes[ny][nx] && !isDeposit(nodes[ny][nx].type)) nodes[ny][nx] = null;
  }
  const eb = { x: bestTile.x * TS + TS/2, y: bestTile.y * TS + TS/2, tx: bestTile.x, ty: bestTile.y, hp: 3000, maxHp: 3000, spawnRate: 15, spawnT: 0, maxEnemies: 20, buildTimer: 0, waveTimer: 0, level: 1 };
  G.enemyBases.push(eb);
  G.battleActive = true;
  pushLog('Вражеская база обнаружена!', 'danger');
  toast('⚔ Найдите и уничтожьте вражескую базу!');
}

// =================== LOOP ===================
let last = performance.now();
let acc = 0, autosaveT = 0;
let fpsFrames = 0, fpsTime = 0;
function isAnyModalOpen(){
  return overlayEl.classList.contains('open') ||
    document.getElementById('settingsmodal').classList.contains('open') ||
    document.getElementById('statsmodal').classList.contains('open') ||
    document.getElementById('workersmodal').classList.contains('open') ||
    document.getElementById('gameovermodal').classList.contains('open');
}
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.1) dt = 0.1;
  fpsFrames++; fpsTime += dt;
  if(fpsTime >= 0.5){ const fps = Math.round(fpsFrames / fpsTime); document.getElementById('fps-counter').textContent = `${fps} FPS`; fpsFrames = 0; fpsTime = 0; }
  const spd = 520/cam.zoom * dt;
  let moved = false;
  if(keys['a'] || keys['arrowleft'] || keys['ф']){ cam.x -= spd; moved = true; }
  if(keys['d'] || keys['arrowright'] || keys['в']){ cam.x += spd; moved = true; }
  if(keys['w'] || keys['arrowup'] || keys['ц']){ cam.y -= spd; moved = true; }
  if(keys['s'] || keys['arrowdown'] || keys['ы']){ cam.y += spd; moved = true; }
  if(moved) clampCam();
  // AUTOPAUSE on any modal
  if(G.gameStarted && !isAnyModalOpen() && G.speed > 0 && !G.gameOver){
    update(dt * G.speed);
    updateParticles(dt * G.speed);
    autosaveT += dt;
    if(autosaveT > 90){ autosaveT = 0; saveGame('auto'); }
  }
  acc += dt;
  if(acc > 0.15){
    acc = 0;
    updateResUI(); refreshBuildUI(); updateUILayout(); updateWaveHud();
    if(getActiveQuest() && getActiveQuest().progress) updateQuestHud();
    if(G.sel && G.sel.constructionT > 0 && G.sel.def){ const el = document.getElementById('build-progress'); if(el){ const total = getBuildTime(G.sel.type); el.textContent = `🏗 Строится: ${Math.round((1 - G.sel.constructionT/total) * 100)}%`; } }
  }
  if(toastT > 0){ toastT -= dt; if(toastT <= 0) toastEl.style.opacity = 0; }
  render();
}

// =================== INIT ===================
(function init(){
  loadSettings();
  genWorld();
  renderTerrain();
  rebuildHarvestIndex();
  applySettings();
  cam.x = MW*TS/2; cam.y = MH*TS/2; cam.zoom = 0.5;
  clampCam();
  renderQuests(); updateQuestHud();
  openMenu('main');
  requestAnimationFrame(loop);
})();
</script>

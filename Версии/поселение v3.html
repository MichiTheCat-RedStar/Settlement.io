<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поселение</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;
  font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#e8eef7;user-select:none}
canvas{display:block;position:absolute;inset:0;cursor:crosshair}

#resbar{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:calc(100vw - 260px)}
.res{background:rgba(16,21,30,.88);border:1px solid #2f3a4b;border-radius:6px;
  padding:4px 9px;font-size:12px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(4px)}
.res b{font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

#topbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:10}
.tbtn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:7px;
  padding:7px 12px;font-size:12.5px;cursor:pointer;transition:.12s;backdrop-filter:blur(4px)}
.tbtn:hover{background:rgba(40,58,84,.95);border-color:#58789e}

#build{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:96vw;z-index:5}
.btn{background:rgba(16,21,30,.92);border:1px solid #2f3a4b;border-radius:7px;
  padding:5px 8px;font-size:11px;cursor:pointer;min-width:76px;text-align:center;
  transition:.12s;line-height:1.2;backdrop-filter:blur(4px)}
.btn:hover{background:rgba(40,58,84,.95);border-color:#58789e}
.btn.active{background:#2e5c8f;border-color:#6fa4e2;box-shadow:0 0 12px rgba(80,150,230,.5)}
.btn.dis{opacity:.32;cursor:not-allowed}
.btn.dis:hover{background:rgba(16,21,30,.92);border-color:#2f3a4b}
.btn.danger.active{background:#8f3030;border-color:#e27a7a;box-shadow:0 0 12px rgba(230,80,80,.5)}
.btn .c{font-size:9.5px;color:#8fa6c0;margin-top:1px}

#techpanel{position:absolute;top:58px;right:8px;width:320px;max-height:calc(100vh - 130px);overflow-y:auto;
  background:rgba(11,15,22,.97);border:1px solid #2f3a4b;border-radius:9px;padding:10px;
  display:none;backdrop-filter:blur(6px);z-index:20}
#techpanel.open{display:block}
#techpanel h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:#9fc4ee;font-weight:600}
.tech{border:1px solid #2c3747;border-radius:7px;padding:7px 9px;margin-bottom:6px;
  cursor:pointer;background:#141c28;transition:.12s}
.tech:hover{background:#1c2839;border-color:#456080}
.tech b{font-size:12.5px}
.tech .td{font-size:11px;color:#8fa6c0;margin:2px 0 3px}
.tech .tc{font-size:11px;color:#d8b45e}
.tech.done{opacity:.55;border-color:#3a6b3a;background:#132018;cursor:default}
.tech.done .tc{color:#7fc27f}
.tech.locked{opacity:.32;cursor:not-allowed}
.tech.locked:hover{background:#141c28;border-color:#2c3747}

#info{position:absolute;left:8px;top:52px;background:rgba(16,21,30,.92);
  border:1px solid #2f3a4b;border-radius:7px;padding:8px 11px;font-size:12px;
  display:none;line-height:1.5;max-width:270px;z-index:15}
#info.open{display:block}
#info button{background:#2e5c8f;border:1px solid #6fa4e2;color:#fff;border-radius:5px;
  padding:4px 9px;font-size:11px;cursor:pointer;margin-top:5px;margin-right:4px}
#info button:hover{background:#3a6dab}
#info button.del{background:#8f3030;border-color:#e27a7a}
#info button.del:hover{background:#ab3a3a}

#hint{position:absolute;left:10px;bottom:12px;font-size:10.5px;color:#6c8098;
  pointer-events:none;max-width:260px;line-height:1.4;z-index:4}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(10,14,20,.95);border:1px solid #3a4a5e;border-radius:8px;
  padding:9px 20px;font-size:14px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:30}

#tooltip{position:absolute;pointer-events:none;background:rgba(11,16,24,.97);
  border:1px solid #3a4a5e;border-radius:7px;padding:7px 10px;font-size:11.5px;
  max-width:250px;line-height:1.45;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.55)}
#tooltip.open{display:block}
#tooltip b{color:#9fc4ee;font-size:12.5px}
#tooltip .tt-cost{color:#d8b45e;margin-top:3px}
#tooltip .tt-req{color:#e08a6a;margin-top:2px}
#tooltip .tt-sub{color:#8fa6c0;margin-top:2px}

#overlay{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#overlay.open{display:flex}
.menu-box{background:#131b26;border:1px solid #2f3a4b;border-radius:12px;padding:26px;
  min-width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.menu-box h2{margin:0 0 20px;text-align:center;color:#9fc4ee;font-size:22px;letter-spacing:1px}
.menu-box button{display:block;width:100%;background:#1e2b3d;border:1px solid #3a4a5e;
  color:#e8eef7;padding:11px 16px;border-radius:7px;font-size:13.5px;cursor:pointer;
  margin-bottom:8px;transition:.12s;text-align:left;position:relative}
.menu-box button:hover{background:#2e5c8f;border-color:#6fa4e2}
.menu-box button:disabled{opacity:.35;cursor:not-allowed}
.menu-box button:disabled:hover{background:#1e2b3d;border-color:#3a4a5e}
.slot-info{font-size:11px;color:#8fa6c0;float:right;margin-top:2px;font-weight:400}
.back-btn{margin-top:12px;text-align:center!important}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#2c3747;border-radius:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="resbar"></div>
<div id="topbar">
  <div class="tbtn" id="menubtn">☰ Меню</div>
  <div class="tbtn" id="techbtn">🔬 Технологии (T)</div>
</div>
<div id="info"></div>
<div id="build"></div>
<div id="techpanel"></div>
<div id="overlay"></div>
<div id="hint">WASD/перетаскивание — камера • колесо — зум • T — техно • ПКМ — отмена<br>
ЛКМ по жителю, затем ЛКМ по земле — приказ идти • Наведение — описание</div>
<div id="toast"></div>
<div id="tooltip"></div>

<script>
"use strict";

// ============ UTILS ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize', resize); resize();

const TS = 32, MW = 120, MH = 90;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

function hash(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct=4){
  let v=0, a=.5, f=1;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*131); f*=2; a*=.5; }
  return v;
}

// ============ WORLD ============
let terrain = [], nodes = [];
let islandId = [], islandSizes = {};
let roadGrid = [], bridgeGrid = [];
for(let y=0;y<MH;y++){
  roadGrid[y]=[]; bridgeGrid[y]=[];
  for(let x=0;x<MW;x++){ roadGrid[y][x]=false; bridgeGrid[y][x]=false; }
}
const DEPOSITS = {stoneD:'stone', coalD:'coal', ironD:'iron', goldD:'gold'};
const isDeposit = t => t in DEPOSITS;

function genWorld(){
  terrain=[]; nodes=[];
  const seed = Math.floor(Math.random()*100000);

  for(let y=0;y<MH;y++){
    terrain[y]=[]; nodes[y]=[];
    for(let x=0;x<MW;x++){
      const e = fbm(x*0.045, y*0.045, seed, 4);
      let t = 'grass';
      if(e < 0.37) t = 'water';
      else if(e < 0.41) t = 'sand';
      terrain[y][x] = {t, v: hash(x,y,seed+3)};
      nodes[y][x] = null;
    }
  }

  // Большой извилистый канал, разрезающий карту
  const cx0 = MW * 0.62;
  for(let y=2;y<MH-2;y++){
    const wobble = Math.sin(y*0.07)*10 + fbm(y*0.04, 50, seed+999)*16 - 8;
    const cx = cx0 + wobble;
    const halfW = 2.5 + hash(y,1,seed+555)*3.5;
    for(let x=Math.floor(cx-halfW); x<=Math.ceil(cx+halfW); x++){
      if(x<1||x>=MW-1) continue;
      if(hash(x,y,seed+777) > 0.10){
        terrain[y][x].t = 'water';
      }
    }
  }

  // Озёра
  for(let i=0;i<12;i++){
    const lx = 8 + Math.floor(hash(i,1,seed+888) * (MW-16));
    const ly = 8 + Math.floor(hash(1,i,seed+999) * (MH-16));
    const r = 2 + Math.floor(hash(i,i,seed+111) * 4);
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        const x=lx+dx, y=ly+dy;
        if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
        if(Math.hypot(dx,dy) <= r && hash(x,y,seed+222) > 0.25)
          terrain[y][x].t = 'water';
      }
    }
  }

  // Ресурсы на траве (реже)
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      if(terrain[y][x].t !== 'grass') continue;
      const e = fbm(x*0.045, y*0.045, seed, 4);
      const m = fbm(x*0.07+40, y*0.07+40, seed+77, 3);
      const r = hash(x,y,seed+9);
      if(e > 0.72 && r > 0.88) nodes[y][x] = {type:'stoneD', tx:x, ty:y};
      else if(m > 0.60 && r > 0.72) nodes[y][x] = {type:'tree', tx:x, ty:y, amount:3};
      else if(r > 0.987) nodes[y][x] = {type:'rock', tx:x, ty:y, amount:2};
    }
  }

  veins('coalD', 10, seed+201);
  veins('ironD', 7, seed+307);
  veins('goldD', 4, seed+409);
  veins('stoneD', 5, seed+501);

  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ roadGrid[y][x]=false; bridgeGrid[y][x]=false; }
  computeIslands();
  return seed;
}

function veins(type, count, seed){
  for(let i=0;i<count;i++){
    const bx = 6 + Math.floor(hash(i,1,seed) * (MW-12));
    const by = 6 + Math.floor(hash(1,i,seed+5) * (MH-12));
    const r = 1 + Math.floor(hash(i,i,seed+9) * 3);
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        const x=bx+dx, y=by+dy;
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        const n = nodes[y][x];
        if(n && isDeposit(n.type)) continue;
        if(Math.hypot(dx,dy) <= r && hash(x,y,seed+17) > 0.3)
          nodes[y][x] = {type, tx:x, ty:y};
      }
    }
  }
}

function isWalkableTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  if(terrain[ty][tx].t !== 'water') return true;
  return bridgeGrid[ty] && bridgeGrid[ty][tx];
}

function computeIslands(){
  islandId = []; islandSizes = {};
  for(let y=0;y<MH;y++) islandId[y] = new Array(MW).fill(-1);
  let nextId = 0;
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      if(!isWalkableTile(x,y)) continue;
      if(islandId[y][x] !== -1) continue;
      const stack = [[x,y]];
      const id = nextId++;
      islandId[y][x] = id;
      let size = 0;
      while(stack.length){
        const [cx, cy] = stack.pop();
        size++;
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=cx+dx, ny=cy+dy;
          if(!isWalkableTile(nx,ny)) continue;
          if(islandId[ny][nx] !== -1) continue;
          islandId[ny][nx] = id;
          stack.push([nx,ny]);
        }
      }
      islandSizes[id] = size;
    }
  }
}

function getIslandAt(px, py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}
function getIslandTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}

// ============ DEFINITIONS ============
const BUILDINGS = {
  house:      {name:'Дом',          desc:'+4 к лимиту населения'},
  storage:    {name:'Склад',        desc:'+150 к лимиту хранения ресурсов'},
  road:       {name:'Дорога',       desc:'Ускоряет передвижение людей в 1.7 раза'},
  mine:       {name:'Шахта',        workers:3, onDeposit:true, tech:'mining', desc:'Добывает ресурс из залежи под собой (уголь, железо, золото, камень)'},
  farm:       {name:'Ферма',        workers:3, tech:'farming', desc:'Производит еду'},
  grove:      {name:'Роща',         workers:2, tech:'forestry', desc:'Производит дерево'},
  drill:      {name:'Буровая',      onDeposit:true, auto:true, tech:'mechanization', desc:'Автоматически добывает из залежи, рабочие не нужны'},
  lumberjack: {name:'Лесопилка',    workers:2, tech:'forestry', desc:'Дерево с ближайших деревьев'},
  quarry:     {name:'Каменоломня',  workers:3, tech:'masonry', desc:'Камень с ближайших камней и залежей камня'},
  fisherman:  {name:'Рыб.хижина',   workers:2, tech:'farming', coastal:true, desc:'Еда, требует берег рядом'},
  bakery:     {name:'Пекарня',      workers:2, tech:'farming', desc:'Превращает дерево в еду'},
  market:     {name:'Рынок',        tech:'trade', desc:'Позволяет продавать и покупать ресурсы за золото'},
  temple:     {name:'Храм',         tech:'architecture', desc:'+15 к счастью'},
  dock:       {name:'Верфь',        tech:'seamanship', coastal:true, desc:'Строит лодки для переправы через воду'},
  bridge:     {name:'Мост',         tech:'masonry', desc:'Переправа через воду'},
  robot:      {name:'Робот',        desc:'Работает без еды, быстрый сборщик'},
  demolish:   {name:'Снос',         desc:'Уничтожает постройку или дорогу и возвращает 50% стоимости'},
};

const COSTS = {
  house:{wood:20}, storage:{wood:30,stone:10}, road:{stone:2}, bridge:{wood:10,stone:5},
  mine:{wood:40,stone:30}, farm:{wood:30}, grove:{wood:25,stone:10},
  drill:{iron:30,stone:40}, robot:{iron:20,gold:5},
  lumberjack:{wood:40,stone:20}, quarry:{wood:50,stone:30},
  fisherman:{wood:35,stone:10}, bakery:{wood:50,stone:20},
  market:{wood:80,stone:60}, temple:{wood:100,stone:100},
  dock:{wood:60,stone:40},
};
const REQS = {
  mine:'mining', farm:'farming', grove:'forestry', drill:'mechanization', robot:'robotics',
  lumberjack:'forestry', quarry:'masonry', fisherman:'farming', bakery:'farming',
  market:'trade', temple:'architecture', dock:'seamanship', bridge:'masonry'
};

const TECHS = [
  {id:'farming',        name:'Земледелие',      cost:{wood:30},                          desc:'Ферма, Рыбацкая хижина, Пекарня'},
  {id:'forestry',       name:'Лесоводство',     cost:{wood:40},                          desc:'Роща, Лесопилка'},
  {id:'mining',         name:'Горное дело',     cost:{wood:40,stone:20},                 desc:'Шахта'},
  {id:'masonry',        name:'Каменная кладка', cost:{wood:60,stone:40}, req:['mining'], desc:'Каменоломня, Мост'},
  {id:'seamanship',     name:'Мореплавание',    cost:{wood:80,stone:30}, req:['forestry'], desc:'Верфь и Лодки'},
  {id:'trade',          name:'Торговля',        cost:{wood:60,stone:40,iron:20}, req:['masonry'], desc:'Рынок'},
  {id:'architecture',   name:'Архитектура',     cost:{wood:100,stone:100}, req:['masonry'], desc:'Храм'},
  {id:'mechanization',  name:'Механизация',     cost:{wood:100,stone:100,iron:60}, req:['mining','masonry'], desc:'Буровая'},
  {id:'robotics',       name:'Робототехника',   cost:{iron:100,gold:30}, req:['mechanization','trade'], desc:'Роботы-сборщики'},
];

const RES_INFO = [
  ['wood','Дерево','#7a5230'], ['stone','Камень','#9aa0a6'], ['food','Еда','#d8a33c'],
  ['coal','Уголь','#3d3d44'],  ['iron','Железо','#a8705a'],  ['gold','Золото','#e6c341']
];
const RES_NAMES = {wood:'дерево', stone:'камень', food:'еда', coal:'уголь', iron:'железо', gold:'золото'};

// ============ STATE ============
const G = {
  res: { wood:60, stone:20, food:40, coal:0, iron:0, gold:0 },
  units: [], buildings: [], boats: [], regrow: [],
  time: 0, growT: 0, happiness: 50,
  techs: {},
  sel: null, build: null, mouse: {x:0,y:0,inside:false},
  infoT: 0, gameStarted: false,
};

function cap(){ return 200 + G.buildings.filter(b=>b.type==='storage').length*150; }
function addRes(k,v){ G.res[k] = Math.min(cap(), G.res[k] + v); }
function canAfford(c){ for(const k in c) if(G.res[k] < c[k]) return false; return true; }
function pay(c){ if(!canAfford(c)) return false; for(const k in c) G.res[k] -= c[k]; return true; }
function costStr(c){ return Object.keys(c).map(k=>`${RES_NAMES[k]} ${c[k]}`).join(' · '); }

const cam = { x: 0, y: 0, zoom: 1 };
let ox = 0, oy = 0, z = 1;
function updCam(){ z = cam.zoom; ox = W/2 - cam.x*z; oy = H/2 - cam.y*z; }
function screenToWorld(sx,sy){ return [ (sx-ox)/z, (sy-oy)/z ]; }

// ============ TERRAIN RENDER ============
const tcan = document.createElement('canvas');
tcan.width = MW*TS; tcan.height = MH*TS;
const tctx = tcan.getContext('2d');

const TCOL = {
  grass: ['#4a7437','#517d3c','#446b32','#568440'],
  sand:  ['#c7b789','#c0b081','#cbbc8e'],
  water: ['#2b5c86','#27547b','#30628d']
};

function renderTerrain(){
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const t = terrain[y][x];
      const arr = TCOL[t.t];
      tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
      tctx.fillRect(x*TS, y*TS, TS+1, TS+1);
      if(roadGrid[y] && roadGrid[y][x]){
        tctx.fillStyle = '#6b6b6b';
        tctx.fillRect(x*TS+4, y*TS+4, TS-8, TS-8);
        tctx.fillStyle = '#7b7b7b';
        tctx.fillRect(x*TS+7, y*TS+7, TS-14, TS-14);
      }
    }
  }
  for(let i=0;i<MW*MH*0.3;i++){
    const x = Math.floor(Math.random()*MW)*TS + Math.random()*TS;
    const y = Math.floor(Math.random()*MH)*TS + Math.random()*TS;
    const tx = Math.floor(x/TS), ty = Math.floor(y/TS);
    if(terrain[ty][tx].t === 'water') continue;
    tctx.fillStyle = 'rgba(0,0,0,0.05)';
    tctx.fillRect(x, y, 2, 2);
  }
  tctx.strokeStyle = '#101820';
  tctx.lineWidth = 8;
  tctx.strokeRect(0,0,MW*TS,MH*TS);
}

function redrawTile(tx,ty){
  const t = terrain[ty][tx];
  const arr = TCOL[t.t];
  tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
  tctx.fillRect(tx*TS, ty*TS, TS+1, TS+1);
}

function redrawRoad(tx,ty){
  redrawTile(tx,ty);
  tctx.fillStyle = '#6b6b6b';
  tctx.fillRect(tx*TS+4, ty*TS+4, TS-8, TS-8);
  tctx.fillStyle = '#7b7b7b';
  tctx.fillRect(tx*TS+7, ty*TS+7, TS-14, TS-14);
}

// ============ CLASSES ============
class Unit {
  constructor(x,y,robot){
    this.x=x; this.y=y; this.robot=!!robot;
    this.state='idle'; this.target=null; this.job=null;
    this.carry=null; this.carryAmt=0;
    this.timer=0; this.idleT=Math.random()*0.6;
    this.speed = robot?80:48;
    this.wax=0; this.way=0;
    this.stuckT=0; this.lx=x; this.ly=y;
    this.phase=Math.random()*6.28;
    this.inBoat=null;
    this.mvx=0; this.mvy=0;
  }
}

class Boat {
  constructor(x,y){
    this.x=x; this.y=y;
    this.passengers=[];
    this.speed=75;
    this.state='idle';
    this.target=null;
    this.phase=Math.random()*6.28;
    this.isBoat=true;
  }
}

// ============ MOVEMENT ============
function isWaterPx(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
  if(terrain[ty][tx].t !== 'water') return false;
  if(bridgeGrid[ty] && bridgeGrid[ty][tx]) return false;
  return true;
}

function isWaterForBoat(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  return terrain[ty][tx].t === 'water';
}

function moveTo(u, tx, ty, dt){
  const dx = tx-u.x, dy = ty-u.y;
  const d = Math.hypot(dx,dy);
  if(d < 2.5) return true;
  let sp = u.speed;
  const ttx = Math.floor(u.x/TS), tty = Math.floor(u.y/TS);
  if(roadGrid[tty] && roadGrid[tty][ttx]) sp *= 1.7;
  const step = Math.min(d, sp*dt);
  let nx = u.x + dx/d*step;
  let ny = u.y + dy/d*step;
  if(isWaterPx(nx, u.y)) nx = u.x;
  if(isWaterPx(u.x, ny)) ny = u.y;
  u.x = nx; u.y = ny;
  return d < 3.5;
}

function nearestStorage(u){
  const myIsland = getIslandAt(u.x, u.y);
  let best=null, bd=1e18;
  for(const b of G.buildings){
    if(b.type!=='house' && b.type!=='storage') continue;
    if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}

function assignJob(u){
  const myIsland = getIslandAt(u.x, u.y);
  if(myIsland < 0) return;

  if(!u.robot){
    let best=null, bd=1e18;
    for(const b of G.buildings){
      const def = b.def;
      if(!def || !def.workers || def.auto) continue;
      if(b.workers.length >= def.workers) continue;
      if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
      const d = (b.px-u.x)**2 + (b.py-u.y)**2;
      if(d<bd){ bd=d; best=b; }
    }
    if(best){
      best.workers.push(u);
      u.job = best;
      const a = Math.random()*6.28, r = 12+Math.random()*8;
      u.wax = Math.cos(a)*r; u.way = Math.sin(a)*r;
      u.state = 'goBuilding';
      return;
    }
  }

  let bn=null, bnd=1e18;
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const n = nodes[y][x];
      if(!n) continue;
      if(n.type!=='tree' && n.type!=='rock') continue;
      if(n.amount <= 0) continue;
      if(islandId[y][x] !== myIsland) continue;
      const d = (x*TS+16-u.x)**2 + (y*TS+16-u.y)**2;
      if(d<bnd){ bnd=d; bn=n; }
    }
  }
  if(bn){ u.target = bn; u.state = 'goNode'; return; }
  u.state = 'idle';
}

function depositCarry(u){
  if(u.carry && u.carryAmt > 0) addRes(u.carry, u.carryAmt);
  u.carry = null; u.carryAmt = 0;
}

function updateUnit(u, dt){
  if(u.inBoat) return;
  const moving = (u.state==='goNode'||u.state==='goStore'||u.state==='goBuilding'||u.state==='manualMove');
  if(moving){
    u.stuckT += dt;
    if(u.stuckT > 2.5){
      if(Math.hypot(u.x-u.lx, u.y-u.ly) < 5){
        if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
        u.job = null; u.target = null; u.state='idle'; u.idleT = 0.6;
      }
      u.stuckT = 0; u.lx = u.x; u.ly = u.y;
    }
  }
  switch(u.state){
    case 'idle': {
      u.idleT -= dt;
      if(u.idleT <= 0){ assignJob(u); u.idleT = 0.5; }
      break;
    }
    case 'manualMove': {
      if(moveTo(u, u.mvx, u.mvy, dt)){
        u.state = 'idle';
        u.idleT = 0.25;
      }
      break;
    }
    case 'goNode': {
      const n = u.target;
      if(!n || n.amount <= 0 || nodes[n.ty][n.tx] !== n){ u.state='idle'; u.target=null; break; }
      if(moveTo(u, n.tx*TS+16, n.ty*TS+16, dt)){ u.state='gather'; u.timer = 2.2; }
      break;
    }
    case 'gather': {
      u.timer -= dt;
      if(u.timer <= 0){
        const n = u.target;
        if(!n || nodes[n.ty][n.tx] !== n || n.amount <= 0){ u.state='idle'; u.target=null; break; }
        n.amount--;
        u.carry = (n.type === 'tree') ? 'wood' : 'stone';
        u.carryAmt = 5;
        if(n.amount <= 0){
          if(n.type === 'tree') G.regrow.push({ tx:n.tx, ty:n.ty, t: 30 + Math.random()*20 });
          else nodes[n.ty][n.tx] = null;
        }
        u.target = null;
        u.state = 'goStore';
      }
      break;
    }
    case 'goStore': {
      const s = nearestStorage(u);
      if(!s){ depositCarry(u); u.state='idle'; break; }
      if(moveTo(u, s.px, s.py, dt)){ depositCarry(u); u.state='idle'; u.idleT = 0.25; }
      break;
    }
    case 'goBuilding': {
      const b = u.job;
      if(!b){ u.state='idle'; break; }
      if(moveTo(u, b.px + u.wax, b.py + u.way, dt)) u.state = 'work';
      break;
    }
    case 'work': {
      if(!u.job || u.job.workers.indexOf(u) < 0){ u.state='idle'; u.job=null; }
      break;
    }
  }
}

// Приказ идти в точку (ручное управление)
function orderMove(u, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(!isWalkableTile(tx,ty)) return false;
  if(u.job){
    const i = u.job.workers.indexOf(u);
    if(i>=0) u.job.workers.splice(i,1);
    u.job = null;
  }
  u.target = null;
  u.carry = null; u.carryAmt = 0;
  u.state = 'manualMove';
  u.mvx = tx*TS + TS/2 + (Math.random()-0.5)*10;
  u.mvy = ty*TS + TS/2 + (Math.random()-0.5)*10;
  u.stuckT = 0; u.lx = u.x; u.ly = u.y;
  return true;
}

// ============ BOATS ============
function updateBoat(bo, dt){
  if(bo.state === 'sailing' && bo.target){
    const dx = bo.target.x - bo.x;
    const dy = bo.target.y - bo.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      bo.x = bo.target.x;
      bo.y = bo.target.y;
      const tgt = bo.target;
      bo.state = 'idle';
      bo.target = null;
      if(tgt.landTx !== undefined){
        if(bo.passengers.length > 0) unloadPassengers(bo, tgt.landTx, tgt.landTy);
        else pickUpWorkers(bo);
      }
    } else {
      const step = Math.min(d, bo.speed*dt);
      const nx = bo.x + dx/d*step;
      const ny = bo.y + dy/d*step;
      if(isWaterForBoat(nx, ny)){ bo.x = nx; bo.y = ny; }
      else { bo.state='idle'; bo.target=null; }
    }
  }
}

function boatGoTo(bo, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  const isLand = terrain[ty][tx].t !== 'water';
  if(isLand){
    const water = findNearestWaterToLand(tx, ty);
    if(!water) return;
    bo.target = { x: water.x*TS+TS/2, y: water.y*TS+TS/2, landTx: tx, landTy: ty };
  } else {
    bo.target = { x: tx*TS+TS/2, y: ty*TS+TS/2 };
  }
  bo.state = 'sailing';
}

function findNearestWaterToLand(tx, ty){
  for(let r=1;r<=6;r++){
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const x=tx+dx, y=ty+dy;
        if(x<0||y<0||x>=MW||y>=MH) continue;
        if(terrain[y][x].t === 'water') return {x, y};
      }
    }
  }
  return null;
}

function findNearestLandNearBoat(bo){
  const btx = Math.floor(bo.x/TS), bty = Math.floor(bo.y/TS);
  for(let r=1;r<=5;r++){
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const x=btx+dx, y=bty+dy;
        if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
        if(terrain[y][x].t !== 'water' && !(bridgeGrid[y] && bridgeGrid[y][x])) return {x, y};
      }
    }
  }
  return null;
}

function boardWorker(bo, u){
  if(bo.passengers.length >= 4) return false;
  if(u.inBoat) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null;
  u.target = null;
  u.state = 'idle';
  u.inBoat = bo;
  bo.passengers.push(u);
  return true;
}

function pickUpWorkers(bo){
  if(bo.passengers.length >= 4) return;
  for(const u of G.units){
    if(u.robot) continue;
    if(u.inBoat) continue;
    if(u.state === 'gather' || u.state === 'work') continue;
    const d = Math.hypot(u.x - bo.x, u.y - bo.y);
    if(d < TS*4){
      boardWorker(bo, u);
      if(bo.passengers.length >= 4) break;
    }
  }
}

function unloadPassengers(bo, targetTx, targetTy){
  const land = findNearestLandNearBoat(bo) || {x:targetTx, y:targetTy};
  for(const u of bo.passengers){
    u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
    u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    u.inBoat = null;
    u.state = 'idle';
    u.idleT = 0.3;
  }
  bo.passengers = [];
}

// ============ WORLD UPDATE ============
function update(dt){
  G.time += dt;

  for(let i=G.regrow.length-1;i>=0;i--){
    const r = G.regrow[i];
    r.t -= dt;
    if(r.t <= 0){
      const n = nodes[r.ty][r.tx];
      if(n && n.type === 'tree') n.amount = 3;
      G.regrow.splice(i,1);
    }
  }

  for(const u of G.units) updateUnit(u, dt);
  for(const bo of G.boats) updateBoat(bo, dt);

  for(const b of G.buildings){
    const def = b.def;
    if(!def) continue;
    if(def.auto){
      if(b.deposit){
        const res = DEPOSITS[b.deposit];
        const rate = res==='gold'?0.05 : res==='iron'?0.1 : res==='coal'?0.16 : 0.2;
        addRes(res, rate*dt);
      }
      continue;
    }
    if(!def.workers) continue;
    const w = b.workers.length;
    if(w === 0) continue;
    if(b.type === 'mine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='gold'?0.06 : res==='iron'?0.14 : res==='coal'?0.22 : 0.28;
      addRes(res, rate*w*dt);
    } else if(b.type === 'farm'){
      addRes('food', 0.35*w*dt);
    } else if(b.type === 'grove'){
      addRes('wood', 0.32*w*dt);
    } else if(b.type === 'lumberjack'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && n.type==='tree' && n.amount > 0) near++;
      }
      addRes('wood', 0.06*w*Math.min(near, 12)*dt);
    } else if(b.type === 'quarry'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
      }
      addRes('stone', 0.05*w*Math.min(near, 10)*dt);
    } else if(b.type === 'fisherman'){
      addRes('food', 0.4*w*dt);
    } else if(b.type === 'bakery'){
      const need = 0.15*w*dt;
      if(G.res.wood >= need){
        G.res.wood -= need;
        addRes('food', 0.6*w*dt);
      }
    }
  }

  let pop = 0;
  for(const u of G.units) if(!u.robot && !u.inBoat) pop++;
  if(pop > 0) G.res.food = Math.max(0, G.res.food - pop*0.028*dt);

  let hap = 50;
  hap += G.buildings.filter(b=>b.type==='temple').length * 15;
  hap += G.buildings.filter(b=>b.type==='house').length * 2;
  hap -= G.buildings.filter(b=>b.type==='mine'||b.type==='drill'||b.type==='quarry').length * 3;
  if(G.res.food < 10) hap -= 20;
  if(G.res.gold > 50) hap += 5;
  G.happiness = clamp(hap, 0, 100);

  G.growT += dt;
  const growthInterval = G.happiness >= 60 ? 12 : G.happiness >= 40 ? 18 : 30;
  if(G.growT > growthInterval){
    G.growT = 0;
    const houses = G.buildings.filter(b=>b.type==='house');
    const capP = houses.length*4;
    if(G.units.length < capP && G.res.food >= 15 && houses.length){
      G.res.food -= 10;
      const h = houses[Math.floor(Math.random()*houses.length)];
      const nu = new Unit(h.px + (Math.random()-0.5)*20, h.py + 20 + (Math.random()-0.5)*20, false);
      G.units.push(nu);
      toast('Новый житель поселился');
    }
  }

  if(G.infoT > 0){ G.infoT -= dt; if(G.infoT <= 0) infoEl.classList.remove('open'); }
}

// ============ RENDER ============
function drawNode(n, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(n.type === 'tree'){
    if(n.amount <= 0){
      ctx.fillStyle = '#5a3d1e';
      ctx.beginPath(); ctx.arc(cx, cy+2, s*0.13, 0, 6.3); ctx.fill();
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.28, s*0.26, s*0.1, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#4a2f16';
    ctx.fillRect(cx - s*0.045, cy + s*0.02, s*0.09, s*0.24);
    ctx.fillStyle = '#2d6528';
    ctx.beginPath(); ctx.arc(cx, cy - s*0.06, s*0.29, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#3a7d33';
    ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.03, s*0.19, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*0.14, cy + s*0.01, s*0.17, 0, 6.3); ctx.fill();
    return;
  }
  if(n.type === 'rock'){
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.22, s*0.25, s*0.09, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#8f959c';
    ctx.beginPath(); ctx.arc(cx - s*0.09, cy + s*0.04, s*0.17, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8aeb5';
    ctx.beginPath(); ctx.arc(cx + s*0.1, cy - s*0.02, s*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7c828a';
    ctx.beginPath(); ctx.arc(cx + s*0.02, cy + s*0.12, s*0.13, 0, 6.3); ctx.fill();
    return;
  }
  const colMap = { stoneD:'#9aa0a6', coalD:'#31313a', ironD:'#a3674a', goldD:'#e0b83a' };
  const col = colMap[n.type] || '#888';
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy+s*0.26, s*0.31, s*0.12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.06, s*0.16, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.11, cy + s*0.11, s*0.14, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.02, cy - s*0.08, s*0.17, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.arc(cx - s*0.02, cy - s*0.14, s*0.07, 0, 6.3); ctx.fill();
}

function drawBuilding(b, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(b.type !== 'bridge'){
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(cx, sy + s*0.9, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  }
  const t = b.type;
  if(t === 'house'){
    ctx.fillStyle = '#d9c7a8';
    ctx.fillRect(sx + s*0.14, sy + s*0.34, s*0.72, s*0.56);
    ctx.fillStyle = '#a8563c';
    ctx.beginPath();
    ctx.moveTo(sx + s*0.06, sy + s*0.36);
    ctx.lineTo(cx, sy + s*0.04);
    ctx.lineTo(sx + s*0.94, sy + s*0.36);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4523';
    ctx.fillRect(cx - s*0.1, sy + s*0.6, s*0.2, s*0.3);
  } else if(t === 'storage'){
    ctx.fillStyle = '#8d95a3';
    ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.58);
    ctx.fillStyle = '#6b7381';
    ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.14);
    ctx.fillStyle = '#c0a25a';
    ctx.fillRect(sx + s*0.24, sy + s*0.55, s*0.2, s*0.22);
    ctx.fillRect(sx + s*0.56, sy + s*0.55, s*0.2, s*0.22);
  } else if(t === 'farm'){
    ctx.fillStyle = '#7a6a2a';
    ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.6);
    ctx.fillStyle = '#d8bc44';
    for(let i=0;i<3;i++) ctx.fillRect(sx + s*0.16, sy + s*0.4 + i*s*0.16, s*0.68, s*0.08);
  } else if(t === 'grove'){
    ctx.fillStyle = '#3d6b34';
    ctx.fillRect(sx + s*0.1, sy + s*0.28, s*0.8, s*0.62);
    ctx.fillStyle = '#4e8f3f';
    for(let i=0;i<3;i++){
      const a = i*2.1 + b.px*0.01;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*s*0.22, cy + Math.sin(a)*s*0.18, s*0.16, 0, 6.3);
      ctx.fill();
    }
  } else if(t === 'mine'){
    ctx.fillStyle = '#4a4c60';
    ctx.fillRect(sx + s*0.14, sy + s*0.3, s*0.72, s*0.62);
    ctx.fillStyle = '#1a1a22';
    ctx.beginPath();
    ctx.moveTo(cx - s*0.2, sy + s*0.92);
    ctx.lineTo(cx - s*0.2, sy + s*0.62);
    ctx.arc(cx, sy + s*0.62, s*0.2, Math.PI, 0);
    ctx.lineTo(cx + s*0.2, sy + s*0.92);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a8fa5';
    ctx.fillRect(sx + s*0.18, sy + s*0.24, s*0.64, s*0.09);
  } else if(t === 'drill'){
    ctx.fillStyle = '#6a3a7a';
    ctx.fillRect(sx + s*0.2, sy + s*0.36, s*0.6, s*0.56);
    ctx.strokeStyle = '#c8a0e0';
    ctx.lineWidth = Math.max(1.5, s*0.07);
    ctx.beginPath();
    const ang = G.time*2.5;
    ctx.moveTo(cx, sy + s*0.34);
    ctx.lineTo(cx + Math.cos(ang)*s*0.3, sy + s*0.34 + Math.sin(ang)*s*0.16);
    ctx.stroke();
    ctx.fillStyle = '#3b2050';
    ctx.beginPath(); ctx.arc(cx, sy + s*0.34, s*0.09, 0, 6.3); ctx.fill();
  } else if(t === 'lumberjack'){
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
    ctx.fillStyle = '#5c4420';
    ctx.fillRect(sx + s*0.22, sy + s*0.45, s*0.56, s*0.2);
    ctx.fillStyle = '#d0c0a0';
    ctx.fillRect(sx + s*0.4, sy + s*0.7, s*0.2, s*0.2);
  } else if(t === 'quarry'){
    ctx.fillStyle = '#808690';
    ctx.fillRect(sx + s*0.15, sy + s*0.32, s*0.7, s*0.6);
    ctx.fillStyle = '#5a6068';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(sx + s*0.25 + (i%2)*s*0.4, sy + s*0.5 + Math.floor(i/2)*s*0.25, s*0.12, 0, 6.3);
      ctx.fill();
    }
  } else if(t === 'fisherman'){
    ctx.fillStyle = '#b0a080';
    ctx.fillRect(sx + s*0.15, sy + s*0.4, s*0.7, s*0.5);
    ctx.fillStyle = '#a8563c';
    ctx.beginPath();
    ctx.moveTo(sx + s*0.08, sy + s*0.42);
    ctx.lineTo(cx, sy + s*0.15);
    ctx.lineTo(sx + s*0.92, sy + s*0.42);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a7a9a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx + s*0.85, sy + s*0.5);
    ctx.lineTo(sx + s*0.85, sy + s*0.85);
    ctx.stroke();
  } else if(t === 'bakery'){
    ctx.fillStyle = '#d0a870';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.12);
    ctx.fillStyle = '#a86a3a';
    ctx.fillRect(sx + s*0.4, sy + s*0.55, s*0.2, s*0.2);
  } else if(t === 'market'){
    ctx.fillStyle = '#c8a040';
    ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.6);
    ctx.fillStyle = '#e0c060';
    ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.15);
    ctx.fillStyle = '#8a6a20';
    for(let i=0;i<3;i++) ctx.fillRect(sx + s*0.18 + i*s*0.24, sy + s*0.5, s*0.1, s*0.3);
  } else if(t === 'temple'){
    ctx.fillStyle = '#e8e0c8';
    ctx.fillRect(sx + s*0.15, sy + s*0.35, s*0.7, s*0.55);
    ctx.fillStyle = '#a89664';
    ctx.beginPath();
    ctx.moveTo(sx + s*0.08, sy + s*0.36);
    ctx.lineTo(cx, sy + s*0.08);
    ctx.lineTo(sx + s*0.92, sy + s*0.36);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0c060';
    ctx.fillRect(cx - s*0.06, sy + s*0.55, s*0.12, s*0.35);
  } else if(t === 'dock'){
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(sx + s*0.1, sy + s*0.45, s*0.8, s*0.45);
    ctx.fillStyle = '#5a4020';
    for(let i=0;i<4;i++) ctx.fillRect(sx + s*0.14 + i*s*0.2, sy + s*0.45, s*0.08, s*0.45);
    ctx.fillStyle = '#c8a860';
    ctx.beginPath(); ctx.arc(sx + s*0.75, sy + s*0.4, s*0.08, 0, 6.3); ctx.fill();
  } else if(t === 'bridge'){
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(sx + s*0.02, sy + s*0.22, s*0.96, s*0.56);
    ctx.fillStyle = '#6a4a2a';
    for(let i=0;i<4;i++) ctx.fillRect(sx + s*0.05 + i*s*0.24, sy + s*0.22, s*0.05, s*0.56);
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(sx + s*0.02, sy + s*0.22, s*0.96, s*0.05);
    ctx.fillRect(sx + s*0.02, sy + s*0.73, s*0.96, s*0.05);
  }
}

function drawUnit(u, sx, sy, s){
  const cx = sx, cy = sy;
  const bob = Math.sin(G.time*8 + u.phase)*1.2;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*0.22, s*0.19, s*0.08, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#9a7ad0' : '#e8d7b8';
  ctx.beginPath(); ctx.arc(cx, cy - s*0.06 + bob*0.3, s*0.13, 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#7a55b8' : '#3d7fc4';
  ctx.fillRect(cx - s*0.11, cy + bob*0.3, s*0.22, s*0.2);
  if(u.carry === 'wood'){
    ctx.fillStyle = '#8a5f2f';
    ctx.fillRect(cx + s*0.09, cy - s*0.14, s*0.14, s*0.09);
  } else if(u.carry === 'stone'){
    ctx.fillStyle = '#a8aeb5';
    ctx.beginPath(); ctx.arc(cx + s*0.15, cy - s*0.1, s*0.08, 0, 6.3); ctx.fill();
  }
}

function drawBoat(bo, sx, sy, s){
  const bob = Math.sin(G.time*2 + bo.phase)*1.5;
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, s*0.15, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#8a5a2a';
  ctx.beginPath();
  ctx.moveTo(-s*0.4, 0);
  ctx.lineTo(s*0.4, 0);
  ctx.lineTo(s*0.3, s*0.25);
  ctx.lineTo(-s*0.3, s*0.25);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a8703a';
  ctx.fillRect(-s*0.3, -s*0.02, s*0.6, s*0.05);
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = Math.max(1.5, s*0.05);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -s*0.35);
  ctx.stroke();
  ctx.fillStyle = 'rgba(240,240,220,.85)';
  ctx.beginPath();
  ctx.moveTo(s*0.02, -s*0.33);
  ctx.lineTo(s*0.28, -s*0.08);
  ctx.lineTo(s*0.02, -s*0.05);
  ctx.closePath(); ctx.fill();
  for(let i=0;i<bo.passengers.length;i++){
    ctx.fillStyle = '#e8d7b8';
    ctx.beginPath();
    ctx.arc(-s*0.22 + i*s*0.13, s*0.05, s*0.07, 0, 6.3);
    ctx.fill();
  }
  ctx.restore();
}

function render(){
  updCam();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#080a0e';
  ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled = z < 1;
  ctx.drawImage(tcan, 0, 0, MW*TS, MH*TS, ox, oy, MW*TS*z, MH*TS*z);

  const s = TS*z;
  const x0 = clamp(Math.floor(-ox/s)-1, 0, MW-1);
  const x1 = clamp(Math.ceil((W-ox)/s)+1, 0, MW-1);
  const y0 = clamp(Math.floor(-oy/s)-1, 0, MH-1);
  const y1 = clamp(Math.ceil((H-oy)/s)+1, 0, MH-1);

  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const n = nodes[y][x];
      if(n) drawNode(n, x*TS*z+ox, y*TS*z+oy, s);
    }
  }

  for(const b of G.buildings){
    const sx = b.tx*TS*z+ox, sy = b.ty*TS*z+oy;
    drawBuilding(b, sx, sy, s);
    if(G.sel === b){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.strokeRect(sx+2, sy+2, s-4, s-4);
    }
  }

  for(const u of G.units){
    if(u.inBoat) continue;
    const sx = u.x*z + ox, sy = u.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawUnit(u, sx, sy, s);
    if(G.sel === u){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, s*0.32, 0, 6.3); ctx.stroke();
    }
  }

  // маркеры ручных приказов
  for(const u of G.units){
    if(u.inBoat || u.state !== 'manualMove') continue;
    const mx = u.mvx*z + ox, my = u.mvy*z + oy;
    const pulse = 7 + Math.sin(G.time*6)*2.5;
    ctx.strokeStyle = 'rgba(120,225,160,.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, pulse, 0, 6.3); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx-5, my); ctx.lineTo(mx+5, my);
    ctx.moveTo(mx, my-5); ctx.lineTo(mx, my+5);
    ctx.stroke();
  }

  for(const bo of G.boats){
    const sx = bo.x*z + ox, sy = bo.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawBoat(bo, sx, sy, s);
    if(G.sel === bo){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, s*0.5, 0, 6.3); ctx.stroke();
    }
  }

  if(G.build && G.mouse.inside){
    const [wx,wy] = screenToWorld(G.mouse.x, G.mouse.y);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    if(tx>=0 && ty>=0 && tx<MW && ty<MH){
      if(G.build === 'demolish'){
        const bb = buildingAt(tx,ty);
        const hasRoad = roadGrid[ty] && roadGrid[ty][tx];
        if(bb || hasRoad){
          ctx.fillStyle = 'rgba(230,80,80,.35)';
          ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
          ctx.strokeStyle = '#e05a5a';
          ctx.lineWidth = 2;
          ctx.strokeRect(tx*TS*z+ox+1, ty*TS*z+oy+1, s-2, s-2);
        }
      } else {
        const ok = canPlace(G.build, tx, ty);
        ctx.fillStyle = ok ? 'rgba(90,220,120,.28)' : 'rgba(230,80,80,.28)';
        ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        ctx.strokeStyle = ok ? '#7fe08a' : '#e05a5a';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx*TS*z+ox+1, ty*TS*z+oy+1, s-2, s-2);
      }
    }
  }
}

// ============ PLACEMENT / DEMOLITION ============
function buildingAt(tx,ty){
  for(const b of G.buildings) if(b.tx===tx && b.ty===ty) return b;
  return null;
}

function canPlace(type, tx, ty){
  if(tx<1||ty<1||tx>=MW-1||ty>=MH-1) return false;
  const t = terrain[ty][tx].t;

  if(type === 'bridge'){
    if(t !== 'water') return false;
    if(buildingAt(tx,ty)) return false;
    return true;
  }

  if(type === 'road'){
    if(t === 'water') return false;
    if(roadGrid[ty][tx]) return false;
    if(buildingAt(tx,ty)) return false;
    return true;
  }

  if(t === 'water') return false;
  if(buildingAt(tx,ty)) return false;

  const def = BUILDINGS[type];

  if(type === 'mine' || type === 'drill'){
    const n = nodes[ty][tx];
    return !!(n && isDeposit(n.type));
  }

  if(def.coastal){
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=tx+dx, ny=ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      if(terrain[ny][nx].t === 'water') return true;
    }
    return false;
  }

  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) return false;
  return true;
}

function rebuildBridgeGrid(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) bridgeGrid[y][x]=false;
  for(const b of G.buildings) if(b.type==='bridge') bridgeGrid[b.ty][b.tx] = true;
}

function tryPlace(type, tx, ty){
  if(!canPlace(type, tx, ty)) return false;
  const cost = COSTS[type];
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); return false; }
  pay(cost);

  if(type === 'road'){
    roadGrid[ty][tx] = true;
    redrawRoad(tx, ty);
    return true;
  }

  const def = BUILDINGS[type];
  const b = {
    type, def, tx, ty,
    px: tx*TS+TS/2, py: ty*TS+TS/2,
    workers: [], deposit: null
  };
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) b.deposit = n.type;
  if(n && (n.type==='tree' || n.type==='rock')) nodes[ty][tx] = null;

  G.buildings.push(b);

  if(type === 'bridge'){
    bridgeGrid[ty][tx] = true;
    computeIslands();
  }
  if(type === 'dock'){
    spawnBoatFromDock(b);
  }
  return true;
}

function demolishBuilding(b){
  const idx = G.buildings.indexOf(b);
  if(idx < 0) return;
  G.buildings.splice(idx,1);

  for(const u of G.units){
    if(u.job === b){
      u.job = null;
      if(u.state === 'work' || u.state === 'goBuilding'){ u.state = 'idle'; u.idleT = 0.2; }
    }
  }

  const cost = COSTS[b.type];
  if(cost){
    for(const k in cost){
      const v = Math.floor(cost[k]*0.5);
      if(v > 0) addRes(k, v);
    }
  }

  if(b.type === 'bridge'){
    bridgeGrid[b.ty][b.tx] = false;
    computeIslands();
  }

  if(b.deposit){
    nodes[b.ty][b.tx] = { type: b.deposit, tx: b.tx, ty: b.ty };
  }

  if(G.sel === b) G.sel = null;
  updateInfoUI();
  updateResUI();
  toast('Снесено: ' + (b.def ? b.def.name : b.type));
}

function demolishRoad(tx,ty){
  if(!roadGrid[ty] || !roadGrid[ty][tx]) return;
  roadGrid[ty][tx] = false;
  redrawTile(tx,ty);
  const v = Math.floor((COSTS.road.stone||0)*0.5);
  if(v > 0) addRes('stone', v);
  updateResUI();
  toast('Дорога снесена');
}

function spawnBoatFromDock(dock){
  for(let r=1;r<=3;r++){
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const x=dock.tx+dx, y=dock.ty+dy;
        if(x<0||y<0||x>=MW||y>=MH) continue;
        if(terrain[y][x].t === 'water' && !(bridgeGrid[y] && bridgeGrid[y][x])){
          const bo = new Boat(x*TS+TS/2, y*TS+TS/2);
          G.boats.push(bo);
          toast('Лодка спущена на воду');
          return;
        }
      }
    }
  }
}

function spawnRobot(){
  const cost = COSTS.robot;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); return; }
  const houses = G.buildings.filter(b=>b.type==='house');
  if(!houses.length){ toast('Нужен хотя бы один дом'); return; }
  pay(cost);
  const h = houses[0];
  const u = new Unit(h.px + (Math.random()-0.5)*26, h.py + 26 + (Math.random()-0.5)*26, true);
  G.units.push(u);
  toast('Робот собран');
}

// ============ UI ============
const resbarEl = document.getElementById('resbar');
const buildEl  = document.getElementById('build');
const techEl   = document.getElementById('techpanel');
const toastEl  = document.getElementById('toast');
const infoEl   = document.getElementById('info');
const overlayEl = document.getElementById('overlay');
const tooltipEl = document.getElementById('tooltip');

let toastT = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.opacity = 1;
  toastT = 2.2;
}

// ---- tooltips ----
function showTooltip(html, sx, sy){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('open');
  positionTooltip(sx, sy);
}
function positionTooltip(sx, sy){
  const r = tooltipEl.getBoundingClientRect();
  let x = sx + 16, y = sy + 16;
  if(x + r.width > W - 8) x = sx - r.width - 12;
  if(y + r.height > H - 8) y = sy - r.height - 12;
  tooltipEl.style.left = Math.max(6, x) + 'px';
  tooltipEl.style.top  = Math.max(6, y) + 'px';
}
function hideTooltip(){ tooltipEl.classList.remove('open'); }

function buildTooltipHtml(id){
  const def = BUILDINGS[id];
  const name = def ? def.name : id;
  let html = `<b>${name}</b>`;
  if(def && def.desc) html += `<div>${def.desc}</div>`;
  if(def && def.workers) html += `<div class="tt-sub">Рабочих мест: ${def.workers}</div>`;
  const cost = COSTS[id];
  if(cost) html += `<div class="tt-cost">${costStr(cost)}</div>`;
  const req = REQS[id];
  if(req){
    const t = TECHS.find(t=>t.id===req);
    html += `<div class="tt-req">${G.techs[req] ? '✓ ' : '🔒 '}${t ? t.name : req}</div>`;
  }
  return html;
}

function placedTooltipHtml(b){
  let html = `<b>${b.def.name}</b><div>${b.def.desc || ''}</div>`;
  if(b.def.workers) html += `<div class="tt-sub">Рабочих: ${b.workers.length}/${b.def.workers}</div>`;
  if(b.deposit) html += `<div class="tt-cost">Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}</div>`;
  return html;
}

const buildBtns = {};
function makeBuildUI(){
  hideTooltip();
  buildEl.innerHTML = '';
  const list = ['house','storage','road','mine','farm','grove','lumberjack','quarry','fisherman','bakery','market','temple','dock','bridge','drill','robot','demolish'];
  for(const id of list){
    const div = document.createElement('div');
    div.className = 'btn' + (id === 'demolish' ? ' danger' : '');
    const name = BUILDINGS[id]?.name || id;
    const cost = COSTS[id];
    div.innerHTML = `<div>${name}</div><div class="c">${cost ? costStr(cost) : 'бесплатно'}</div>`;
    div.onclick = () => {
      const req = REQS[id];
      if(req && !G.techs[req]){
        const t = TECHS.find(t=>t.id===req);
        toast('Нужна технология: ' + (t ? t.name : req));
        return;
      }
      if(id === 'robot'){ spawnRobot(); return; }
      if(G.build === id) G.build = null;
      else G.build = id;
      refreshBuildUI();
    };
    div.addEventListener('mouseenter', e => showTooltip(buildTooltipHtml(id), e.clientX, e.clientY));
    div.addEventListener('mousemove', e => positionTooltip(e.clientX, e.clientY));
    div.addEventListener('mouseleave', hideTooltip);
    buildEl.appendChild(div);
    buildBtns[id] = div;
  }
}

function refreshBuildUI(){
  for(const id in buildBtns){
    const el = buildBtns[id];
    if(id === 'demolish'){
      el.classList.remove('dis');
      el.classList.toggle('active', G.build === id);
      continue;
    }
    const req = REQS[id];
    const locked = req && !G.techs[req];
    const afford = canAfford(COSTS[id]);
    el.classList.toggle('dis', locked || !afford);
    el.classList.toggle('active', G.build === id);
  }
}

function renderTech(){
  techEl.innerHTML = '<h3>Дерево технологий</h3>';
  for(const t of TECHS){
    const done = !!G.techs[t.id];
    const unlocked = !t.req || t.req.every(r => G.techs[r]);
    const div = document.createElement('div');
    div.className = 'tech' + (done ? ' done' : '') + (unlocked ? '' : ' locked');
    div.innerHTML = `<b>${t.name}</b><div class="td">${t.desc}</div>` +
      `<div class="tc">${done ? '✓ изучено' : costStr(t.cost)}</div>`;
    if(!done && unlocked){
      div.onclick = () => {
        if(pay(t.cost)){
          G.techs[t.id] = true;
          renderTech();
          refreshBuildUI();
          toast('Изучено: ' + t.name);
        } else {
          toast('Не хватает ресурсов');
        }
      };
    }
    techEl.appendChild(div);
  }
}

function updateResUI(){
  let html = '';
  for(const [k,name,col] of RES_INFO){
    html += `<div class="res"><span class="dot" style="background:${col}"></span>${name}: <b>${Math.floor(G.res[k])}</b></div>`;
  }
  html += `<div class="res">👥 <b>${G.units.filter(u=>!u.robot && !u.inBoat).length}</b>/${G.buildings.filter(b=>b.type==='house').length*4}</div>`;
  if(G.units.some(u=>u.robot))
    html += `<div class="res">🤖 <b>${G.units.filter(u=>u.robot).length}</b></div>`;
  if(G.boats.length)
    html += `<div class="res">⛵ <b>${G.boats.length}</b></div>`;
  html += `<div class="res">😊 <b>${Math.round(G.happiness)}</b></div>`;
  html += `<div class="res">📦 <b>${Math.floor(cap())}</b></div>`;
  resbarEl.innerHTML = html;
}

function updateInfoUI(){
  if(!G.sel){ infoEl.classList.remove('open'); return; }
  let html = '';
  if(G.sel instanceof Boat){
    const bo = G.sel;
    html = `<b>⛵ Лодка</b><br>Пассажиров: ${bo.passengers.length}/4` +
      `<br><span style="color:#8fa6c0;font-size:11px">ПКМ по земле — загрузить/выгрузить, по воде — плыть</span>`;
  } else if(G.sel instanceof Unit){
    const u = G.sel;
    const st = {idle:'свободен', goNode:'идёт к ресурсу', gather:'добывает',
      goStore:'несёт на склад', goBuilding:'идёт на работу', work:'работает',
      manualMove:'идёт по приказу'}[u.state] || u.state;
    html = `<b>${u.robot ? '🤖 Робот' : '🧑 Житель'}</b><br>Состояние: ${st}` +
      (u.job ? `<br>Работа: ${u.job.def.name}` : '') +
      (u.carry ? `<br>Несёт: ${RES_NAMES[u.carry] || u.carry} x${u.carryAmt}` : '') +
      `<br><span style="color:#8fa6c0;font-size:11px">Кликните по земле, чтобы отправить туда</span>`;
  } else {
    const b = G.sel;
    html = `<b>${b.def.name}</b><br>${b.def.desc}`;
    if(b.def.workers) html += `<br>Рабочих: ${b.workers.length}/${b.def.workers}`;
    if(b.deposit) html += `<br>Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}`;
    if(b.type === 'market'){
      html += `<br><button onclick="tradeRes('wood')">дерево 5→2з</button>`;
      html += `<button onclick="tradeRes('food')">еда 5→2з</button>`;
      html += `<button onclick="tradeRes('stone')">камень 5→2з</button>`;
      html += `<br><button onclick="buyRes('wood')">3з→дерево 5</button>`;
      html += `<button onclick="buyRes('food')">3з→еда 5</button>`;
    }
    if(b.type === 'dock'){
      html += `<br><button onclick="spawnExtraBoat()">Построить лодку (30 дер)</button>`;
    }
    if(b.type !== 'house' || G.buildings.filter(x=>x.type==='house').length > 1){
      html += `<br><button class="del" onclick="demolishSelected()">🗑 Снести</button>`;
    }
  }
  infoEl.innerHTML = html;
  infoEl.classList.add('open');
}

function tradeRes(res){
  if(G.res[res] >= 5){
    G.res[res] -= 5;
    addRes('gold', 2);
    toast(`Продано ${RES_NAMES[res]} за 2 золота`);
  } else toast('Недостаточно ресурса');
  updateResUI(); updateInfoUI();
}
function buyRes(res){
  if(G.res.gold >= 3){
    G.res.gold -= 3;
    addRes(res, 5);
    toast(`Куплено 5 ${RES_NAMES[res]}`);
  } else toast('Недостаточно золота');
  updateResUI(); updateInfoUI();
}
function spawnExtraBoat(){
  if(G.res.wood >= 30){
    G.res.wood -= 30;
    spawnBoatFromDock(G.sel);
  } else toast('Нужно 30 дерева');
  updateResUI(); updateInfoUI();
}
function demolishSelected(){
  if(G.sel && G.sel.def && G.buildings.indexOf(G.sel) >= 0) demolishBuilding(G.sel);
}
window.tradeRes = tradeRes; window.buyRes = buyRes; window.spawnExtraBoat = spawnExtraBoat;
window.demolishSelected = demolishSelected;

// ============ SAVE/LOAD ============
const SAVE_KEY = 'citysim_v3_';

function saveGame(slot){
  try {
    const data = {
      version: 3,
      terrain: terrain.map(row => row.map(t => t.t)),
      terrainV: terrain.map(row => row.map(t => t.v)),
      nodes: nodes.map(row => row.map(n => n ? {type:n.type, amount:n.amount} : null)),
      roadGrid: roadGrid.map(row => row.map(c => c ? 1 : 0)),
      res: {...G.res},
      techs: {...G.techs},
      time: G.time, growT: G.growT, happiness: G.happiness,
      buildings: G.buildings.map(b => ({
        type: b.type, tx: b.tx, ty: b.ty, deposit: b.deposit,
        workerIndices: b.workers.map(w => G.units.indexOf(w))
      })),
      units: G.units.map(u => ({
        x: u.x, y: u.y, robot: u.robot, state: u.state,
        jobIndex: u.job ? G.buildings.indexOf(u.job) : -1,
        carry: u.carry, carryAmt: u.carryAmt,
        timer: u.timer, idleT: u.idleT,
        targetTx: u.target ? u.target.tx : -1,
        targetTy: u.target ? u.target.ty : -1,
        inBoatIndex: u.inBoat ? G.boats.indexOf(u.inBoat) : -1,
        mvx: u.mvx, mvy: u.mvy
      })),
      boats: G.boats.map(bo => ({
        x: bo.x, y: bo.y, state: bo.state, target: bo.target,
        passengerIndices: bo.passengers.map(p => G.units.indexOf(p))
      })),
      cam: {x: cam.x, y: cam.y, zoom: cam.zoom},
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY + slot, JSON.stringify(data));
    return true;
  } catch(e){
    console.error('Save error', e);
    toast('Ошибка сохранения');
    return false;
  }
}

function loadGame(slot){
  try {
    const raw = localStorage.getItem(SAVE_KEY + slot);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || data.version !== 3) return false;

    terrain = data.terrain.map((row, y) => row.map((t, x) => ({ t, v: data.terrainV[y][x] })));
    nodes = data.nodes.map((row, y) => row.map((n, x) => n ? {type:n.type, amount:n.amount, tx:x, ty:y} : null));
    roadGrid = data.roadGrid.map(row => row.map(c => !!c));
    G.res = {...data.res};
    G.techs = {...data.techs};
    G.time = data.time;
    G.growT = data.growT;
    G.happiness = data.happiness || 50;

    G.buildings = data.buildings.map(bd => ({
      type: bd.type, def: BUILDINGS[bd.type], tx: bd.tx, ty: bd.ty,
      px: bd.tx*TS+TS/2, py: bd.ty*TS+TS/2,
      workers: [], deposit: bd.deposit
    }));

    G.units = data.units.map(ud => {
      const u = new Unit(ud.x, ud.y, ud.robot);
      u.state = ud.state;
      u.carry = ud.carry; u.carryAmt = ud.carryAmt;
      u.timer = ud.timer; u.idleT = ud.idleT;
      u.mvx = ud.mvx || 0; u.mvy = ud.mvy || 0;
      u.job = ud.jobIndex >= 0 ? G.buildings[ud.jobIndex] : null;
      const tn = (ud.targetTx >= 0) ? nodes[ud.targetTy]?.[ud.targetTx] : null;
      u.target = tn || null;
      return u;
    });

    data.buildings.forEach((bd, i) => {
      (bd.workerIndices || []).forEach(wi => {
        if(wi >= 0 && G.units[wi]) G.buildings[i].workers.push(G.units[wi]);
      });
    });

    G.boats = data.boats.map(bod => {
      const bo = new Boat(bod.x, bod.y);
      bo.state = bod.state;
      bo.target = bod.target;
      return bo;
    });

    data.boats.forEach((bod, i) => {
      (bod.passengerIndices || []).forEach(pi => {
        if(pi >= 0 && G.units[pi]){
          G.boats[i].passengers.push(G.units[pi]);
          G.units[pi].inBoat = G.boats[i];
        }
      });
    });

    cam.x = data.cam.x; cam.y = data.cam.y; cam.zoom = data.cam.zoom;
    clampCam();

    rebuildBridgeGrid();
    computeIslands();
    renderTerrain();
    renderTech();
    makeBuildUI();
    refreshBuildUI();
    G.gameStarted = true;
    return true;
  } catch(e){
    console.error('Load error', e);
    toast('Ошибка загрузки');
    return false;
  }
}

function listSaves(){
  const out = [];
  for(let i=0;i<3;i++){
    const raw = localStorage.getItem(SAVE_KEY + i);
    if(raw){
      try {
        const d = JSON.parse(raw);
        out.push({slot: i, exists: true, savedAt: d.savedAt});
      } catch(e){ out.push({slot: i, exists: false}); }
    } else out.push({slot: i, exists: false});
  }
  return out;
}

function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0,5);
}

// ============ MENU ============
const menubtn = document.getElementById('menubtn');
const techbtn = document.getElementById('techbtn');

menubtn.onclick = () => openMenu('main');
techbtn.onclick = () => { techEl.classList.toggle('open'); renderTech(); };

function openMenu(view){
  hideTooltip();
  overlayEl.classList.add('open');
  if(view === 'main') renderMenuMain();
  else if(view === 'save') renderMenuSave();
  else if(view === 'load') renderMenuLoad();
}

function closeMenu(){
  overlayEl.classList.remove('open');
  overlayEl.innerHTML = '';
}

function renderMenuMain(){
  const hasSaves = listSaves().some(s=>s.exists);
  let html = `<div class="menu-box">
    <h2>Поселение</h2>
    <button onclick="startNewGame()">🌱 Новая игра</button>
    <button onclick="openMenu('load')" ${hasSaves ? '' : 'disabled'}>📂 Загрузить</button>
    <button onclick="openMenu('save')" ${G.gameStarted ? '' : 'disabled'}>💾 Сохранить</button>
    ${G.gameStarted ? '<button onclick="closeMenu()">▶ Продолжить игру</button>' : ''}
    <button class="back-btn" onclick="closeMenu()">✕ Закрыть</button>
  </div>`;
  overlayEl.innerHTML = html;
}

function renderMenuSave(){
  const saves = listSaves();
  let html = '<div class="menu-box"><h2>Сохранить игру</h2>';
  for(const s of saves){
    const info = s.exists ? formatDate(s.savedAt) : 'пусто';
    html += `<button onclick="doSave(${s.slot})">Слот ${s.slot+1}<span class="slot-info">${info}</span></button>`;
  }
  html += '<button class="back-btn" onclick="openMenu(\'main\')">◀ Назад</button></div>';
  overlayEl.innerHTML = html;
}

function renderMenuLoad(){
  const saves = listSaves();
  let html = '<div class="menu-box"><h2>Загрузить игру</h2>';
  for(const s of saves){
    const info = s.exists ? formatDate(s.savedAt) : 'пусто';
    html += `<button ${s.exists ? '' : 'disabled'} onclick="doLoad(${s.slot})">Слот ${s.slot+1}<span class="slot-info">${info}</span></button>`;
  }
  html += '<button class="back-btn" onclick="openMenu(\'main\')">◀ Назад</button></div>';
  overlayEl.innerHTML = html;
}

function doSave(slot){
  if(!G.gameStarted){ toast('Игра не начата'); return; }
  if(saveGame(slot)){
    toast('Игра сохранена');
    renderMenuSave();
  }
}

function doLoad(slot){
  if(loadGame(slot)){
    closeMenu();
    toast('Игра загружена');
    updateResUI();
    updateInfoUI();
  }
}

function startNewGame(){
  closeMenu();
  newGame();
}

window.openMenu = openMenu;
window.closeMenu = closeMenu;
window.doSave = doSave;
window.doLoad = doLoad;
window.startNewGame = startNewGame;

// ============ INPUT ============
const keys = {};
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  keys[e.key.toLowerCase()] = true;
  if(e.key === 'Escape'){
    if(G.build){ G.build = null; refreshBuildUI(); }
    else if(overlayEl.classList.contains('open')) closeMenu();
    else openMenu('main');
  }
  if(e.key.toLowerCase() === 't'){ techEl.classList.toggle('open'); renderTech(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let dragging = false, dragMoved = false, lastMX = 0, lastMY = 0;

canvas.addEventListener('mousedown', e => {
  if(e.button === 0 || e.button === 1 || e.button === 2){
    dragging = true; dragMoved = false;
    lastMX = e.clientX; lastMY = e.clientY;
    hideTooltip();
  }
});
canvas.addEventListener('mousemove', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.inside = true;
  if(dragging){
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    if(Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
    if(dragMoved){
      cam.x -= dx/cam.zoom;
      cam.y -= dy/cam.zoom;
      clampCam();
    }
    lastMX = e.clientX; lastMY = e.clientY;
    hideTooltip();
    return;
  }
  // подсказка при наведении на постройку
  if(!G.build && !overlayEl.classList.contains('open')){
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    const bb = buildingAt(tx, ty);
    if(bb) showTooltip(placedTooltipHtml(bb), e.clientX, e.clientY);
    else hideTooltip();
  }
});
addEventListener('mouseup', e => {
  if(dragging && !dragMoved && e.button === 0){
    handleClick(e.clientX, e.clientY);
  }
  dragging = false;
});
canvas.addEventListener('mouseleave', () => {
  G.mouse.inside = false; dragging = false; hideTooltip();
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  if(G.sel instanceof Boat){
    boatGoTo(G.sel, wx, wy);
    return;
  }
  G.build = null; refreshBuildUI();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx,wy] = screenToWorld(e.clientX, e.clientY);
  const f = e.deltaY > 0 ? 0.88 : 1.14;
  cam.zoom = clamp(cam.zoom * f, 0.35, 2.6);
  const [nx,ny] = screenToWorld(e.clientX, e.clientY);
  cam.x += wx - nx; cam.y += wy - ny;
  clampCam();
}, {passive:false});

function clampCam(){
  const halfW = (W/2)/cam.zoom, halfH = (H/2)/cam.zoom;
  const worldW = MW*TS, worldH = MH*TS;
  if(worldW < halfW*2) cam.x = worldW/2;
  else cam.x = clamp(cam.x, halfW, worldW-halfW);
  if(worldH < halfH*2) cam.y = worldH/2;
  else cam.y = clamp(cam.y, halfH, worldH-halfH);
}

function handleClick(sx, sy){
  const [wx, wy] = screenToWorld(sx, sy);
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);

  // режим сноса
  if(G.build === 'demolish'){
    const b = buildingAt(tx, ty);
    if(b){ demolishBuilding(b); return; }
    if(roadGrid[ty] && roadGrid[ty][tx]){ demolishRoad(tx, ty); return; }
    toast('Здесь нечего сносить');
    return;
  }

  if(G.build){
    if(tryPlace(G.build, tx, ty)){
      if(!keys['shift']) G.build = null;
      refreshBuildUI();
    }
    return;
  }

  let bestBoat = null, bd = 24/cam.zoom;
  for(const bo of G.boats){
    const d = Math.hypot(bo.x-wx, bo.y-wy);
    if(d < bd){ bd = d; bestBoat = bo; }
  }
  if(bestBoat){ G.sel = bestBoat; updateInfoUI(); return; }

  let bestUnit = null; bd = 22/cam.zoom;
  for(const u of G.units){
    if(u.inBoat) continue;
    const d = Math.hypot(u.x-wx, u.y-wy);
    if(d < bd){ bd = d; bestUnit = u; }
  }
  if(bestUnit){ G.sel = bestUnit; updateInfoUI(); return; }

  const b = buildingAt(tx,ty);
  if(b){ G.sel = b; updateInfoUI(); return; }

  // если выбран юнит — приказ идти
  if(G.sel instanceof Unit && !G.sel.inBoat){
    if(orderMove(G.sel, wx, wy)){ updateInfoUI(); return; }
  }

  G.sel = null;
  infoEl.classList.remove('open');
}

// ============ START ============
function findStart(){
  computeIslands();
  let bestIsland = -1, bestSize = 0;
  for(const id in islandSizes){
    if(islandSizes[id] > bestSize){ bestSize = islandSizes[id]; bestIsland = parseInt(id); }
  }
  let best = null, bestScore = -1e9;
  for(let y=6;y<MH-6;y++){
    for(let x=6;x<MW-6;x++){
      if(islandId[y][x] !== bestIsland) continue;
      if(terrain[y][x].t !== 'grass') continue;
      let trees = 0, water = 0, dep = 0;
      for(let dy=-4;dy<=4;dy++){
        for(let dx=-4;dx<=4;dx++){
          const nx = x+dx, ny = y+dy;
          if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
          const n = nodes[ny][nx];
          if(n && n.type==='tree') trees++;
          if(n && isDeposit(n.type)) dep++;
          if(terrain[ny][nx].t === 'water') water++;
        }
      }
      const score = trees*2 - dep*1.5 + Math.min(water, 8)*3 - Math.abs(x-MW/2)*0.1 - Math.abs(y-MH/2)*0.1;
      if(score > bestScore){ bestScore = score; best = {x,y}; }
    }
  }
  return best || {x: Math.floor(MW/2), y: Math.floor(MH/2)};
}

function newGame(){
  genWorld();
  renderTerrain();

  G.res = { wood:60, stone:20, food:40, coal:0, iron:0, gold:0 };
  G.units = []; G.buildings = []; G.boats = []; G.regrow = [];
  G.techs = {}; G.sel = null; G.build = null; G.time = 0; G.growT = 0;
  G.happiness = 50; G.gameStarted = true;

  const st = findStart();

  for(let dy=-2;dy<=2;dy++){
    for(let dx=-2;dx<=2;dx++){
      const x = st.x+dx, y = st.y+dy;
      if(x<0||y<0||x>=MW||y>=MH) continue;
      const n = nodes[y][x];
      if(n && !isDeposit(n.type)) nodes[y][x] = null;
    }
  }

  const house = {
    type:'house', def:BUILDINGS.house, tx:st.x, ty:st.y,
    px: st.x*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null
  };
  G.buildings.push(house);

  const stg = {
    type:'storage', def:BUILDINGS.storage, tx:st.x+1, ty:st.y,
    px: (st.x+1)*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null
  };
  G.buildings.push(stg);

  G.units.push(new Unit(house.px - 10, house.py + 22, false));
  G.units.push(new Unit(house.px + 12, house.py + 26, false));

  cam.x = st.x*TS + TS;
  cam.y = st.y*TS + TS;
  cam.zoom = 1.4;
  clampCam();

  renderTech();
  makeBuildUI();
  refreshBuildUI();
  updateResUI();
  toast('Добро пожаловать! Изучите технологии и постройте верфь для лодок');
}

// ============ LOOP ============
let last = performance.now();
let acc = 0;
let autosaveT = 0;

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.1) dt = 0.1;

  const spd = 520/cam.zoom * dt;
  let moved = false;
  if(keys['a'] || keys['arrowleft'] || keys['ф']){ cam.x -= spd; moved = true; }
  if(keys['d'] || keys['arrowright'] || keys['в']){ cam.x += spd; moved = true; }
  if(keys['w'] || keys['arrowup'] || keys['ц']){ cam.y -= spd; moved = true; }
  if(keys['s'] || keys['arrowdown'] || keys['ы']){ cam.y += spd; moved = true; }
  if(moved) clampCam();

  if(G.gameStarted && !overlayEl.classList.contains('open')){
    update(dt);
    autosaveT += dt;
    if(autosaveT > 90){ autosaveT = 0; saveGame('auto'); }
  }

  acc += dt;
  if(acc > 0.12){ acc = 0; updateResUI(); refreshBuildUI(); }

  if(toastT > 0){
    toastT -= dt;
    if(toastT <= 0) toastEl.style.opacity = 0;
  }

  render();
}

// ============ INIT ============
(function init(){
  genWorld();
  renderTerrain();
  cam.x = MW*TS/2; cam.y = MH*TS/2; cam.zoom = 0.5;
  clampCam();
  openMenu('main');
  requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;

#info{position:absolute;left:8px;top:100px;background:rgba(16,21,30,.92);

  padding:4px 9px;font-size:11px;cursor:pointer;margin-top:5px;margin-right:4px}

#logbox{position:absolute;bottom:160px;right:10px;width:270px;max-height:130px;overflow-y:auto;
  background:rgba(16,21,30,.85);border:1px solid #2f3a4b;border-radius:6px;
  padding:5px 8px;font-size:11px;z-index:4;line-height:1.4}

#overlay{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}
#overlay.open{display:flex}
.menu-box{background:#131b26;border:1px solid #2f3a4b;border-radius:12px;padding:26px;
  min-width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.menu-box h2{margin:0 0 20px;text-align:center;color:#9fc4ee;font-size:22px;letter-spacing:1px}
.menu-box button{display:block;width:100%;background:#1e2b3d;border:1px solid #3a4a5e;

#statsmodal{position:absolute;inset:0;background:rgba(5,8,12,.93);display:none;

  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(10px)}

::-webkit-scrollbar{width:8px}

<body>
<canvas id="c"></canvas>
<canvas id="minimap" width="180" height="135"></canvas>
<div id="resbar"></div>
<div id="questhud"></div>
<div id="topbar">
  <div class="timegroup">
    <div class="timebtn" data-speed="0" title="Пауза (пробел)">⏸</div>
    <div class="timebtn active" data-speed="1" title="1×">▶</div>
    <div class="timebtn" data-speed="2" title="2×">▶▶</div>
    <div class="timebtn" data-speed="4" title="4×">▶▶▶</div>
  </div>
  <div class="tbtn" id="questbtn">📜 Задания (Q)</div>
  <div class="tbtn" id="techbtn">🔬 Технологии (T)</div>
  <div class="tbtn" id="statsbtn">📊 Статистика (S)</div>
  <div class="tbtn" id="menubtn">☰ Меню</div>
</div>
<div id="info"></div>
<div id="build"></div>
<div id="questpanel" class="sidepanel"></div>
<div id="techpanel" class="sidepanel"></div>
<div id="logbox"></div>
<div id="overlay"></div>
<div id="statsmodal"><div class="menu-box"><h2>Статистика</h2><canvas id="statscanvas" width="680" height="400"></canvas><button class="back-btn" onclick="document.getElementById('statsmodal').classList.remove('open')">✕ Закрыть</button></div></div>
<div id="workersmodal"><div class="menu-box" id="workersbox"><h2>Рабочие</h2><div id="workerslist"></div><button class="back-btn" onclick="document.getElementById('workersmodal').classList.remove('open')">✕ Закрыть</button></div></div>
<div id="hint">WASD/стрелки — камера • колесо — зум • ЛКМ-протяжка — выделение • M — метка • Пробел — пауза</div>
<div id="toast"></div>
<div id="tooltip"></div>

<script>
"use strict";

// ============ UTILS ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const miniCan = document.getElementById('minimap');
const miniCtx = miniCan.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize', resize); resize();

const TS = 32, MW = 160, MH = 120;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const DAY_LENGTH = 100; // seconds per day at 1×
const DAYS_PER_SEASON = 3;
const SEASONS = ['spring','summer','autumn','winter'];
const SEASON_NAMES = {spring:'Весна', summer:'Лето', autumn:'Осень', winter:'Зима'};
const SEASON_FARM = {spring:1.1, summer:1.2, autumn:1.0, winter:0.5};

function hash(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct=4){
  let v=0, a=.5, f=1;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*131); f*=2; a*=.5; }
  return v;
}

// ============ WORLD ============
let terrain = [], nodes = [];
let islandId = [], islandSizes = {};
let roadGrid = [], bridgeGrid = [];
for(let y=0;y<MH;y++){
  roadGrid[y]=[]; bridgeGrid[y]=[];
  for(let x=0;x<MW;x++){ roadGrid[y][x]=false; bridgeGrid[y][x]=false; }
}
const DEPOSITS = {stoneD:'stone', coalD:'coal', ironD:'iron', goldD:'gold'};
const isDeposit = t => t in DEPOSITS;

function genWorld(){
  terrain=[]; nodes=[];
  const seed = Math.floor(Math.random()*100000);
  for(let y=0;y<MH;y++){
    terrain[y]=[]; nodes[y]=[];
    for(let x=0;x<MW;x++){
      const e = fbm(x*0.045, y*0.045, seed, 4);
      let t = 'grass';
      if(e < 0.37) t = 'water';
      else if(e < 0.41) t = 'sand';
      else if(e > 0.75) t = 'mountain';
      terrain[y][x] = {t, v: hash(x,y,seed+3)};
      nodes[y][x] = null;
    }
  }
  const cx0 = MW * 0.62;
  for(let y=2;y<MH-2;y++){
    const wobble = Math.sin(y*0.07)*10 + fbm(y*0.04, 50, seed+999)*16 - 8;
    const cx = cx0 + wobble;
    const halfW = 2.5 + hash(y,1,seed+555)*3.5;
    for(let x=Math.floor(cx-halfW); x<=Math.ceil(cx+halfW); x++){
      if(x<1||x>=MW-1) continue;
      if(hash(x,y,seed+777) > 0.10) terrain[y][x].t = 'water';
    }
  }
  for(let i=0;i<20;i++){
    const lx = 8 + Math.floor(hash(i,1,seed+888) * (MW-16));
    const ly = 8 + Math.floor(hash(1,i,seed+999) * (MH-16));
    const r = 2 + Math.floor(hash(i,i,seed+111) * 4);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      const x=lx+dx, y=ly+dy;
      if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
      if(Math.hypot(dx,dy) <= r && hash(x,y,seed+222) > 0.25) terrain[y][x].t = 'water';
    }
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(terrain[y][x].t !== 'grass') continue;
    const e = fbm(x*0.045, y*0.045, seed, 4);
    const m = fbm(x*0.07+40, y*0.07+40, seed+77, 3);
    const r = hash(x,y,seed+9);
    if(e > 0.55 && e < 0.75 && r > 0.88) nodes[y][x] = {type:'stoneD', tx:x, ty:y};
    else if(m > 0.60 && r > 0.72) nodes[y][x] = {type:'tree', tx:x, ty:y, amount:3};
    else if(r > 0.987) nodes[y][x] = {type:'rock', tx:x, ty:y, amount:2};
  }
  veins('coalD', 18, seed+201);
  veins('ironD', 12, seed+307);
  veins('goldD', 8, seed+409);
  veins('stoneD', 9, seed+501);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ roadGrid[y][x]=false; bridgeGrid[y][x]=false; }
  computeIslands();
  ensureAllOres(seed);
  return seed;
}

function ensureAllOres(seed){
  let mainIsland = -1, maxSize = 0;
  for(const id in islandSizes){
    if(islandSizes[id] > maxSize){ maxSize = islandSizes[id]; mainIsland = parseInt(id); }
  }
  for(const type of Object.keys(DEPOSITS)){
    let found = false;
    for(let y=0;y<MH && !found;y++)
      for(let x=0;x<MW && !found;x++)
        if(nodes[y][x] && nodes[y][x].type === type) found = true;
    if(found) continue;
    let attempts = 0;
    while(attempts < 800){
      const bx = 4 + Math.floor(Math.random() * (MW - 8));
      const by = 4 + Math.floor(Math.random() * (MH - 8));
      if(islandId[by][bx] !== mainIsland || terrain[by][bx].t !== 'grass'){ attempts++; continue; }
      const r = 2;
      let placed = 0;
      for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
        const x = bx+dx, y = by+dy;
        if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
        if(terrain[y][x].t !== 'grass') continue;
        if(nodes[y][x] && isDeposit(nodes[y][x].type)) continue;
        if(Math.hypot(dx,dy) <= r){ nodes[y][x] = { type, tx:x, ty:y }; placed++; }
      }
      if(placed > 0) break;
      attempts++;
    }
  }
}

function veins(type, count, seed){
  for(let i=0;i<count;i++){
    const bx = 6 + Math.floor(hash(i,1,seed) * (MW-12));
    const by = 6 + Math.floor(hash(1,i,seed+5) * (MH-12));
    const r = 1 + Math.floor(hash(i,i,seed+9) * 3);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      const x=bx+dx, y=by+dy;
      if(x<2||y<2||x>=MW-2||y>=MH-2) continue;
      if(terrain[y][x].t !== 'grass') continue;
      const n = nodes[y][x];
      if(n && isDeposit(n.type)) continue;
      if(Math.hypot(dx,dy) <= r && hash(x,y,seed+17) > 0.3) nodes[y][x] = {type, tx:x, ty:y};
    }
  }
}

function isWalkableTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  const t = terrain[ty][tx].t;
  if(t === 'mountain') return false;
  if(t !== 'water') return true;
  return bridgeGrid[ty] && bridgeGrid[ty][tx];
}

function computeIslands(){
  islandId = []; islandSizes = {};
  for(let y=0;y<MH;y++) islandId[y] = new Array(MW).fill(-1);
  let nextId = 0;
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      if(!isWalkableTile(x,y)) continue;
      if(islandId[y][x] !== -1) continue;
      const stack = [[x,y]];
      const id = nextId++;
      islandId[y][x] = id;
      let size = 0;
      while(stack.length){
        const [cx, cy] = stack.pop();
        size++;
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=cx+dx, ny=cy+dy;
          if(!isWalkableTile(nx,ny)) continue;
          if(islandId[ny][nx] !== -1) continue;
          islandId[ny][nx] = id;
          stack.push([nx,ny]);
        }
      }
      islandSizes[id] = size;
    }
  }
}

function getIslandAt(px, py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}
function getIslandTile(tx, ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return -1;
  return islandId[ty][tx];
}

// ============ PATHFINDING ============
function canWalkStraight(x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const d = Math.hypot(dx,dy);
  if (d < 6) return true;
  const steps = Math.ceil(d / 8);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const px = x1 + dx*t, py = y1 + dy*t;
    const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
    if (!isWalkableTile(tx, ty)) return false;
  }
  return true;
}
function findPath(sx, sy, tx, ty){
  const stx = Math.floor(sx/TS), sty = Math.floor(sy/TS);
  if (!isWalkableTile(stx, sty)) return null;
  if (!isWalkableTile(tx, ty)) return null;
  if (stx === tx && sty === ty) return [{x: tx*TS+16, y: ty*TS+16}];
  const open = [];
  const closed = new Set();
  const startH = Math.abs(tx-stx) + Math.abs(ty-sty);
  open.push({x: stx, y: sty, g: 0, f: startH, parent: null});
  let iter = 0;
  const maxIter = MW*MH*2;
  while (open.length > 0 && iter < maxIter) {
    iter++;
    let minIdx = 0;
    for (let i = 1; i < open.length; i++) if (open[i].f < open[minIdx].f) minIdx = i;
    const cur = open.splice(minIdx, 1)[0];
    const ck = cur.y*MW + cur.x;
    if (closed.has(ck)) continue;
    closed.add(ck);
    if (cur.x === tx && cur.y === ty) {
      const path = [];
      let n = cur;
      while (n) { path.unshift({x: n.x*TS+16, y: n.y*TS+16}); n = n.parent; }
      return path;
    }
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cur.x+dx, ny = cur.y+dy;
      if (!isWalkableTile(nx, ny)) continue;
      const nk = ny*MW+nx;
      if (closed.has(nk)) continue;
      const stepCost = (roadGrid[ny] && roadGrid[ny][nx]) ? 0.6 : 1;
      const g = cur.g + stepCost;
      const h = Math.abs(tx-nx) + Math.abs(ty-ny);
      let found = null;
      for (const o of open) if (o.x === nx && o.y === ny) { found = o; break; }
      if (found) {
        if (found.g > g) { found.g = g; found.f = g+h; found.parent = cur; }
      } else {
        open.push({x: nx, y: ny, g, f: g+h, parent: cur});
      }
    }
  }
  return null;
}

function cap(){ return 200 + G.buildings.filter(b=>b.type==='storage').length*150; }
function popCap(){
  let c = 0;
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type === 'house') c += 4;
    else if(b.type === 'apartment') c += 20;
  }
  return c;
}
function countHumans(){ return G.units.filter(u => !u.robot && !u.inBoat && !u.inHeli).length; }
function addRes(k,v){ G.res[k] = Math.min(cap(), G.res[k] + v); }
function canAfford(c){ for(const k in c) if(G.res[k] < c[k]) return false; return true; }
function pay(c){ if(!canAfford(c)) return false; for(const k in c) G.res[k] -= c[k]; return true; }
function costStr(c){ return Object.keys(c).map(k=>`${RES_NAMES[k]} ${c[k]}`).join(' · '); }
function getBuildTime(type){
  const cost = COSTS[type] || {};
  let sum = 0; for (const k in cost) sum += cost[k];
  return 8 + sum * 0.1;
}

// ============ TERRAIN RENDER ============
const tcan = document.createElement('canvas');
tcan.width = MW*TS; tcan.height = MH*TS;
const tctx = tcan.getContext('2d');
const TCOL = {
  grass: ['#4a7437','#517d3c','#446b32','#568440'],
  sand:  ['#c7b789','#c0b081','#cbbc8e'],
  water: ['#2b5c86','#27547b','#30628d'],
  mountain: ['#5a5a68','#525260','#606070']
};

function drawMountainTile(tctx, x, y){
  const v = terrain[y][x].v;
  const arr = TCOL.mountain;
  tctx.fillStyle = arr[Math.floor(v*arr.length) % arr.length];
  tctx.fillRect(x*TS, y*TS, TS+1, TS+1);
  tctx.fillStyle = '#7a7a8a';
  tctx.beginPath();
  tctx.moveTo(x*TS+TS/2, y*TS+5);
  tctx.lineTo(x*TS+TS-4, y*TS+TS-3);
  tctx.lineTo(x*TS+4, y*TS+TS-3);
  tctx.closePath(); tctx.fill();
  tctx.fillStyle = '#d0d0e0';
  tctx.beginPath();
  tctx.moveTo(x*TS+TS/2, y*TS+5);
  tctx.lineTo(x*TS+TS*0.62, y*TS+TS*0.35);
  tctx.lineTo(x*TS+TS*0.38, y*TS+TS*0.35);
  tctx.closePath(); tctx.fill();
}

function renderTerrain(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const t = terrain[y][x];
    if(t.t === 'mountain'){ drawMountainTile(tctx, x, y); continue; }
    const arr = TCOL[t.t];
    tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
    tctx.fillRect(x*TS, y*TS, TS+1, TS+1);
    if(roadGrid[y] && roadGrid[y][x]){
      tctx.fillStyle = '#6b6b6b';
      tctx.fillRect(x*TS+4, y*TS+4, TS-8, TS-8);
      tctx.fillStyle = '#7b7b7b';
      tctx.fillRect(x*TS+7, y*TS+7, TS-14, TS-14);
    }
  }
  for(let i=0;i<MW*MH*0.3;i++){
    const x = Math.floor(Math.random()*MW)*TS + Math.random()*TS;
    const y = Math.floor(Math.random()*MH)*TS + Math.random()*TS;
    const tx = Math.floor(x/TS), ty = Math.floor(y/TS);
    if(terrain[ty][tx].t === 'water' || terrain[ty][tx].t === 'mountain') continue;
    tctx.fillStyle = 'rgba(0,0,0,0.05)';
    tctx.fillRect(x, y, 2, 2);
  }
  tctx.strokeStyle = '#101820';
  tctx.lineWidth = 8;
  tctx.strokeRect(0,0,MW*TS,MH*TS);
  renderMiniBg();
}
function redrawTile(tx,ty){
  const t = terrain[ty][tx];
  if(t.t === 'mountain'){ drawMountainTile(tctx, tx, ty); return; }
  const arr = TCOL[t.t];
  tctx.fillStyle = arr[Math.floor(t.v*arr.length) % arr.length];
  tctx.fillRect(tx*TS, ty*TS, TS+1, TS+1);
}
function redrawRoad(tx,ty){
  redrawTile(tx,ty);
  tctx.fillStyle = '#6b6b6b';
  tctx.fillRect(tx*TS+4, ty*TS+4, TS-8, TS-8);
  tctx.fillStyle = '#7b7b7b';
  tctx.fillRect(tx*TS+7, ty*TS+7, TS-14, TS-14);
}

// ============ MINIMAP ============
const miniBg = document.createElement('canvas');
miniBg.width = 180; miniBg.height = 135;
const miniBgCtx = miniBg.getContext('2d');
function renderMiniBg(){
  const scaleX = miniBg.width / (MW*TS);
  const scaleY = miniBg.height / (MH*TS);
  for (let py = 0; py < miniBg.height; py++) {
    for (let px = 0; px < miniBg.width; px++) {
      const tx = Math.floor(px / scaleX / TS);
      const ty = Math.floor(py / scaleY / TS);
      const t = terrain[ty][tx].t;
      let col;
      if (t === 'water') col = '#2b5c86';
      else if (t === 'sand') col = '#c7b789';
      else if (t === 'mountain') col = '#5a5a68';
      else col = '#4a7437';
      miniBgCtx.fillStyle = col;
      miniBgCtx.fillRect(px, py, 1, 1);
    }
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (roadGrid[y][x]) {
      miniBgCtx.fillStyle = '#8a8a8a';
      miniBgCtx.fillRect(x * TS * scaleX, y * TS * scaleY, Math.max(1, TS*scaleX), Math.max(1, TS*scaleY));
    }
  }
}
function drawMinimap(){
  const scaleX = miniCan.width / (MW*TS);
  const scaleY = miniCan.height / (MH*TS);
  miniCtx.drawImage(miniBg, 0, 0);
  if (G.minimapMode === 'resources') {
    for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) {
      const n = nodes[y][x];
      if (!n) continue;
      let col = null;
      if (n.type==='tree') col = '#3a7d33';
      else if (n.type==='rock') col = '#a8aeb5';
      else if (n.type==='stoneD') col = '#9aa0a6';
      else if (n.type==='coalD') col = '#31313a';
      else if (n.type==='ironD') col = '#a3674a';
      else if (n.type==='goldD') col = '#e0b83a';
      if (col) {
        miniCtx.fillStyle = col;
        miniCtx.fillRect(x*TS*scaleX-0.5, y*TS*scaleY-0.5, 2, 2);
      }
    }
  }
  if (G.minimapMode === 'buildings') {
    for (const b of G.buildings) {
      miniCtx.fillStyle = b.constructionT > 0 ? '#887755' : '#e6c341';
      miniCtx.fillRect(b.tx*TS*scaleX-1, b.ty*TS*scaleY-1, 2.5, 2.5);
    }
  }
  if (G.minimapMode === 'normal') {
    for (const b of G.buildings) {
      miniCtx.fillStyle = b.constructionT > 0 ? '#887755' : (b.type==='house'?'#e8d7b8':(b.type==='storage'?'#c0a25a':'#e6c341'));
      miniCtx.fillRect(b.tx*TS*scaleX-1, b.ty*TS*scaleY-1, 2.5, 2.5);
    }
  }
  for (const u of G.units) {
    if (u.inBoat || u.inHeli) continue;
    miniCtx.fillStyle = u.robot ? '#9a7ad0' : '#7fe08a';
    miniCtx.fillRect(u.x*scaleX-0.5, u.y*scaleY-0.5, 1.5, 1.5);
  }
  for (const m of G.markers) {
    miniCtx.fillStyle = '#e6c341';
    miniCtx.fillRect(m.x*scaleX-1, m.y*scaleY-1, 2, 2);
  }
  const vx = -ox / z * scaleX;
  const vy = -oy / z * scaleY;
  const vw = W / z * scaleX;
  const vh = H / z * scaleY;
  miniCtx.strokeStyle = 'rgba(255,255,255,.85)';
  miniCtx.lineWidth = 1;
  miniCtx.strokeRect(vx, vy, vw, vh);
}
miniCan.addEventListener('click', e => {
  const r = miniCan.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  cam.x = (px / miniCan.width) * MW * TS;
  cam.y = (py / miniCan.height) * MH * TS;
  clampCam();
});
miniCan.addEventListener('contextmenu', e => {
  e.preventDefault();
  const modes = ['normal', 'resources', 'buildings'];
  G.minimapMode = modes[(modes.indexOf(G.minimapMode)+1) % modes.length];
  toast('Миникарта: ' + {normal:'обычная', resources:'ресурсы', buildings:'здания'}[G.minimapMode]);
});

    this.speed = baseSpeed * (0.9 + Math.random()*0.2);
    this.wax=0; this.way=0;
    this.stuckT=0; this.lx=x; this.ly=y;
    this.phase=Math.random()*6.28;
    this.inBoat=null; this.inHeli=null;
    this.mvx=0; this.mvy=0;
    this.path=null; this.pathIdx=0;
    this.pathTargetTx=-1; this.pathTargetTy=-1;
    this.unreachable=false;
    this.cloth = CLOTHES[(Math.random()*CLOTHES.length)|0];
    this.skin = SKINS[(Math.random()*SKINS.length)|0];
    this.width = 0.82 + Math.random()*0.36;
  }
}
class Boat {
  constructor(x,y){ this.x=x; this.y=y; this.passengers=[]; this.speed=75; this.state='idle'; this.target=null; this.phase=Math.random()*6.28; this.isBoat=true; }
}
class Heli {
  constructor(x,y){ this.x=x; this.y=y; this.passengers=[]; this.speed=115; this.state='idle'; this.target=null; this.phase=Math.random()*6.28; this.isHeli=true; }
}

// ============ MOVEMENT ============
function isWaterPx(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return true;
  if(terrain[ty][tx].t !== 'water') return false;
  if(bridgeGrid[ty] && bridgeGrid[ty][tx]) return false;
  return true;
}
function isWaterForBoat(px,py){
  const tx = Math.floor(px/TS), ty = Math.floor(py/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return false;
  return terrain[ty][tx].t === 'water';
}
function moveTo(u, tpx, tpy, dt){
  if (u.drone) {
    const dx = tpx-u.x, dy = tpy-u.y;
    const d = Math.hypot(dx,dy);
    if (d < 2.5) return true;
    const step = Math.min(d, u.speed*dt);
    u.x += dx/d*step; u.y += dy/d*step;
    return d < 3.5;
  }
  const ttx = Math.floor(tpx/TS), tty = Math.floor(tpy/TS);
  if (!u.path || u.pathTargetTx !== ttx || u.pathTargetTy !== tty) {
    if (canWalkStraight(u.x, u.y, tpx, tpy)) u.path = [{x: tpx, y: tpy}];
    else {
      u.path = findPath(u.x, u.y, ttx, tty);
      if (!u.path) { u.unreachable = true; return false; }
    }
    u.pathTargetTx = ttx; u.pathTargetTy = tty; u.pathIdx = 0;
  }
  while (u.pathIdx < u.path.length) {
    const wp = u.path[u.pathIdx];
    const dx = wp.x-u.x, dy = wp.y-u.y;
    const d = Math.hypot(dx,dy);
    if (d < 3) { u.pathIdx++; continue; }
    let sp = u.speed;
    const curTx = Math.floor(u.x/TS), curTy = Math.floor(u.y/TS);
    if (roadGrid[curTy] && roadGrid[curTy][curTx]) sp *= 1.7;
    const step = Math.min(d, sp*dt);
    let nx = u.x + dx/d*step;
    let ny = u.y + dy/d*step;
    if (isWaterPx(nx, u.y)) nx = u.x;
    if (isWaterPx(u.x, ny)) ny = u.y;
    u.x = nx; u.y = ny;
    return false;
  }
  return true;
}
function nearestStorage(u){
  let best=null, bd=1e18;
  if(u.drone){
    for(const b of G.buildings){
      if(b.constructionT > 0) continue;
      if(b.type!=='house' && b.type!=='storage' && b.type!=='apartment') continue;
      const d = (b.px-u.x)**2 + (b.py-u.y)**2;
      if(d<bd){ bd=d; best=b; }
    }
    return best;
  }
  const myIsland = getIslandAt(u.x, u.y);
  for(const b of G.buildings){
    if(b.constructionT > 0) continue;
    if(b.type!=='house' && b.type!=='storage' && b.type!=='apartment') continue;
    if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}
function assignJob(u){
  if(u.drone){
    let bn=null, bnd=1e18;
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      const n = nodes[y][x];
      if(!n) continue;
      if(n.type!=='tree' && n.type!=='rock') continue;
      if(n.amount <= 0) continue;
      const d = (x*TS+16-u.x)**2 + (y*TS+16-u.y)**2;
      if(d<bnd){ bnd=d; bn=n; }
    }
    if(bn){ u.target = bn; u.state = 'goNode'; return; }
    u.state = 'idle'; return;
  }
  const myIsland = getIslandAt(u.x, u.y);
  if(myIsland < 0) return;
  let best=null, bd=1e18;
  for(const b of G.buildings){
    const def = b.def;
    if(!def || !def.workers || def.auto) continue;
    if(b.constructionT > 0) continue;
    if(def.robotOnly && !u.robot) continue;
    if(b.workers.length >= def.workers) continue;
    if(getIslandTile(b.tx, b.ty) !== myIsland) continue;
    const d = (b.px-u.x)**2 + (b.py-u.y)**2;
    if(d<bd){ bd=d; best=b; }
  }
  if(best){
    best.workers.push(u);
    u.job = best;
    const a = Math.random()*6.28, r = 12+Math.random()*8;
    u.wax = Math.cos(a)*r; u.way = Math.sin(a)*r;
    u.state = 'goBuilding';
    return;
  }
  let bn=null, bnd=1e18;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const n = nodes[y][x];
    if(!n) continue;
    if(n.type!=='tree' && n.type!=='rock') continue;
    if(n.amount <= 0) continue;
    if(islandId[y][x] !== myIsland) continue;
    const d = (x*TS+16-u.x)**2 + (y*TS+16-u.y)**2;
    if(d<bnd){ bnd=d; bn=n; }
  }
  if(bn){ u.target = bn; u.state = 'goNode'; return; }
  u.state = 'idle';
}
function depositCarry(u){
  if(u.carry && u.carryAmt > 0) addRes(u.carry, u.carryAmt);
  u.carry = null; u.carryAmt = 0;
}
function updateUnit(u, dt){
  if(u.inBoat || u.inHeli) return;
  const moving = (u.state==='goNode'||u.state==='goStore'||u.state==='goBuilding'||u.state==='manualMove');
  if(moving){
    u.stuckT += dt;
    if(u.stuckT > 3.0){
      if(Math.hypot(u.x-u.lx, u.y-u.ly) < 5){
        if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
        u.job = null; u.target = null; u.state='idle'; u.idleT = 0.6; u.path = null;
      }
      u.stuckT = 0; u.lx = u.x; u.ly = u.y;
    }
  }
  switch(u.state){
    case 'idle': {
      u.idleT -= dt;
      if(u.idleT <= 0){ assignJob(u); u.idleT = 0.5; }
      break;
    }
    case 'manualMove': {
      u.unreachable = false;
      const arrived = moveTo(u, u.mvx, u.mvy, dt);
      if (u.unreachable || arrived) { u.state = 'idle'; u.idleT = 0.25; u.path = null; }
      break;
    }
    case 'goNode': {
      const n = u.target;
      if(!n || n.amount <= 0 || nodes[n.ty][n.tx] !== n){ u.state='idle'; u.target=null; u.path=null; break; }
      u.unreachable = false;
      const arrived = moveTo(u, n.tx*TS+16, n.ty*TS+16, dt);
      if (u.unreachable) { u.state='idle'; u.target=null; u.path=null; break; }
      if (arrived) { u.state='gather'; u.timer = u.drone ? 1.0 : 2.2; u.path=null; }
      break;
    }
    case 'gather': {
      u.timer -= dt;
      if(u.timer <= 0){
        const n = u.target;
        if(!n || nodes[n.ty][n.tx] !== n || n.amount <= 0){ u.state='idle'; u.target=null; break; }
        n.amount--;
        u.carry = (n.type === 'tree') ? 'wood' : 'stone';
        u.carryAmt = 5;
        if(n.amount <= 0){
          if(n.type === 'tree') G.regrow.push({ tx:n.tx, ty:n.ty, t: 30 + Math.random()*20 });
          else nodes[n.ty][n.tx] = null;
        }
        u.target = null; u.state = 'goStore';
      }
      break;
    }
    case 'goStore': {
      const s = nearestStorage(u);
      if(!s){ depositCarry(u); u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, s.px, s.py, dt);
      if (u.unreachable) { depositCarry(u); u.state='idle'; u.path=null; break; }
      if (arrived) { depositCarry(u); u.state='idle'; u.idleT = 0.25; u.path=null; }
      break;
    }
    case 'goBuilding': {
      const b = u.job;
      if(!b){ u.state='idle'; break; }
      u.unreachable = false;
      const arrived = moveTo(u, b.px + u.wax, b.py + u.way, dt);
      if (u.unreachable) {
        const i = b.workers.indexOf(u);
        if(i>=0) b.workers.splice(i,1);
        u.job = null; u.state='idle'; u.path=null;
        break;
      }
      if (arrived) { u.state = 'work'; u.path=null; }
      break;
    }
    case 'work': {
      if(!u.job || u.job.workers.indexOf(u) < 0){ u.state='idle'; u.job=null; }
      break;
    }
  }
}
function orderMove(u, wx, wy){
  if(u.inHeli) return false;
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(!u.drone && !isWalkableTile(tx,ty)) return false;
  if(u.job){
    const i = u.job.workers.indexOf(u);
    if(i>=0) u.job.workers.splice(i,1);
    u.job = null;
  }
  u.target = null; u.path = null;
  u.carry = null; u.carryAmt = 0;
  u.state = 'manualMove';
  u.mvx = tx*TS + TS/2 + (Math.random()-0.5)*10;
  u.mvy = ty*TS + TS/2 + (Math.random()-0.5)*10;
  u.stuckT = 0; u.lx = u.x; u.ly = u.y;
  return true;
}

// ============ BOATS ============
function updateBoat(bo, dt){
  if(bo.state === 'sailing' && bo.target){
    const dx = bo.target.x - bo.x, dy = bo.target.y - bo.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      bo.x = bo.target.x; bo.y = bo.target.y;
      const tgt = bo.target;
      bo.state = 'idle'; bo.target = null;
      if(tgt.landTx !== undefined){
        if(bo.passengers.length > 0) unloadPassengers(bo, tgt.landTx, tgt.landTy);
        else pickUpWorkers(bo);
      }
    } else {
      const step = Math.min(d, bo.speed*dt);
      const nx = bo.x + dx/d*step, ny = bo.y + dy/d*step;
      if(isWaterForBoat(nx, ny)){ bo.x = nx; bo.y = ny; }
      else { bo.state='idle'; bo.target=null; }
    }
  }
}
function boatGoTo(bo, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  const isLand = terrain[ty][tx].t !== 'water';
  if(isLand){
    const water = findNearestWaterToLand(tx, ty);
    if(!water) return;
    bo.target = { x: water.x*TS+TS/2, y: water.y*TS+TS/2, landTx: tx, landTy: ty };
  } else bo.target = { x: tx*TS+TS/2, y: ty*TS+TS/2 };
  bo.state = 'sailing';
}
function findNearestWaterToLand(tx, ty){
  for(let r=1;r<=6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=tx+dx, y=ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water') return {x, y};
  }
  return null;
}
function findNearestLandNearBoat(bo){
  const btx = Math.floor(bo.x/TS), bty = Math.floor(bo.y/TS);
  for(let r=1;r<=5;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=btx+dx, y=bty+dy;
    if(x<1||y<1||x>=MW-1||y>=MH-1) continue;
    if(terrain[y][x].t !== 'water' && terrain[y][x].t !== 'mountain' && !(bridgeGrid[y] && bridgeGrid[y][x])) return {x, y};
  }
  return null;
}
function boardWorker(bo, u){
  if(bo.passengers.length >= 4) return false;
  if(u.inBoat || u.inHeli) return false;
  if(u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inBoat = bo;
  bo.passengers.push(u);
  return true;
}
function pickUpWorkers(bo){
  if(bo.passengers.length >= 4) return;
  for(const u of G.units){
    if(u.robot || u.drone) continue;
    if(u.inBoat || u.inHeli) continue;
    if(u.state === 'gather' || u.state === 'work') continue;
    const d = Math.hypot(u.x - bo.x, u.y - bo.y);
    if(d < TS*4){
      boardWorker(bo, u);
      if(bo.passengers.length >= 4) break;
    }
  }
}
function unloadPassengers(bo, targetTx, targetTy){
  const land = findNearestLandNearBoat(bo) || {x:targetTx, y:targetTy};
  for(const u of bo.passengers){
    u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
    u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    u.inBoat = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  bo.passengers = [];
}

// ============ HELIS ============
function findNearestWalkable(px,py){
  const btx = Math.floor(px/TS), bty = Math.floor(py/TS);
  if(isWalkableTile(btx,bty)) return {x:btx, y:bty};
  for(let r=1;r<=8;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;
    const x=btx+dx, y=bty+dy;
    if(isWalkableTile(x,y)) return {x,y};
  }
  return null;
}
function boardHeli(h, u){
  if(h.passengers.length >= 3) return false;
  if(u.inBoat || u.inHeli) return false;
  if(u.drone) return false;
  if(u.carry && u.carryAmt > 0){ addRes(u.carry, u.carryAmt); u.carry=null; u.carryAmt=0; }
  if(u.job){ const i = u.job.workers.indexOf(u); if(i>=0) u.job.workers.splice(i,1); }
  u.job = null; u.target = null; u.state = 'idle';
  u.inHeli = h; h.passengers.push(u);
  return true;
}
function pickUpForHeli(h){
  if(h.passengers.length >= 3) return;
  for(const u of G.units){
    if(u.robot || u.drone) continue;
    if(u.inBoat || u.inHeli) continue;
    if(u.state === 'gather' || u.state === 'work') continue;
    const d = Math.hypot(u.x - h.x, u.y - h.y);
    if(d < TS*5){
      boardHeli(h, u);
      if(h.passengers.length >= 3) break;
    }
  }
}
function unloadHeliPassengers(h){
  const land = findNearestWalkable(h.x, h.y);
  for(const u of h.passengers){
    if(land){
      u.x = land.x*TS + TS/2 + (Math.random()-0.5)*14;
      u.y = land.y*TS + TS/2 + (Math.random()-0.5)*14;
    }
    u.inHeli = null; u.state = 'idle'; u.idleT = 0.3; u.path = null;
  }
  h.passengers = [];
}
function updateHeli(h, dt){
  if(h.state === 'sailing' && h.target){
    const dx = h.target.x - h.x, dy = h.target.y - h.y;
    const d = Math.hypot(dx,dy);
    if(d < 4){
      h.x = h.target.x; h.y = h.target.y;
      h.target = null; h.state = 'idle';
      if(h.passengers.length > 0) unloadHeliPassengers(h);
      else pickUpForHeli(h);
    } else {
      const step = Math.min(d, h.speed*dt);
      h.x += dx/d*step; h.y += dy/d*step;
    }
  }
}
function heliGoTo(h, wx, wy){
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH) return;
  h.target = { x: wx, y: wy };
  h.state = 'sailing';
}
function spawnHeliFromPad(pad){
  const h = new Heli(pad.px, pad.py - TS);
  G.helis.push(h);
  toast('Вертолёт поднялся в воздух');
}

// ============ RATES & NEEDS ============
function currentForgeState(){
  const activeForges = G.buildings.filter(b => b.type === 'forge' && b.workers.length > 0 && b.constructionT <= 0);
  let coalUse = 0;
  for (const f of activeForges) coalUse += 0.05 * f.workers.length;
  const active = coalUse > 0 && G.res.coal >= coalUse * 0.5;
  return { coalUse, active, bonus: active ? (1 + activeForges.length * 0.15) : 1 };
}
function currentOfficeBoost(){
  const libs = G.buildings.filter(b => b.type === 'library' && b.workers.length > 0 && b.constructionT <= 0).length;
  return Math.min(1.6, 1 + 0.2 * libs);
}
function farmBoost(b){
  let boost = 1;
  for (const w of G.buildings) {
    if (w.type !== 'windmill' || w.constructionT > 0) continue;
    if (Math.hypot(w.tx - b.tx, w.ty - b.ty) <= 5) boost += 0.25;
  }
  return Math.min(boost, 2);
}
function buildingResourceStatus(b) {
  if (!b.def || !b.def.workers) return null;
  if (b.constructionT > 0) return null;
  const w = b.workers.length;
  if (w === 0) return null;
  if (b.type === 'bakery') {
    const need = 0.15 * w;
    if (G.res.wood < need) return { res: 'wood', needed: need };
  } else if (b.type === 'tavern') {
    const need = 0.15 * w;
    if (G.res.food < need) return { res: 'food', needed: need };
  } else if (b.type === 'bathhouse') {
    const need = 0.1 * w;
    if (G.res.wood < need) return { res: 'wood', needed: need };
  } else if (b.type === 'forge') {
    const fs = currentForgeState();
    if (!fs.active) return { res: 'coal', needed: 0.05 * w };
  } else if (b.type === 'factory') {
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if (robots > 0) {
      if (G.res.iron < 0.1 * robots) return { res: 'iron', needed: 0.1 * robots };
      if (G.res.gold < 0.02 * robots) return { res: 'gold', needed: 0.02 * robots };
    }
  }
  return null;
}
function buildingRate(b, forgeBonus){
  const r = {};
  const def = b.def;
  if (!def) return r;
  if (b.constructionT > 0) return r;
  if (forgeBonus === undefined) forgeBonus = currentForgeState().bonus;
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;
  if (def.auto) {
    if (b.type === 'drill' && b.deposit) {
      const res = DEPOSITS[b.deposit];
      const rate = res==='gold'?0.05 : res==='iron'?0.1 : res==='coal'?0.16 : 0.2;
      r[res] = (r[res]||0) + rate * forgeBonus;
    } else if (b.type === 'algae') r.food = (r.food||0) + 0.4;
    return r;
  }
  if (!def.workers) return r;
  const w = b.workers.length;
  if (w === 0) return r;
  if (b.type === 'mine' && b.deposit) {
    const res = DEPOSITS[b.deposit];
    const rate = res==='gold'?0.06 : res==='iron'?0.14 : res==='coal'?0.22 : 0.28;
    r[res] = (r[res]||0) + rate * w * forgeBonus;
  } else if (b.type === 'farm') {
    r.food = (r.food||0) + 0.35 * w * farmBoost(b) * seasonMul * weatherMul;
  } else if (b.type === 'grove') {
    r.wood = (r.wood||0) + 0.32 * w;
  } else if (b.type === 'lumberjack') {
    let near = 0;
    for (let dy=-4; dy<=4; dy++) for (let dx=-4; dx<=4; dx++) {
      const nx = b.tx+dx, ny = b.ty+dy;
      if (nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if (n && n.type==='tree' && n.amount > 0) near++;
    }
    r.wood = (r.wood||0) + 0.06 * w * Math.min(near, 12);
  } else if (b.type === 'quarry') {
    let near = 0;
    for (let dy=-4; dy<=4; dy++) for (let dx=-4; dx<=4; dx++) {
      const nx = b.tx+dx, ny = b.ty+dy;
      if (nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if (n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
    }
    r.stone = (r.stone||0) + 0.05 * w * Math.min(near, 10) * forgeBonus;
  } else if (b.type === 'fisherman') {
    r.food = (r.food||0) + 0.4 * w;
  } else if (b.type === 'bakery') {
    r.wood = (r.wood||0) - 0.15 * w;
    r.food = (r.food||0) + 0.6 * w;
  } else if (b.type === 'forge') r.coal = (r.coal||0) - 0.05 * w;
  else if (b.type === 'tavern') r.food = (r.food||0) - 0.15 * w;
  else if (b.type === 'bathhouse') r.wood = (r.wood||0) - 0.1 * w;
  else if (b.type === 'office') r.gold = (r.gold||0) + 0.08 * w * currentOfficeBoost();
  else if (b.type === 'factory') {
    const robots = b.workers.filter(x => x.robot && !x.drone).length;
    if (robots > 0) {
      r.iron = (r.iron||0) - 0.1 * robots;
      r.gold = (r.gold||0) - 0.02 * robots;
      r.gears = (r.gears||0) + 0.06 * robots;
    }
  }
  return r;
}
function computeGlobalRates(){
  const r = {wood:0, stone:0, food:0, coal:0, iron:0, gold:0, gears:0};
  const forge = currentForgeState();
  for (const b of G.buildings) {
    const br = buildingRate(b, forge.bonus);
    for (const k in br) r[k] = (r[k]||0) + br[k];
  }
  const pop = countHumans();
  const activeObs = G.buildings.filter(b => b.type === 'observatory' && b.workers.length > 0 && b.constructionT <= 0).length;
  let foodCons = pop * 0.028 * Math.max(0.5, 1 - activeObs * 0.1);
  r.food -= foodCons;
  return r;
}
function computeNeeds(){
  const pop = countHumans();
  const capP = popCap();
  let food = 100;
  if (G.res.food < 3) food = 0;
  else if (G.res.food < 15) food = 40;
  else if (G.rates.food < -0.05 && G.res.food < 80) food = 60;
  let housing = 100;
  if (capP > 0 && pop >= capP) housing = Math.max(20, 100 - (pop - capP) * 10);
  else if (capP === 0) housing = 30;
  let rec = 0;
  for (const b of G.buildings) {
    if (b.constructionT > 0) continue;
    if (b.type === 'park') rec += 10;
    else if (b.type === 'fountain') rec += 8;
    else if (b.type === 'theater') rec += 15 * b.workers.length;
    else if (b.type === 'tavern') rec += 10 * b.workers.length;
    else if (b.type === 'bathhouse') rec += 10 * b.workers.length;
  }
  rec = Math.min(100, rec);
  let faith = 0;
  for (const b of G.buildings) {
    if (b.constructionT > 0) continue;
    if (b.type === 'temple') faith += 25;
    else if (b.type === 'monument') faith += 20;
    else if (b.type === 'library') faith += 10 * b.workers.length;
    else if (b.type === 'school') faith += 8 * b.workers.length;
    else if (b.type === 'observatory') faith += 8 * b.workers.length;
  }
  faith = Math.min(100, faith);
  const offices = G.buildings.filter(b=>b.type==='office' && b.constructionT<=0).length;
  const mines = G.buildings.filter(b=>(b.type==='mine'||b.type==='drill'||b.type==='quarry') && b.constructionT<=0).length;
  const avg = (food + housing + rec + faith) / 4;
  const total = clamp(avg - offices*3 - mines*1, 0, 100);
  return {food, housing, recreation: rec, faith, total};
}

// ============ EVENTS / WEATHER ============
function pushLog(msg, type){
  G.log.push({time: G.time, msg, type: type||'info'});
  if (G.log.length > 100) G.log.shift();
  renderLog();
}
function triggerRandomEvent(){
  const r = Math.random();
  if (r < 0.30) triggerCaravan();
  else if (r < 0.55) {
    const amt = 20 + Math.floor(Math.random()*30);
    addRes('food', amt);
    pushLog(`Хороший урожай: +${amt} еды`, 'good');
    toast(`+${amt} еды`);
  } else if (r < 0.85) {
    G.weather = {type: 'storm', timer: 45, foodMult: 0.5};
    pushLog('Непогода: производство еды снижено на 45 секунд', 'warn');
    toast('Непогода — фермы работают вполсилы');
  } else {
    if (popCap() > countHumans() && G.res.food >= 20) {
      G.res.food -= 10;
      const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment') && b.constructionT<=0);
      if (homes.length) {
        const h = homes[0];
        const nu = new Unit(h.px + (Math.random()-0.5)*20, h.py + 20, false);
        G.units.push(nu);
        pushLog('Прибыл путник, поселился в вашем городе', 'good');
        toast('Путник присоединился к поселению');
      }
    } else {
      addRes('gold', 5);
      pushLog('Торговец оставил 5 золота', 'good');
    }
  }
}
function triggerCaravan(){
  const offers = [
    {label:'Продать 30 еды за 15 золота', give:{food:30}, get:{gold:15}},
    {label:'Продать 20 дерева за 10 золота', give:{wood:20}, get:{gold:10}},
    {label:'Купить 25 еды за 12 золота', give:{gold:12}, get:{food:25}},
  ];
  const offer = offers[Math.floor(Math.random()*offers.length)];
  const can = Object.keys(offer.give).every(k => G.res[k] >= offer.give[k]);
  if (!can) { pushLog('Караван уехал: у вас не хватило ресурсов', 'warn'); return; }
  const ov = document.getElementById('overlay');
  ov.classList.add('open');
  ov.innerHTML = `<div class="menu-box">
    <h2>🚚 Караван</h2>
    <p style="color:#d8e2f0;font-size:13px;margin-bottom:14px">Странствующий торговец предлагает сделку:</p>
    <button onclick="acceptCaravan(${JSON.stringify(offer.give)},${JSON.stringify(offer.get)})">✅ ${offer.label}</button>
    <button class="back-btn" onclick="closeCaravan()">✕ Отказаться</button>
  </div>`;
}
window.acceptCaravan = (give, get) => {
  for (const k in give) G.res[k] -= give[k];
  for (const k in get) addRes(k, get[k]);
  pushLog('Караван: сделка заключена', 'good');
  toast('Сделка заключена!');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('overlay').innerHTML = '';
};
window.closeCaravan = () => {
  pushLog('Караван уехал ни с чем', 'info');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('overlay').innerHTML = '';
};

// ============ PARTICLES ============
function spawnParticle(x, y, color, opts){
  opts = opts || {};
  G.particles.push({
    x, y,
    vx: (Math.random()-0.5) * (opts.speed || 20),
    vy: -Math.random() * (opts.speed || 20) - 10,
    life: opts.life || 1.5,
    maxLife: opts.life || 1.5,
    color,
    size: opts.size || 3,
  });
  if (G.particles.length > 80) G.particles.shift();
}
function updateParticles(dt){
  G.particleTimer += dt;
  if (G.particleTimer > 0.35) {
    G.particleTimer = 0;
    for (const b of G.buildings) {
      if (b.constructionT > 0) continue;
      if (b.type === 'forge') spawnParticle(b.px + (Math.random()-0.5)*10, b.py - 12, 'rgba(120,120,130,0.6)', {life: 2, size: 4, speed: 15});
      else if (b.type === 'factory') spawnParticle(b.px + (Math.random()-0.5)*14, b.py - 16, 'rgba(120,120,130,0.6)', {life: 2.2, size: 5, speed: 12});
      else if (b.type === 'bakery') spawnParticle(b.px, b.py - 10, 'rgba(220,200,160,0.5)', {life: 1.5, size: 3, speed: 8});
    }
  }
  for (let i = G.particles.length-1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 10 * dt;
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}

// ============ TIME ============
function updateTime(dt){
  G.dayTime += dt / DAY_LENGTH;
  if (G.dayTime >= 1) {
    G.dayTime -= 1;
    G.day++;
    if ((G.day-1) % DAYS_PER_SEASON === 0 && G.day > 1) {
      const idx = SEASONS.indexOf(G.season);
      G.season = SEASONS[(idx+1) % SEASONS.length];
      pushLog(`Наступила ${SEASON_NAMES[G.season].toLowerCase() === 'зима' ? 'зима' : SEASON_NAMES[G.season].toLowerCase()}`, 'info');
      toast(SEASON_NAMES[G.season]);
      if (G.season === 'spring') G.year++;
    }
  }
}
function getNightAlpha(){
  const t = G.dayTime;
  if (t < 0.25) return 0.55 * (1 - t/0.25);
  if (t > 0.75) return 0.55 * (t - 0.75) / 0.25;
  return 0;
}

// ============ WORLD UPDATE ============
function update(dt){
  G.time += dt;
  updateTime(dt);
  // Weather
  if (G.weather) {
    G.weather.timer -= dt;
    if (G.weather.timer <= 0) G.weather = null;
  }
  // Events
  G.eventTimer -= dt;
  if (G.eventTimer <= 0) {
    G.eventTimer = 90 + Math.random() * 60;
    triggerRandomEvent();
  }
  // Regrow
  for(let i=G.regrow.length-1;i>=0;i--){
    const r = G.regrow[i];
    r.t -= dt;
    if(r.t <= 0){
      const n = nodes[r.ty][r.tx];
      if(n && n.type === 'tree') n.amount = 3;
      G.regrow.splice(i,1);
    }
  }
  // Units
  for(const u of G.units) updateUnit(u, dt);
  for(const bo of G.boats) updateBoat(bo, dt);
  for(const h of G.helis) updateHeli(h, dt);
  // Construction
  for(const b of G.buildings){
    if (b.constructionT > 0) {
      b.constructionT -= dt;
      if (b.constructionT <= 0) {
        b.constructionT = 0;
        pushLog(`Построено: ${b.def.name}`, 'good');
      }
    }
  }
  // Production
  const forge = currentForgeState();
  const seasonMul = SEASON_FARM[G.season] || 1;
  const weatherMul = G.weather ? (G.weather.foodMult || 1) : 1;
  for(const b of G.buildings){
    const def = b.def;
    if(!def) continue;
    if(b.constructionT > 0) continue;
    if(def.auto){
      if(b.type === 'drill' && b.deposit){
        const res = DEPOSITS[b.deposit];
        const rate = res==='gold'?0.05 : res==='iron'?0.1 : res==='coal'?0.16 : 0.2;
        addRes(res, rate*dt*forge.bonus);
      } else if(b.type === 'algae') addRes('food', 0.4*dt);
      continue;
    }
    if(!def.workers) continue;
    const w = b.workers.length;
    if(w === 0) continue;
    if(b.type === 'mine' && b.deposit){
      const res = DEPOSITS[b.deposit];
      const rate = res==='gold'?0.06 : res==='iron'?0.14 : res==='coal'?0.22 : 0.28;
      addRes(res, rate*w*dt*forge.bonus);
    } else if(b.type === 'farm'){
      addRes('food', 0.35*w*farmBoost(b)*seasonMul*weatherMul*dt);
    } else if(b.type === 'grove'){
      addRes('wood', 0.32*w*dt);
    } else if(b.type === 'lumberjack'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && n.type==='tree' && n.amount > 0) near++;
      }
      addRes('wood', 0.06*w*Math.min(near, 12)*dt);
    } else if(b.type === 'quarry'){
      let near = 0;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
        const nx = b.tx+dx, ny = b.ty+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const n = nodes[ny][nx];
        if(n && (n.type==='rock' || n.type==='stoneD') && (n.amount === undefined || n.amount > 0)) near++;
      }
      addRes('stone', 0.05*w*Math.min(near, 10)*dt*forge.bonus);
    } else if(b.type === 'fisherman'){
      addRes('food', 0.4*w*dt);
    } else if(b.type === 'bakery'){
      const need = 0.15*w*dt;
      if(G.res.wood >= need){ G.res.wood -= need; addRes('food', 0.6*w*dt); }
    } else if(b.type === 'office'){
      addRes('gold', 0.08*w*currentOfficeBoost()*dt);
    } else if(b.type === 'factory'){
      const robots = b.workers.filter(x => x.robot && !x.drone).length;
      if(robots > 0){
        const needIron = 0.1 * robots * dt, needGold = 0.02 * robots * dt;
        if(G.res.iron >= needIron && G.res.gold >= needGold){
          G.res.iron -= needIron; G.res.gold -= needGold;
          addRes('gears', 0.06 * robots * dt);
        }
      }
    }
  }
  if(forge.active) G.res.coal = Math.max(0, G.res.coal - forge.coalUse * dt);
  // Pop food
  let pop = countHumans();
  const activeObservatories = G.buildings.filter(b => b.type === 'observatory' && b.workers.length > 0 && b.constructionT<=0).length;
  if(pop > 0){
    let foodCons = pop * 0.028;
    foodCons *= Math.max(0.5, 1 - activeObservatories * 0.1);
    G.res.food = Math.max(0, G.res.food - foodCons*dt);
  }
  // Consume for tavern/bathhouse
  for (const b of G.buildings) {
    if (b.constructionT > 0) continue;
    if (b.type === 'tavern' && b.workers.length > 0) {
      const need = 0.15 * b.workers.length * dt;
      if (G.res.food >= need) G.res.food -= need;
    }
    if (b.type === 'bathhouse' && b.workers.length > 0) {
      const need = 0.1 * b.workers.length * dt;
      if (G.res.wood >= need) G.res.wood -= need;
    }
  }
  // Needs & happiness
  const needs = computeNeeds();
  G.needs = needs;
  G.happiness = needs.total;
  // Growth
  G.growT += dt;
  const growthInterval = G.happiness >= 60 ? 12 : G.happiness >= 40 ? 18 : 30;
  if(G.growT > growthInterval){
    G.growT = 0;
    const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment') && b.constructionT<=0);
    const capP = popCap();
    const humans = countHumans();
    if(humans < capP && G.res.food >= 15 && homes.length){
      G.res.food -= 10;
      const h = homes[Math.floor(Math.random()*homes.length)];
      const nu = new Unit(h.px + (Math.random()-0.5)*20, h.py + 20 + (Math.random()-0.5)*20, false);
      G.units.push(nu);
      pushLog('Новый житель поселился', 'good');
    }
  }
  // Stats sampling
  G.statTimer += dt;
  if (G.statTimer > 2) {
    G.statTimer = 0;
    G.stats.push({
      t: G.time,
      pop: countHumans(),
      food: G.res.food, wood: G.res.wood, stone: G.res.stone, gold: G.res.gold,
      hap: G.happiness,
    });
    if (G.stats.length > 300) G.stats.shift();
  }
  // Quest updates
  updateQuests();
  if(G.infoT > 0){ G.infoT -= dt; if(G.infoT <= 0) infoEl.classList.remove('open'); }
}

// ============ QUESTS ============
function getActiveQuest(){
  for (const q of QUESTS) {
    if (!G.quests[q.id]) return q;
  }
  return null;
}
function updateQuests(){
  for (const q of QUESTS) {
    if (G.quests[q.id]) continue;
    if (q.check()) {
      G.quests[q.id] = true;
      pushLog(`Задание выполнено: ${q.title}`, 'good');
      toast(`✓ ${q.title}`);
      renderQuests();
      updateQuestHud();
      break;
    }
  }
}

// ============ RENDER ============
function drawNode(n, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if(n.type === 'tree'){
    if(n.amount <= 0){
      ctx.fillStyle = '#5a3d1e';
      ctx.beginPath(); ctx.arc(cx, cy+2, s*0.13, 0, 6.3); ctx.fill();
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.28, s*0.26, s*0.1, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#4a2f16';
    ctx.fillRect(cx - s*0.045, cy + s*0.02, s*0.09, s*0.24);
    ctx.fillStyle = '#2d6528';
    ctx.beginPath(); ctx.arc(cx, cy - s*0.06, s*0.29, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#3a7d33';
    ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.03, s*0.19, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s*0.14, cy + s*0.01, s*0.17, 0, 6.3); ctx.fill();
    return;
  }
  if(n.type === 'rock'){
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy+s*0.22, s*0.25, s*0.09, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#8f959c';
    ctx.beginPath(); ctx.arc(cx - s*0.09, cy + s*0.04, s*0.17, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8aeb5';
    ctx.beginPath(); ctx.arc(cx + s*0.1, cy - s*0.02, s*0.14, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7c828a';
    ctx.beginPath(); ctx.arc(cx + s*0.02, cy + s*0.12, s*0.13, 0, 6.3); ctx.fill();
    return;
  }
  const colMap = { stoneD:'#9aa0a6', coalD:'#31313a', ironD:'#a3674a', goldD:'#e0b83a' };
  const col = colMap[n.type] || '#888';
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy+s*0.26, s*0.31, s*0.12, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx - s*0.13, cy + s*0.06, s*0.16, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.11, cy + s*0.11, s*0.14, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.02, cy - s*0.08, s*0.17, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.arc(cx - s*0.02, cy - s*0.14, s*0.07, 0, 6.3); ctx.fill();
}
function drawBuilding(b, sx, sy, s){
  const cx = sx + s/2, cy = sy + s/2;
  if (b.constructionT > 0) {
    // Строится
    ctx.fillStyle = 'rgba(200,180,120,.18)';
    ctx.fillRect(sx+4, sy+4, s-8, s-8);
    ctx.strokeStyle = '#c8a050';
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 2;
    ctx.strokeRect(sx+4, sy+4, s-8, s-8);
    ctx.setLineDash([]);
    const total = getBuildTime(b.type);
    const pct = 1 - b.constructionT / total;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(sx + 4, sy + s*0.88, s - 8, Math.max(3, s*0.1));
    ctx.fillStyle = '#7fc27f';
    ctx.fillRect(sx + 4, sy + s*0.88, (s - 8) * pct, Math.max(3, s*0.1));
    return;
  }
  if(b.type !== 'bridge' && b.type !== 'algae'){
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(cx, sy + s*0.9, s*0.42, s*0.13, 0, 0, 6.3); ctx.fill();
  }
  const t = b.type;
  if(t === 'house'){
    ctx.fillStyle = '#d9c7a8'; ctx.fillRect(sx + s*0.14, sy + s*0.34, s*0.72, s*0.56);
    ctx.fillStyle = '#a8563c';
    ctx.beginPath(); ctx.moveTo(sx + s*0.06, sy + s*0.36); ctx.lineTo(cx, sy + s*0.04); ctx.lineTo(sx + s*0.94, sy + s*0.36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4523'; ctx.fillRect(cx - s*0.1, sy + s*0.6, s*0.2, s*0.3);
  } else if(t === 'apartment'){
    ctx.fillStyle = '#b8bcc8'; ctx.fillRect(sx + s*0.12, sy + s*0.1, s*0.76, s*0.8);
    ctx.fillStyle = '#8f94a4'; ctx.fillRect(sx + s*0.12, sy + s*0.1, s*0.76, s*0.1);
    ctx.fillStyle = '#5a7fa8';
    for(let ry=0;ry<3;ry++) for(let rx=0;rx<3;rx++) ctx.fillRect(sx + s*0.2 + rx*s*0.24, sy + s*0.28 + ry*s*0.2, s*0.14, s*0.13);
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(cx - s*0.09, sy + s*0.78, s*0.18, s*0.12);
  } else if(t === 'storage'){
    ctx.fillStyle = '#8d95a3'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.58);
    ctx.fillStyle = '#6b7381'; ctx.fillRect(sx + s*0.12, sy + s*0.32, s*0.76, s*0.14);
    ctx.fillStyle = '#c0a25a'; ctx.fillRect(sx + s*0.24, sy + s*0.55, s*0.2, s*0.22); ctx.fillRect(sx + s*0.56, sy + s*0.55, s*0.2, s*0.22);
  } else if(t === 'farm'){
    ctx.fillStyle = '#7a6a2a'; ctx.fillRect(sx + s*0.1, sy + s*0.3, s*0.8, s*0.6);
    ctx.fillStyle = '#d8bc44';
    for(let i=0;i<3;i++) ctx.fillRect(sx + s*0.16, sy + s*0.4 + i*s*0.16, s*0.68, s*0.08);
  } else if(t === 'grove'){
    ctx.fillStyle = '#3d6b34'; ctx.fillRect(sx + s*0.1, sy + s*0.28, s*0.8, s*0.62);
    ctx.fillStyle = '#4e8f3f';
    for(let i=0;i<3;i++){ const a = i*2.1 + b.px*0.01; ctx.beginPath(); ctx.arc(cx + Math.cos(a)*s*0.22, cy + Math.sin(a)*s*0.18, s*0.16, 0, 6.3); ctx.fill(); }
  } else if(t === 'mine'){
    ctx.fillStyle = '#4a4c60'; ctx.fillRect(sx + s*0.14, sy + s*0.3, s*0.72, s*0.62);
    ctx.fillStyle = '#1a1a22';

function drawUnit(u, sx, sy, s){
  const cx = sx, cy = sy;
  if(u.drone){
    const bob = Math.sin(G.time*6 + u.phase)*2.5;
    const fy = cy - s*0.15 + bob;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(cx, cy + s*0.3, s*0.15, s*0.06, 0, 0, 6.3); ctx.fill();
    const t = G.time * 30;
    for(let i=0;i<4;i++){
      const a = Math.PI/4 + i*Math.PI/2;
      const px = cx + Math.cos(a)*s*0.18;
      const py = fy + Math.sin(a)*s*0.13;
      ctx.strokeStyle = 'rgba(180,220,255,.75)'; ctx.lineWidth = Math.max(1.2, s*0.035);
      const r = s*0.09;
      const ct = Math.cos(t + i*0.5), st = Math.sin(t + i*0.5);
      ctx.beginPath(); ctx.moveTo(px - ct*r, py - st*r*0.45); ctx.lineTo(px + ct*r, py + st*r*0.45); ctx.stroke();
    }
    ctx.fillStyle = '#7a80a8'; ctx.beginPath(); ctx.arc(cx, fy, s*0.1, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#a8b0d0'; ctx.beginPath(); ctx.arc(cx, fy, s*0.05, 0, 6.3); ctx.fill();
    if(u.carry === 'wood'){ ctx.fillStyle = '#8a5f2f'; ctx.fillRect(cx + s*0.06, fy + s*0.13, s*0.1, s*0.07); }
    else if(u.carry === 'stone'){ ctx.fillStyle = '#a8aeb5'; ctx.beginPath(); ctx.arc(cx + s*0.1, fy + s*0.15, s*0.06, 0, 6.3); ctx.fill(); }
    return;
  }
  const wScale = u.width || 1;
  const bob = Math.sin(G.time*8 + u.phase)*1.2;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*0.22, s*0.19*wScale, s*0.08, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#9a7ad0' : (u.skin || '#e8d7b8');
  ctx.beginPath(); ctx.arc(cx, cy - s*0.06 + bob*0.3, s*0.13*(0.92 + 0.08*wScale), 0, 6.3); ctx.fill();
  ctx.fillStyle = u.robot ? '#7a55b8' : u.cloth;
  ctx.fillRect(cx - s*0.11*wScale, cy + bob*0.3, s*0.22*wScale, s*0.2);
  if(u.carry === 'wood'){ ctx.fillStyle = '#8a5f2f'; ctx.fillRect(cx + s*0.09*wScale, cy - s*0.14, s*0.14, s*0.09); }
  else if(u.carry === 'stone'){ ctx.fillStyle = '#a8aeb5'; ctx.beginPath(); ctx.arc(cx + s*0.15*wScale, cy - s*0.1, s*0.08, 0, 6.3); ctx.fill(); }
}

  const s = TS*z;
  const x0 = clamp(Math.floor(-ox/s)-1, 0, MW-1);
  const x1 = clamp(Math.ceil((W-ox)/s)+1, 0, MW-1);
  const y0 = clamp(Math.floor(-oy/s)-1, 0, MH-1);
  const y1 = clamp(Math.ceil((H-oy)/s)+1, 0, MH-1);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const n = nodes[y][x];
    if(n) drawNode(n, x*TS*z+ox, y*TS*z+oy, s);
  }
  for(const b of G.buildings){
    const sx = b.tx*TS*z+ox, sy = b.ty*TS*z+oy;
    drawBuilding(b, sx, sy, s);
    if (b.constructionT <= 0) {
      const status = buildingResourceStatus(b);
      if (status) {
        ctx.fillStyle = 'rgba(230,80,80,.85)';
        ctx.beginPath(); ctx.arc(sx + s*0.85, sy + s*0.15, Math.max(3, s*0.08), 0, 6.3); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, s*0.15)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', sx + s*0.85, sy + s*0.15);
      } else if (b.def && b.def.workers && b.workers.length === 0) {
        ctx.fillStyle = 'rgba(216,180,94,.7)';
        ctx.beginPath(); ctx.arc(sx + s*0.85, sy + s*0.15, Math.max(2.5, s*0.06), 0, 6.3); ctx.fill();
      }
    }
    if(G.sel === b){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.strokeRect(sx+2, sy+2, s-4, s-4);
    }
  }
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    const sx = u.x*z + ox, sy = u.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawUnit(u, sx, sy, s);
    if(G.sel === u || G.selectedUnits.includes(u)){
      ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, s*0.32, 0, 6.3); ctx.stroke();
    }
  }
  for(const u of G.selectedUnits){
    if(u.inBoat || u.inHeli || u.state !== 'manualMove') continue;
    const mx = u.mvx*z + ox, my = u.mvy*z + oy;
    const pulse = 6 + Math.sin(G.time*6)*2;
    ctx.strokeStyle = 'rgba(120,225,160,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, pulse, 0, 6.3); ctx.stroke();
  }
  for(const bo of G.boats){
    const sx = bo.x*z + ox, sy = bo.y*z + oy;
    if(sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    drawBoat(bo, sx, sy, s);
    if(G.sel === bo){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.5, 0, 6.3); ctx.stroke(); }
  }
  for(const h of G.helis){
    const sx = h.x*z + ox, sy = h.y*z + oy;
    if(sx < -60 || sx > W+60 || sy < -60 || sy > H+60) continue;
    drawHeli(h, sx, sy, s);
    if(G.sel === h){ ctx.strokeStyle = '#7fe08a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, s*0.48, 0, 6.3); ctx.stroke(); }
  }
  // Particles
  for (const p of G.particles) {
    const alpha = Math.min(1, p.life / p.maxLife);
    ctx.fillStyle = p.color.replace(/[\d.]+\)$/, alpha + ')');
    if (p.color.startsWith('rgba')) {
      const parts = p.color.match(/rgba\((\d+),(\d+),(\d+),[\d.]+\)/);
      if (parts) ctx.fillStyle = `rgba(${parts[1]},${parts[2]},${parts[3]},${alpha*0.6})`;
    }
    ctx.beginPath();
    ctx.arc(p.x*z+ox, p.y*z+oy, p.size*z, 0, 6.3);
    ctx.fill();
  }
  // Markers
  for (const m of G.markers) {
    const mx = m.x*z+ox, my = m.y*z+oy;
    ctx.strokeStyle = '#e6c341';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, my - 20*z); ctx.stroke();
    ctx.fillStyle = '#e6c341';
    ctx.beginPath(); ctx.moveTo(mx, my - 20*z); ctx.lineTo(mx + 12*z, my - 16*z); ctx.lineTo(mx, my - 12*z); ctx.closePath(); ctx.fill();
  }
  // Day/night overlay
  const nightAlpha = getNightAlpha();
  if (nightAlpha > 0.01) {
    ctx.fillStyle = `rgba(10,20,50,${nightAlpha})`;
    ctx.fillRect(0, 0, W, H);
    // Night lights
    ctx.globalCompositeOperation = 'lighter';
    for (const b of G.buildings) {
      if (b.constructionT > 0) continue;
      let glow = 0;
      if (b.type === 'house') glow = 0.5;
      else if (b.type === 'apartment') glow = 0.7;
      else if (b.type === 'tavern' || b.type === 'theater' || b.type === 'forge' || b.type === 'factory') glow = 0.6;
      if (glow > 0) {
        const bx = (b.tx*TS+TS/2)*z+ox;
        const by = (b.ty*TS+TS/2)*z+oy;
        const r = TS * z * 1.2;
        const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
        grad.addColorStop(0, `rgba(255,220,150,${glow*nightAlpha*0.5})`);
        grad.addColorStop(1, 'rgba(255,220,150,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(bx, by, r, 0, 6.3); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // Selection box
  if (G.boxSelect && G.boxSelect.active) {
    const bx = Math.min(G.boxSelect.x1, G.boxSelect.x2);
    const by = Math.min(G.boxSelect.y1, G.boxSelect.y2);
    const bw = Math.abs(G.boxSelect.x2 - G.boxSelect.x1);
    const bh = Math.abs(G.boxSelect.y2 - G.boxSelect.y1);
    ctx.fillStyle = 'rgba(120,200,255,.15)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(120,200,255,.85)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
  }
  // Build preview
  if(G.build && G.mouse.inside){
    const [wx,wy] = screenToWorld(G.mouse.x, G.mouse.y);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    if(tx>=0 && ty>=0 && tx<MW && ty<MH){
      if(G.build === 'demolish'){
        const bb = buildingAt(tx,ty);
        const hasRoad = roadGrid[ty] && roadGrid[ty][tx];
        if(bb || hasRoad){
          ctx.fillStyle = 'rgba(230,80,80,.35)';
          ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        }
      } else {
        const ok = canPlace(G.build, tx, ty);
        ctx.fillStyle = ok ? 'rgba(90,220,120,.28)' : 'rgba(230,80,80,.28)';
        ctx.fillRect(tx*TS*z+ox, ty*TS*z+oy, s, s);
        ctx.strokeStyle = ok ? '#7fe08a' : '#e05a5a';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx*TS*z+ox+1, ty*TS*z+oy+1, s-2, s-2);
      }
    }
  }
  // Marker mode cursor
  if (G.markerMode && G.mouse.inside) {
    ctx.strokeStyle = '#e6c341';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.mouse.x, G.mouse.y, 10, 0, 6.3); ctx.stroke();
  }
  drawMinimap();
}

// ============ PLACEMENT / DEMOLITION ============
function buildingAt(tx,ty){
  for(const b of G.buildings) if(b.tx===tx && b.ty===ty) return b;
  return null;
}
function canPlace(type, tx, ty){
  if(tx<1||ty<1||tx>=MW-1||ty>=MH-1) return false;
  const t = terrain[ty][tx].t;
  const def = BUILDINGS[type];
  if(type === 'bridge'){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(type === 'road'){ if(t === 'water' || t === 'mountain') return false; if(roadGrid[ty][tx]) return false; if(buildingAt(tx,ty)) return false; return true; }
  if(def && def.waterOnly){ if(t !== 'water') return false; if(buildingAt(tx,ty)) return false; return true; }
  if(t === 'water' || t === 'mountain') return false;
  if(buildingAt(tx,ty)) return false;
  if(type === 'mine' || type === 'drill'){ const n = nodes[ty][tx]; return !!(n && isDeposit(n.type)); }
  if(def.coastal){
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=tx+dx, ny=ty+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      if(terrain[ny][nx].t === 'water') return true;
    }
    return false;
  }
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) return false;
  return true;
}
function rebuildBridgeGrid(){
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) bridgeGrid[y][x]=false;
  for(const b of G.buildings) if(b.type==='bridge') bridgeGrid[b.ty][b.tx] = true;
}
function tryPlace(type, tx, ty){
  if(!canPlace(type, tx, ty)) return false;
  const cost = COSTS[type];
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); return false; }
  pay(cost);
  if(type === 'road'){ roadGrid[ty][tx] = true; redrawRoad(tx, ty); renderMiniBg(); return true; }
  const def = BUILDINGS[type];
  const b = { type, def, tx, ty, px: tx*TS+TS/2, py: ty*TS+TS/2, workers: [], deposit: null, constructionT: getBuildTime(type) };
  const n = nodes[ty][tx];
  if(n && isDeposit(n.type)) b.deposit = n.type;
  if(n && (n.type==='tree' || n.type==='rock')) nodes[ty][tx] = null;
  G.buildings.push(b);
  if(type === 'bridge'){ bridgeGrid[ty][tx] = true; computeIslands(); }
  if(type === 'dock') spawnBoatFromDock(b);
  if(type === 'helipad') spawnHeliFromPad(b);
  renderMiniBg();
  return true;
}
function demolishBuilding(b){
  const idx = G.buildings.indexOf(b);
  if(idx < 0) return;
  G.buildings.splice(idx,1);
  for(const u of G.units){
    if(u.job === b){ u.job = null; if(u.state === 'work' || u.state === 'goBuilding'){ u.state = 'idle'; u.idleT = 0.2; u.path=null; } }
  }
  const cost = COSTS[b.type];
  if(cost){ for(const k in cost){ const v = Math.floor(cost[k]*0.5); if(v > 0) addRes(k, v); } }
  if(b.type === 'bridge'){ bridgeGrid[b.ty][b.tx] = false; computeIslands(); }
  if(b.deposit) nodes[b.ty][b.tx] = { type: b.deposit, tx: b.tx, ty: b.ty };
  if(G.sel === b) G.sel = null;
  updateInfoUI(); updateResUI(); renderMiniBg();
  pushLog('Снесено: ' + (b.def ? b.def.name : b.type), 'info');
}
function demolishRoad(tx,ty){
  if(!roadGrid[ty] || !roadGrid[ty][tx]) return;
  roadGrid[ty][tx] = false;
  redrawTile(tx,ty);
  const v = Math.floor((COSTS.road.stone||0)*0.5);
  if(v > 0) addRes('stone', v);
  updateResUI(); renderMiniBg();
  pushLog('Дорога снесена', 'info');
}
function spawnBoatFromDock(dock){
  for(let r=1;r<=3;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
    const x=dock.tx+dx, y=dock.ty+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    if(terrain[y][x].t === 'water' && !(bridgeGrid[y] && bridgeGrid[y][x])){
      const bo = new Boat(x*TS+TS/2, y*TS+TS/2);
      G.boats.push(bo);
      pushLog('Лодка спущена на воду', 'good');
      return;
    }
  }
}
function spawnRobot(){
  const cost = COSTS.robot;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); return; }
  const homes = G.buildings.filter(b=>(b.type==='house'||b.type==='apartment') && b.constructionT<=0);
  if(!homes.length){ toast('Нужен хотя бы один дом'); return; }
  pay(cost);
  const h = homes[0];
  const u = new Unit(h.px + (Math.random()-0.5)*26, h.py + 26 + (Math.random()-0.5)*26, true);
  G.units.push(u);
  pushLog('Робот собран', 'good');
}
function spawnDrone(){
  const cost = COSTS.drone;
  if(!canAfford(cost)){ toast('Не хватает ресурсов'); return; }
  const factories = G.buildings.filter(b => b.type === 'factory' && b.constructionT<=0 && b.workers.some(w => w.robot && !w.drone));
  const homes = G.buildings.filter(b => (b.type === 'house' || b.type === 'apartment') && b.constructionT<=0);
  const from = factories.length ? factories[0] : (homes.length ? homes[0] : null);
  if(!from){ toast('Нужен дом или работающий завод'); return; }
  pay(cost);
  const u = new Unit(from.px + (Math.random()-0.5)*26, from.py + 26 + (Math.random()-0.5)*26, true);
  u.drone = true; u.speed = 110;
  G.units.push(u);
  pushLog('Дрон запущен', 'good');
}
function spawnExtraHeli(){
  if(!G.sel || G.sel.type !== 'helipad') return;
  if(G.res.wood >= 20 && G.res.iron >= 15){
    G.res.wood -= 20; G.res.iron -= 15;
    spawnHeliFromPad(G.sel);
  } else toast('Нужно 20 дерева и 15 железа');
  updateResUI(); updateInfoUI();
}
function spawnExtraBoat(){
  if(G.res.wood >= 30){ G.res.wood -= 30; spawnBoatFromDock(G.sel); }
  else toast('Нужно 30 дерева');
  updateResUI(); updateInfoUI();
}

// ============ UI ============
const resbarEl = document.getElementById('resbar');
const buildEl  = document.getElementById('build');
const techEl   = document.getElementById('techpanel');
const questEl  = document.getElementById('questpanel');
const questHudEl = document.getElementById('questhud');
const logEl    = document.getElementById('logbox');
const toastEl  = document.getElementById('toast');
const infoEl   = document.getElementById('info');
const overlayEl = document.getElementById('overlay');
const tooltipEl = document.getElementById('tooltip');

let toastT = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.opacity = 1;
  toastT = 2.2;
}
function showTooltip(html, sx, sy){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('open');
  positionTooltip(sx, sy);
}
function positionTooltip(sx, sy){
  const r = tooltipEl.getBoundingClientRect();
  let x = sx + 16, y = sy + 16;
  if(x + r.width > W - 8) x = sx - r.width - 12;
  if(y + r.height > H - 8) y = sy - r.height - 12;
  tooltipEl.style.left = Math.max(6, x) + 'px';
  tooltipEl.style.top  = Math.max(6, y) + 'px';
}
function hideTooltip(){ tooltipEl.classList.remove('open'); }

function renderLog(){
  let html = '';
  const entries = G.log.slice(-30).reverse();
  for (const e of entries) {
    const cls = 'log-entry ' + (e.type||'');
    const mins = Math.floor(e.time / 60);
    const secs = Math.floor(e.time % 60);
    const tstr = mins > 0 ? `${mins}м ${secs}с` : `${secs}с`;
    html += `<div class="${cls}"><span class="t">${tstr}</span>${e.msg}</div>`;
  }
  logEl.innerHTML = html;
}
function renderQuests(){
  let html = '<h3>📜 Задания</h3>';
  const active = getActiveQuest();
  for (const q of QUESTS) {
    const done = G.quests[q.id];
    const isActive = q === active;
    const cls = 'quest' + (done ? ' done' : '') + (isActive ? ' active' : '');
    let prog = '';
    if (q.progress && !done) prog = `<div class="qprog">${q.progress()}</div>`;
    html += `<div class="${cls}"><b>${done?'✓ ':''}${q.title}</b><div class="qd">${q.desc}</div>${prog}</div>`;
  }
  questEl.innerHTML = html;
}
function updateQuestHud(){
  const a = getActiveQuest();
  if (!a) { questHudEl.style.display = 'none'; return; }
  questHudEl.style.display = '';
  let prog = '';
  if (a.progress) prog = ' (' + a.progress() + ')';
  questHudEl.innerHTML = `📜 <b>${a.title}</b>${prog}`;
}
function buildTooltipHtml(id){
  const def = BUILDINGS[id];
  const name = def ? def.name : id;
  let html = `<b>${name}</b>`;
  if(def && def.desc) html += `<div>${def.desc}</div>`;
  if(def && def.workers) html += `<div class="tt-sub">Рабочих мест: ${def.workers}</div>`;
  if(def && def.robotOnly) html += `<div class="tt-sub">Только для роботов</div>`;
  if(def && def.waterOnly) html += `<div class="tt-sub">Строится на воде</div>`;
  const cost = COSTS[id];
  if(cost) html += `<div class="tt-cost">${costStr(cost)}</div>`;
  const req = REQS[id];
  if(req){
    const t = TECHS.find(t=>t.id===req);
    html += `<div class="tt-req">${G.techs[req] ? '✓ ' : '🔒 '}${t ? t.name : req}</div>`;
  }
  return html;
}
function placedTooltipHtml(b){
  let html = `<b>${b.def.name}</b><div>${b.def.desc || ''}</div>`;
  if (b.constructionT > 0) {
    const total = getBuildTime(b.type);
    const pct = Math.round((1 - b.constructionT/total) * 100);
    html += `<div class="tt-warn" style="color:#d8b45e">🏗 Строится: ${pct}%</div>`;
    return html;
  }
  if(b.def.workers) html += `<div class="tt-sub">Рабочих: ${b.workers.length}/${b.def.workers}</div>`;
  if(b.deposit) html += `<div class="tt-cost">Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}</div>`;
  const status = buildingResourceStatus(b);
  if (status) html += `<div class="tt-warn">⚠ Не хватает ${RES_NAMES[status.res]} — не работает</div>`;
  else if (b.def.workers && b.workers.length === 0) html += `<div class="tt-warn">⏳ Нет рабочих</div>`;
  const rates = buildingRate(b);
  const pos = [], neg = [];
  const blocked = !!status;
  for (const k in rates) {
    if (rates[k] > 0.005) pos.push(`<span style="color:${blocked?'#6c8098':'#7fc27f'}">+${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span>`);
    else if (rates[k] < -0.005) neg.push(`<span style="color:${blocked?'#6c8098':'#e08a7a'}">${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span>`);
  }
  if (pos.length || neg.length) {
    html += '<div class="tt-rate">';
    if (pos.length) html += '<div>' + pos.join(' ') + '</div>';
    if (neg.length) html += '<div>' + neg.join(' ') + '</div>';
    html += '</div>';
  }
  return html;
}
const buildBtns = {};
function makeBuildUI(){
  hideTooltip();
  buildEl.innerHTML = '';
  const list = ['house','apartment','storage','road','mine','farm','grove','lumberjack','quarry','fisherman','bakery','market','bigmarket','temple','park','fountain','theater','library','school','bathhouse','windmill','monument','dock','helipad','bridge','forge','observatory','tavern','office','algae','drill','factory','robot','drone','demolish'];
  for(const id of list){
    const div = document.createElement('div');
    div.className = 'btn' + (id === 'demolish' ? ' danger' : '');
    const name = BUILDINGS[id]?.name || id;
    const cost = COSTS[id];
    div.innerHTML = `<div>${name}</div><div class="c">${cost ? costStr(cost) : 'бесплатно'}</div>`;
    div.onclick = () => {
      const req = REQS[id];
      if(req && !G.techs[req]){
        const t = TECHS.find(t=>t.id===req);
        toast('Нужна технология: ' + (t ? t.name : req));
        return;
      }
      if(id === 'robot'){ spawnRobot(); return; }
      if(id === 'drone'){ spawnDrone(); return; }
      if(G.build === id) G.build = null;
      else { G.build = id; G.markerMode = false; }
      refreshBuildUI();
    };
    div.addEventListener('mouseenter', e => showTooltip(buildTooltipHtml(id), e.clientX, e.clientY));
    div.addEventListener('mousemove', e => positionTooltip(e.clientX, e.clientY));
    div.addEventListener('mouseleave', hideTooltip);
    buildEl.appendChild(div);
    buildBtns[id] = div;
  }
}
function refreshBuildUI(){
  for(const id in buildBtns){
    const el = buildBtns[id];
    if(id === 'demolish'){ el.classList.remove('dis'); el.classList.toggle('active', G.build === id); continue; }
    const req = REQS[id];
    const locked = req && !G.techs[req];
    const afford = canAfford(COSTS[id]);
    el.classList.toggle('dis', locked || !afford);
    el.classList.toggle('active', G.build === id);
  }
}
function renderTech(){
  techEl.innerHTML = '<h3>🔬 Дерево технологий</h3>';
  for(const t of TECHS){
    const done = !!G.techs[t.id];
    const unlocked = !t.req || t.req.every(r => G.techs[r]);
    const div = document.createElement('div');
    div.className = 'tech' + (done ? ' done' : '') + (unlocked ? '' : ' locked');
    div.innerHTML = `<b>${t.name}</b><div class="td">${t.desc}</div>` +
      `<div class="tc">${done ? '✓ изучено' : costStr(t.cost)}</div>`;
    if(!done && unlocked){
      div.onclick = () => {
        if(pay(t.cost)){
          G.techs[t.id] = true;
          renderTech(); refreshBuildUI(); renderQuests();
          pushLog('Изучено: ' + t.name, 'good');
          toast('Изучено: ' + t.name);
        } else toast('Не хватает ресурсов');
      };
    }
    techEl.appendChild(div);
  }
}
function updateResUI(){
  let html = '';
  for(const [k,name,col] of RES_INFO){
    const rate = G.rates[k] || 0;
    let rateColor = '#6c8098';
    if (rate > 0.005) rateColor = '#7fc27f';
    else if (rate < -0.005) rateColor = '#e08a7a';
    const sign = rate > 0.005 ? '+' : '';
    const rateStr = ` <span class="rt" style="color:${rateColor}">${sign}${rate.toFixed(1)}</span>`;
    html += `<div class="res"><span class="dot" style="background:${col}"></span>${name}: <b>${Math.floor(G.res[k])}</b>${rateStr}</div>`;
  }
  const humans = countHumans();
  html += `<div class="res">👥 <b>${humans}</b>/${popCap()}</div>`;

function updateInfoUI(){
  if(!G.sel){ infoEl.classList.remove('open'); return; }
  let html = '';
  if(G.sel instanceof Boat){
    const bo = G.sel;
    html = `<b>⛵ Лодка</b><br>Пассажиров: ${bo.passengers.length}/4<br><span style="color:#8fa6c0;font-size:11px">ПКМ по земле — погрузка/разгрузка</span>`;
  } else if(G.sel instanceof Heli){
    const h = G.sel;
    html = `<b>🚁 Вертолёт</b><br>Пассажиров: ${h.passengers.length}/3<br><span style="color:#8fa6c0;font-size:11px">ПКМ в любую точку — лететь</span>`;
  } else if(G.sel instanceof Unit){
    const u = G.sel;
    const st = {idle:'свободен', goNode:'идёт к ресурсу', gather:'добывает', goStore:'несёт на склад', goBuilding:'идёт на работу', work:'работает', manualMove:'идёт по приказу'}[u.state] || u.state;
    const name = u.drone ? '🚁 Дрон' : (u.robot ? '🤖 Робот' : '🧑 Житель');
    html = `<b>${name}</b><br>Состояние: ${st}${u.job ? `<br>Работа: ${u.job.def.name}` : ''}${u.carry ? `<br>Несёт: ${RES_NAMES[u.carry] || u.carry} x${u.carryAmt}` : ''}`;
  } else {
    const b = G.sel;
    html = `<b>${b.def.name}</b><br>${b.def.desc}`;
    if (b.constructionT > 0) {
      const total = getBuildTime(b.type);
      html += `<div class="warn" style="color:#d8b45e">🏗 Строится: ${Math.round((1-b.constructionT/total)*100)}%</div>`;
    } else {
      if(b.def.workers) html += `<br>Рабочих: ${b.workers.length}/${b.def.workers}`;
      if(b.def.robotOnly) html += `<br><span style="color:#c8a0e0">Только роботы</span>`;
      if(b.deposit) html += `<br>Залежь: ${RES_NAMES[DEPOSITS[b.deposit]] || b.deposit}`;
      const status = buildingResourceStatus(b);
      if (status) html += `<div class="warn">⚠ Не хватает ${RES_NAMES[status.res]} — не работает</div>`;
      else if (b.def.workers && b.workers.length === 0) html += `<div class="warn" style="color:#d8b45e">⏳ Нет рабочих</div>`;
      const rates = buildingRate(b);
      const blocked = !!status;
      let rateHtml = '';
      for (const k in rates) {
        if (rates[k] > 0.005) rateHtml += `<span style="color:${blocked?'#6c8098':'#7fc27f'}">+${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span> `;
        else if (rates[k] < -0.005) rateHtml += `<span style="color:${blocked?'#6c8098':'#e08a7a'}">${rates[k].toFixed(2)} ${RES_NAMES[k]}/с</span> `;
      }
      if (rateHtml) html += `<br>${rateHtml}`;
    }
    if(b.type === 'market'){
      html += `<br><button onclick="tradeRes('wood')">дерево 5→2з</button><button onclick="tradeRes('food')">еда 5→2з</button><button onclick="tradeRes('stone')">камень 5→2з</button>`;
      html += `<br><button onclick="buyRes('wood')">3з→дерево 5</button><button onclick="buyRes('food')">3з→еда 5</button>`;
    }
    if(b.type === 'bigmarket'){
      html += `<br><button onclick="tradeBig('iron')">железо 5→4з</button><button onclick="tradeBig('coal')">уголь 5→2з</button><button onclick="tradeBig('gears')">шестерёнки 5→8з</button>`;
      html += `<br><button onclick="buyBig('iron')">12з→железо 5</button><button onclick="buyBig('coal')">6з→уголь 5</button><button onclick="buyBig('gears')">24з→шестерёнки 5</button>`;
    }
    if(b.type === 'dock') html += `<br><button onclick="spawnExtraBoat()">Построить лодку (30 дер)</button>`;
    if(b.type === 'helipad') html += `<br><button onclick="spawnExtraHeli()">Построить вертолёт (20 дер, 15 жел)</button>`;
    if(b.type !== 'house' || G.buildings.filter(x=>x.type==='house').length > 1){
      html += `<br><button class="del" onclick="demolishSelected()">🗑 Снести</button>`;
    }
  }
  infoEl.innerHTML = html;
  infoEl.classList.add('open');
}

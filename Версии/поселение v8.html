function openStats(){
  const sm = document.getElementById('statsmodal');
  sm.classList.add('open');
  drawStats();
}
function drawStats(){
  const c = document.getElementById('statscanvas');
  const cx2 = c.getContext('2d');
  const w = c.width, h = c.height;
  cx2.fillStyle = '#0e1420';
  cx2.fillRect(0, 0, w, h);
  // Grid
  cx2.strokeStyle = '#1e2a3a';
  cx2.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    cx2.beginPath(); cx2.moveTo(40, i * h/5); cx2.lineTo(w - 20, i * h/5); cx2.stroke();
  }
  // Auto-range
  let maxPop = 1, maxFood = 1, maxWood = 1, maxStone = 1, maxGold = 1;
  for (const s of G.stats) {
    if (s.pop > maxPop) maxPop = s.pop;
    if (s.food > maxFood) maxFood = s.food;
    if (s.wood > maxWood) maxWood = s.wood;
    if (s.stone > maxStone) maxStone = s.stone;
    if (s.gold > maxGold) maxGold = s.gold;
  }
  const series = [
    {data: G.stats.map(s=>s.pop), color: '#7fe08a', max: maxPop*1.2, label: 'Население'},
    {data: G.stats.map(s=>s.food), color: '#d8a33c', max: maxFood*1.2, label: 'Еда'},
    {data: G.stats.map(s=>s.wood), color: '#7a5230', max: maxWood*1.2, label: 'Дерево'},
    {data: G.stats.map(s=>s.stone), color: '#9aa0a6', max: maxStone*1.2, label: 'Камень'},
    {data: G.stats.map(s=>s.gold), color: '#e6c341', max: maxGold*1.2, label: 'Золото'},
    {data: G.stats.map(s=>s.hap), color: '#6fa4e2', max: 100, label: 'Счастье'},
  ];
  const n = G.stats.length;
  if (n < 2) {
    cx2.fillStyle = '#6c8098'; cx2.font = '14px sans-serif'; cx2.textAlign = 'center';
    cx2.fillText('Собираем данные...', w/2, h/2);
    return;
  }
  const padL = 50, padR = 20, padT = 20, padB = 30;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  for (const s of series) {
    cx2.strokeStyle = s.color;
    cx2.lineWidth = 2;
    cx2.beginPath();
    for (let i = 0; i < n; i++) {
      const x = padL + (i / (n-1)) * plotW;
      const y = padT + plotH - (s.data[i] / s.max) * plotH;
      if (i === 0) cx2.moveTo(x, y);
      else cx2.lineTo(x, y);
    }
    cx2.stroke();
  }
  // Legend
  cx2.font = '12px sans-serif';
  cx2.textAlign = 'left';
  let ly = padT + 14;
  for (const s of series) {
    cx2.fillStyle = s.color;
    cx2.fillRect(w - 130, ly - 8, 10, 10);
    cx2.fillStyle = '#e8eef7';
    cx2.fillText(s.label, w - 115, ly);
    ly += 18;
  }
  // Time axis
  cx2.fillStyle = '#6c8098';
  cx2.font = '10px sans-serif';
  cx2.textAlign = 'center';
  const firstT = G.stats[0].t;
  const lastT = G.stats[n-1].t;
  for (let i = 0; i <= 4; i++) {
    const x = padL + (i/4) * plotW;
    const t = firstT + (i/4) * (lastT - firstT);
    cx2.fillText(Math.round(t) + 'с', x, h - 12);
  }
}

// ============ SAVE/LOAD ============
const SAVE_KEY = 'citysim_v4_';
function saveGame(slot){
  try {
    const data = {
      version: 4,
      terrain: terrain.map(row => row.map(t => t.t)),
      terrainV: terrain.map(row => row.map(t => t.v)),
      nodes: nodes.map(row => row.map(n => n ? {type:n.type, amount:n.amount} : null)),
      roadGrid: roadGrid.map(row => row.map(c => c ? 1 : 0)),
      res: {...G.res}, techs: {...G.techs},
      time: G.time, growT: G.growT, happiness: G.happiness,
      dayTime: G.dayTime, day: G.day, season: G.season, year: G.year,
      quests: {...G.quests}, weather: G.weather,
      markers: G.markers.map(m=>({x:m.x,y:m.y})),
      buildings: G.buildings.map(b => ({
        type: b.type, tx: b.tx, ty: b.ty, deposit: b.deposit,
        constructionT: b.constructionT || 0,
        workerIndices: b.workers.map(w => G.units.indexOf(w))
      })),
      units: G.units.map(u => ({
        x: u.x, y: u.y, robot: u.robot, drone: u.drone, state: u.state,
        cloth: u.cloth, skin: u.skin, width: u.width,
        jobIndex: u.job ? G.buildings.indexOf(u.job) : -1,
        carry: u.carry, carryAmt: u.carryAmt,
        timer: u.timer, idleT: u.idleT,
        targetTx: u.target ? u.target.tx : -1,
        targetTy: u.target ? u.target.ty : -1,
        inBoatIndex: u.inBoat ? G.boats.indexOf(u.inBoat) : -1,
        inHeliIndex: u.inHeli ? G.helis.indexOf(u.inHeli) : -1,
        mvx: u.mvx, mvy: u.mvy
      })),
      boats: G.boats.map(bo => ({
        x: bo.x, y: bo.y, state: bo.state, target: bo.target,
        passengerIndices: bo.passengers.map(p => G.units.indexOf(p))
      })),
      helis: G.helis.map(h => ({
        x: h.x, y: h.y, state: h.state, target: h.target,
        passengerIndices: h.passengers.map(p => G.units.indexOf(p))
      })),
      cam: {x: cam.x, y: cam.y, zoom: cam.zoom},
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY + slot, JSON.stringify(data));
    return true;
  } catch(e){ console.error('Save error', e); toast('Ошибка сохранения'); return false; }
}
function loadGame(slot){
  try {
    const raw = localStorage.getItem(SAVE_KEY + slot);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || data.version !== 4) return false;
    terrain = data.terrain.map((row, y) => row.map((t, x) => ({ t, v: data.terrainV[y][x] })));
    nodes = data.nodes.map((row, y) => row.map((n, x) => n ? {type:n.type, amount:n.amount, tx:x, ty:y} : null));
    roadGrid = data.roadGrid.map(row => row.map(c => !!c));
    G.res = {...data.res};
    if (G.res.gears === undefined) G.res.gears = 0;
    G.techs = {...data.techs};
    G.time = data.time; G.growT = data.growT; G.happiness = data.happiness || 50;
    G.dayTime = data.dayTime || 0.35; G.day = data.day || 1;
    G.season = data.season || 'spring'; G.year = data.year || 1;
    G.quests = {...(data.quests||{})};
    G.weather = data.weather || null;
    G.markers = (data.markers||[]).map(m=>({x:m.x,y:m.y}));
    G.buildings = data.buildings.map(bd => ({
      type: bd.type, def: BUILDINGS[bd.type], tx: bd.tx, ty: bd.ty,
      px: bd.tx*TS+TS/2, py: bd.ty*TS+TS/2,
      workers: [], deposit: bd.deposit,
      constructionT: bd.constructionT || 0
    }));
    G.units = data.units.map(ud => {
      const u = new Unit(ud.x, ud.y, ud.robot);
      if (ud.drone) { u.drone = true; u.speed = 110; }
      if (ud.cloth) u.cloth = ud.cloth;
      if (ud.skin) u.skin = ud.skin;
      if (ud.width) u.width = ud.width;
      u.state = ud.state;
      u.carry = ud.carry; u.carryAmt = ud.carryAmt;
      u.timer = ud.timer; u.idleT = ud.idleT;
      u.mvx = ud.mvx || 0; u.mvy = ud.mvy || 0;
      u.job = ud.jobIndex >= 0 ? G.buildings[ud.jobIndex] : null;
      const tn = (ud.targetTx >= 0) ? nodes[ud.targetTy]?.[ud.targetTx] : null;
      u.target = tn || null;
      return u;
    });
    data.buildings.forEach((bd, i) => {
      (bd.workerIndices || []).forEach(wi => { if(wi >= 0 && G.units[wi]) G.buildings[i].workers.push(G.units[wi]); });
    });
    G.boats = data.boats.map(bod => { const bo = new Boat(bod.x, bod.y); bo.state = bod.state; bo.target = bod.target; return bo; });
    data.boats.forEach((bod, i) => {
      (bod.passengerIndices || []).forEach(pi => {
        if(pi >= 0 && G.units[pi]){ G.boats[i].passengers.push(G.units[pi]); G.units[pi].inBoat = G.boats[i]; }
      });
    });
    G.helis = (data.helis || []).map(hd => { const h = new Heli(hd.x, hd.y); h.state = hd.state; h.target = hd.target; return h; });
    (data.helis || []).forEach((hd, i) => {
      (hd.passengerIndices || []).forEach(pi => {
        if(pi >= 0 && G.units[pi]){ G.helis[i].passengers.push(G.units[pi]); G.units[pi].inHeli = G.helis[i]; }
      });
    });
    cam.x = data.cam.x; cam.y = data.cam.y; cam.zoom = data.cam.zoom;
    clampCam();
    rebuildBridgeGrid();
    computeIslands();
    renderTerrain();
    renderTech();
    makeBuildUI();
    refreshBuildUI();
    renderQuests();
    updateQuestHud();
    G.stats = []; G.log = []; G.particles = [];
    G.gameStarted = true;
    return true;
  } catch(e){ console.error('Load error', e); toast('Ошибка загрузки'); return false; }
}
function listSaves(){
  const out = [];
  for(let i=0;i<3;i++){
    const raw = localStorage.getItem(SAVE_KEY + i);
    if(raw){ try { const d = JSON.parse(raw); out.push({slot: i, exists: true, savedAt: d.savedAt}); } catch(e){ out.push({slot: i, exists: false}); } }
    else out.push({slot: i, exists: false});
  }
  return out;
}
function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0,5);
}

const keys = {};
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if(k === ' '){ e.preventDefault(); togglePause(); }
  if(k === 'escape'){
    if(G.build){ G.build = null; refreshBuildUI(); }
    else if(G.markerMode){ G.markerMode = false; }
    else if(overlayEl.classList.contains('open')) closeMenu();
    else openMenu('main');
  }
  if(k === 't'){ techEl.classList.toggle('open'); renderTech(); questEl.classList.remove('open'); }
  if(k === 'q'){ questEl.classList.toggle('open'); renderQuests(); techEl.classList.remove('open'); }
  if(k === 's' && !e.shiftKey){ openStats(); }
  if(k === 'm'){ G.markerMode = !G.markerMode; G.build = null; refreshBuildUI(); toast(G.markerMode ? 'Режим меток включён' : 'Режим меток выключен'); }
  // Hotkeys for buildings
  const hk = {'1':'house','2':'storage','3':'farm','4':'mine','5':'road','6':'market','7':'temple','8':'park','9':'demolish'};
  if(hk[k]){
    const id = hk[k];
    const req = REQS[id];
    if(req && !G.techs[req]){ toast('Нужна технология'); return; }
    if(id === 'robot'){ spawnRobot(); return; }
    if(id === 'drone'){ spawnDrone(); return; }
    G.build = (G.build === id) ? null : id;
    G.markerMode = false;
    refreshBuildUI();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function togglePause(){
  if (G.speed === 0) G.speed = 1;
  else G.speed = 0;
  updateTimeButtons();
}
function updateTimeButtons(){
  document.querySelectorAll('.timebtn').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.speed) === G.speed);
  });
}
document.querySelectorAll('.timebtn').forEach(el => {
  el.onclick = () => { G.speed = parseInt(el.dataset.speed); updateTimeButtons(); };
});

// Mouse
let mouseDown = false, dragStartX = 0, dragStartY = 0, panMode = false;
let lastMX = 0, lastMY = 0;
canvas.addEventListener('mousedown', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY;
  if (e.button === 1) {
    // Middle mouse → pan
    panMode = true;
    lastMX = e.clientX; lastMY = e.clientY;
    e.preventDefault();
    return;
  }
  if (e.button === 0) {
    mouseDown = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    if (!G.build && !G.markerMode) {
      G.boxSelect = { active: false, x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY };
    }
  }
  hideTooltip();
});
canvas.addEventListener('mousemove', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY; G.mouse.inside = true;
  if (panMode) {
    cam.x -= (e.clientX - lastMX) / cam.zoom;
    cam.y -= (e.clientY - lastMY) / cam.zoom;
    lastMX = e.clientX; lastMY = e.clientY;
    clampCam();
    return;
  }
  if (mouseDown && G.boxSelect) {
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if (Math.hypot(dx, dy) > 5) {
      G.boxSelect.active = true;
      G.boxSelect.x2 = e.clientX;
      G.boxSelect.y2 = e.clientY;
    }
  }
  if(!G.build && !overlayEl.classList.contains('open') && !G.markerMode){
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
    const bb = buildingAt(tx, ty);
    if(bb) showTooltip(placedTooltipHtml(bb), e.clientX, e.clientY);
    else hideTooltip();
  } else hideTooltip();
});
addEventListener('mouseup', e => {
  if (panMode) { panMode = false; return; }
  if (e.button === 0 && mouseDown) {
    mouseDown = false;
    if (G.boxSelect && G.boxSelect.active) {
      // Box select units
      const bx = Math.min(G.boxSelect.x1, G.boxSelect.x2);
      const by = Math.min(G.boxSelect.y1, G.boxSelect.y2);
      const bw = Math.abs(G.boxSelect.x2 - G.boxSelect.x1);
      const bh = Math.abs(G.boxSelect.y2 - G.boxSelect.y1);
      const sel = [];
      for (const u of G.units) {
        if (u.inBoat || u.inHeli) continue;
        const ux = u.x*z + ox, uy = u.y*z + oy;
        if (ux >= bx && ux <= bx+bw && uy >= by && uy <= by+bh) sel.push(u);
      }
      G.selectedUnits = sel;
      G.sel = sel.length === 1 ? sel[0] : null;
      G.boxSelect = null;
      updateInfoUI();
    } else {
      G.boxSelect = null;
      handleClick(e.clientX, e.clientY);
    }
  }
});
canvas.addEventListener('mouseleave', () => { G.mouse.inside = false; mouseDown = false; panMode = false; hideTooltip(); });
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  // Remove marker at this position
  for (let i = G.markers.length - 1; i >= 0; i--) {
    const m = G.markers[i];
    if (Math.hypot(m.x - wx, m.y - wy) < 20) { G.markers.splice(i, 1); return; }
  }
  if(G.sel instanceof Boat){ boatGoTo(G.sel, wx, wy); return; }
  if(G.sel instanceof Heli){ heliGoTo(G.sel, wx, wy); return; }
  if (G.selectedUnits.length > 0) {
    for (const u of G.selectedUnits) orderMove(u, wx, wy);
    return;
  }
  G.build = null; G.markerMode = false; refreshBuildUI();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx,wy] = screenToWorld(e.clientX, e.clientY);
  const f = e.deltaY > 0 ? 0.88 : 1.14;
  cam.zoom = clamp(cam.zoom * f, 0.3, 2.6);
  const [nx,ny] = screenToWorld(e.clientX, e.clientY);
  cam.x += wx - nx; cam.y += wy - ny;
  clampCam();
}, {passive:false});

function clampCam(){
  const halfW = (W/2)/cam.zoom, halfH = (H/2)/cam.zoom;
  const worldW = MW*TS, worldH = MH*TS;
  if(worldW < halfW*2) cam.x = worldW/2;
  else cam.x = clamp(cam.x, halfW, worldW-halfW);
  if(worldH < halfH*2) cam.y = worldH/2;
  else cam.y = clamp(cam.y, halfH, worldH-halfH);
}

function handleClick(sx, sy){
  const [wx, wy] = screenToWorld(sx, sy);
  const tx = Math.floor(wx/TS), ty = Math.floor(wy/TS);
  if (G.markerMode) {
    G.markers.push({x: wx, y: wy});
    toast('Метка поставлена (ПКМ — убрать)');
    return;
  }
  if(G.build === 'demolish'){
    const b = buildingAt(tx, ty);
    if(b){ demolishBuilding(b); return; }
    if(roadGrid[ty] && roadGrid[ty][tx]){ demolishRoad(tx, ty); return; }
    toast('Здесь нечего сносить');
    return;
  }
  if(G.build){
    if(tryPlace(G.build, tx, ty)){
      if(!keys['shift']) G.build = null;
      refreshBuildUI();
    }
    return;
  }
  // Try boat
  let bestBoat = null, bd = 24/cam.zoom;
  for(const bo of G.boats){ const d = Math.hypot(bo.x-wx, bo.y-wy); if(d < bd){ bd = d; bestBoat = bo; } }
  if(bestBoat){ G.sel = bestBoat; G.selectedUnits = []; updateInfoUI(); return; }
  // Try heli
  let bestHeli = null; bd = 26/cam.zoom;
  for(const h of G.helis){ const d = Math.hypot(h.x-wx, h.y-wy); if(d < bd){ bd = d; bestHeli = h; } }
  if(bestHeli){ G.sel = bestHeli; G.selectedUnits = []; updateInfoUI(); return; }
  // Try unit
  let bestUnit = null; bd = 22/cam.zoom;
  for(const u of G.units){
    if(u.inBoat || u.inHeli) continue;
    const d = Math.hypot(u.x-wx, u.y-wy);
    if(d < bd){ bd = d; bestUnit = u; }
  }
  if(bestUnit){
    if (keys['shift']) {
      if (!G.selectedUnits.includes(bestUnit)) G.selectedUnits.push(bestUnit);
    } else {
      G.selectedUnits = [bestUnit];
    }
    G.sel = bestUnit;
    updateInfoUI();
    return;
  }
  const b = buildingAt(tx,ty);
  if(b){ G.sel = b; G.selectedUnits = []; updateInfoUI(); return; }
  if(G.sel instanceof Unit && !G.sel.inBoat && !G.sel.inHeli){
    if(orderMove(G.sel, wx, wy)){ updateInfoUI(); return; }
  }
  G.sel = null; G.selectedUnits = [];
  infoEl.classList.remove('open');
}

// ============ START ============
function findStart(){
  computeIslands();
  let bestIsland = -1, bestSize = 0;
  for(const id in islandSizes){
    if(islandSizes[id] > bestSize){ bestSize = islandSizes[id]; bestIsland = parseInt(id); }
  }
  let best = null, bestScore = -1e9;
  for(let y=6;y<MH-6;y++) for(let x=6;x<MW-6;x++){
    if(islandId[y][x] !== bestIsland) continue;
    if(terrain[y][x].t !== 'grass') continue;
    let trees = 0, water = 0, dep = 0;
    for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
      const nx = x+dx, ny = y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const n = nodes[ny][nx];
      if(n && n.type==='tree') trees++;
      if(n && isDeposit(n.type)) dep++;
      if(terrain[ny][nx].t === 'water') water++;
    }
    const score = trees*2 - dep*1.5 + Math.min(water, 8)*3 - Math.abs(x-MW/2)*0.1 - Math.abs(y-MH/2)*0.1;
    if(score > bestScore){ bestScore = score; best = {x,y}; }
  }
  return best || {x: Math.floor(MW/2), y: Math.floor(MH/2)};
}
function newGame(){
  genWorld();
  renderTerrain();
  G.res = { wood:60, stone:20, food:40, coal:0, iron:0, gold:0, gears:0 };
  G.rates = { wood:0, stone:0, food:0, coal:0, iron:0, gold:0, gears:0 };
  G.units = []; G.buildings = []; G.boats = []; G.helis = []; G.regrow = [];
  G.techs = {}; G.sel = null; G.build = null; G.time = 0; G.growT = 0;
  G.happiness = 50;
  G.needs = {food:100, housing:100, recreation:0, faith:0};
  G.gameStarted = true;
  G.speed = 1; updateTimeButtons();
  G.dayTime = 0.35; G.day = 1; G.season = 'spring'; G.year = 1;
  G.log = []; G.stats = []; G.statTimer = 0;
  G.markers = []; G.markerMode = false;
  G.particles = []; G.particleTimer = 0;
  G.eventTimer = 90 + Math.random()*30;
  G.weather = null;
  G.selectedUnits = []; G.boxSelect = null;
  G.quests = {};
  const st = findStart();
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const x = st.x+dx, y = st.y+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    const n = nodes[y][x];
    if(n && !isDeposit(n.type)) nodes[y][x] = null;
  }
  const house = { type:'house', def:BUILDINGS.house, tx:st.x, ty:st.y, px: st.x*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0 };
  G.buildings.push(house);
  const stg = { type:'storage', def:BUILDINGS.storage, tx:st.x+1, ty:st.y, px: (st.x+1)*TS+TS/2, py: st.y*TS+TS/2, workers:[], deposit:null, constructionT: 0 };
  G.buildings.push(stg);
  G.units.push(new Unit(house.px - 10, house.py + 22, false));
  G.units.push(new Unit(house.px + 12, house.py + 26, false));
  cam.x = st.x*TS + TS; cam.y = st.y*TS + TS; cam.zoom = 1.4;
  clampCam();
  renderTech(); makeBuildUI(); refreshBuildUI(); renderQuests(); updateQuestHud();
  updateResUI(); renderLog();
  pushLog('Поселение основано. Удачи!', 'good');
  toast('Добро пожаловать! Изучайте технологии: роботы и дроны ждут');
}

// ============ LOOP ============
let last = performance.now();
let acc = 0, autosaveT = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.1) dt = 0.1;
  const spd = 520/cam.zoom * dt;
  let moved = false;
  if(keys['a'] || keys['arrowleft'] || keys['ф']){ cam.x -= spd; moved = true; }
  if(keys['d'] || keys['arrowright'] || keys['в']){ cam.x += spd; moved = true; }
  if(keys['w'] || keys['arrowup'] || keys['ц']){ cam.y -= spd; moved = true; }
  if(keys['s'] || keys['arrowdown'] || keys['ы']){ cam.y += spd; moved = true; }
  if(moved) clampCam();
  if(G.gameStarted && !overlayEl.classList.contains('open') && G.speed > 0){
    update(dt * G.speed);
    updateParticles(dt * G.speed);
    autosaveT += dt;
    if(autosaveT > 90){ autosaveT = 0; saveGame('auto'); }
  }
  acc += dt;
  if(acc > 0.15){ acc = 0; updateResUI(); refreshBuildUI(); }
  if(toastT > 0){ toastT -= dt; if(toastT <= 0) toastEl.style.opacity = 0; }
  render();
}

// ============ INIT ============
(function init(){
  genWorld();
  renderTerrain();
  cam.x = MW*TS/2; cam.y = MH*TS/2; cam.zoom = 0.5;
  clampCam();
  renderQuests();
  updateQuestHud();
  openMenu('main');
  requestAnimationFrame(loop);
})();
</script>
